            display: flex; flex-direction: column; align-items: center; min-height: 100vh;

        }
        .prop-name {
            font-size: 19px; font-weight: 900; color: #ffab00; text-transform: uppercase;

        }

        .count-btns { display: flex; gap: 8px; }

        }
        .cnt-btn:active { transform: scale(0.92); }

        .cnt-num { font-size: 22px; font-weight: 900; line-height: 1; margin-bottom: 2px; }
        .cnt-lbl { font-size: 10px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; line-height: 1; }

        .btn-blue { background: #29b6f6; color: #000; }

        .back-btn {
            background: #2a2a2a; border: 1px solid #444; color: #ffab00; padding: 8px 16px;

        }
        .detail-title { font-size: 24px; font-weight: 900; color: #ffab00; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }

        .pass-tile {
            background: #1e1e1e; border-radius: 16px; padding: 16px; margin-bottom: 12px;
            border: 2px solid #29b6f6; cursor: pointer; transition: transform 0.1s ease;
        }
        .pass-tile:active { transform: scale(0.98); }

        .pass-exp { font-size: 18px; font-weight: 900; color: #29b6f6; letter-spacing: 0.5px; }

        .tile-bottom-row {
            display: flex; justify-content: space-between; align-items: center;

        }
