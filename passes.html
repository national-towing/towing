<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PASSES</title>
    
    <link rel="apple-touch-icon" href="icon-passes.png?v=15">
    <link rel="icon" type="image/png" href="icon-passes.png?v=15">
    <link rel="manifest" href="manifest-passes.json?v=15">

    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            margin: 0; padding: 14px; background: #121212; color: #fff; 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; 
        }
        
        /* HEADER BAR WITH CENTERED TITLE AND ICON REFRESH */
        .header-box { display: flex; align-items: center; justify-content: center; position: relative; width: 100%; max-width: 440px; margin-bottom: 10px; }
        .header-box h1 { margin: 0; font-size: 38px; font-weight: 900; color: #ab47bc; letter-spacing: 2px; text-align: center; }
        .icon-btn { position: absolute; background: #2a2a2a; border: 1px solid #444; border-radius: 10px; font-size: 20px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; }
        .icon-btn:active { transform: scale(0.9); }
        .refresh-pos { right: 0; }
        .back-btn { position: absolute; left: 0; background: #2a2a2a; border: 1px solid #444; border-radius: 10px; font-size: 15px; font-weight: 900; padding: 0 12px; height: 44px; display: flex; align-items: center; justify-content: center; color: #fff; cursor: pointer; }

        .nav-bar { display: flex; gap: 8px; width: 100%; max-width: 440px; margin-bottom: 16px; }
        .nav-tile { flex: 1; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 900; text-decoration: none; color: #000; }
        .nav-run { background: #ffab00; }
        .nav-tow { background: #ff1744; color: #fff; }
        .nav-rel { background: #00e676; }
        .nav-pass { background: #ab47bc; color: #fff; }

        /* SCREENS */
        #propsScreen, #detailScreen, #addScreen { width: 100%; max-width: 440px; }
        #detailScreen, #addScreen { display: none; }

        /* PROPERTY TILE BUTTONS WITH PASS COUNT COUNTER */
        .prop-tile-btn { 
            background: #1e1e1e; border: 1px solid #333; border-radius: 14px; padding: 18px; width: 100%; 
            margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; 
            cursor: pointer; user-select: none;
        }
        .prop-tile-btn:active { transform: scale(0.98); background: #252525; }
        .prop-name { font-size: 20px; font-weight: 900; color: #fff; text-transform: uppercase; }
        .prop-badge { background: #ab47bc; color: #fff; font-size: 18px; font-weight: 900; border-radius: 20px; padding: 4px 14px; }

        /* PASS ITEM LIST DETAILS */
        .pass-item { background: #2a2a2a; border-radius: 12px; padding: 14px; margin-bottom: 10px; border-left: 6px solid #ab47bc; }
        .pass-rego { font-size: 24px; font-weight: 900; color: #ab47bc; }
        .pass-dates { font-size: 14px; color: #aaa; margin-top: 4px; font-weight: 600; }
        .pass-notes { font-size: 13px; color: #ffd54f; margin-top: 6px; font-style: italic; }

        /* FLOATING CIRCLE PLUS BUTTON */
        .fab-btn {
            position: fixed; bottom: 30px; right: calc(50% - 200px); width: 66px; height: 66px;
            background: #ab47bc; color: #fff; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 36px; font-weight: 900; box-shadow: 0 6px 20px rgba(171, 71, 188, 0.5);
            cursor: pointer; z-index: 99; user-select: none; border: 3px solid #fff;
        }
        @media (max-width: 440px) { .fab-btn { right: 20px; } }
        .fab-btn:active { transform: scale(0.9); }

        /* FORM STYLES */
        .card { background: #1e1e1e; border-radius: 18px; padding: 18px; width: 100%; border: 1px solid #333; }
        label { font-size: 13px; text-transform: uppercase; color: #aaa; display: block; margin-top: 14px; font-weight: 900; letter-spacing: 1px; }
        input, select, textarea {
            width: 100%; height: 56px; padding: 0 14px; border-radius: 12px; border: 1px solid #444;
            background: #2a2a2a; color: #fff; font-size: 20px; font-weight: 900; margin-top: 6px; outline: none;
            -webkit-appearance: none;
        }
        input[type="date"] { height: 56px !important; line-height: 56px !important; font-size: 18px !important; }
        textarea { height: 80px; padding: 12px; font-size: 16px; font-weight: 500; resize: none; }

        .submit-btn {
            background: #ab47bc; color: #fff; font-weight: 900; border: none; border-radius: 14px;
            height: 60px; font-size: 26px; width: 100%; margin-top: 20px; cursor: pointer; letter-spacing: 2px;
        }
        .submit-btn:active { transform: scale(0.97); }

        .row-2 { display: flex; gap: 10px; }
        .row-2 > div { flex: 1; }
        #loading { text-align: center; color: #aaa; font-weight: 900; margin-top: 20px; }
        #status { text-align: center; font-weight: 900; font-size: 16px; margin-top: 14px; min-height: 24px; color: #00e676; }
    </style>
</head>
<body>

<div class="header-box">
    <div class="back-btn" id="backBtn" style="display:none;">⬅ BACK</div>
    <h1 id="headerTitle">PASSES</h1>
    <div class="icon-btn refresh-pos" id="refreshBtn">🔄</div>
</div>

<div class="nav-bar">
    <a href="run.html" class="nav-tile nav-run">RUN</a>
    <a href="tow.html" class="nav-tile nav-tow">TOW</a>
    <a href="release.html" class="nav-tile nav-rel">REL</a>
    <a href="passes.html" class="nav-tile nav-pass">PASS</a>
</div>

<!-- SCREEN 1: PROPERTY LIST WITH COUNTS -->
<div id="propsScreen">
    <div id="loading">LOADING PROPERTIES...</div>
    <div id="propsContainer"></div>
</div>

<!-- SCREEN 2: VEHICLE PASSES FOR SELECTED PROPERTY -->
<div id="detailScreen">
    <div id="detailTitle" style="font-size:22px; font-weight:900; color:#ab47bc; margin-bottom:12px; text-transform:uppercase;"></div>
    <div id="passesContainer"></div>
    <div class="fab-btn" id="fabAddBtn">＋</div>
</div>

<!-- SCREEN 3: ADD PASS FORM -->
<div id="addScreen">
    <div class="card">
        <label>PROPERTY</label>
        <select id="propertySelect"><option value="">LOADING...</option></select>

        <label>REGO</label>
        <input type="text" id="regoInput" placeholder="REGO" style="font-size:26px; color:#ab47bc; text-transform:uppercase;">

        <div class="row-2">
            <div>
                <label>START DATE</label>
                <input type="date" id="startDateInput">
            </div>
            <div>
                <label>DURATION</label>
                <select id="durationSelect">
                    <option value="1" selected>1 Day</option>
                    <option value="2">2 Days</option>
                    <option value="3">3 Days</option>
                    <option value="4">4 Days</option>
                    <option value="5">5 Days</option>
                    <option value="6">6 Days</option>
                    <option value="7">7 Days</option>
                    <option value="MORE">More...</option>
                </select>
            </div>
        </div>

        <label>EXPIRY DATE</label>
        <input type="date" id="expiryDateInput" readonly style="background:#1a1a1a; color:#aaa;">

        <label>NOTES</label>
        <textarea id="notesInput" placeholder="Optional"></textarea>

        <button class="submit-btn" id="submitBtn">CREATE PASS</button>
        <div id="status"></div>
    </div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";

    const propsScreen = document.getElementById('propsScreen');
    const detailScreen = document.getElementById('detailScreen');
    const addScreen = document.getElementById('addScreen');

    const headerTitle = document.getElementById('headerTitle');
    const backBtn = document.getElementById('backBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const loadingDiv = document.getElementById('loading');
    
    const propsContainer = document.getElementById('propsContainer');
    const passesContainer = document.getElementById('passesContainer');
    const detailTitle = document.getElementById('detailTitle');
    const fabAddBtn = document.getElementById('fabAddBtn');

    const propertySelect = document.getElementById('propertySelect');
    const regoInput = document.getElementById('regoInput');
    const startDateInput = document.getElementById('startDateInput');
    const durationSelect = document.getElementById('durationSelect');
    const expiryDateInput = document.getElementById('expiryDateInput');
    const notesInput = document.getElementById('notesInput');
    const submitBtn = document.getElementById('submitBtn');
    const statusDiv = document.getElementById('status');

    let allPasses = [];
    let currentSelectedProperty = "";

    window.addEventListener('load', () => {
        const today = new Date().toISOString().split('T')[0];
        startDateInput.value = today;
        calcExpiry();
        loadAllData();
    });

    backBtn.addEventListener('click', () => {
        if (addScreen.style.display === 'block') {
            if (currentSelectedProperty) {
                showDetailScreen(currentSelectedProperty);
            } else {
                showPropsScreen();
            }
        } else if (detailScreen.style.display === 'block') {
            showPropsScreen();
        }
    });

    refreshBtn.addEventListener('click', loadAllData);
    fabAddBtn.addEventListener('click', () => showAddScreen(currentSelectedProperty));

    function showPropsScreen() {
        propsScreen.style.display = 'block';
        detailScreen.style.display = 'none';
        addScreen.style.display = 'none';
        backBtn.style.display = 'none';
        refreshBtn.style.display = 'flex';
        headerTitle.innerText = "PASSES";
        currentSelectedProperty = "";
    }

    function showDetailScreen(propName) {
        currentSelectedProperty = propName;
        propsScreen.style.display = 'none';
        detailScreen.style.display = 'block';
        addScreen.style.display = 'none';
        backBtn.style.display = 'flex';
        refreshBtn.style.display = 'flex';
        headerTitle.innerText = "PASSES";
        detailTitle.innerText = propName;
        renderPropertyPasses(propName);
    }

    function showAddScreen(selectedProp) {
        propsScreen.style.display = 'none';
        detailScreen.style.display = 'none';
        addScreen.style.display = 'block';
        backBtn.style.display = 'flex';
        refreshBtn.style.display = 'none';
        headerTitle.innerText = "ADD PASS";

        if (selectedProp && propertySelect.options.length > 0) {
            for (let i = 0; i < propertySelect.options.length; i++) {
                if (propertySelect.options[i].value.toUpperCase() === selectedProp.toUpperCase()) {
                    propertySelect.selectedIndex = i;
                    break;
                }
            }
        }
    }

    startDateInput.addEventListener('change', calcExpiry);
    durationSelect.addEventListener('change', calcExpiry);

    function calcExpiry() {
        if (!startDateInput.value) return;
        const start = new Date(startDateInput.value);

        if (durationSelect.value === "MORE") {
            expiryDateInput.removeAttribute("readonly");
            expiryDateInput.style.background = "#2a2a2a";
            expiryDateInput.style.color = "#fff";
            start.setDate(start.getDate() + 8);
            expiryDateInput.value = start.toISOString().split('T')[0];
        } else {
            expiryDateInput.setAttribute("readonly", true);
            expiryDateInput.style.background = "#1a1a1a";
            expiryDateInput.style.color = "#aaa";
            const days = parseInt(durationSelect.value, 10);
            start.setDate(start.getDate() + days);
            expiryDateInput.value = start.toISOString().split('T')[0];
        }
    }

    async function loadAllData() {
        loadingDiv.style.display = 'block';
        propsContainer.innerHTML = "";
        try {
            const [propRes, passRes] = await Promise.all([
                fetch(GOOGLE_SCRIPT_URL + "?action=get_properties"),
                fetch(GOOGLE_SCRIPT_URL + "?action=get_passes")
            ]);

            const properties = await propRes.json();
            allPasses = await passRes.json();
            loadingDiv.style.display = 'none';

            propertySelect.innerHTML = "";
            properties.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.name; opt.innerText = p.name;
                propertySelect.appendChild(opt);
            });

            const counts = {};
            allPasses.forEach(p => {
                const name = p.property || "GENERAL";
                counts[name] = (counts[name] || 0) + 1;
            });

            properties.forEach(p => {
                const propName = p.name;
                const count = counts[propName] || 0;

                const tile = document.createElement('div');
                tile.className = 'prop-tile-btn';
                tile.onclick = () => showDetailScreen(propName);
                tile.innerHTML = `
                    <div class="prop-name">${propName}</div>
                    <div class="prop-badge">${count}</div>
                `;
                propsContainer.appendChild(tile);
            });

        } catch(e) {
            loadingDiv.innerText = "ERROR LOADING DATA";
        }
    }

    function renderPropertyPasses(propName) {
        passesContainer.innerHTML = "";
        const filtered = allPasses.filter(p => (p.property || "").toUpperCase() === propName.toUpperCase());

        if (filtered.length === 0) {
            passesContainer.innerHTML = "<div style='text-align:center; color:#666; font-weight:900; margin-top:20px;'>NO CURRENT PASSES</div>";
            return;
        }

        filtered.forEach(p => {
            const item = document.createElement('div');
            item.className = 'pass-item';
            item.innerHTML = `
                <div class="pass-rego">${p.rego}</div>
                <div class="pass-dates">Valid: ${p.startDate} to ${p.expiry} (${p.duration})</div>
                ${p.notes ? `<div class="pass-notes">Notes: ${p.notes}</div>` : ''}
            `;
            passesContainer.appendChild(item);
        });
    }

    submitBtn.addEventListener('click', async () => {
        const rego = regoInput.value.trim().toUpperCase();
        if (!rego) { statusDiv.innerText = "ENTER REGO"; return; }

        let durationVal = durationSelect.value;
        if (durationVal === "MORE") {
            const startMs = new Date(startDateInput.value).getTime();
            const expMs = new Date(expiryDateInput.value).getTime();
            const diffDays = Math.ceil((expMs - startMs) / (1000 * 60 * 60 * 24));
            durationVal = diffDays > 0 ? String(diffDays) : "Custom";
        }

        const payload = {
            action: 'add_pass',
            property: propertySelect.value,
            rego: rego,
            startDate: startDateInput.value,
            duration: durationVal,
            expiryDate: expiryDateInput.value,
            notes: notesInput.value.trim()
        };

        statusDiv.innerText = "CREATING PASS...";
        await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
        statusDiv.innerText = "✔ PASS CREATED SUCCESS!";
        
        setTimeout(() => {
            const savedProp = propertySelect.value;
            statusDiv.innerText = "";
            regoInput.value = "";
            notesInput.value = "";
            loadAllData().then(() => showDetailScreen(savedProp));
        }, 1000);
    });
</script>
</body>
</html>
