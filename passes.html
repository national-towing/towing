<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PASSES</title>
    
    <link rel="apple-touch-icon" href="icon-passes.png?v=12">
    <link rel="icon" type="image/png" href="icon-passes.png?v=12">
    <link rel="manifest" href="manifest-passes.json?v=12">

    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            margin: 0; padding: 14px; background: #121212; color: #fff; 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; 
        }
        
        .header-box { display: flex; align-items: center; justify-content: center; position: relative; width: 100%; max-width: 440px; margin-bottom: 10px; }
        .header-box h1 { margin: 0; font-size: 38px; font-weight: 900; color: #ab47bc; letter-spacing: 2px; text-align: center; }
        .icon-btn { position: absolute; background: #2a2a2a; border: 1px solid #444; border-radius: 10px; font-size: 20px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; text-decoration: none; }
        .icon-btn:active { transform: scale(0.9); }
        .refresh-pos { right: 54px; }
        .add-pos { right: 0; background: #ab47bc; color: #fff; font-size: 24px; font-weight: 900; }

        .nav-bar { display: flex; gap: 8px; width: 100%; max-width: 440px; margin-bottom: 16px; }
        .nav-tile { flex: 1; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 900; text-decoration: none; color: #000; }
        .nav-run { background: #ffab00; }
        .nav-tow { background: #ff1744; color: #fff; }
        .nav-rel { background: #00e676; }
        .nav-pass { background: #ab47bc; color: #fff; }

        .property-card { background: #1e1e1e; border-radius: 16px; padding: 16px; width: 100%; max-width: 440px; border: 1px solid #333; margin-bottom: 14px; }
        .property-title { font-size: 20px; font-weight: 900; color: #ab47bc; margin-bottom: 10px; text-transform: uppercase; border-bottom: 1px solid #333; padding-bottom: 6px; }

        .pass-item { background: #2a2a2a; border-radius: 10px; padding: 12px; margin-bottom: 8px; border-left: 5px solid #ab47bc; }
        .pass-rego { font-size: 22px; font-weight: 900; color: #fff; }
        .pass-dates { font-size: 13px; color: #aaa; margin-top: 2px; font-weight: 600; }
        .pass-notes { font-size: 13px; color: #ffd54f; margin-top: 4px; font-style: italic; }
        
        #loading { text-align: center; color: #aaa; font-weight: 900; margin-top: 20px; }
    </style>
</head>
<body>

<div class="header-box">
    <h1>PASSES</h1>
    <div class="icon-btn refresh-pos" id="refreshBtn">🔄</div>
    <a href="add-pass.html" class="icon-btn add-pos">➕</a>
</div>

<div class="nav-bar">
    <a href="run.html" class="nav-tile nav-run">RUN</a>
    <a href="tow.html" class="nav-tile nav-tow">TOW</a>
    <a href="release.html" class="nav-tile nav-rel">REL</a>
    <a href="passes.html" class="nav-tile nav-pass">PASS</a>
</div>

<div id="loading">LOADING ACTIVE PASSES...</div>
<div id="container" style="width:100%; max-width:440px;"></div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";

    const refreshBtn = document.getElementById('refreshBtn');
    const loadingDiv = document.getElementById('loading');
    const container = document.getElementById('container');

    window.addEventListener('load', loadPasses);
    refreshBtn.addEventListener('click', loadPasses);

    async function loadPasses() {
        loadingDiv.style.display = 'block';
        container.innerHTML = "";
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL + "?action=get_passes");
            const passes = await res.json();
            loadingDiv.style.display = 'none';

            if (!passes || passes.length === 0) {
                container.innerHTML = "<div style='text-align:center; color:#666; font-weight:900;'>NO ACTIVE PASSES</div>";
                return;
            }

            // Group passes by Property
            const grouped = {};
            passes.forEach(p => {
                const prop = p.property || "GENERAL";
                if (!grouped[prop]) grouped[prop] = [];
                grouped[prop].push(p);
            });

            for (let prop in grouped) {
                const card = document.createElement('div');
                card.className = 'property-card';
                card.innerHTML = `<div class="property-title">${prop}</div>`;

                grouped[prop].forEach(p => {
                    const item = document.createElement('div');
                    item.className = 'pass-item';
                    item.innerHTML = `
                        <div class="pass-rego">${p.rego}</div>
                        <div class="pass-dates">Valid: ${p.startDate} to ${p.expiry} (${p.duration})</div>
                        ${p.notes ? `<div class="pass-notes">Notes: ${p.notes}</div>` : ''}
                    `;
                    card.appendChild(item);
                });

                container.appendChild(card);
            }
        } catch(e) {
            loadingDiv.innerText = "ERROR LOADING PASSES";
        }
    }
</script>
</body>
</html>
