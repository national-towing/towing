<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PASSES</title>
    <link rel="apple-touch-icon" href="icon-pass.png?v=701">
    <link rel="icon" type="image/png" href="icon-pass.png?v=701">
    <style>
        :root { --c-mark: #2979ff; --c-run: #ffab00; --c-tow: #ff1744; --c-pass: #ab47bc; --c-yard: #00b0ff; --c-rel: #00e676; }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; margin: 0; padding: 12px; background: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding-bottom: 110px; }
        .header-box { display: flex; align-items: center; justify-content: center; position: relative; width: 100%; max-width: 440px; margin-bottom: 8px; }
        .header-box h1 { margin: 0; font-size: 34px; font-weight: 900; color: #ab47bc; letter-spacing: 2px; }
        .icon-btn { position: absolute; right: 0; background: #2a2a2a; border: 1px solid #444; border-radius: 8px; font-size: 18px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; }
        .nav-grid-3x2 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; max-width: 440px; margin-bottom: 12px; }
        .nav-tile { height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; text-decoration: none; color: #000; text-transform: uppercase; }
        .t-mark { background: var(--c-mark); color: #fff; }
        .t-run  { background: var(--c-run); color: #000; }
        .t-tow  { background: var(--c-tow); color: #fff; }
        .t-pass { background: var(--c-pass); color: #fff; box-shadow: 0 0 0 2px #fff; }
        .t-yard { background: var(--c-yard); color: #000; }
        .t-rel  { background: var(--c-rel); color: #000; }

        .container { width: 100%; max-width: 440px; }
        .prop-summary-card { background: #1e1e1e; border-radius: 14px; padding: 12px; margin-bottom: 10px; border: 1px solid #333; display: flex; align-items: center; justify-content: space-between; }
        .prop-name { font-size: 18px; font-weight: 900; color: #ffab00; text-transform: uppercase; cursor: pointer; }
        .cnt-btn { width: 52px; height: 52px; border-radius: 8px; border: none; background: #29b6f6; color: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
        .cnt-num { font-size: 20px; font-weight: 900; line-height: 1; }
        .cnt-lbl { font-size: 9px; font-weight: 900; text-transform: uppercase; }

        .pass-tile { background: #1e1e1e; border-radius: 12px; padding: 14px; margin-bottom: 10px; border: 2px solid #29b6f6; cursor: pointer; }
        .pass-rego { font-size: 28px; font-weight: 900; color: #29b6f6; }
        .pass-exp { font-size: 16px; font-weight: 900; color: #29b6f6; }

        /* FIXED DOCKED FOOTER CONTROL BAR */
        .fixed-footer-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 75px;
            background: rgba(18, 18, 18, 0.98); border-top: 1.5px solid #333;
            display: flex; align-items: center; justify-content: center;
            padding: 10px 16px; padding-bottom: max(10px, env(safe-area-inset-bottom));
            z-index: 100;
        }
        .docked-add-btn {
            width: 100%; max-width: 440px; height: 50px; background: #29b6f6;
            border-radius: 12px; border: none; font-size: 20px; color: #000;
            font-weight: 900; letter-spacing: 1.5px; cursor: pointer; text-transform: uppercase;
        }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 200; padding: 20px; }
        .modal-card { background: #1e1e1e; border-radius: 16px; padding: 18px; width: 100%; max-width: 400px; border: 2px solid #ab47bc; }
        label { font-size: 11px; text-transform: uppercase; color: #aaa; display: block; margin-top: 8px; font-weight: 900; }
        input, select { width: 100%; height: 46px; padding: 0 10px; border-radius: 8px; border: 1px solid #444; background: #2a2a2a; color: #fff; font-size: 16px; font-weight: 800; margin-top: 4px; outline: none; }
        .btn-row { display: flex; gap: 8px; margin-top: 14px; }
        .btn-cancel, .btn-save { flex: 1; height: 46px; border-radius: 8px; border: none; font-weight: 900; cursor: pointer; text-transform: uppercase; }
        .btn-cancel { background: #444; color: #fff; }
        .btn-save { background: #ab47bc; color: #fff; }
    </style>
</head>
<body>
<div class="header-box"><h1>PASSES</h1><div class="icon-btn" onclick="loadPasses()">🔄</div></div>
<div class="nav-grid-3x2">
    <a href="mark.html" class="nav-tile t-mark">MARK</a><a href="run.html" class="nav-tile t-run">RUN</a><a href="tow.html" class="nav-tile t-tow">TOW</a>
    <a href="passes.html" class="nav-tile t-pass">PASS</a><a href="yard.html" class="nav-tile t-yard">YARD</a><a href="release.html" class="nav-tile t-rel">REL</a>
</div>

<div class="container" id="passContainer"><div style="text-align:center; padding:30px; font-weight:800; color:#888;">LOADING PASSES...</div></div>

<div class="fixed-footer-bar">
    <button class="docked-add-btn" onclick="openAddModal()">+ ADD VISITOR PASS</button>
</div>

<div class="modal-overlay" id="passModal">
    <div class="modal-card">
        <h2 style="color:#ab47bc; text-align:center; margin-top:0;" id="modalTitle">ADD PASS</h2>
        <label>PROPERTY</label><select id="modalProp"></select>
        <label>REGISTRATION</label><input type="text" id="modalRego" placeholder="REGO" style="color:#29b6f6; text-transform:uppercase;">
        <label>DURATION (DAYS)</label>
        <select id="modalDuration" onchange="calcEnd()"><option value="1">1 Day</option><option value="2">2 Days</option><option value="3">3 Days</option><option value="7">7 Days</option><option value="14">14 Days</option></select>
        <div style="display:flex; gap:8px;">
            <div style="flex:1;"><label>START DATE</label><input type="date" id="modalStartDate" onchange="calcEnd()"></div>
            <div style="flex:1;"><label>END DATE</label><input type="date" id="modalEndDate"></div>
        </div>
        <label>NOTES</label><input type="text" id="modalNotes" placeholder="REASON / NOTES">
        <div class="btn-row">
            <button class="btn-cancel" onclick="closeModal()">CANCEL</button>
            <button class="btn-save" id="btnSave" onclick="savePass()">SAVE</button>
        </div>
    </div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";
    let propertyGroups = {};
    let propertiesList = [];
    let activePass = null;

    window.addEventListener('load', async () => {
        await loadProps();
        loadPasses();
    });

    async function loadProps() {
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL + "?action=get_properties");
            propertiesList = await res.json();
            const sel = document.getElementById('modalProp');
            sel.innerHTML = "";
            propertiesList.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.name || p; opt.innerText = p.name || p;
                sel.appendChild(opt);
            });
        } catch(e) {}
    }

    async function loadPasses() {
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL + "?action=get_passes");
            const data = await res.json();
            parsePasses(data);
        } catch(e) {}
    }

    function parsePasses(data) {
        propertyGroups = {};
        data.forEach(p => {
            const prop = p.property || "GENERAL";
            if (!propertyGroups[prop]) propertyGroups[prop] = [];
            propertyGroups[prop].push(p);
        });
        renderSummary();
    }

    function renderSummary() {
        const c = document.getElementById('passContainer');
        c.innerHTML = "";
        Object.keys(propertyGroups).sort().forEach(prop => {
            const count = propertyGroups[prop].length;
            const card = document.createElement('div');
            card.className = 'prop-summary-card';
            card.innerHTML = `<div class="prop-name" onclick="renderDetail('${prop}')">${prop}</div><button class="cnt-btn" onclick="renderDetail('${prop}')"><span class="cnt-num">${count}</span><span class="cnt-lbl">PASS</span></button>`;
            c.appendChild(card);
        });
    }

    function renderDetail(prop) {
        const c = document.getElementById('passContainer');
        c.innerHTML = `<div style="background:#2a2a2a; border:1px solid #444; color:#ffab00; padding:6px 12px; border-radius:6px; font-weight:900; display:inline-block; margin-bottom:10px; cursor:pointer;" onclick="renderSummary()">← BACK</div><h2 style="color:#ffab00; margin:0 0 10px 0;">${prop}</h2>`;
        (propertyGroups[prop] || []).forEach(p => {
            const tile = document.createElement('div');
            tile.className = 'pass-tile';
            tile.innerHTML = `<div style="display:flex; justify-content:space-between;"><span class="pass-rego">${p.rego}</span><span class="pass-exp">EXP: ${p.expiry}</span></div><div style="font-size:12px; color:#aaa; margin-top:6px;">START: ${p.startDate} (${p.duration}) • ${p.notes||''}</div>`;
            tile.onclick = () => openEditModal(p);
            c.appendChild(tile);
        });
    }

    function openAddModal() {
        activePass = null;
        document.getElementById('modalTitle').innerText = "ADD PASS";
        document.getElementById('modalRego').value = "";
        document.getElementById('modalStartDate').valueAsDate = new Date();
        document.getElementById('modalDuration').value = "1";
        calcEnd();
        document.getElementById('passModal').style.display = 'flex';
    }
    function openEditModal(p) {
        activePass = p;
        document.getElementById('modalTitle').innerText = "EDIT PASS";
        document.getElementById('modalProp').value = p.property;
        document.getElementById('modalRego').value = p.rego;
        document.getElementById('modalStartDate').valueAsDate = new Date();
        document.getElementById('modalDuration').value = "1";
        calcEnd();
        document.getElementById('passModal').style.display = 'flex';
    }
    function closeModal() { document.getElementById('passModal').style.display = 'none'; }
    function calcEnd() {
        const s = new Date(document.getElementById('modalStartDate').value || Date.now());
        const d = parseInt(document.getElementById('modalDuration').value, 10);
        s.setDate(s.getDate() + d);
        document.getElementById('modalEndDate').value = s.toISOString().split('T')[0];
    }

    async function savePass() {
        const rego = document.getElementById('modalRego').value.trim().toUpperCase();
        if (!rego) return;
        const btn = document.getElementById('btnSave');
        btn.disabled = true; btn.innerText = "SAVING...";
        const payload = {
            action: activePass ? 'update_pass' : 'add_pass',
            rego: rego, newRego: rego,
            property: document.getElementById('modalProp').value,
            startDate: document.getElementById('modalStartDate').value,
            expiryDate: document.getElementById('modalEndDate').value,
            duration: document.getElementById('modalDuration').value,
            notes: document.getElementById('modalNotes').value,
            rowIdx: activePass ? activePass.rowIdx : null
        };
        try {
            await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(payload) });
            closeModal();
            setTimeout(loadPasses, 1200);
        } catch(e) {}
        btn.disabled = false; btn.innerText = "SAVE";
    }
</script>
</body>
</html>
