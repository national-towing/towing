<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

    <title>PASSES</title>
    
    <link rel="apple-touch-icon" href="icon-pass.png?v=300">
    <link rel="icon" type="image/png" href="icon-pass.png?v=300">
    <link rel="manifest" href="manifest-pass.json?v=300">

    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            margin: 0; padding: 14px; background: #121212; color: #fff; 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; 
        }
        
        .header-box { display: flex; align-items: center; justify-content: center; position: relative; width: 100%; max-width: 440px; margin-bottom: 10px; }
        .header-box h1 { margin: 0; font-size: 38px; font-weight: 900; color: #ab47bc; letter-spacing: 2px; text-align: center; }
        .icon-btn { position: absolute; right: 0; background: #2a2a2a; border: 1px solid #444; border-radius: 10px; font-size: 20px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; }

        .sync-badge {
            background: #ffab00; color: #000; font-weight: 900; font-size: 12px;
            padding: 6px 12px; border-radius: 20px; margin-bottom: 10px; display: none;
            cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
        }

        .nav-bar { display: flex; gap: 8px; width: 100%; max-width: 440px; margin-bottom: 16px; }
        .nav-tile { flex: 1; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 900; text-decoration: none; color: #000; }
        .nav-run { background: #ffab00; }
        .nav-tow { background: #ff1744; color: #fff; }
        .nav-rel { background: #00e676; }
        .nav-pass { background: #ab47bc; color: #fff; }

        .card { background: #1e1e1e; border-radius: 18px; padding: 18px; width: 100%; max-width: 440px; border: 1px solid #333; margin-bottom: 16px; }
        
        label { font-size: 12px; text-transform: uppercase; color: #aaa; display: block; margin-top: 10px; font-weight: 900; letter-spacing: 1px; }
        input, select {
            width: 100%; height: 50px; padding: 0 12px; border-radius: 10px; border: 1px solid #444;
            background: #2a2a2a; color: #fff; font-size: 20px; font-weight: 900; margin-top: 4px; outline: none;
            -webkit-appearance: none;
        }

        .row-2 { display: flex; gap: 10px; }
        .row-2 > div { flex: 1; }

        .submit-btn {
            background: #ab47bc; color: #fff; font-weight: 900; border: none; border-radius: 14px;
            height: 60px; font-size: 24px; width: 100%; margin-top: 18px; cursor: pointer; letter-spacing: 2px;
        }
        .submit-btn:active { transform: scale(0.97); }

        #status { text-align: center; font-weight: 900; font-size: 15px; margin-top: 12px; min-height: 24px; color: #ffab00; }
    </style>
</head>
<body>

<div class="header-box">
    <h1>PASSES</h1>
    <div class="icon-btn" id="refreshBtn">🔄</div>
</div>

<div class="sync-badge" id="syncBadge" onclick="processOfflineQueue()">⚡ OFFLINE QUEUE: <span id="queueCount">0</span> (AUTO-SYNCING)</div>

<div class="nav-bar">
    <a href="run.html" class="nav-tile nav-run">RUN</a>
    <a href="tow.html" class="nav-tile nav-tow">TOW</a>
    <a href="release.html" class="nav-tile nav-rel">REL</a>
    <a href="passes.html" class="nav-tile nav-pass">PASS</a>
</div>

<div class="card">
    <label>PROPERTY</label>
    <select id="propertySelect"><option value="">LOADING PROPERTIES...</option></select>

    <label>REGO</label>
    <input type="text" id="regoInput" placeholder="ENTER REGO" style="color:#ab47bc; text-transform:uppercase;">

    <div class="row-2">
        <div>
            <label>DURATION (DAYS)</label>
            <input type="number" id="durationInput" value="1" min="1">
        </div>
        <div>
            <label>START DATE</label>
            <input type="date" id="startDateInput">
        </div>
    </div>

    <label>NOTES</label>
    <input type="text" id="notesInput" placeholder="REASON / GUEST NAME">

    <button class="submit-btn" id="submitBtn">ADD PASS</button>
    <div id="status"></div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";

    // SERVICE WORKER UPDATED FOR OFFLINE ACCESS
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js?v=300').catch(()=>{});
    }

    const propertySelect = document.getElementById('propertySelect');
    const regoInput = document.getElementById('regoInput');
    const durationInput = document.getElementById('durationInput');
    const startDateInput = document.getElementById('startDateInput');
    const notesInput = document.getElementById('notesInput');

    const submitBtn = document.getElementById('submitBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const statusDiv = document.getElementById('status');
    const syncBadge = document.getElementById('syncBadge');
    const queueCount = document.getElementById('queueCount');

    let isSubmitting = false;

    window.addEventListener('load', async () => {
        setTodayDate();
        await loadProperties();
        updateQueueUI();
        window.addEventListener('online', processOfflineQueue);
    });

    refreshBtn.addEventListener('click', async () => {
        if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            for (let registration of registrations) {
                await registration.unregister();
            }
        }
        window.location.reload(true);
    });

    function setTodayDate() {
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        startDateInput.value = `${yyyy}-${mm}-${dd}`;
    }

    async function loadProperties() {
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL + "?action=get_properties");
            const data = await res.json();
            localStorage.setItem('cached_properties', JSON.stringify(data));
            populatePropertiesUI(data);
        } catch(e) {
            const cached = localStorage.getItem('cached_properties');
            if (cached) populatePropertiesUI(JSON.parse(cached));
        }
    }

    function populatePropertiesUI(data) {
        propertySelect.innerHTML = "";
        data.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.name; opt.innerText = p.name;
            propertySelect.appendChild(opt);
        });

        // PRE-SELECT LAST PROPERTY USED IF SAVED IN LOCALSTORAGE
        if (localStorage.getItem('last_pass_prop')) {
            propertySelect.value = localStorage.getItem('last_pass_prop');
        }
    }

    submitBtn.addEventListener('click', async (e) => {
        e.preventDefault();
        if (isSubmitting) return;

        const rego = regoInput.value.trim().toUpperCase();
        const prop = propertySelect.value;
        const duration = durationInput.value || "1";
        const startDate = startDateInput.value;

        if (!rego) { statusDiv.innerText = "ENTER A REGO FIRST"; return; }
        if (!prop) { statusDiv.innerText = "SELECT A PROPERTY"; return; }

        // SAVE SELECTED PROPERTY AS LAST USED
        localStorage.setItem('last_pass_prop', prop);

        isSubmitting = true;
        submitBtn.disabled = true;
        submitBtn.style.opacity = "0.5";

        const now = new Date(startDate);
        const durationDays = parseInt(duration, 10);
        const expiryDate = new Date(now.getTime() + (durationDays * 24 * 60 * 60 * 1000));

        const payload = {
            id: 'PASS_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
            action: 'add_pass',
            property: prop,
            rego: rego,
            startDate: startDate,
            duration: duration,
            expiryDate: expiryDate.toISOString(),
            notes: notesInput.value.trim()
        };

        if (!navigator.onLine) {
            saveToOfflineQueue(payload);
            statusDiv.innerText = "⚡ SAVED OFFLINE! WILL SYNC ON SIGNAL";
            setTimeout(() => { resetForm(); }, 1000);
            return;
        }

        statusDiv.innerText = "SAVING PASS...";
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });

            const responseData = await res.json();
            if (responseData.status === "ERROR") {
                statusDiv.innerText = `⚠️ ${responseData.message || "PASS ALREADY EXISTS"}`;
                isSubmitting = false;
                submitBtn.disabled = false;
                submitBtn.style.opacity = "1";
                return;
            }

            statusDiv.innerText = "✔ PASS ADDED SUCCESS!";
            setTimeout(() => { resetForm(); }, 1000);

        } catch(err) {
            saveToOfflineQueue(payload);
            statusDiv.innerText = "⚡ SAVED OFFLINE! WILL SYNC ON SIGNAL";
            setTimeout(() => { resetForm(); }, 1000);
        }
    });

    function resetForm() {
        regoInput.value = "";
        notesInput.value = "";
        durationInput.value = "1";
        setTodayDate();
        statusDiv.innerText = "";
        isSubmitting = false;
        submitBtn.disabled = false;
        submitBtn.style.opacity = "1";

        // RESTORE LAST USED PROPERTY VALUE
        if (localStorage.getItem('last_pass_prop')) {
            propertySelect.value = localStorage.getItem('last_pass_prop');
        }
    }

    function saveToOfflineQueue(payload) {
        let queue = JSON.parse(localStorage.getItem('pass_offline_queue') || "[]");
        if (!queue.some(item => item.id === payload.id)) {
            queue.push(payload);
            localStorage.setItem('pass_offline_queue', JSON.stringify(queue));
        }
        updateQueueUI();
    }

    function updateQueueUI() {
        let queue = JSON.parse(localStorage.getItem('pass_offline_queue') || "[]");
        if (queue.length > 0) {
            queueCount.innerText = queue.length;
            syncBadge.style.display = 'block';
        } else {
            syncBadge.style.display = 'none';
        }
    }

    async function processOfflineQueue() {
        let queue = JSON.parse(localStorage.getItem('pass_offline_queue') || "[]");
        if (queue.length === 0 || !navigator.onLine) return;

        let remaining = [];

        for (let item of queue) {
            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(item)
                });
            } catch(e) {
                remaining.push(item);
            }
        }

        localStorage.setItem('pass_offline_queue', JSON.stringify(remaining));
        updateQueueUI();
    }
</script>
</body>
</html>
