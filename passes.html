<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

    <title>PASSES</title>
    
    <link rel="apple-touch-icon" href="icon-pass.png?v=703">
    <link rel="icon" type="image/png" href="icon-pass.png?v=703">
    <link rel="manifest" href="manifest-pass.json?v=703">

    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            margin: 0; padding: 14px; background: #121212; color: #fff; 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
            padding-bottom: 110px;
        }
        
        .header-box { display: flex; align-items: center; justify-content: center; position: relative; width: 100%; max-width: 440px; margin-bottom: 10px; }
        .header-box h1 { margin: 0; font-size: 38px; font-weight: 900; color: #ab47bc; letter-spacing: 2px; text-align: center; }
        .icon-btn { position: absolute; right: 0; background: #2a2a2a; border: 1px solid #444; border-radius: 10px; font-size: 20px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; }
        .icon-btn:active { transform: scale(0.9); }

        .nav-bar { display: flex; gap: 8px; width: 100%; max-width: 440px; margin-bottom: 16px; }
        .nav-tile { flex: 1; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 900; text-decoration: none; color: #000; }
        .nav-run { background: #ffab00; }
        .nav-tow { background: #ff1744; color: #fff; }
        .nav-rel { background: #00e676; }
        .nav-pass { background: #ab47bc; color: #fff; }

        .container { width: 100%; max-width: 440px; }

        .prop-summary-card {
            background: #1e1e1e; border-radius: 16px; padding: 14px; margin-bottom: 12px;
            border: 1px solid #333; display: flex; align-items: center; justify-content: space-between;
            cursor: pointer;
        }
        .prop-summary-card:active { transform: scale(0.98); }
        .prop-name {
            font-size: 19px; font-weight: 900; color: #ffab00; text-transform: uppercase;
            letter-spacing: 1px; flex: 1; padding-right: 8px;
        }

        .cnt-btn-blue {
            width: 58px; height: 58px; border-radius: 10px; border: none;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: #29b6f6; color: #000; padding: 0; flex-shrink: 0;
        }
        .cnt-num { font-size: 22px; font-weight: 900; line-height: 1; margin-bottom: 2px; }
        .cnt-lbl { font-size: 10px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; line-height: 1; }

        .back-btn {
            background: #2a2a2a; border: 1px solid #444; color: #ffab00; padding: 8px 16px;
            border-radius: 10px; font-weight: 900; margin-bottom: 14px; cursor: pointer; display: inline-block;
        }
        .detail-title { font-size: 24px; font-weight: 900; color: #ffab00; margin-bottom: 12px; text-transform: uppercase; }

        .pass-tile {
            background: #1e1e1e; border-radius: 14px; padding: 14px; margin-bottom: 10px;
            border: 2px solid #29b6f6; color: #fff;
        }
        .pass-header { display: flex; justify-content: space-between; align-items: baseline; }
        .pass-rego { font-size: 28px; font-weight: 900; color: #29b6f6; letter-spacing: 1px; }
        .pass-expiry { font-size: 18px; font-weight: 900; color: #29b6f6; text-align: right; }

        .pass-footer { display: flex; justify-content: space-between; margin-top: 6px; font-size: 12px; color: #aaa; font-weight: 700; }
        .pass-notes { color: #fff; font-weight: 800; max-width: 50%; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .card { background: #1e1e1e; border-radius: 18px; padding: 18px; width: 100%; max-width: 440px; border: 1px solid #333; margin-bottom: 16px; }
        label { font-size: 12px; text-transform: uppercase; color: #aaa; display: block; margin-top: 10px; font-weight: 900; letter-spacing: 1px; }
        input, select {
            width: 100%; height: 50px; padding: 0 12px; border-radius: 10px; border: 1px solid #444;
            background: #2a2a2a; color: #fff; font-size: 20px; font-weight: 900; margin-top: 4px; outline: none;
            -webkit-appearance: none;
        }

        .row-2 { display: flex; gap: 10px; }
        .row-2 > div { flex: 1; }

        .submit-btn {
            background: #ab47bc; color: #fff; font-weight: 900; border: none; border-radius: 14px;
            height: 60px; font-size: 24px; width: 100%; margin-top: 18px; cursor: pointer; letter-spacing: 2px;
        }

        .fab-add {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 76px; height: 76px; background: #29b6f6; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 48px; font-weight: 900; color: #000; box-shadow: 0 6px 22px rgba(41, 182, 246, 0.5);
            cursor: pointer; z-index: 999; border: none; user-select: none;
        }
        .fab-add:active { transform: translateX(-50%) scale(0.90); }

        .empty-msg { text-align: center; color: #666; font-weight: 800; font-size: 16px; margin-top: 40px; }
        #status { text-align: center; font-weight: 900; font-size: 15px; margin-top: 12px; min-height: 24px; color: #ab47bc; }
    </style>
</head>
<body>

<div class="header-box">
    <h1>PASSES</h1>
    <div class="icon-btn" id="refreshBtn">🔄</div>
</div>

<div class="nav-bar">
    <a href="run.html" class="nav-tile nav-run">RUN</a>
    <a href="tow.html" class="nav-tile nav-tow">TOW</a>
    <a href="release.html" class="nav-tile nav-rel">REL</a>
    <a href="passes.html" class="nav-tile nav-pass">PASS</a>
</div>

<div class="container" id="passContainer">
    <div class="empty-msg">LOADING PASSES...</div>
</div>

<button class="fab-add" id="fabAddBtn">+</button>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(()=>{});
    }

    const passContainer = document.getElementById('passContainer');
    const refreshBtn = document.getElementById('refreshBtn');
    const fabAddBtn = document.getElementById('fabAddBtn');

    let allPasses = [];
    let propertyPassGroups = {};
    let cachedProperties = [];

    window.addEventListener('load', () => {
        loadData();
    });

    refreshBtn.addEventListener('click', () => {
        passContainer.innerHTML = "<div class='empty-msg'>REFRESHING...</div>";
        loadData();
    });

    fabAddBtn.addEventListener('click', renderAddPassForm);

    async function loadData() {
        await loadProperties();
        await loadActivePasses();
    }

    async function loadProperties() {
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL + "?action=get_properties");
            cachedProperties = await res.json();
            localStorage.setItem('cached_properties', JSON.stringify(cachedProperties));
        } catch(e) {
            const cached = localStorage.getItem('cached_properties');
            if (cached) cachedProperties = JSON.parse(cached);
        }
    }

    async function loadActivePasses() {
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL + "?action=get_passes");
            allPasses = await res.json();
            localStorage.setItem('cached_passes', JSON.stringify(allPasses));
            parseAndRenderPassSummary();
        } catch(e) {
            const cached = localStorage.getItem('cached_passes');
            if (cached) {
                allPasses = JSON.parse(cached);
                parseAndRenderPassSummary();
            } else {
                passContainer.innerHTML = "<div class='empty-msg'>NO OFFLINE DATA STORED</div>";
            }
        }
    }

    function parseAndRenderPassSummary() {
        propertyPassGroups = {};

        allPasses.forEach(p => {
            const prop = p.property || "GENERAL";
            if (!propertyPassGroups[prop]) propertyPassGroups[prop] = [];
            propertyPassGroups[prop].push(p);
        });

        renderSummaryView();
    }

    function formatExpiryNoYear(expiryStr) {
        if (!expiryStr) return "EXP: N/A";
        let cleanStr = expiryStr.replace(/-\d{2,4}$/, '').trim();
        return `EXP: ${cleanStr}`;
    }

    function renderSummaryView() {
        passContainer.innerHTML = "";

        const activeProps = Object.keys(propertyPassGroups).filter(prop => propertyPassGroups[prop].length > 0);

        activeProps.sort((a, b) => {
            const countA = propertyPassGroups[a].length;
            const countB = propertyPassGroups[b].length;
            if (countB !== countA) return countB - countA;
            return a.localeCompare(b);
        });

        if (activeProps.length === 0) {
            passContainer.innerHTML = "<div class='empty-msg'>NO ACTIVE PASSES</div>";
            return;
        }

        activeProps.forEach(prop => {
            const count = propertyPassGroups[prop].length;

            const card = document.createElement('div');
            card.className = 'prop-summary-card';
            card.onclick = () => renderDetailView(prop);

            card.innerHTML = `
                <div class="prop-name">${prop}</div>
                <div class="cnt-btn-blue">
                    <span class="cnt-num">${count}</span>
                    <span class="cnt-lbl">PASS</span>
                </div>
            `;

            passContainer.appendChild(card);
        });
    }

    function renderDetailView(prop) {
        passContainer.innerHTML = "";

        const backBtn = document.createElement('div');
        backBtn.className = 'back-btn';
        backBtn.innerText = "← BACK TO ALL PROPERTIES";
        backBtn.onclick = renderSummaryView;
        passContainer.appendChild(backBtn);

        const title = document.createElement('div');
        title.className = 'detail-title';
        title.innerText = prop;
        passContainer.appendChild(title);

        const passes = propertyPassGroups[prop] || [];

        if (passes.length === 0) {
            passContainer.innerHTML += `<div class="empty-msg">NO PASSES FOR THIS PROPERTY</div>`;
            return;
        }

        passes.forEach(p => {
            const tile = document.createElement('div');
            tile.className = 'pass-tile';

            tile.innerHTML = `
                <div class="pass-header">
                    <div class="pass-rego">${p.rego}</div>
                    <div class="pass-expiry">${formatExpiryNoYear(p.expiry)}</div>
                </div>
                <div class="pass-footer">
                    <div>START: ${p.startDate} (${p.duration})</div>
                    ${p.notes ? `<div class="pass-notes">${p.notes}</div>` : ''}
                </div>
            `;

            passContainer.appendChild(tile);
        });
    }

    function renderAddPassForm() {
        passContainer.innerHTML = "";

        const backBtn = document.createElement('div');
        backBtn.className = 'back-btn';
        backBtn.innerText = "← BACK TO PASSES";
        backBtn.onclick = renderSummaryView;
        passContainer.appendChild(backBtn);

        let propOptionsHtml = "<option value=''>SELECT PROPERTY (REQUIRED)</option>";
        cachedProperties.forEach(p => {
            propOptionsHtml += `<option value="${p.name}">${p.name}</option>`;
        });

        const todayStr = new Date().toISOString().split('T')[0];

        const formCard = document.createElement('div');
        formCard.className = 'card';
        formCard.innerHTML = `
            <label style="color:#ffab00;">PROPERTY (REQUIRED)</label>
            <select id="propertySelect">${propOptionsHtml}</select>

            <label>OPTION 1: UPLOAD SCREENSHOT (MULTI-VEHICLE)</label>
            <input type="file" id="ocrInput" accept="image/*" style="font-size:14px; padding:10px; height:auto;">

            <hr style="border:0; border-top:1px solid #333; margin:16px 0;">

            <label>OPTION 2: MANUAL ENTRY</label>
            <label>VEHICLE REGO</label>
            <input type="text" id="regoInput" placeholder="REGO" style="text-transform:uppercase; color:#ab47bc;">

            <div class="row-2">
                <div>
                    <label>START DATE</label>
                    <input type="date" id="startDateInput" value="${todayStr}" style="font-size:16px;" onchange="onStartDateChange()">
                </div>
                <div>
                    <label>EXPIRY DATE</label>
                    <input type="date" id="expiryDateInput" style="font-size:16px;" onchange="onExpiryDateChange()">
                </div>
            </div>

            <label>DURATION (DAYS)</label>
            <select id="durationSelect" onchange="onDurationSelectChange(this.value)">
                <option value="1" selected>1 DAY</option>
                <option value="2">2 DAYS</option>
                <option value="3">3 DAYS</option>
                <option value="4">4 DAYS</option>
                <option value="5">5 DAYS</option>
                <option value="6">6 DAYS</option>
                <option value="7">7 DAYS</option>
                <option value="custom" id="customOpt" style="display:none;">CUSTOM</option>
            </select>

            <label>NOTES / APARTMENT</label>
            <input type="text" id="notesInput" placeholder="NOTES (OPTIONAL)">

            <button class="submit-btn" id="submitBtn">ADD PASS</button>
            <div id="status"></div>
        `;

        passContainer.appendChild(formCard);

        onDurationSelectChange("1");

        document.getElementById('submitBtn').addEventListener('click', async () => {
            const propertySelect = document.getElementById('propertySelect');
            const ocrInput = document.getElementById('ocrInput');
            const regoInput = document.getElementById('regoInput');
            const startDateInput = document.getElementById('startDateInput');
            const expiryDateInput = document.getElementById('expiryDateInput');
            const durationSelect = document.getElementById('durationSelect');
            const notesInput = document.getElementById('notesInput');
            const statusDiv = document.getElementById('status');

            const selectedProp = propertySelect.value;
            if (!selectedProp) {
                statusDiv.innerText = "SELECT A PROPERTY FIRST!";
                return;
            }

            if (ocrInput.files && ocrInput.files[0]) {
                statusDiv.innerText = "READING SCREENSHOT & ADDING PASSES...";
                const reader = new FileReader();
                reader.onload = async () => {
                    try {
                        const res = await fetch(GOOGLE_SCRIPT_URL, {
                            method: 'POST',
                            body: JSON.stringify({
                                action: 'parse_pass_screenshot',
                                property: selectedProp,
                                photoBytes: reader.result,
                                duration: durationSelect.value === "custom" ? "1" : durationSelect.value,
                                notes: notesInput.value.trim()
                            })
                        });
                        const data = await res.json();
                        if (data.status === "SUCCESS") {
                            statusDiv.innerText = `✔ ADDED ${data.addedCount} PASSES (${data.skippedCount} DUPLICATES SKIPPED)`;
                            setTimeout(loadData, 1500);
                        } else {
                            statusDiv.innerText = "ERROR: " + data.message;
                        }
                    } catch(err) {
                        statusDiv.innerText = "OCR FAILED - CHECK NETWORK";
                    }
                };
                reader.readAsDataURL(ocrInput.files[0]);
                return;
            }

            const rego = regoInput.value.trim().toUpperCase();
            if (!rego) { statusDiv.innerText = "ENTER REGO OR CHOOSE SCREENSHOT!"; return; }

            const startDate = startDateInput.value ? new Date(startDateInput.value) : new Date();
            const expiryDate = expiryDateInput.value ? new Date(expiryDateInput.value) : new Date(startDate.getTime() + (24 * 60 * 60 * 1000));

            const diffTime = Math.abs(expiryDate - startDate);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) || 1;

            const payload = {
                action: 'add_pass',
                property: selectedProp,
                rego: rego,
                startDate: startDate,
                duration: String(diffDays),
                expiryDate: expiryDate,
                notes: notesInput.value.trim()
            };

            statusDiv.innerText = "ADDING MANUAL PASS...";
            try {
                const res = await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                const data = await res.json();
                if (data.status === "SUCCESS") {
                    statusDiv.innerText = "✔ PASS ADDED SUCCESS!";
                    setTimeout(loadData, 1000);
                } else {
                    statusDiv.innerText = "ERROR: " + data.message;
                }
            } catch(err) {
                statusDiv.innerText = "ERROR ADDING PASS (OFFLINE)";
            }
        });
    }

    function onDurationSelectChange(val) {
        if (val === "custom") return;
        const startDateInput = document.getElementById('startDateInput');
        const expiryDateInput = document.getElementById('expiryDateInput');
        if (!startDateInput || !expiryDateInput) return;

        const start = startDateInput.value ? new Date(startDateInput.value) : new Date();
        const days = parseInt(val, 10);
        const exp = new Date(start.getTime() + (days * 24 * 60 * 60 * 1000));
        expiryDateInput.value = exp.toISOString().split('T')[0];
    }

    function onStartDateChange() {
        const durationSelect = document.getElementById('durationSelect');
        onDurationSelectChange(durationSelect.value);
    }

    function onExpiryDateChange() {
        const startDateInput = document.getElementById('startDateInput');
        const expiryDateInput = document.getElementById('expiryDateInput');
        const durationSelect = document.getElementById('durationSelect');
        const customOpt = document.getElementById('customOpt');

        if (!startDateInput.value || !expiryDateInput.value) return;

        const start = new Date(startDateInput.value);
        const exp = new Date(expiryDateInput.value);
        
        const diffTime = exp - start;
        const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));

        if (diffDays >= 1 && diffDays <= 7) {
            durationSelect.value = String(diffDays);
            customOpt.style.display = "none";
        } else {
            customOpt.innerText = `CUSTOM (${diffDays} DAYS)`;
            customOpt.style.display = "block";
            durationSelect.value = "custom";
        }
    }
</script>
</body>
</html>
