<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

    <title>PASSES</title>
    
    <link rel="apple-touch-icon" href="icon-pass.png?v=80000">
    <link rel="icon" type="image/png" href="icon-pass.png?v=80000">
    <link rel="manifest" href="manifest-pass.json?v=80000">

    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            margin: 0; padding: 14px; background: #121212; color: #fff; 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }
        
        .header-box { display: flex; align-items: center; justify-content: center; position: relative; width: 100%; max-width: 440px; margin-bottom: 10px; }
        .header-box h1 { margin: 0; font-size: 38px; font-weight: 900; color: #ab47bc; letter-spacing: 2px; text-align: center; }
        .icon-btn { position: absolute; right: 0; background: #2a2a2a; border: 1px solid #444; border-radius: 10px; font-size: 20px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; }

        .nav-bar { display: flex; gap: 8px; width: 100%; max-width: 440px; margin-bottom: 16px; }
        .nav-tile { flex: 1; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 900; text-decoration: none; color: #000; }
        .nav-run { background: #ffab00; }
        .nav-tow { background: #ff1744; color: #fff; }
        .nav-rel { background: #00e676; }
        .nav-pass { background: #ab47bc; color: #fff; }

        .card { background: #1e1e1e; border-radius: 18px; padding: 18px; width: 100%; max-width: 440px; border: 1px solid #333; margin-bottom: 16px; }
        
        label { font-size: 12px; text-transform: uppercase; color: #aaa; display: block; margin-top: 10px; font-weight: 900; letter-spacing: 1px; }
        input, select, textarea {
            width: 100%; height: 50px; padding: 0 12px; border-radius: 10px; border: 1px solid #444;
            background: #2a2a2a; color: #fff; font-size: 18px; font-weight: 900; margin-top: 4px; outline: none;
            -webkit-appearance: none;
        }

        textarea { height: 80px; padding: 10px; font-size: 16px; font-weight: 400; resize: none; }

        .row-2 { display: flex; gap: 10px; }
        .row-2 > div { flex: 1; }

        .action-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 440px; margin-bottom: 10px; }
        .action-title { font-size: 20px; font-weight: 900; color: #ab47bc; letter-spacing: 1px; }
        .add-btn { background: #ab47bc; color: #fff; border: none; border-radius: 10px; width: 44px; height: 44px; font-size: 26px; font-weight: 900; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        .pass-list { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 10px; }
        .pass-item { background: #1e1e1e; border: 1px solid #333; border-radius: 12px; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
        .pass-rego { font-size: 22px; font-weight: 900; color: #ab47bc; letter-spacing: 1px; }
        .pass-prop { font-size: 14px; font-weight: 700; color: #aaa; margin-top: 2px; }
        .pass-exp { font-size: 12px; font-weight: 900; color: #ffab00; margin-top: 4px; }

        .submit-btn {
            background: #ab47bc; color: #fff; font-weight: 900; border: none; border-radius: 14px;
            height: 56px; font-size: 22px; width: 100%; margin-top: 18px; cursor: pointer; letter-spacing: 1px;
        }

        #status { text-align: center; font-weight: 900; font-size: 15px; margin-top: 12px; min-height: 24px; color: #ffab00; }
    </style>
</head>
<body>

<div class="header-box">
    <h1>PASSES</h1>
    <div class="icon-btn" id="refreshBtn">🔄</div>
</div>

<div class="nav-bar">
    <a href="run.html" class="nav-tile nav-run">RUN</a>
    <a href="tow.html" class="nav-tile nav-tow">TOW</a>
    <a href="release.html" class="nav-tile nav-rel">REL</a>
    <a href="passes.html" class="nav-tile nav-pass">PASS</a>
</div>

<!-- VIEW 1: PASS SUMMARY LIST -->
<div id="summaryView" style="width: 100%; max-width: 440px;">
    <div class="action-bar">
        <div class="action-title">ACTIVE PASSES</div>
        <button class="add-btn" id="openAddBtn">＋</button>
    </div>
    <div class="pass-list" id="passListContainer">
        <div style="text-align:center; color:#aaa; font-weight:700; margin-top:20px;">LOADING ACTIVE PASSES...</div>
    </div>
</div>

<!-- VIEW 2: ADD PASS FORM (HIDDEN BY DEFAULT) -->
<div class="card" id="addFormCard" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <span style="font-size:18px; font-weight:900; color:#ab47bc;">ADD VISITOR PASS</span>
        <button onclick="showSummaryView()" style="background:#333; color:#fff; border:1px solid #555; padding:6px 12px; border-radius:8px; font-size:12px; font-weight:900; cursor:pointer;">CANCEL</button>
    </div>

    <label>PROPERTY</label>
    <select id="propertySelect"><option value="">LOADING PROPERTIES...</option></select>

    <label>REGO</label>
    <input type="text" id="regoInput" placeholder="REGO" style="color:#ab47bc; text-transform:uppercase;">

    <div class="row-2">
        <div>
            <label>START DATE</label>
            <input type="date" id="startDateInput">
        </div>
        <div>
            <label>DURATION (DAYS)</label>
            <select id="durationSelect">
                <option value="1" selected>1 Day</option>
                <option value="2">2 Days</option>
                <option value="3">3 Days</option>
                <option value="7">7 Days</option>
                <option value="14">14 Days</option>
                <option value="30">30 Days</option>
            </select>
        </div>
    </div>

    <label>NOTES / REASON</label>
    <textarea id="notesInput" placeholder="OPTIONAL NOTES..."></textarea>

    <button class="submit-btn" id="savePassBtn">ADD PASS</button>
    <div id="status"></div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js?v=80000').catch(()=>{});
    }

    const summaryView = document.getElementById('summaryView');
    const addFormCard = document.getElementById('addFormCard');
    const openAddBtn = document.getElementById('openAddBtn');
    const passListContainer = document.getElementById('passListContainer');

    const propertySelect = document.getElementById('propertySelect');
    const regoInput = document.getElementById('regoInput');
    const startDateInput = document.getElementById('startDateInput');
    const durationSelect = document.getElementById('durationSelect');
    const notesInput = document.getElementById('notesInput');

    const savePassBtn = document.getElementById('savePassBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const statusDiv = document.getElementById('status');

    let isSubmitting = false;

    window.addEventListener('load', async () => {
        setTodayStartDate();
        await loadProperties();
        await loadActivePasses();
    });

    refreshBtn.addEventListener('click', () => {
        window.location.reload(true);
    });

    function setTodayStartDate() {
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        startDateInput.value = `${year}-${month}-${day}`;
    }

    // Save property selection manually whenever user changes it
    propertySelect.addEventListener('change', () => {
        if (propertySelect.value) {
            localStorage.setItem('last_pass_property', propertySelect.value);
        }
    });

    async function loadProperties() {
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL + "?action=get_properties");
            const data = await res.json();
            localStorage.setItem('cached_properties', JSON.stringify(data));
            populatePropertiesUI(data);
        } catch(e) {
            const cached = localStorage.getItem('cached_properties');
            if (cached) populatePropertiesUI(JSON.parse(cached));
        }
    }

    function populatePropertiesUI(data) {
        propertySelect.innerHTML = "";
        data.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.name; opt.innerText = p.name;
            propertySelect.appendChild(opt);
        });

        // Apply last used property if available
        applyLastProperty();
    }

    function applyLastProperty() {
        const lastProp = localStorage.getItem('last_pass_property');
        if (lastProp && propertySelect.options.length > 0) {
            for (let i = 0; i < propertySelect.options.length; i++) {
                if (propertySelect.options[i].value === lastProp) {
                    propertySelect.selectedIndex = i;
                    break;
                }
            }
        }
    }

    async function loadActivePasses() {
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL + "?action=get_passes");
            const data = await res.json();
            renderPassList(data);
        } catch(e) {
            passListContainer.innerHTML = `<div style="text-align:center; color:#ff1744; font-weight:700;">OFFLINE - CANNOT FETCH PASSES</div>`;
        }
    }

    function renderPassList(passes) {
        if (!passes || passes.length === 0) {
            passListContainer.innerHTML = `<div style="text-align:center; color:#aaa; font-weight:700; margin-top:20px;">NO ACTIVE PASSES</div>`;
            return;
        }

        passListContainer.innerHTML = "";
        passes.forEach(p => {
            const div = document.createElement('div');
            div.className = 'pass-item';
            div.innerHTML = `
                <div>
                    <div class="pass-rego">${p.rego}</div>
                    <div class="pass-prop">${p.property}</div>
                </div>
                <div style="text-align:right;">
                    <div class="pass-exp">EXP: ${p.expiry}</div>
                    <div style="font-size:11px; color:#888; margin-top:2px;">${p.duration}</div>
                </div>
            `;
            passListContainer.appendChild(div);
        });
    }

    openAddBtn.addEventListener('click', () => {
        regoInput.value = "";
        notesInput.value = "";
        setTodayStartDate();
        applyLastProperty(); // Pre-selects the last property used
        statusDiv.innerText = "";

        summaryView.style.display = 'none';
        addFormCard.style.display = 'block';
    });

    function showSummaryView() {
        addFormCard.style.display = 'none';
        summaryView.style.display = 'block';
        loadActivePasses();
    }

    savePassBtn.addEventListener('click', async (e) => {
        e.preventDefault();
        if (isSubmitting) return;

        const rego = regoInput.value.trim().toUpperCase();
        const prop = propertySelect.value;
        if (!rego) { statusDiv.innerText = "ENTER REGO FIRST"; return; }
        if (!prop) { statusDiv.innerText = "SELECT PROPERTY FIRST"; return; }

        // Remember the property used
        localStorage.setItem('last_pass_property', prop);

        isSubmitting = true;
        savePassBtn.disabled = true;
        savePassBtn.style.opacity = "0.5";

        const startDate = new Date(startDateInput.value);
        const durationDays = parseInt(durationSelect.value, 10);
        const expiryDate = new Date(startDate.getTime() + (durationDays * 24 * 60 * 60 * 1000));

        const payload = {
            action: 'add_pass',
            property: prop,
            rego: rego,
            startDate: startDateInput.value,
            duration: durationSelect.value,
            expiryDate: expiryDate.toISOString(),
            notes: notesInput.value.trim()
        };

        statusDiv.innerText = "SAVING PASS...";
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });

            const responseData = await res.json();
            if (responseData.status === "ERROR") {
                statusDiv.innerText = `⚠️ ${responseData.message || "PASS ALREADY EXISTS"}`;
                isSubmitting = false;
                savePassBtn.disabled = false;
                savePassBtn.style.opacity = "1";
                return;
            }

            statusDiv.innerText = "✔ PASS ADDED SUCCESS!";
            setTimeout(() => {
                isSubmitting = false;
                savePassBtn.disabled = false;
                savePassBtn.style.opacity = "1";
                showSummaryView();
            }, 800);

        } catch(err) {
            statusDiv.innerText = "ERROR SAVING PASS";
            isSubmitting = false;
            savePassBtn.disabled = false;
            savePassBtn.style.opacity = "1";
        }
    });
</script>
</body>
</html>
