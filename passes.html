<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PASSES</title>
    
    <link rel="apple-touch-icon" href="icon-pass.png?v=4">
    <link rel="icon" type="image/png" href="icon-pass.png?v=4">
    <link rel="manifest" href="manifest-passes.json?v=4">

    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: 14px; background: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .header h1 { margin: 0 0 14px 0; font-size: 38px; font-weight: 900; color: #ab47bc; letter-spacing: 2px; text-align: center; }
        .container { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 12px; }

        .prop-card { background: #1e1e1e; border-radius: 18px; padding: 22px; border: 1px solid #333; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .prop-title { font-size: 24px; font-weight: 900; color: #fff; }
        .pass-count { background: #ab47bc; color: #fff; font-weight: 900; padding: 8px 18px; border-radius: 20px; font-size: 20px; }

        .pass-card { background: #1e1e1e; border-radius: 18px; padding: 20px; border-left: 8px solid #ab47bc; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
        .back-btn { background: #2a2a2a; color: #ab47bc; border: 2px solid #ab47bc; border-radius: 12px; height: 50px; font-size: 18px; font-weight: 900; width: 100%; cursor: pointer; margin-bottom: 10px; }

        /* CENTERED LARGE PLUS BUTTON */
        .fab {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            width: 120px; height: 120px; background: #ab47bc; color: #fff; border-radius: 50%;
            font-size: 64px; font-weight: 900; border: 6px solid #fff; box-shadow: 0 8px 26px rgba(171, 71, 188, 0.6);
            cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 90;
        }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; justify-content: center; align-items: center; padding: 16px; }
        .modal-content { background: #1e1e1e; border-radius: 18px; padding: 20px; width: 100%; max-width: 400px; border: 1px solid #333; }
        label { font-size: 13px; text-transform: uppercase; color: #aaa; display: block; margin-top: 12px; font-weight: 900; }
        input { width: 100%; height: 50px; padding: 0 12px; border-radius: 10px; border: 1px solid #444; background: #2a2a2a; color: #fff; font-size: 18px; margin-top: 4px; }
    </style>
</head>
<body>

<div class="header"><h1>PASSES</h1></div>
<div class="container" id="passContainer"><div style="text-align:center; color:#aaa; font-weight:900; font-size:20px;">LOADING PASSES...</div></div>

<button class="fab" id="addPassFab">+</button>

<div class="modal" id="passModal">
    <div class="modal-content">
        <h2 style="margin:0; color:#ab47bc; font-size:24px;">ADD PASS</h2>
        <label>REGISTRATION</label>
        <input type="text" id="passRego" placeholder="REGO" style="text-transform:uppercase; font-size:22px; color:#ab47bc; font-weight:900;">
        <label>PROPERTY</label>
        <input type="text" id="passProp" placeholder="PROPERTY">
        <label>EXPIRY DATE</label>
        <input type="date" id="passExpiry">
        <label>NOTES / UNIT NO</label>
        <input type="text" id="passNotes" placeholder="UNIT / NOTES">
        <button id="savePassBtn" style="width:100%; height:54px; background:#ab47bc; color:#fff; font-weight:900; border:none; border-radius:12px; margin-top:18px; font-size:20px;">SAVE PASS</button>
        <button id="closePassBtn" style="width:100%; height:40px; background:transparent; color:#aaa; border:none; margin-top:8px;">CANCEL</button>
    </div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";
    const passContainer = document.getElementById('passContainer');
    let passesData = [];

    window.addEventListener('load', loadPasses);

    async function loadPasses() {
        try {
            const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=get_passes`);
            passesData = await res.json();
            renderPropertyView();
        } catch(e) { passContainer.innerHTML = '<div style="text-align:center; color:#ff1744; font-weight:900;">ERROR LOADING PASSES</div>'; }
    }

    function formatDDMMM(dStr) {
        if (!dStr) return "N/A";
        const d = new Date(dStr);
        if (isNaN(d)) return dStr;
        const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
        return `${String(d.getDate()).padStart(2, '0')}-${months[d.getMonth()]}`;
    }

    function renderPropertyView() {
        passContainer.innerHTML = '';
        const propGroups = {};
        passesData.forEach(p => {
            const prop = p.property || 'GENERAL';
            propGroups[prop] = (propGroups[prop] || 0) + 1;
        });

        Object.keys(propGroups).forEach(prop => {
            const card = document.createElement('div');
            card.className = 'prop-card';
            card.onclick = () => renderPassList(prop);
            card.innerHTML = `<div class="prop-title">📍 ${prop}</div><div class="pass-count">${propGroups[prop]}</div>`;
            passContainer.appendChild(card);
        });
    }

    function renderPassList(prop) {
        passContainer.innerHTML = `<button class="back-btn" onclick="renderPropertyView()">⬅ BACK TO PROPERTIES</button>`;
        const filtered = passesData.filter(p => p.property === prop);

        filtered.forEach(p => {
            const card = document.createElement('div');
            card.className = 'pass-card';
            card.innerHTML = `
                <div style="font-size:30px; font-weight:900; color:#ab47bc;">${p.rego}</div>
                <div style="font-size:18px; font-weight:800; color:#ccc;">📅 Expiry: <strong>${formatDDMMM(p.expiry)}</strong></div>
                <div style="font-size:16px; color:#aaa;">📝 ${p.notes || 'No notes'}</div>
            `;
            passContainer.appendChild(card);
        });
    }

    document.getElementById('addPassFab').onclick = () => document.getElementById('passModal').style.display = 'flex';
    document.getElementById('closePassBtn').onclick = () => document.getElementById('passModal').style.display = 'none';

    document.getElementById('savePassBtn').onclick = async () => {
        const payload = {
            action: 'add_pass',
            rego: document.getElementById('passRego').value.trim().toUpperCase(),
            property: document.getElementById('passProp').value.trim(),
            expiry: document.getElementById('passExpiry').value,
            notes: document.getElementById('passNotes').value.trim()
        };
        await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
        document.getElementById('passModal').style.display = 'none';
        loadPasses();
    };
</script>
</body>
</html>
