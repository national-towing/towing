<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

    <title>PASSES</title>
    
    <link rel="apple-touch-icon" href="icon-pass.png?v=700">
    <link rel="icon" type="image/png" href="icon-pass.png?v=700">
    <link rel="manifest" href="manifest-pass.json?v=700">

    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            margin: 0; padding: 14px; background: #121212; color: #fff; 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; 
        }
        
        .header-box { display: flex; align-items: center; justify-content: center; position: relative; width: 100%; max-width: 440px; margin-bottom: 10px; }
        .header-box h1 { margin: 0; font-size: 38px; font-weight: 900; color: #ab47bc; letter-spacing: 2px; text-align: center; }
        .icon-btn { position: absolute; right: 0; background: #2a2a2a; border: 1px solid #444; border-radius: 10px; font-size: 20px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; }
        .icon-btn:active { transform: scale(0.9); }

        .nav-bar { display: flex; gap: 8px; width: 100%; max-width: 440px; margin-bottom: 16px; }
        .nav-tile { flex: 1; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 900; text-decoration: none; color: #000; }
        .nav-run { background: #ffab00; }
        .nav-tow { background: #ff1744; color: #fff; }
        .nav-rel { background: #00e676; }
        .nav-pass { background: #ab47bc; color: #fff; }

        .container { width: 100%; max-width: 440px; }

        .property-title {
            font-size: 24px; font-weight: 900; color: #ffab00; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px;
        }

        .pass-tile {
            background: #1e1e1e; border-radius: 16px; padding: 16px; margin-bottom: 12px;
            border: 2px solid #29b6f6; cursor: pointer; transition: transform 0.1s ease;
        }
        .pass-tile:active { transform: scale(0.98); }

        .tile-top-row { display: flex; justify-content: space-between; align-items: baseline; }
        .pass-rego { font-size: 32px; font-weight: 900; color: #29b6f6; letter-spacing: 1px; }
        .pass-exp { font-size: 18px; font-weight: 900; color: #29b6f6; letter-spacing: 0.5px; }

        .tile-bottom-row {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 12px; color: #aaa; margin-top: 8px; font-weight: 700;
        }

        .fab-add {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            width: 72px; height: 72px; background: #29b6f6; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 40px; color: #000; font-weight: 900; cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6); z-index: 100;
        }
        .fab-add:active { transform: translateX(-50%) scale(0.92); }

        /* MODAL STYLES */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center;
            z-index: 200; padding: 20px;
        }
        .modal-card {
            background: #1e1e1e; border-radius: 18px; padding: 20px; width: 100%; max-width: 400px;
            border: 2px solid #ab47bc; box-shadow: 0 6px 30px rgba(0,0,0,0.8);
        }
        .modal-card h2 { margin: 0 0 14px 0; color: #ab47bc; font-size: 24px; font-weight: 900; text-transform: uppercase; text-align: center; }

        label { font-size: 12px; text-transform: uppercase; color: #aaa; display: block; margin-top: 10px; font-weight: 900; letter-spacing: 1px; }
        input, select {
            width: 100%; height: 48px; padding: 0 12px; border-radius: 10px; border: 1px solid #444;
            background: #2a2a2a; color: #fff; font-size: 18px; font-weight: 900; margin-top: 4px; outline: none;
            -webkit-appearance: none;
        }

        .modal-btn-row { display: flex; gap: 10px; margin-top: 18px; }
        .modal-btn {
            flex: 1; height: 48px; border-radius: 10px; border: none; font-size: 16px; font-weight: 900;
            cursor: pointer; letter-spacing: 1px; text-transform: uppercase;
        }
        .btn-cancel { background: #444; color: #fff; }
        .btn-save { background: #ab47bc; color: #fff; }

        .empty-msg { text-align: center; color: #666; font-weight: 800; font-size: 16px; margin-top: 40px; }
    </style>
</head>
<body>

<div class="header-box">
    <h1>PASSES</h1>
    <div class="icon-btn" id="refreshBtn">🔄</div>
</div>

<div class="nav-bar">
    <a href="run.html" class="nav-tile nav-run">RUN</a>
    <a href="tow.html" class="nav-tile nav-tow">TOW</a>
    <a href="release.html" class="nav-tile nav-rel">REL</a>
    <a href="passes.html" class="nav-tile nav-pass">PASS</a>
</div>

<div class="container" id="passContainer">
    <div class="empty-msg">LOADING PASSES...</div>
</div>

<div class="fab-add" id="fabAdd">+</div>

<!-- EDIT / ADD MODAL -->
<div class="modal-overlay" id="passModal">
    <div class="modal-card">
        <h2 id="modalTitle">EDIT PASS</h2>
        
        <label>PROPERTY</label>
        <select id="modalProp"></select>

        <label>REGISTRATION</label>
        <input type="text" id="modalRego" placeholder="REGO..." style="color:#29b6f6; text-transform:uppercase;">

        <label>DURATION (DAYS)</label>
        <input type="number" id="modalDuration" value="1" min="1">

        <label>NOTES</label>
        <input type="text" id="modalNotes" placeholder="NOTES / REASON...">

        <div class="modal-btn-row">
            <button class="modal-btn btn-cancel" id="btnCancel">CANCEL</button>
            <button class="modal-btn btn-save" id="btnSave">SAVE PASS</button>
        </div>
    </div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(()=>{});
    }

    const passContainer = document.getElementById('passContainer');
    const refreshBtn = document.getElementById('refreshBtn');
    const fabAdd = document.getElementById('fabAdd');

    const passModal = document.getElementById('passModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalProp = document.getElementById('modalProp');
    const modalRego = document.getElementById('modalRego');
    const modalDuration = document.getElementById('modalDuration');
    const modalNotes = document.getElementById('modalNotes');
    const btnCancel = document.getElementById('btnCancel');
    const btnSave = document.getElementById('btnSave');

    let passesData = [];
    let propertiesList = [];
    let activeEditPass = null;

    window.addEventListener('load', async () => {
        await loadProperties();
        loadPasses();
    });

    refreshBtn.addEventListener('click', () => {
        passContainer.innerHTML = "<div class='empty-msg'>REFRESHING...</div>";
        loadPasses();
    });

    async function loadProperties() {
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL + "?action=get_properties");
            propertiesList = await res.json();
            populatePropertiesSelect();
        } catch(e) {}
    }

    function populatePropertiesSelect() {
        modalProp.innerHTML = "";
        propertiesList.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.name;
            opt.innerText = p.name;
            modalProp.appendChild(opt);
        });
    }

    async function loadPasses() {
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL + "?action=get_passes");
            passesData = await res.json();
            localStorage.setItem('cached_passes', JSON.stringify(passesData));
            renderPasses(passesData);
        } catch(e) {
            const cached = localStorage.getItem('cached_passes');
            if (cached) {
                passesData = JSON.parse(cached);
                renderPasses(passesData);
            } else {
                passContainer.innerHTML = "<div class='empty-msg'>NO PASSES FOUND</div>";
            }
        }
    }

    function formatExpiryDisplay(rawExpStr) {
        if (!rawExpStr) return "N/A";
        
        // If string is already formatted like "Thu 01-Oct-26" or "Thu 01-Oct"
        if (String(rawExpStr).includes("-") && !String(rawExpStr).includes("T")) {
            const parts = String(rawExpStr).trim().split(/[\s-]+/);
            if (parts.length >= 3) {
                return `${parts[0]} ${parts[1]} ${parts[2]}`; // "Thu 01 Oct"
            }
            return String(rawExpStr);
        }

        // Standard date fallback
        const d = new Date(rawExpStr);
        if (!isNaN(d.getTime())) {
            const days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
            const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            const dayName = days[d.getDay()];
            const dd = String(d.getDate()).padStart(2, '0');
            const mmm = months[d.getMonth()];
            return `${dayName} ${dd} ${mmm}`;
        }

        return String(rawExpStr);
    }

    function renderPasses(data) {
        if (!data || !Array.isArray(data) || data.length === 0) {
            passContainer.innerHTML = "<div class='empty-msg'>NO ACTIVE PASSES</div>";
            return;
        }

        const grouped = {};
        data.forEach(p => {
            const prop = p.property || "WATERPOINT";
            if (!grouped[prop]) grouped[prop] = [];
            grouped[prop].push(p);
        });

        passContainer.innerHTML = "";

        Object.keys(grouped).sort().forEach(prop => {
            const title = document.createElement('div');
            title.className = 'property-title';
            title.innerText = prop;
            passContainer.appendChild(title);

            grouped[prop].forEach(pass => {
                const tile = document.createElement('div');
                tile.className = 'pass-tile';
                tile.onclick = () => openEditModal(pass);

                const cleanExpStr = formatExpiryDisplay(pass.expiry || pass.rawExpiry);

                tile.innerHTML = `
                    <div class="tile-top-row">
                        <span class="pass-rego">${pass.rego}</span>
                        <span class="pass-exp">EXP: ${cleanExpStr}</span>
                    </div>
                    <div class="tile-bottom-row">
                        <span>START: ${pass.startDate || 'N/A'} (${pass.duration})</span>
                        <span>${pass.notes || ''}</span>
                    </div>
                `;

                passContainer.appendChild(tile);
            });
        });
    }

    function openEditModal(pass) {
        activeEditPass = pass;
        modalTitle.innerText = "EDIT PASS";
        modalProp.value = pass.property || (propertiesList[0] ? propertiesList[0].name : "");
        modalRego.value = pass.rego;
        modalDuration.value = parseInt(pass.duration, 10) || 1;
        modalNotes.value = pass.notes || "";
        passModal.style.display = 'flex';
    }

    fabAdd.addEventListener('click', () => {
        activeEditPass = null;
        modalTitle.innerText = "ADD PASS";
        if (propertiesList.length > 0) modalProp.value = propertiesList[0].name;
        modalRego.value = "";
        modalDuration.value = 1;
        modalNotes.value = "";
        passModal.style.display = 'flex';
    });

    btnCancel.addEventListener('click', () => {
        passModal.style.display = 'none';
    });

    btnSave.addEventListener('click', async () => {
        const newRego = modalRego.value.trim().toUpperCase();
        if (!newRego) {
            alert("ENTER A REGISTRATION PLATE");
            return;
        }

        btnSave.disabled = true;
        btnSave.innerText = "SAVING...";

        const payload = {
            action: activeEditPass ? 'update_pass' : 'add_pass',
            oldRego: activeEditPass ? activeEditPass.rego : "",
            newRego: newRego,
            rego: newRego,
            property: modalProp.value,
            duration: modalDuration.value,
            notes: modalNotes.value,
            rowIdx: activeEditPass ? activeEditPass.rowIdx : null
        };

        try {
            await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });

            passModal.style.display = 'none';
            btnSave.disabled = false;
            btnSave.innerText = "SAVE PASS";

            passContainer.innerHTML = "<div class='empty-msg'>UPDATING PASSES...</div>";
            setTimeout(loadPasses, 1200);

        } catch(e) {
            alert("Network error. Could not update pass.");
            btnSave.disabled = false;
            btnSave.innerText = "SAVE PASS";
        }
    });
</script>
</body>
</html>
