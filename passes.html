<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EXEMPT PASSES</title>
    
    <link rel="apple-touch-icon" href="icon-pass.png?v=3">
    <link rel="icon" type="image/png" href="icon-pass.png?v=3">
    <link rel="manifest" href="manifest-passes.json?v=3">

    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; padding: 14px; background: #121212; color: #fff; 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }
        .header { width: 100%; max-width: 440px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .header h1 { margin: 0; font-size: 32px; font-weight: 900; color: #ab47bc; letter-spacing: 1px; }
        
        .container { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 12px; }

        .prop-card {
            background: #1e1e1e; border-radius: 16px; padding: 20px; border: 1px solid #333;
            display: flex; justify-content: space-between; align-items: center; cursor: pointer;
        }
        .prop-title { font-size: 22px; font-weight: 900; color: #fff; }
        .pass-count { background: #ab47bc; color: #fff; font-weight: 900; padding: 6px 14px; border-radius: 20px; font-size: 16px; }

        .pass-card {
            background: #1e1e1e; border-radius: 16px; padding: 18px; border-left: 6px solid #ab47bc;
            display: flex; flex-direction: column; gap: 6px;
        }

        .fab {
            position: fixed; bottom: 24px; right: 24px; width: 68px; height: 68px; background: #ab47bc;
            color: #fff; border-radius: 50%; font-size: 38px; font-weight: 900; border: none;
            box-shadow: 0 6px 18px rgba(171, 71, 188, 0.6); cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>PASSES</h1>
    <button onclick="loadPasses()" style="background:#2a2a2a; color:#ab47bc; border:2px solid #ab47bc; border-radius:10px; padding:8px 16px; font-weight:900; font-size:16px;">🔄 REFRESH</button>
</div>

<div class="container" id="passContainer">
    <div style="text-align:center; color:#aaa; font-weight:900; font-size:18px; margin-top:30px;">LOADING PASSES...</div>
</div>

<button class="fab" id="addPassFab">+</button>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";
    const passContainer = document.getElementById('passContainer');
    let passesData = [];

    window.addEventListener('load', loadPasses);

    async function loadPasses() {
        try {
            const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=get_passes`);
            passesData = await res.json();
            renderPropertyView();
        } catch(e) {
            passContainer.innerHTML = '<div style="text-align:center; color:#ff1744; font-weight:900; font-size:18px;">ERROR LOADING PASSES</div>';
        }
    }

    function renderPropertyView() {
        passContainer.innerHTML = '';
        const propGroups = {};
        passesData.forEach(p => {
            const prop = p.property || 'GENERAL';
            propGroups[prop] = (propGroups[prop] || 0) + 1;
        });

        if (Object.keys(propGroups).length === 0) {
            passContainer.innerHTML = '<div style="text-align:center; color:#aaa; font-size:18px; font-weight:800;">NO ACTIVE PASSES</div>';
            return;
        }

        Object.keys(propGroups).forEach(prop => {
            const card = document.createElement('div');
            card.className = 'prop-card';
            card.onclick = () => renderPassList(prop);
            card.innerHTML = `
                <div class="prop-title">📍 ${prop}</div>
                <div class="pass-count">${propGroups[prop]} PASSES</div>
            `;
            passContainer.appendChild(card);
        });
    }

    function renderPassList(prop) {
        passContainer.innerHTML = '';
        const filtered = passesData.filter(p => p.property === prop);

        filtered.forEach(p => {
            const card = document.createElement('div');
            card.className = 'pass-card';
            card.innerHTML = `
                <div style="font-size:26px; font-weight:900; color:#ab47bc;">${p.rego}</div>
                <div style="font-size:15px; color:#ccc;">📅 Expires: <strong>${p.expiry}</strong></div>
                <div style="font-size:14px; color:#888;">📝 ${p.notes || 'No notes'}</div>
            `;
            passContainer.appendChild(card);
        });
    }
</script>
</body>
</html>
