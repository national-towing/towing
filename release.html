<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RELEASE VEHICLE</title>
  <style>
    :root { --bg: #121212; --card-bg: #1e1e1e; --border: #333333; --c-rel: #00e676; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: var(--bg); color: #fff; padding: 14px; padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: 40px; }
    .header-box { display: flex; align-items: center; justify-content: center; position: relative; width: 100%; max-width: 440px; margin: 0 auto 12px auto; }
    .header-box h1 { font-size: 30px; font-weight: 900; color: var(--c-rel); letter-spacing: 1px; }
    .back-btn { position: absolute; left: 0; background: #2a2a2a; border: 1px solid #444; color: #ffab00; padding: 8px 14px; border-radius: 8px; font-weight: 900; text-decoration: none; font-size: 13px; }

    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 16px; width: 100%; max-width: 440px; margin: 0 auto 14px auto; }
    .sec-title { font-size: 12px; font-weight: 900; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .veh-banner { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 8px; }
    .rego-large { font-size: 32px; font-weight: 900; color: #facc15; }
    .prop-large { font-size: 18px; font-weight: 900; color: #aaa; }

    label { font-size: 11px; text-transform: uppercase; color: #aaa; display: block; margin-top: 8px; font-weight: 900; }
    input, select { width: 100%; height: 46px; background: #2a2a2a; border: 1.5px solid #444; border-radius: 8px; color: #fff; font-size: 16px; font-weight: 800; padding: 0 10px; margin-top: 4px; outline: none; }
    input:focus { border-color: var(--c-rel); }

    .sig-canvas-wrap { border: 2px dashed #ffab00; border-radius: 10px; background: #fff; margin-top: 6px; touch-action: none; position: relative; }
    canvas { width: 100%; height: 130px; display: block; }
    .clear-sig-btn { position: absolute; top: 6px; right: 6px; background: #333; color: #fff; border: none; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 900; cursor: pointer; }

    .fee-box { background: #141414; border: 1px solid #333; border-radius: 8px; padding: 10px; margin-top: 10px; display: flex; justify-content: space-between; align-items: center; }
    .total-paid { font-size: 22px; font-weight: 900; color: var(--c-rel); }

    .submit-rel-btn { width: 100%; height: 56px; background: var(--c-rel); color: #000; border: none; border-radius: 12px; font-size: 20px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; margin-top: 16px; }
    .submit-rel-btn:disabled { opacity: 0.5; }

    /* Success Overlay */
    #successModal { display: none; position: fixed; inset: 0; background: rgba(0, 230, 118, 0.96); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
    #successModal h2 { font-size: 36px; font-weight: 900; color: #000; margin-bottom: 10px; }
    #successModal p { font-size: 16px; font-weight: 800; color: #111; margin-bottom: 24px; }
    .view-inv-btn { background: #000; color: #fff; padding: 14px 28px; border-radius: 10px; font-size: 18px; font-weight: 900; text-decoration: none; display: inline-block; margin-bottom: 12px; }
  </style>
</head>
<body>

  <div class="header-box">
    <a href="yard.html" class="back-btn">← YARD</a>
    <h1>RELEASE</h1>
  </div>

  <div class="card">
    <div class="veh-banner">
      <span class="rego-large" id="dispRego">LOADING...</span>
      <span class="prop-large" id="dispProp"></span>
    </div>

    <div class="sec-title">Collector / Owner Identification</div>
    <label>FULL NAME</label>
    <input type="text" id="ownerName" placeholder="Full Legal Name">

    <label>ID / DRIVERS LICENCE NUMBER</label>
    <input type="text" id="idNumber" placeholder="Licence / ID Number">

    <label>RESIDENTIAL ADDRESS</label>
    <input type="text" id="ownerAddress" placeholder="Street, Suburb, Postcode">

    <label>CONTACT MOBILE NUMBER</label>
    <input type="tel" id="ownerPhone" placeholder="04xx xxx xxx">

    <label>OWNER SIGNATURE (SIGN BELOW)</label>
    <div class="sig-canvas-wrap">
      <canvas id="sigCanvas"></canvas>
      <button type="button" class="clear-sig-btn" onclick="clearSig()">CLEAR</button>
    </div>

    <div class="fee-box">
      <div>
        <div style="font-size:12px; font-weight:800; color:#aaa;">PAYMENT SETTLEMENT</div>
        <div style="font-size:11px; color:#666;">Statutory Tow & Release Fee</div>
      </div>
      <div class="total-paid">$450.05 PAID</div>
    </div>

    <button type="button" class="submit-rel-btn" id="releaseBtn" onclick="processRelease()">PROCESS RELEASE & INVOICE</button>
  </div>

  <div id="successModal">
    <h2>✔ RELEASED!</h2>
    <p id="invNoticeText">Invoice generated and SMS receipt dispatched.</p>
    <a href="#" id="viewPdfBtn" target="_blank" class="view-inv-btn">VIEW TAX INVOICE</a>
    <div><a href="yard.html" style="color:#000; font-weight:900; text-decoration:none;">RETURN TO YARD</a></div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";

    let targetRego = "";
    let canvas, ctx;
    let isDrawing = false;
    let hasSigned = false;

    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      targetRego = (params.get('rego') || '').trim().toUpperCase();
      document.getElementById('dispRego').innerText = targetRego || "NO REGO SPECIFIED";

      initSigPad();
      loadVehicleData();
    });

    function loadVehicleData() {
      const cached = localStorage.getItem('cached_yard_inventory');
      if (cached) {
        try {
          const list = JSON.parse(cached);
          const car = list.find(c => c.rego.toUpperCase() === targetRego);
          if (car) {
            document.getElementById('dispProp').innerText = car.property || "";
            if (car.callerPhone) document.getElementById('ownerPhone').value = car.callerPhone;
          }
        } catch(e) {}
      }
    }

    function initSigPad() {
      canvas = document.getElementById('sigCanvas');
      ctx = canvas.getContext('2d');
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = "#000";

      function getPos(e) {
        const r = canvas.getBoundingClientRect();
        const ev = e.touches ? e.touches[0] : e;
        return { x: ev.clientX - r.left, y: ev.clientY - r.top };
      }

      function start(e) { isDrawing = true; hasSigned = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); }
      function move(e) { if (!isDrawing) return; e.preventDefault(); const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); }
      function stop() { isDrawing = false; }

      canvas.addEventListener('mousedown', start);
      canvas.addEventListener('mousemove', move);
      window.addEventListener('mouseup', stop);

      canvas.addEventListener('touchstart', start, { passive: false });
      canvas.addEventListener('touchmove', move, { passive: false });
      window.addEventListener('touchend', stop);
    }

    function clearSig() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      hasSigned = false;
    }

    async function processRelease() {
      const name = document.getElementById('ownerName').value.trim();
      const idNum = document.getElementById('idNumber').value.trim();
      const addr = document.getElementById('ownerAddress').value.trim();
      const phone = document.getElementById('ownerPhone').value.trim();

      if (!name || !idNum || !phone) {
        alert("Please enter Name, ID Number, and Mobile Phone.");
        return;
      }
      if (!hasSigned) {
        alert("Please have the collector sign the signature box.");
        return;
      }

      const btn = document.getElementById('releaseBtn');
      btn.disabled = true;
      btn.innerText = "PROCESSING RELEASE...";

      const payload = {
        action: 'process_release',
        rego: targetRego,
        ownerName: name,
        idNumber: idNum,
        ownerAddress: addr,
        ownerPhone: phone,
        ownerSigBytes: canvas.toDataURL('image/png'),
        releaseFee: 310.05,
        storageFee: 140.00,
        officer: "Brian"
      };

      try {
        const res = await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data && data.status === "SUCCESS") {
          // Update local cache so Yard app removes released car immediately
          try {
            let inv = JSON.parse(localStorage.getItem('cached_yard_inventory') || '[]');
            inv = inv.filter(c => c.rego.toUpperCase() !== targetRego);
            localStorage.setItem('cached_yard_inventory', JSON.stringify(inv));
          } catch(e) {}

          if (data.pdfUrl) {
            document.getElementById('viewPdfBtn').href = data.pdfUrl;
            document.getElementById('viewPdfBtn').style.display = 'inline-block';
          } else {
            document.getElementById('viewPdfBtn').style.display = 'none';
          }
          document.getElementById('invNoticeText').innerText = `Invoice #${data.invoiceNum || ''} issued and sent to ${phone}.`;
          document.getElementById('successModal').style.display = 'flex';
        } else {
          alert("Release error: " + (data.message || "Failed to log"));
          btn.disabled = false;
          btn.innerText = "PROCESS RELEASE & INVOICE";
        }
      } catch(err) {
        alert("Network error processing release: " + err.message);
        btn.disabled = false;
        btn.innerText = "PROCESS RELEASE & INVOICE";
      }
    }
  </script>
</body>
</html>
