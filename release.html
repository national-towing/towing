<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>RELEASE</title>
    
    <link rel="apple-touch-icon" href="icon-release.png?v=1002">
    <link rel="icon" type="image/png" href="icon-release.png?v=1002">
    <link rel="manifest" href="manifest-release.json?v=1002">

    <style>
        :root {
            --c-mark: #2979ff;
            --c-run: #ffab00;
            --c-tow: #ff1744;
            --c-admin: #ab47bc;
            --c-yard: #00b0ff;
            --c-rel: #00e676;
        }
        * { box-sizing: border-box; }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #121212;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            padding-top: max(16px, env(safe-area-inset-top));
            padding-bottom: max(20px, env(safe-area-inset-bottom));
        }

        .header-box {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            max-width: 440px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }
        .header-box h1 {
            margin: 0;
            font-size: 32px;
            font-weight: 900;
            color: var(--c-rel);
            letter-spacing: 2px;
            text-align: center;
        }
        .icon-btn {
            position: absolute;
            right: 0;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            font-size: 18px;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #fff;
        }
        .icon-btn:active { transform: scale(0.92); }

        /* 3x2 Grid Navigation */
        .nav-grid-3x2 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            width: 100%;
            max-width: 440px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }
        .nav-tile {
            height: 38px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 900;
            text-decoration: none;
            color: #000;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .nav-tile:active { transform: scale(0.96); }
        .t-mark  { background: var(--c-mark); color: #fff; }
        .t-run   { background: var(--c-run); color: #000; }
        .t-tow   { background: var(--c-tow); color: #fff; }
        .t-admin { background: var(--c-admin); color: #fff; }
        .t-yard  { background: var(--c-yard); color: #000; }
        .t-rel   { background: var(--c-rel); color: #000; box-shadow: 0 0 0 2px #fff; }

        .container {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 14px;
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 14px;
            gap: 10px;
        }

        .f-field { display: flex; flex-direction: column; gap: 4px; }
        .f-label { font-size: 10px; font-weight: 900; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
        .f-input {
            width: 100%;
            height: 42px;
            background: #242424;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 0 10px;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            outline: none;
        }
        .f-input:focus { border-color: var(--c-rel); }
        .f-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        /* OCR Licence Scan Button */
        .btn-ocr {
            height: 42px;
            background: #ab47bc;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 900;
            font-size: 12px;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* Digital Signature Canvas */
        .sig-canvas-box {
            border: 1.5px solid #444;
            border-radius: 8px;
            background: #fff;
            height: 100px;
            touch-action: none;
        }
        .sig-canvas-box canvas { width: 100%; height: 100%; }

        .btn-submit-rel {
            height: 48px;
            background: var(--c-rel);
            color: #000;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 8px;
            flex-shrink: 0;
        }
        .btn-submit-rel:disabled { background: #555; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="header-box">
    <h1>RELEASE VEHICLE</h1>
    <div class="icon-btn" onclick="window.location.reload(true)">🔄</div>
</div>

<div class="nav-grid-3x2">
    <a href="mark.html" class="nav-tile t-mark">MARK</a>
    <a href="run.html" class="nav-tile t-run">RUN</a>
    <a href="tow.html" class="nav-tile t-tow">TOW</a>
    <a href="admin.html" class="nav-tile t-admin">ADMIN</a>
    <a href="yard.html" class="nav-tile t-yard">YARD</a>
    <a href="release.html" class="nav-tile t-rel">REL</a>
</div>

<form class="container" onsubmit="submitRelease(event)">
    <div class="f-field">
        <label class="f-label">Select Impounded Vehicle</label>
        <select id="relVehicleSelect" class="f-input" onchange="autoFillVehicleDetails()" required>
            <option value="">LOADING YARD VEHICLES...</option>
        </select>
    </div>

    <!-- DRIVER LICENCE SCAN (SECTION 14 OCR) -->
    <div class="f-field">
        <label class="f-label">Owner Driver Licence (AI Scan)</label>
        <button type="button" class="btn-ocr" onclick="document.getElementById('licCamInput').click()">📷 SNAP & EXTRACT LICENCE</button>
        <input type="file" id="licCamInput" accept="image/*" capture="environment" style="display:none;" onchange="handleLicencePhoto(this)">
    </div>

    <div class="f-field">
        <label class="f-label">Collector / Owner Full Name</label>
        <input type="text" id="relOwnerName" class="f-input" placeholder="e.g. John Citizen" required>
    </div>

    <div class="f-grid-2">
        <div class="f-field">
            <label class="f-label">ID / Licence #</label>
            <input type="text" id="relIdNumber" class="f-input" placeholder="e.g. 12345678" required>
        </div>
        <div class="f-field">
            <label class="f-label">Mobile Phone (For SMS Tax Invoice)</label>
            <input type="tel" id="relOwnerPhone" class="f-input" placeholder="e.g. 0400 000 000" required>
        </div>
    </div>

    <div class="f-field">
        <label class="f-label">Residential Address</label>
        <input type="text" id="relOwnerAddress" class="f-input" placeholder="Street, Suburb, State, Postcode">
    </div>

    <div class="f-grid-2">
        <div class="f-field">
            <label class="f-label">Release Fee ($)</label>
            <input type="number" step="0.01" id="relFee" class="f-input" value="310.05" oninput="calcTotal()">
        </div>
        <div class="f-field">
            <label class="f-label">Storage Fee ($)</label>
            <input type="number" step="0.01" id="storFee" class="f-input" value="140.00" oninput="calcTotal()">
        </div>
    </div>

    <div class="f-field">
        <label class="f-label">Collector Signature</label>
        <div class="sig-canvas-box">
            <canvas id="sigCanvas"></canvas>
        </div>
        <button type="button" style="background:#333; color:#aaa; border:none; border-radius:4px; padding:4px 8px; font-size:10px; align-self:flex-end; margin-top:2px;" onclick="clearSignature()">Clear Signature</button>
    </div>

    <button type="submit" id="btnRelease" class="btn-submit-rel">CONFIRM RELEASE & CONSOLIDATE ✔</button>
</form>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";
    let yardVehicles = [];
    let idPhotoBytesList = [];
    let canvas, ctx, isDrawing = false;

    window.addEventListener('load', () => {
        initCanvas();
        fetchYardVehicles();
    });

    function initCanvas() {
        canvas = document.getElementById('sigCanvas');
        ctx = canvas.getContext('2d');
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;

        const start = (e) => { isDrawing = true; ctx.beginPath(); ctx.moveTo(getX(e), getY(e)); };
        const move = (e) => { if (isDrawing) { ctx.lineTo(getX(e), getY(e)); ctx.stroke(); e.preventDefault(); } };
        const stop = () => { isDrawing = false; };

        canvas.addEventListener('mousedown', start);
        canvas.addEventListener('mousemove', move);
        window.addEventListener('mouseup', stop);

        canvas.addEventListener('touchstart', start);
        canvas.addEventListener('touchmove', move);
        window.addEventListener('touchend', stop);
    }

    function getX(e) { return (e.touches ? e.touches[0] : e).getBoundingClientRect().left ? (e.touches ? e.touches[0].clientX : e.clientX) - canvas.getBoundingClientRect().left : 0; }
    function getY(e) { return (e.touches ? e.touches[0] : e).getBoundingClientRect().top ? (e.touches ? e.touches[0].clientY : e.clientY) - canvas.getBoundingClientRect().top : 0; }
    function clearSignature() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

    async function fetchYardVehicles() {
        const sel = document.getElementById('relVehicleSelect');
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL + "?action=get_tow_history");
            yardVehicles = await res.json();
            sel.innerHTML = "<option value=''>-- SELECT YARD VEHICLE --</option>";
            yardVehicles.forEach(v => {
                const opt = document.createElement('option');
                opt.value = v.rego;
                opt.innerText = `${v.rego} (${v.property}) - ${v.make} ${v.model}`;
                sel.appendChild(opt);
            });
        } catch(e) {
            sel.innerHTML = "<option value=''>Error loading vehicles</option>";
        }
    }

    function autoFillVehicleDetails() {
        const rego = document.getElementById('relVehicleSelect').value;
        const v = yardVehicles.find(item => item.rego === rego);
        if (v && v.callerPhone) {
            document.getElementById('relOwnerPhone').value = v.callerPhone;
        }
    }

    function handleLicencePhoto(input) {
        if (!input.files || !input.files[0]) return;
        const file = input.files[0];

        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const c = document.createElement('canvas');
                const maxDim = 960;
                let w = img.width, h = img.height;
                if (w > maxDim || h > maxDim) {
                    if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
                    else { w = Math.round((w * maxDim) / h); h = maxDim; }
                }
                c.width = w; c.height = h;
                c.getContext('2d').drawImage(img, 0, 0, w, h);
                const b64 = c.toDataURL('image/jpeg', 0.65);
                idPhotoBytesList.push(b64);

                // Run Section 14 OCR
                extractLicenceData(b64);
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    async function extractLicenceData(b64) {
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'scan_id_card', photoBytes: b64 })
            });
            const data = await res.json();
            if (data.status === "SUCCESS") {
                if (data.name) document.getElementById('relOwnerName').value = data.name;
                if (data.idNumber) document.getElementById('relIdNumber').value = data.idNumber;
                if (data.address) document.getElementById('relOwnerAddress').value = data.address;
                alert("Driver Licence Details Extracted ✔");
            }
        } catch(e) {}
    }

    async function submitRelease(e) {
        e.preventDefault();
        const rego = document.getElementById('relVehicleSelect').value;
        if (!rego) { alert("Select a vehicle first"); return; }

        const btn = document.getElementById('btnRelease');
        btn.innerText = "PROCESSING RELEASE & INVOICE...";
        btn.disabled = true;

        const v = yardVehicles.find(item => item.rego === rego) || {};

        const payload = {
            action: 'process_release',
            rego: rego,
            property: v.property || "GENERAL",
            make: v.make || "",
            model: v.model || "",
            colour: v.colour || "",
            bodyType: v.bodyType || "",
            ownerName: document.getElementById('relOwnerName').value.trim(),
            idNumber: document.getElementById('relIdNumber').value.trim(),
            ownerPhone: document.getElementById('relOwnerPhone').value.trim(),
            ownerAddress: document.getElementById('relOwnerAddress').value.trim(),
            releaseFee: document.getElementById('relFee').value,
            storageFee: document.getElementById('storFee').value,
            officer: "Brian",
            ownerSigBytes: canvas.toDataURL('image/png'),
            idPhotos: idPhotoBytesList
        };

        try {
            const res = await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (data.status === "SUCCESS") {
                alert(`Vehicle ${rego} released! Tax Invoice ${data.invoiceNum} created and files consolidated into Release folder.`);
                window.location.reload();
            } else {
                alert("Error: " + data.message);
                btn.innerText = "CONFIRM RELEASE & CONSOLIDATE ✔";
                btn.disabled = false;
            }
        } catch(err) {
            alert("Network error processing release.");
            btn.innerText = "CONFIRM RELEASE & CONSOLIDATE ✔";
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
