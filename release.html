<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>RELEASE</title>
    
    <link rel="apple-touch-icon" href="icon-release.png?v=25">
    <link rel="icon" type="image/png" href="icon-release.png?v=25">
    <link rel="manifest" href="manifest-release.json?v=25">

    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            margin: 0; padding: 14px; background: #121212; color: #fff; 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; 
        }
        
        .header-box { display: flex; align-items: center; justify-content: center; position: relative; width: 100%; max-width: 440px; margin-bottom: 10px; }
        .header-box h1 { margin: 0; font-size: 38px; font-weight: 900; color: #00e676; letter-spacing: 2px; text-align: center; }
        .icon-btn { position: absolute; right: 0; background: #2a2a2a; border: 1px solid #444; border-radius: 10px; font-size: 20px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; }
        .icon-btn:active { transform: scale(0.9); }

        .nav-bar { display: flex; gap: 8px; width: 100%; max-width: 440px; margin-bottom: 16px; }
        .nav-tile { flex: 1; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 900; text-decoration: none; color: #000; }
        .nav-run { background: #ffab00; }
        .nav-tow { background: #ff1744; color: #fff; }
        .nav-rel { background: #00e676; }
        .nav-pass { background: #ab47bc; color: #fff; }

        .card { background: #1e1e1e; border-radius: 18px; padding: 18px; width: 100%; max-width: 440px; border: 1px solid #333; }
        
        label { font-size: 13px; text-transform: uppercase; color: #aaa; display: block; margin-top: 14px; font-weight: 900; letter-spacing: 1px; }
        input, select {
            width: 100%; height: 56px; padding: 0 14px; border-radius: 12px; border: 1px solid #444;
            background: #2a2a2a; color: #fff; font-size: 20px; font-weight: 900; margin-top: 6px; outline: none;
            -webkit-appearance: none;
        }

        .camera-box {
            width: 100%; height: 240px; background: #000; border-radius: 14px; border: 2px solid #333;
            margin-top: 14px; overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative;
        }
        video { width: 100%; height: 100%; object-fit: cover; }

        .thumb-gallery { display: flex; gap: 10px; margin-top: 14px; overflow-x: auto; padding-bottom: 4px; }
        .thumb-img { width: 75px; height: 75px; border-radius: 12px; object-fit: cover; border: 3px solid #00e676; cursor: pointer; flex-shrink: 0; }

        .circle-cam-btn {
            width: 100px; height: 100px; background: #00e676; border: 5px solid #fff; border-radius: 50%;
            margin: 14px auto 0 auto; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 6px 20px rgba(0, 230, 118, 0.5); cursor: pointer; user-select: none;
        }
        .circle-cam-btn:active { transform: scale(0.90); }
        .circle-cam-inner { width: 76px; height: 76px; border-radius: 50%; border: 3px solid #000; }

        .sig-container { width: 100%; margin-top: 6px; position: relative; }
        canvas.sig-box {
            width: 100%; height: 140px; background: #2a2a2a; border: 1px solid #444; border-radius: 12px;
            touch-action: none; cursor: crosshair;
        }
        .clear-sig-btn {
            position: absolute; right: 10px; top: 10px; background: #ff1744; color: #fff; border: none;
            border-radius: 6px; padding: 4px 10px; font-size: 11px; font-weight: 900; cursor: pointer;
        }

        .submit-btn {
            background: #00e676; color: #000; font-weight: 900; border: none; border-radius: 14px;
            height: 60px; font-size: 28px; width: 100%; margin-top: 20px; cursor: pointer; letter-spacing: 2px;
        }
        .submit-btn:active { transform: scale(0.97); }

        .row-2 { display: flex; gap: 10px; }
        .row-2 > div { flex: 1; }
        #status { text-align: center; font-weight: 900; font-size: 16px; margin-top: 16px; min-height: 24px; color: #00e676; }

        .modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); z-index: 100; justify-content: center; align-items: center; 
        }
    </style>
</head>
<body>

<div class="header-box">
    <h1>RELEASE</h1>
    <div class="icon-btn" id="refreshBtn">🔄</div>
</div>

<div class="nav-bar">
    <a href="run.html" class="nav-tile nav-run">RUN</a>
    <a href="tow.html" class="nav-tile nav-tow">TOW</a>
    <a href="release.html" class="nav-tile nav-rel">REL</a>
    <a href="passes.html" class="nav-tile nav-pass">PASS</a>
</div>

<div class="card">
    <label>SELECT VEHICLE IN YARD</label>
    <select id="vehicleSelect"><option value="">LOADING YARD VEHICLES...</option></select>

    <div class="row-2">
        <div>
            <label>REGO</label>
            <input type="text" id="regoInput" placeholder="REGO" style="font-size:24px; color:#00e676; text-transform:uppercase;">
        </div>
        <div>
            <label>MAKE</label>
            <input type="text" id="makeInput" placeholder="MAKE">
        </div>
    </div>

    <div class="row-2">
        <div>
            <label>MODEL</label>
            <input type="text" id="modelInput" placeholder="MODEL">
        </div>
        <div>
            <label>COLOUR</label>
            <input type="text" id="colourInput" placeholder="COLOUR">
        </div>
    </div>

    <label>PROPERTY TOWED FROM</label>
    <input type="text" id="propertyInput" placeholder="PROPERTY">

    <div class="row-2">
        <div>
            <label>RELEASE FEE ($)</label>
            <input type="number" id="feeInput" placeholder="FEE">
        </div>
        <div>
            <label>PAYMENT TYPE</label>
            <select id="paymentSelect">
                <option value="EFTPOS" selected>EFTPOS</option>
                <option value="CASH">CASH</option>
                <option value="DIRECT DEPOSIT">DIRECT DEPOSIT</option>
            </select>
        </div>
    </div>

    <div class="row-2">
        <div>
            <label>ID TYPE</label>
            <select id="idTypeSelect">
                <option value="Driver Licence" selected>Driver Licence</option>
                <option value="Passport">Passport</option>
                <option value="Proof of Age">Proof of Age</option>
                <option value="Other">Other</option>
            </select>
        </div>
        <div>
            <label>ID / LICENCE NO.</label>
            <input type="text" id="idNumInput" placeholder="ID NUMBER">
        </div>
    </div>

    <div class="row-2">
        <div>
            <label>RELEASED BY</label>
            <select id="officerSelect">
                <option value="Brian" selected>Brian</option>
                <option value="Brett">Brett</option>
                <option value="Other">Other</option>
            </select>
        </div>
    </div>

    <label>SNAP DRIVER ID / LICENCE</label>
    <div class="camera-box">
        <video id="videoElem" autoplay playsinline></video>
    </div>
    
    <div class="thumb-gallery" id="thumbGallery"></div>
    <div class="circle-cam-btn" id="snapBtn"><div class="circle-cam-inner"></div></div>

    <label>OWNER / RECEIVER SIGNATURE</label>
    <div class="sig-container">
        <canvas id="ownerSigCanvas" class="sig-box"></canvas>
        <button class="clear-sig-btn" onclick="clearSig('ownerSigCanvas')">CLEAR</button>
    </div>

    <label>OFFICER SIGNATURE</label>
    <div class="sig-container">
        <canvas id="officerSigCanvas" class="sig-box"></canvas>
        <button class="clear-sig-btn" onclick="clearSig('officerSigCanvas')">CLEAR</button>
    </div>

    <button class="submit-btn" id="submitBtn">RELEASE VEHICLE</button>
    <div id="status"></div>
</div>

<div class="modal" id="imgModal">
    <div style="display:flex; flex-direction:column; align-items:center; width:100%; height:100%; justify-content:center;">
        <img id="modalImg" src="" style="max-width:90%; max-height:75%; border-radius:12px; border:2px solid #fff;">
        <button onclick="document.getElementById('imgModal').style.display='none'" 
                style="margin-top:20px; background:#ff1744; color:#fff; font-weight:900; border:none; border-radius:12px; height:50px; width:200px; font-size:18px; cursor:pointer;">
            ⬅ BACK
        </button>
    </div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";

    const vehicleSelect = document.getElementById('vehicleSelect');
    const regoInput = document.getElementById('regoInput');
    const makeInput = document.getElementById('makeInput');
    const modelInput = document.getElementById('modelInput');
    const colourInput = document.getElementById('colourInput');
    const propertyInput = document.getElementById('propertyInput');
    const feeInput = document.getElementById('feeInput');
    const paymentSelect = document.getElementById('paymentSelect');
    const idTypeSelect = document.getElementById('idTypeSelect');
    const idNumInput = document.getElementById('idNumInput');
    const officerSelect = document.getElementById('officerSelect');
    
    const videoElem = document.getElementById('videoElem');
    const snapBtn = document.getElementById('snapBtn');
    const thumbGallery = document.getElementById('thumbGallery');
    const submitBtn = document.getElementById('submitBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const statusDiv = document.getElementById('status');
    
    let yardVehicles = [];
    let idPhotoBytes = "";

    window.addEventListener('load', () => {
        loadYardVehicles();
        initCamera();
        initSignatureCanvas('ownerSigCanvas');
        initSignatureCanvas('officerSigCanvas');
    });

    refreshBtn.addEventListener('click', () => {
        window.location.reload(true);
    });

    vehicleSelect.addEventListener('change', () => {
        const selectedRego = vehicleSelect.value;
        const veh = yardVehicles.find(v => v.rego === selectedRego);
        if (veh) {
            regoInput.value = veh.rego || '';
            makeInput.value = veh.make || '';
            modelInput.value = veh.model || '';
            colourInput.value = veh.colour || '';
            propertyInput.value = veh.property || '';
        }
    });

    async function loadYardVehicles() {
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL + "?action=get_yard_vehicles");
            yardVehicles = await res.json();
            vehicleSelect.innerHTML = "<option value=''>-- SELECT FROM YARD --</option>";

            if (!yardVehicles || yardVehicles.length === 0) {
                vehicleSelect.innerHTML = "<option value=''>NO VEHICLES IN YARD</option>";
                return;
            }

            yardVehicles.forEach(v => {
                const opt = document.createElement('option');
                opt.value = v.rego;
                opt.innerText = `${v.rego} (${v.make || ''} ${v.model || ''})`;
                vehicleSelect.appendChild(opt);
            });
        } catch(e) {
            vehicleSelect.innerHTML = "<option value=''>ERROR LOADING YARD</option>";
        }
    }

    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            videoElem.srcObject = stream;
        } catch(e) {}
    }

    snapBtn.addEventListener('click', () => {
        const canvas = document.createElement('canvas');
        canvas.width = videoElem.videoWidth || 640;
        canvas.height = videoElem.videoHeight || 480;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(videoElem, 0, 0, canvas.width, canvas.height);
        idPhotoBytes = canvas.toDataURL('image/jpeg', 0.8);

        thumbGallery.innerHTML = "";
        const img = document.createElement('img');
        img.src = idPhotoBytes; 
        img.className = 'thumb-img';
        img.onclick = () => {
            document.getElementById('modalImg').src = idPhotoBytes;
            document.getElementById('imgModal').style.display = 'flex';
        };
        thumbGallery.appendChild(img);
        statusDiv.innerText = "✔ ID SNAP CAPTURED";
    });

    function initSignatureCanvas(canvasId) {
        const canvas = document.getElementById(canvasId);
        const ctx = canvas.getContext('2d');
        let drawing = false;

        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            ctx.strokeStyle = "#00e676";
            ctx.lineWidth = 3;
            ctx.lineCap = "round";
        }
        resizeCanvas();

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function startDrawing(e) { drawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); }
        function draw(e) { if (!drawing) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); }
        function stopDrawing() { drawing = false; }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);

        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e); }, {passive: false});
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); }, {passive: false});
        canvas.addEventListener('touchend', stopDrawing);
    }

    function clearSig(canvasId) {
        const canvas = document.getElementById(canvasId);
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    submitBtn.addEventListener('click', async () => {
        const rego = regoInput.value.trim().toUpperCase();
        if (!rego) { statusDiv.innerText = "ENTER OR SELECT REGO"; return; }

        const ownerSig = document.getElementById('ownerSigCanvas').toDataURL('image/png');
        const officerSig = document.getElementById('officerSigCanvas').toDataURL('image/png');

        const payload = {
            action: 'process_release',
            rego: rego,
            make: makeInput.value.trim(),
            model: modelInput.value.trim(),
            colour: colourInput.value.trim(),
            property: propertyInput.value.trim(),
            fee: feeInput.value.trim(),
            paymentType: paymentSelect.value,
            idType: idTypeSelect.value,
            idNumber: idNumInput.value.trim(),
            officer: officerSelect.value,
            idPhotoBytes: idPhotoBytes,
            ownerSigBytes: ownerSig,
            officerSigBytes: officerSig
        };

        statusDiv.innerText = "PROCESSING RELEASE...";
        try {
            await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
            statusDiv.innerText = "✔ VEHICLE RELEASED SUCCESS!";
        } catch(err) {
            statusDiv.innerText = "ERROR PROCESSING RELEASE";
        }

        setTimeout(() => {
            window.location.reload(true);
        }, 1500);
    });
</script>
</body>
</html>
