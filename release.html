<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

    <title>RELEASE</title>
    
    <link rel="apple-touch-icon" href="icon-rel.png?v=9999">
    <link rel="icon" type="image/png" href="icon-rel.png?v=9999">
    <link rel="manifest" href="manifest-rel.json?v=9999">

    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            margin: 0; padding: 14px; background: #121212; color: #fff; 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; 
        }
        
        .header-box { display: flex; align-items: center; justify-content: center; position: relative; width: 100%; max-width: 440px; margin-bottom: 10px; }
        .header-box h1 { margin: 0; font-size: 38px; font-weight: 900; color: #00e676; letter-spacing: 2px; text-align: center; }
        .icon-btn { position: absolute; right: 0; background: #2a2a2a; border: 1px solid #444; border-radius: 10px; font-size: 20px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; }

        .nav-bar { display: flex; gap: 8px; width: 100%; max-width: 440px; margin-bottom: 16px; }
        .nav-tile { flex: 1; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 900; text-decoration: none; color: #000; }
        .nav-run { background: #ffab00; }
        .nav-tow { background: #ff1744; color: #fff; }
        .nav-rel { background: #00e676; }
        .nav-pass { background: #ab47bc; color: #fff; }

        .card { background: #1e1e1e; border-radius: 18px; padding: 18px; width: 100%; max-width: 440px; border: 1px solid #333; margin-bottom: 16px; }
        
        label { font-size: 12px; text-transform: uppercase; color: #aaa; display: block; margin-top: 10px; font-weight: 900; letter-spacing: 1px; }
        input, select {
            width: 100%; height: 50px; padding: 0 12px; border-radius: 10px; border: 1px solid #444;
            background: #2a2a2a; color: #fff; font-size: 20px; font-weight: 900; margin-top: 4px; outline: none;
            -webkit-appearance: none;
        }

        .row-2 { display: flex; gap: 10px; }
        .row-2 > div { flex: 1; }

        .sig-container { margin-top: 12px; }
        .sig-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .sig-box { width: 100%; height: 140px; background: #fff; border-radius: 10px; touch-action: none; border: 2px solid #555; }
        .sig-btn { background: #333; color: #fff; border: 1px solid #555; padding: 6px 14px; border-radius: 8px; font-size: 12px; font-weight: 900; cursor: pointer; }

        .camera-box {
            width: 100%; height: 200px; background: #000; border-radius: 12px; border: 2px solid #333;
            margin-top: 10px; overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative;
        }
        video { width: 100%; height: 100%; object-fit: cover; }

        .circle-cam-btn {
            width: 70px; height: 70px; background: #00e676; border: 4px solid #fff; border-radius: 50%;
            margin: 10px auto 0 auto; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 18px rgba(0, 230, 118, 0.4); cursor: pointer; user-select: none;
        }
        .circle-cam-btn:active { transform: scale(0.90); }
        .circle-cam-inner { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #000; }

        .thumb-gallery { display: flex; gap: 8px; margin-top: 8px; overflow-x: auto; padding-bottom: 4px; }
        .thumb-img { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; border: 2px solid #00e676; flex-shrink: 0; }

        .submit-btn {
            background: #00e676; color: #000; font-weight: 900; border: none; border-radius: 14px;
            height: 60px; font-size: 24px; width: 100%; margin-top: 18px; cursor: pointer; letter-spacing: 2px;
        }
        .submit-btn:active { transform: scale(0.97); }

        #status { text-align: center; font-weight: 900; font-size: 15px; margin-top: 12px; min-height: 24px; color: #ffab00; }
    </style>
</head>
<body>

<div class="header-box">
    <h1>RELEASE</h1>
    <div class="icon-btn" id="refreshBtn">🔄</div>
</div>

<div class="nav-bar">
    <a href="run.html?v=9999" class="nav-tile nav-run">RUN</a>
    <a href="tow.html?v=9999" class="nav-tile nav-tow">TOW</a>
    <a href="release.html?v=9999" class="nav-tile nav-rel">REL</a>
    <a href="passes.html?v=9999" class="nav-tile nav-pass">PASS</a>
</div>

<div class="card">
    <label>SELECT VEHICLE IN YARD</label>
    <select id="yardVehicleSelect" onchange="autoFillYardVehicle(this.value)">
        <option value="">LOADING YARD VEHICLES...</option>
    </select>

    <label>OWNER / COLLECTOR NAME</label>
    <input type="text" id="ownerNameInput" placeholder="FULL NAME" style="color:#00e676;">

    <div class="row-2">
        <div>
            <label>PHONE</label>
            <input type="tel" id="ownerPhoneInput" placeholder="PHONE">
        </div>
        <div>
            <label>ID / LICENCE #</label>
            <input type="text" id="idNumberInput" placeholder="ID #">
        </div>
    </div>

    <label>EMAIL (FOR TAX INVOICE)</label>
    <input type="email" id="ownerEmailInput" placeholder="EMAIL ADDRESS">

    <label>RESIDENTIAL ADDRESS</label>
    <input type="text" id="ownerAddressInput" placeholder="ADDRESS">

    <div class="row-2">
        <div>
            <label>RELEASE FEE ($)</label>
            <input type="number" id="relFeeInput" value="310.05" step="0.01">
        </div>
        <div>
            <label>STORAGE FEE ($)</label>
            <input type="number" id="storFeeInput" value="140.95" step="0.01">
        </div>
    </div>

    <label>RELEASE OFFICER</label>
    <select id="officerSelect">
        <option value="Brian" selected>Brian</option>
        <option value="Brett">Brett</option>
        <option value="Other">Other</option>
    </select>

    <label>CAPTURE COLLECTOR ID / DRIVERS LICENCE</label>
    <div class="camera-box">
        <video id="videoElem" autoplay playsinline></video>
    </div>
    <div class="thumb-gallery" id="idThumbGallery"></div>
    <div class="circle-cam-btn" id="snapIdBtn"><div class="circle-cam-inner"></div></div>

    <div class="sig-container">
        <div class="sig-header">
            <label style="margin:0;">OWNER SIGNATURE</label>
            <button class="sig-btn" onclick="clearOwnerSig()">CLEAR</button>
        </div>
        <canvas class="sig-box" id="ownerSigCanvas"></canvas>
    </div>

    <button class="submit-btn" id="submitBtn">PROCESS RELEASE</button>
    <div id="status"></div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js?v=9999').catch(()=>{});
    }

    const yardVehicleSelect = document.getElementById('yardVehicleSelect');
    const ownerNameInput = document.getElementById('ownerNameInput');
    const ownerPhoneInput = document.getElementById('ownerPhoneInput');
    const idNumberInput = document.getElementById('idNumberInput');
    const ownerEmailInput = document.getElementById('ownerEmailInput');
    const ownerAddressInput = document.getElementById('ownerAddressInput');
    const relFeeInput = document.getElementById('relFeeInput');
    const storFeeInput = document.getElementById('storFeeInput');
    const officerSelect = document.getElementById('officerSelect');
    
    const videoElem = document.getElementById('videoElem');
    const snapIdBtn = document.getElementById('snapIdBtn');
    const idThumbGallery = document.getElementById('idThumbGallery');
    const ownerSigCanvas = document.getElementById('ownerSigCanvas');
    const submitBtn = document.getElementById('submitBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const statusDiv = document.getElementById('status');

    let yardVehicles = [];
    let idPhotos = [];
    let isSubmitting = false;
    let sigCtx = null;
    let isDrawing = false;

    window.addEventListener('load', async () => {
        initSigCanvas();
        await loadYardVehicles();
        initCamera();
    });

    refreshBtn.addEventListener('click', async () => {
        if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            for (let registration of registrations) {
                await registration.unregister();
            }
        }
        window.location.reload(true);
    });

    function initSigCanvas() {
        ownerSigCanvas.width = ownerSigCanvas.offsetWidth || 380;
        ownerSigCanvas.height = 140;
        sigCtx = ownerSigCanvas.getContext('2d');
        sigCtx.strokeStyle = "#000";
        sigCtx.lineWidth = 3;

        const getPos = (e) => {
            const rect = ownerSigCanvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        };

        const startDraw = (e) => { isDrawing = true; const p = getPos(e); sigCtx.beginPath(); sigCtx.moveTo(p.x, p.y); };
        const draw = (e) => { if (!isDrawing) return; const p = getPos(e); sigCtx.lineTo(p.x, p.y); sigCtx.stroke(); };
        const stopDraw = () => { isDrawing = false; };

        ownerSigCanvas.addEventListener('mousedown', startDraw);
        ownerSigCanvas.addEventListener('mousemove', draw);
        ownerSigCanvas.addEventListener('mouseup', stopDraw);

        ownerSigCanvas.addEventListener('touchstart', startDraw, {passive: true});
        ownerSigCanvas.addEventListener('touchmove', draw, {passive: true});
        ownerSigCanvas.addEventListener('touchend', stopDraw);
    }

    function clearOwnerSig() {
        sigCtx.clearRect(0, 0, ownerSigCanvas.width, ownerSigCanvas.height);
    }

    async function loadYardVehicles() {
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL + "?action=get_yard_vehicles");
            yardVehicles = await res.json();
            populateYardUI(yardVehicles);
        } catch(e) {}
    }

    function populateYardUI(vehicles) {
        yardVehicleSelect.innerHTML = '<option value="">-- SELECT VEHICLE --</option>';
        vehicles.forEach(v => {
            const opt = document.createElement('option');
            opt.value = v.rego;
            opt.innerText = `${v.rego} (${v.make} ${v.model} - ${v.property})`;
            yardVehicleSelect.appendChild(opt);
        });
    }

    function autoFillYardVehicle(rego) {
        const v = yardVehicles.find(x => x.rego === rego);
        if (v) {
            statusDiv.innerText = `SELECTED: ${v.rego} (${v.property})`;
        }
    }

    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            videoElem.srcObject = stream;
        } catch(e) {}
    }

    snapIdBtn.addEventListener('click', (e) => {
        e.preventDefault();
        const canvas = document.createElement('canvas');
        canvas.width = 800;
        canvas.height = 450;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(videoElem, 0, 0, 800, 450);
        
        const b64 = canvas.toDataURL('image/jpeg', 0.60);
        idPhotos.push(b64);

        const img = document.createElement('img');
        img.src = b64; img.className = 'thumb-img';
        idThumbGallery.appendChild(img);

        statusDiv.innerText = `✔ ID PHOTO ${idPhotos.length} CAPTURED`;
    });

    submitBtn.addEventListener('click', async (e) => {
        e.preventDefault();
        if (isSubmitting) return;

        const selectedRego = yardVehicleSelect.value;
        if (!selectedRego) { statusDiv.innerText = "SELECT A VEHICLE FROM YARD"; return; }

        isSubmitting = true;
        submitBtn.disabled = true;
        submitBtn.style.opacity = "0.5";

        const matchedVehicle = yardVehicles.find(v => v.rego === selectedRego) || {};
        const sigBytes = ownerSigCanvas.toDataURL('image/png');

        const payload = {
            action: 'process_release',
            rego: selectedRego,
            property: matchedVehicle.property || "",
            make: matchedVehicle.make || "",
            model: matchedVehicle.model || "",
            colour: matchedVehicle.colour || "",
            ownerName: ownerNameInput.value.trim(),
            ownerPhone: ownerPhoneInput.value.trim(),
            idNumber: idNumberInput.value.trim(),
            ownerEmail: ownerEmailInput.value.trim(),
            ownerAddress: ownerAddressInput.value.trim(),
            releaseFee: relFeeInput.value || "310.05",
            storageFee: storFeeInput.value || "140.95",
            officer: officerSelect.value,
            ownerSigBytes: sigBytes,
            idPhotos: idPhotos
        };

        statusDiv.innerText = "GENERATING INVOICE & RELEASING...";
        
        try {
            await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });

            statusDiv.innerText = "✔ VEHICLE RELEASED & INVOICE SENT!";
            setTimeout(() => { window.location.href = "run.html?v=9999"; }, 1000);
        } catch(err) {
            statusDiv.innerText = "ERROR PROCESSING RELEASE";
            isSubmitting = false;
            submitBtn.disabled = false;
            submitBtn.style.opacity = "1";
        }
    });
</script>
</body>
</html>
