<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

    <title>MARK</title>
    
    <link rel="apple-touch-icon" href="icon-mark.png?v=950">
    <link rel="icon" type="image/png" href="icon-mark.png?v=950">
    <link rel="manifest" href="manifest-mark.json?v=950">

    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            margin: 0; padding: 14px; background: #121212; color: #fff; 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; 
        }
        
        .header-box { display: flex; align-items: center; justify-content: center; position: relative; width: 100%; max-width: 440px; margin-bottom: 10px; }
        .header-box h1 { margin: 0; font-size: 38px; font-weight: 900; color: #ffab00; letter-spacing: 2px; text-align: center; }
        .icon-btn { position: absolute; right: 0; background: #2a2a2a; border: 1px solid #444; border-radius: 10px; font-size: 20px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; }

        .sync-badge {
            background: #ffab00; color: #000; font-weight: 900; font-size: 12px;
            padding: 6px 12px; border-radius: 20px; margin-bottom: 10px; display: none;
            cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
        }

        .nav-bar { display: flex; gap: 8px; width: 100%; max-width: 440px; margin-bottom: 16px; }
        .nav-tile { flex: 1; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 900; text-decoration: none; color: #000; }
        .nav-run { background: #ffab00; }
        .nav-tow { background: #ff1744; color: #fff; }
        .nav-rel { background: #00e676; }
        .nav-pass { background: #ab47bc; color: #fff; }

        .card { background: #1e1e1e; border-radius: 18px; padding: 18px; width: 100%; max-width: 440px; border: 1px solid #333; margin-bottom: 16px; }
        
        label { font-size: 12px; text-transform: uppercase; color: #aaa; display: block; margin-top: 10px; font-weight: 900; letter-spacing: 1px; }
        input, select {
            width: 100%; height: 50px; padding: 0 12px; border-radius: 10px; border: 1px solid #444;
            background: #2a2a2a; color: #fff; font-size: 20px; font-weight: 900; margin-top: 4px; outline: none;
            -webkit-appearance: none;
        }

        .camera-box {
            width: 100%; height: 260px; background: #000; border-radius: 12px; border: 2px solid #333;
            margin-top: 10px; overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative;
        }
        video { width: 100%; height: 100%; object-fit: cover; }

        .torch-btn {
            position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6);
            border: 1px solid #ffab00; color: #ffab00; padding: 6px 12px; border-radius: 20px;
            font-size: 12px; font-weight: 900; cursor: pointer; z-index: 10;
        }

        .thumb-preview { width: 100%; height: 260px; border-radius: 12px; object-fit: cover; border: 2px solid #ffab00; display: none; margin-top: 10px; }

        .circle-cam-btn {
            width: 100px; height: 100px; background: #ffab00; border: 5px solid #fff; border-radius: 50%;
            margin: 18px auto 0 auto; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 18px rgba(255, 171, 0, 0.4); cursor: pointer; user-select: none;
        }
        .circle-cam-btn:active { transform: scale(0.90); }
        .circle-cam-inner { width: 74px; height: 74px; border-radius: 50%; border: 2px solid #000; }

        #status { text-align: center; font-weight: 900; font-size: 18px; margin-top: 14px; min-height: 24px; color: #ffab00; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

<div class="header-box">
    <h1>MARK</h1>
    <div class="icon-btn" id="refreshBtn">🔄</div>
</div>

<div class="sync-badge" id="syncBadge" onclick="processOfflineQueue()">⚡ OFFLINE QUEUE: <span id="queueCount">0</span> (TAP TO SYNC)</div>

<div class="nav-bar">
    <a href="run.html?v=950" class="nav-tile nav-run">RUN</a>
    <a href="tow.html?v=950" class="nav-tile nav-tow">TOW</a>
    <a href="release.html?v=950" class="nav-tile nav-rel">REL</a>
    <a href="passes.html?v=950" class="nav-tile nav-pass">PASS</a>
</div>

<div class="card">
    <label>PROPERTY</label>
    <select id="propertySelect" onchange="saveSelectedProperty(this.value)">
        <option value="">LOADING PROPERTIES...</option>
    </select>

    <label>REGO</label>
    <input type="text" id="regoInput" placeholder="REGO" style="color:#ffab00; text-transform:uppercase;">

    <label>MARKING CAMERA</label>
    <div class="camera-box" id="camBox">
        <button class="torch-btn" id="torchBtn">⚡ FLASH OFF</button>
        <video id="videoElem" autoplay playsinline></video>
    </div>
    <img class="thumb-preview" id="thumbPreview">
    
    <div class="circle-cam-btn" id="snapBtn"><div class="circle-cam-inner"></div></div>

    <div id="status">READY</div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js?v=950').catch(()=>{});
    }

    const propertySelect = document.getElementById('propertySelect');
    const regoInput = document.getElementById('regoInput');
    const videoElem = document.getElementById('videoElem');
    const camBox = document.getElementById('camBox');
    const thumbPreview = document.getElementById('thumbPreview');
    const snapBtn = document.getElementById('snapBtn');
    const torchBtn = document.getElementById('torchBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const statusDiv = document.getElementById('status');
    const syncBadge = document.getElementById('syncBadge');
    const queueCount = document.getElementById('queueCount');

    let videoTrack = null;
    let torchOn = false;

    window.addEventListener('load', async () => {
        await loadProperties();
        initCamera();
        updateQueueUI();
        window.addEventListener('online', processOfflineQueue);
    });

    refreshBtn.addEventListener('click', async () => {
        if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            for (let registration of registrations) {
                await registration.unregister();
            }
        }
        window.location.reload(true);
    });

    function saveSelectedProperty(val) {
        if (val) localStorage.setItem('sticky_selected_property', val);
    }

    async function loadProperties() {
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL + "?action=get_properties");
            const data = await res.json();
            localStorage.setItem('cached_properties', JSON.stringify(data));
            populatePropertiesUI(data);
        } catch(e) {
            const cached = localStorage.getItem('cached_properties');
            if (cached) populatePropertiesUI(JSON.parse(cached));
        }
    }

    function populatePropertiesUI(data) {
        propertySelect.innerHTML = "";
        data.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.name; opt.innerText = p.name;
            propertySelect.appendChild(opt);
        });

        const savedProp = localStorage.getItem('sticky_selected_property');
        if (savedProp) {
            propertySelect.value = savedProp;
        }
    }

    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            videoElem.srcObject = stream;
            videoTrack = stream.getVideoTracks()[0];
        } catch(e) {}
    }

    torchBtn.addEventListener('click', async (e) => {
        e.preventDefault();
        if (!videoTrack) return;
        try {
            torchOn = !torchOn;
            await videoTrack.applyConstraints({ advanced: [{ torch: torchOn }] });
            torchBtn.innerText = torchOn ? "⚡ FLASH ON" : "⚡ FLASH OFF";
            torchBtn.style.color = torchOn ? "#00e676" : "#ffab00";
        } catch(e) {
            statusDiv.innerText = "ERROR";
        }
    });

    snapBtn.addEventListener('click', async (e) => {
        e.preventDefault(); e.stopPropagation();

        const selectedProp = propertySelect.value;
        if (!selectedProp) {
            statusDiv.innerText = "SELECT PROPERTY";
            return;
        }

        // 1. FAST CAMERA FRAME CAPTURE
        const canvas = document.createElement('canvas');
        canvas.width = videoElem.videoWidth || 800;
        canvas.height = videoElem.videoHeight || 450;
        canvas.getContext('2d').drawImage(videoElem, 0, 0);
        const photoBytes = canvas.toDataURL('image/jpeg', 0.55);

        // 2. FLASH PREVIEW
        thumbPreview.src = photoBytes;
        thumbPreview.style.display = 'block';
        camBox.style.display = 'none';

        const manualRego = regoInput.value.trim().toUpperCase();

        const payload = {
            action: 'log_mark',
            property: selectedProp,
            rego: manualRego,
            photoBytes: photoBytes
        };

        statusDiv.innerText = "PROCESSING...";

        // 3. EXECUTE BACKEND ANPR & LOG
        if (navigator.onLine) {
            try {
                const res = await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                const data = await res.json();
                
                if (data.status === "SUCCESS") {
                    statusDiv.innerText = `LOGGED: ${data.rego}`;
                    regoInput.value = "";
                } else {
                    statusDiv.innerText = "ERROR";
                }
            } catch(err) {
                saveToOfflineQueue(payload);
                statusDiv.innerText = "LOGGED (OFFLINE)";
            }
        } else {
            saveToOfflineQueue(payload);
            statusDiv.innerText = "LOGGED (OFFLINE)";
        }

        // 4. RESET CAMERA FOR NEXT SNAP AFTER 1.5 SECONDS
        setTimeout(() => {
            thumbPreview.style.display = 'none';
            camBox.style.display = 'flex';
            statusDiv.innerText = "READY";
        }, 1500);
    });

    function saveToOfflineQueue(payload) {
        let queue = JSON.parse(localStorage.getItem('mark_offline_queue') || "[]");
        queue.push(payload);
        localStorage.setItem('mark_offline_queue', JSON.stringify(queue));
        updateQueueUI();
    }

    function updateQueueUI() {
        let queue = JSON.parse(localStorage.getItem('mark_offline_queue') || "[]");
        if (queue.length > 0) {
            queueCount.innerText = queue.length;
            syncBadge.style.display = 'block';
        } else {
            syncBadge.style.display = 'none';
        }
    }

    async function processOfflineQueue() {
        let queue = JSON.parse(localStorage.getItem('mark_offline_queue') || "[]");
        if (queue.length === 0 || !navigator.onLine) return;

        let remaining = [];

        for (let item of queue) {
            try {
                await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify(item) });
            } catch(e) {
                remaining.push(item);
            }
        }

        localStorage.setItem('mark_offline_queue', JSON.stringify(remaining));
        updateQueueUI();
    }
</script>
</body>
</html>
