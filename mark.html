<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta id="themeColor" name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>MARK</title>
    
    <link rel="apple-touch-icon" href="icon-mark.png?v=999">
    <link rel="icon" type="image/png" href="icon-mark.png?v=999">
    <link rel="manifest" href="manifest-mark.json?v=999">

    <style>
        * { box-sizing: border-box; }
        html, body { 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: #121212; 
            color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            transition: background 0.3s ease;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            position: relative;
        }
        
        .header-box { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            width: 100%; 
            max-width: 440px; 
            margin-bottom: 8px; 
            flex-shrink: 0;
            padding: 6px 10px;
            border-radius: 12px;
            transition: background 0.3s ease;
        }
        .header-box.success-bg { background: #00e676; }
        .header-box.error-bg { background: #ff1744; }

        .header-box h1 { 
            margin: 0; 
            font-size: 34px; 
            font-weight: 900; 
            color: #ffab00; 
            letter-spacing: 2px; 
            text-align: center; 
            transition: color 0.3s ease;
        }
        .header-box.success-bg h1, .header-box.error-bg h1 { color: #fff; }

        .icon-btn { 
            position: absolute; 
            right: 8px; 
            background: #2a2a2a; 
            border: 1px solid #444; 
            border-radius: 10px; 
            font-size: 18px; 
            width: 40px; 
            height: 40px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            color: #fff; 
        }
        .icon-btn:active { transform: scale(0.9); }

        .card { 
            background: #1e1e1e; 
            border-radius: 18px; 
            padding: 14px; 
            width: 100%; 
            max-width: 440px; 
            border: 1px solid #333; 
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            margin-bottom: 8px;
        }

        label { font-size: 11px; text-transform: uppercase; color: #aaa; display: block; margin-top: 6px; font-weight: 900; letter-spacing: 1px; flex-shrink: 0; }
        input, select {
            width: 100%; height: 46px; padding: 0 12px; border-radius: 10px; border: 1px solid #444;
            background: #2a2a2a; color: #fff; font-size: 16px; font-weight: 900; margin-top: 3px; outline: none;
            -webkit-appearance: none; transition: border 0.2s ease, background 0.2s ease;
            flex-shrink: 0;
        }

        .camera-box {
            width: 100%;
            flex: 1;
            min-height: 0;
            background: #000;
            border-radius: 14px;
            border: 2px solid #333;
            margin-top: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            touch-action: none;
        }
        video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }

        .torch-btn {
            position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.65);
            border: 1px solid #ff1744; color: #ff1744; padding: 6px 12px; border-radius: 20px;
            font-size: 11px; font-weight: 900; cursor: pointer; z-index: 10;
        }

        .circle-cam-btn {
            position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
            width: 76px; height: 76px; background: #ffab00; border: 4px solid #fff; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7); cursor: pointer; user-select: none; z-index: 15;
        }
        .circle-cam-btn:active { transform: translateX(-50%) scale(0.90); }
        .circle-cam-inner { width: 56px; height: 56px; border-radius: 50%; border: 3px solid #000; }

        /* FULL-SCREEN OVERLAYS */
        .full-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            display: flex; align-items: center; justify-content: center;
            z-index: 9999; pointer-events: none; opacity: 0;
            transition: opacity 0.15s ease-in-out;
        }
        .full-overlay.green { background: rgba(0, 230, 118, 0.92); }
        .full-overlay.red { background: rgba(255, 23, 68, 0.92); }
        .full-overlay.show { opacity: 1; }
        .full-overlay-symbol { font-size: 160px; color: #fff; text-shadow: 0 8px 32px rgba(0,0,0,0.5); }

            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
