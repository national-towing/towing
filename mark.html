<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta id="themeColor" name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>MARK</title>
    <link rel="apple-touch-icon" href="icon-mark.png?v=1000">
    <link rel="icon" type="image/png" href="icon-mark.png?v=1000">
    <style>
        :root { --c-mark: #2979ff; --c-run: #ffab00; --c-tow: #ff1744; --c-pass: #ab47bc; --c-yard: #00b0ff; --c-rel: #00e676; }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background: #121212; color: #fff; font-family: -apple-system, sans-serif; }
        body { display: flex; flex-direction: column; align-items: center; padding: 8px 12px; }
        .header-box { display: flex; align-items: center; justify-content: center; position: relative; width: 100%; max-width: 440px; margin-bottom: 6px; }
        .header-box h1 { margin: 0; font-size: 34px; font-weight: 900; color: #ffab00; letter-spacing: 2px; }
        .icon-btn { position: absolute; right: 0; background: #2a2a2a; border: 1px solid #444; border-radius: 8px; font-size: 18px; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; }
        .nav-grid-3x2 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; max-width: 440px; margin-bottom: 8px; flex-shrink: 0; }
        .nav-tile { height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; text-decoration: none; color: #000; text-transform: uppercase; }
        .t-mark { background: var(--c-mark); color: #fff; box-shadow: 0 0 0 2px #fff; }
        .t-run  { background: var(--c-run); color: #000; }
        .t-tow  { background: var(--c-tow); color: #fff; }
        .t-pass { background: var(--c-pass); color: #fff; }
        .t-yard { background: var(--c-yard); color: #000; }
        .t-rel  { background: var(--c-rel); color: #000; }
        .card { background: #1e1e1e; border-radius: 16px; padding: 10px; width: 100%; max-width: 440px; border: 1px solid #333; display: flex; flex-direction: column; flex: 1; min-height: 0; margin-bottom: 4px; }
        select { width: 100%; height: 44px; padding: 0 10px; border-radius: 8px; border: 1px solid #444; background: #2a2a2a; color: #fff; font-size: 16px; font-weight: 900; outline: none; margin-bottom: 6px; }
        .camera-box { width: 100%; flex: 1; min-height: 0; background: #000; border-radius: 12px; border: 2px solid #333; overflow: hidden; position: relative; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .cam-controls { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 8px; z-index: 20; }
        .ctrl-btn { background: rgba(0,0,0,0.75); border: 1.5px solid #ffab00; color: #ffab00; padding: 8px 12px; border-radius: 20px; font-size: 12px; font-weight: 900; cursor: pointer; }
        .circle-cam-btn { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); width: 78px; height: 78px; background: #ffab00; border: 4px solid #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 15; }
        .circle-cam-inner { width: 56px; height: 56px; border-radius: 50%; border: 3px solid #000; }
        .full-overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; pointer-events: none; opacity: 0; transition: opacity 0.15s; }
        .full-overlay.green { background: rgba(0, 230, 118, 0.94); }
        .full-overlay.red { background: rgba(255, 23, 68, 0.94); }
        .full-overlay.show { opacity: 1; }
        .full-overlay-symbol { font-size: 120px; color: #fff; }
        .full-overlay-text { font-size: 26px; font-weight: 900; color: #000; text-transform: uppercase; margin-top: 8px; }
        .manual-rego-modal { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.85); z-index: 25; flex-direction: column; align-items: center; justify-content: center; padding: 16px; }
        .manual-rego-card { width: 100%; max-width: 320px; background: #1e1e1e; border: 2px solid #ff1744; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
        .manual-input { width: 100%; height: 50px; background: #2a2a2a; border: 2px solid #ffab00; border-radius: 8px; color: #fff; font-size: 24px; font-weight: 900; text-align: center; text-transform: uppercase; outline: none; }
        .manual-btn-row { display: flex; gap: 8px; }
        .btn-cancel, .btn-submit { flex: 1; height: 44px; border: none; border-radius: 8px; font-weight: 900; cursor: pointer; text-transform: uppercase; }
        .btn-cancel { background: #333; color: #fff; }
        .btn-submit { background: #00e676; color: #000; }
        #status { text-align: center; font-weight: 900; font-size: 13px; margin-top: 6px; color: #ffab00; min-height: 18px; }
    </style>
</head>
<body>
<div class="full-overlay green" id="greenOverlay"><div class="full-overlay-symbol">✔</div><div class="full-overlay-text" id="greenText">MARKED</div></div>
<div class="full-overlay red" id="redOverlay"><div class="full-overlay-symbol">✖</div><div class="full-overlay-text" id="redText">NO PLATE</div></div>

<div class="header-box" id="headerBox"><h1>MARK</h1><div class="icon-btn" onclick="window.location.reload(true)">🔄</div></div>
<div class="nav-grid-3x2">
    <a href="mark.html" class="nav-tile t-mark">MARK</a><a href="run.html" class="nav-tile t-run">RUN</a><a href="tow.html" class="nav-tile t-tow">TOW</a>
    <a href="passes.html" class="nav-tile t-pass">PASS</a><a href="yard.html" class="nav-tile t-yard">YARD</a><a href="release.html" class="nav-tile t-rel">REL</a>
</div>

<div class="card">
    <select id="propertySelect"><option value="">LOADING PROPERTIES...</option></select>
    <div class="camera-box">
        <video id="videoElem" autoplay playsinline></video>
        <div class="cam-controls">
            <button class="ctrl-btn" id="torchBtn" onclick="togglePersistentTorch()">🔦 TORCH: OFF</button>
            <label class="ctrl-btn" style="text-align:center; display:none;" id="nativeIosCamBtn">⚡ FLASH CAM<input type="file" accept="image/*" capture="environment" style="display:none;" onchange="handleNativeIosPhoto(this)"></label>
        </div>
        <div class="circle-cam-btn" id="snapBtn"><div class="circle-cam-inner"></div></div>
        <div class="manual-rego-modal" id="manualRegoModal">
            <div class="manual-rego-card">
                <div style="font-size:16px; font-weight:900; color:#ff1744; text-align:center;">⚠️ UNREADABLE PLATE</div>
                <input type="text" id="manualRegoInput" class="manual-input" placeholder="ENTER REGO">
                <div class="manual-btn-row">
                    <button type="button" class="btn-cancel" onclick="cancelManualMark()">RETAKE 📷</button>
                    <button type="button" class="btn-submit" onclick="submitManualMark()">MARK ✔</button>
                </div>
            </div>
        </div>
    </div>
    <div id="status">READY</div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";
    const propertySelect = document.getElementById('propertySelect');
    const videoElem = document.getElementById('videoElem');
    const torchBtn = document.getElementById('torchBtn');
    const nativeIosCamBtn = document.getElementById('nativeIosCamBtn');
    const snapBtn = document.getElementById('snapBtn');
    const statusDiv = document.getElementById('status');
    const greenOverlay = document.getElementById('greenOverlay');
    const redOverlay = document.getElementById('redOverlay');
    const greenText = document.getElementById('greenText');
    const redText = document.getElementById('redText');
    const manualRegoModal = document.getElementById('manualRegoModal');
    const manualRegoInput = document.getElementById('manualRegoInput');

    let videoStream = null;
    let videoTrack = null;
    let isTorchOn = false;
    let pendingFailedPhoto = "";
    let isProcessing = false;

    window.addEventListener('load', () => {
        loadProperties();
        initCamera();
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        if (isIOS) nativeIosCamBtn.style.display = 'block';
    });

    async function loadProperties() {
        const cached = localStorage.getItem('cached_properties');
        if (cached) { try { populatePropertyDropdown(JSON.parse(cached)); } catch(e) {} }
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL + "?action=get_properties");
            const data = await res.json();
            localStorage.setItem('cached_properties', JSON.stringify(data));
            populatePropertyDropdown(data);
        } catch(e) {}
    }

    function populatePropertyDropdown(properties) {
        propertySelect.innerHTML = "<option value=''>-- SELECT PROPERTY --</option>";
        const savedProp = localStorage.getItem('last_property');
        properties.forEach(p => {
            const pName = (typeof p === 'object' && p !== null) ? (p.name || p.property || p[0] || Object.values(p)[0]) : p;
            if (pName) {
                const opt = document.createElement('option');
                opt.value = pName; opt.innerText = pName;
                if (savedProp && pName === savedProp) opt.selected = true;
                propertySelect.appendChild(opt);
            }
        });
    }

    async function initCamera() {
        try {
            videoStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
            });
            videoElem.srcObject = videoStream;
            videoTrack = videoStream.getVideoTracks()[0];
        } catch(e) {
            statusDiv.innerText = "CAMERA ACCESS ERROR";
        }
    }

    async function togglePersistentTorch() {
        if (!videoTrack) return;
        isTorchOn = !isTorchOn;
        try {
            await videoTrack.applyConstraints({ advanced: [{ torch: isTorchOn }] });
            torchBtn.innerText = isTorchOn ? "🔦 TORCH: ON" : "🔦 TORCH: OFF";
            torchBtn.style.borderColor = isTorchOn ? "#00e676" : "#ffab00";
            torchBtn.style.color = isTorchOn ? "#00e676" : "#ffab00";
        } catch(e) {
            torchBtn.innerText = "⚡ NO TORCH";
            isTorchOn = false;
        }
    }

    snapBtn.addEventListener('click', async () => {
        if (isProcessing) return;
        const prop = propertySelect.value;
        if (!prop) { triggerRedOverlay("SELECT PROPERTY"); return; }

        isProcessing = true;
        statusDiv.innerText = "🔍 READING PLATE...";

        const vW = videoElem.videoWidth || 1280;
        const vH = videoElem.videoHeight || 720;
        const canvas = document.createElement('canvas');
        canvas.width = 960; canvas.height = Math.round(960 * (vH / vW));
        const ctx = canvas.getContext('2d');
        ctx.drawImage(videoElem, 0, 0, canvas.width, canvas.height);
        const b64 = canvas.toDataURL('image/jpeg', 0.65);
        executeAnprScan(b64, prop);
    });

    async function executeAnprScan(b64, prop) {
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'scan_npr', photoBytes: b64 })
            });
            const data = await res.json();
            const detected = data && data.rego ? String(data.rego).trim().toUpperCase() : "";

            if (detected) {
                triggerGreenOverlay(detected);
                statusDiv.innerText = `✔ MARKED ${detected}`;
                sendMarkToServer(detected, prop, b64);
                isProcessing = false;
            } else {
                triggerRedOverlay("NO PLATE");
                pendingFailedPhoto = b64;
                openManualModal();
                isProcessing = false;
            }
        } catch(e) {
            triggerRedOverlay("SCAN ERROR");
            pendingFailedPhoto = b64;
            openManualModal();
            isProcessing = false;
        }
    }

    function handleNativeIosPhoto(input) {
        if (!input.files || !input.files[0]) return;
        const prop = propertySelect.value;
        if (!prop) { triggerRedOverlay("SELECT PROPERTY"); return; }

        const reader = new FileReader();
        reader.onload = function(e) {
            statusDiv.innerText = "🔍 PROCESSING FLASH PHOTO...";
            executeAnprScan(e.target.result, prop);
        };
        reader.readAsDataURL(input.files[0]);
    }

    function sendMarkToServer(rego, property, photoBytes) {
        localStorage.setItem('last_property', property);
        fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST', mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'log_mark', property: property, rego: rego, photoBytes: photoBytes, timestamp: new Date().toISOString() })
        }).catch(() => {});
    }

    function openManualModal() {
        manualRegoModal.style.display = "flex";
        manualRegoInput.value = "";
        setTimeout(() => manualRegoInput.focus(), 100);
    }
    function cancelManualMark() { manualRegoModal.style.display = "none"; pendingFailedPhoto = ""; }
    function submitManualMark() {
        const val = manualRegoInput.value.trim().toUpperCase();
        if (!val) return;
        manualRegoModal.style.display = "none";
        triggerGreenOverlay(val);
        sendMarkToServer(val, propertySelect.value, pendingFailedPhoto);
        pendingFailedPhoto = "";
    }

    function triggerGreenOverlay(txt) {
        greenText.innerText = txt || "MARKED";
        greenOverlay.classList.add('show');
        if (navigator.vibrate) navigator.vibrate(80);
        setTimeout(() => greenOverlay.classList.remove('show'), 650);
    }
    function triggerRedOverlay(txt) {
        redText.innerText = txt || "NO PLATE";
        redOverlay.classList.add('show');
        if (navigator.vibrate) navigator.vibrate([150, 60, 150]);
        setTimeout(() => redOverlay.classList.remove('show'), 650);
    }
</script>
</body>
</html>
