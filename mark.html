<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="National Towing">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

    <title>MARK</title>

    <link rel="apple-touch-icon" href="icon-manager.png?v=2">
    <link rel="icon" type="image/png" href="icon-manager.png?v=2">
    <link rel="manifest" href="manifest-mark.json?v=2">

    <style>
        :root {
            --bg: #121212; --card-bg: #1e1e1e; --border: #333333;
            --c-mark: #2979ff; --c-run: #ffab00; --c-tow: #ff1744;
            --c-pass: #ab47bc; --c-yard: #00b0ff; --c-rel: #00e676;
        }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: 14px; background: var(--bg); color: #fff; display: flex; flex-direction: column; align-items: center; }

        .header-box { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 440px; margin-bottom: 12px; }
        .nav-grid-3x2 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; max-width: 440px; margin: 0 auto 14px auto; }
        .nav-tile { height: 38px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; text-decoration: none; color: #000; text-transform: uppercase; letter-spacing: 0.5px; }
        .t-mark { background: var(--c-mark); color: #fff; box-shadow: 0 0 0 2px #fff; }
        .t-run { background: var(--c-run); color: #000; }
        .t-tow { background: var(--c-tow); color: #fff; }
        .t-pass { background: var(--c-pass); color: #fff; }
        .t-yard { background: var(--c-yard); color: #000; }
        .t-rel { background: var(--c-rel); color: #000; }

        .card { background: var(--card-bg); border-radius: 18px; padding: 18px; width: 100%; max-width: 440px; border: 1px solid var(--border); }
        label { font-size: 12px; font-weight: 900; color: #888; text-transform: uppercase; margin-top: 14px; display: block; }
        input, select { width: 100%; height: 52px; padding: 0 12px; border-radius: 10px; border: 1px solid #444; background: #2a2a2a; color: #fff; font-size: 18px; font-weight: 900; outline: none; margin-top: 4px; }

        .cam-box { width: 100%; height: 260px; background: #000; border-radius: 12px; border: 2.5px dashed var(--c-mark); margin-top: 8px; overflow: hidden; position: relative; }
        video, img { width: 100%; height: 100%; object-fit: cover; }
        
        .cam-controls { display: flex; align-items: center; justify-content: center; margin-top: 12px; }
        .snap-btn { width: 70px; height: 70px; border-radius: 50%; background: var(--c-mark); border: 4px solid #fff; cursor: pointer; }

        .submit-btn { width: 100%; height: 60px; border-radius: 14px; border: none; background: var(--c-mark); color: #fff; font-size: 24px; font-weight: 900; cursor: pointer; margin-top: 20px; letter-spacing: 2px; }
        .submit-btn:disabled { opacity: 0.5; }
        #status { text-align: center; color: var(--c-run); font-weight: 900; margin-top: 12px; min-height: 24px; }
    </style>
</head>
<body>

<div class="header-box">
    <div style="display:flex; align-items:center; gap:10px;">
        <img src="icon-manager.png" alt="Logo" style="width:40px; height:40px; border-radius:8px; object-fit:contain; border:1px solid #444; background:#000;">
        <div style="display:flex; flex-direction:column;">
            <span style="font-size:17px; font-weight:900; color:#ffab00; letter-spacing:1px; line-height:1;">NATIONAL TOWING</span>
            <span style="font-size:11px; font-weight:800; color:#aaa; letter-spacing:1px;">OPERATIONS HUB</span>
        </div>
    </div>
</div>

<div class="nav-grid-3x2">
    <a href="mark.html" class="nav-tile t-mark">MARK</a>
    <a href="run.html" class="nav-tile t-run">RUN</a>
    <a href="tow.html" class="nav-tile t-tow">TOW</a>
    <a href="passes.html" class="nav-tile t-pass">PASS</a>
    <a href="yard.html" class="nav-tile t-yard">YARD</a>
    <a href="release.html" class="nav-tile t-rel">REL</a>
</div>

<div class="card">
    <label>SELECT PROPERTY</label>
    <select id="propertySelect"><option value="">LOADING...</option></select>

    <label>CAPTURE VEHICLE</label>
    <div class="cam-box" id="camContainer">
        <video id="videoElem" autoplay playsinline muted></video>
        <img id="photoPreview" style="display:none;">
    </div>
    
    <div class="cam-controls">
        <button type="button" class="snap-btn" id="snapBtn"></button>
    </div>

    <label>REGO</label>
    <input type="text" id="regoInput" placeholder="REGO" style="text-transform:uppercase; color:var(--c-mark);">

    <button type="button" class="submit-btn" id="submitBtn">MARK</button>
    <div id="status"></div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "[https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec](https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec)";
    
    let capturedB64 = "";
    let videoStream = null;

    window.addEventListener('load', async () => {
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL + "?action=get_properties");
            const props = await res.json();
            const sel = document.getElementById('propertySelect');
            sel.innerHTML = "<option value='GENERAL'>GENERAL PATROL</option>";
            props.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.name; opt.innerText = p.name;
                sel.appendChild(opt);
            });
            
            const savedProp = localStorage.getItem('last_property');
            if (savedProp) sel.value = savedProp;
            
        } catch(e) {}
        initCamera();
    });

    async function initCamera() {
        try {
            videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 } }, audio: false });
            document.getElementById('videoElem').srcObject = videoStream;
        } catch(e) {}
    }

    document.getElementById('snapBtn').addEventListener('click', () => {
        const vid = document.getElementById('videoElem');
        if (!vid.videoWidth) {
            document.getElementById('photoPreview').style.display = 'none';
            vid.style.display = 'block';
            capturedB64 = "";
            document.getElementById('regoInput').value = "";
            return;
        }
        
        const canvas = document.createElement('canvas');
        canvas.width = 800; canvas.height = 600;
        const ctx = canvas.getContext('2d');
        
        const ratio = vid.videoWidth / vid.videoHeight;
        if (ratio > 800/600) {
            ctx.drawImage(vid, (800 - (600*ratio))/2, 0, 600*ratio, 600);
        } else {
            ctx.drawImage(vid, 0, (600 - (800/ratio))/2, 800, 800/ratio);
        }
        
        capturedB64 = canvas.toDataURL('image/jpeg', 0.6);
        document.getElementById('photoPreview').src = capturedB64;
        document.getElementById('photoPreview').style.display = 'block';
        vid.style.display = 'none';

        document.getElementById('status').innerText = "🔍 SCANNING PLATE...";
        fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST', body: JSON.stringify({ action: 'scan_npr', photoBytes: capturedB64 })
        }).then(r => r.json()).then(data => {
            if (data.rego) {
                document.getElementById('regoInput').value = data.rego;
                document.getElementById('status').innerText = "✔ PLATE READ";
                document.getElementById('status').style.color = "var(--c-rel)";
            } else {
                document.getElementById('status').innerText = "⚠️ ENTER PLATE MANUALLY";
            }
        }).catch(() => document.getElementById('status').innerText = "");
    });

    document.getElementById('submitBtn').addEventListener('click', async () => {
        const rego = document.getElementById('regoInput').value.trim().toUpperCase();
        if (!rego || !capturedB64) { document.getElementById('status').innerText = "⚠️ SNAP PHOTO AND ENTER REGO"; return; }
        
        const prop = document.getElementById('propertySelect').value;
        localStorage.setItem('last_property', prop);
        
        document.getElementById('submitBtn').disabled = true;
        document.getElementById('submitBtn').innerText = "SAVING...";
        
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST', body: JSON.stringify({
                    action: 'log_mark',
                    property: prop,
                    rego: rego,
                    photoBytes: capturedB64
                })
            });
            const data = await res.json();
            if (data.status === "SUCCESS") {
                window.location.href = "run.html";
            } else {
                document.getElementById('status').innerText = "ERROR: " + data.message;
                document.getElementById('submitBtn').disabled = false;
                document.getElementById('submitBtn').innerText = "MARK";
            }
        } catch(e) {
            document.getElementById('status').innerText = "NETWORK ERROR";
        }
    });
</script>
</body>
</html>
