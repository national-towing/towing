<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>MARK</title>
    
    <link rel="apple-touch-icon" href="icon-mark.png?v=19">
    <link rel="icon" type="image/png" href="icon-mark.png?v=19">
    <link rel="manifest" href="manifest-mark.json?v=19">

    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            margin: 0; padding: 14px; background: #121212; color: #fff; 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; 
        }
        
        .header-box { display: flex; align-items: center; justify-content: center; position: relative; width: 100%; max-width: 440px; margin-bottom: 10px; }
        .header-box h1 { margin: 0; font-size: 38px; font-weight: 900; color: #ffab00; letter-spacing: 2px; text-align: center; }
        .icon-btn { position: absolute; right: 0; background: #2a2a2a; border: 1px solid #444; border-radius: 10px; font-size: 20px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; }
        .icon-btn:active { transform: scale(0.9); }

        .nav-bar { display: flex; gap: 8px; width: 100%; max-width: 440px; margin-bottom: 16px; }
        .nav-tile { flex: 1; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 900; text-decoration: none; color: #000; }
        .nav-run { background: #ffab00; }
        .nav-tow { background: #ff1744; color: #fff; }
        .nav-rel { background: #00e676; }
        .nav-pass { background: #ab47bc; color: #fff; }

        .card { background: #1e1e1e; border-radius: 18px; padding: 18px; width: 100%; max-width: 440px; border: 1px solid #333; }
        
        label { font-size: 13px; text-transform: uppercase; color: #aaa; display: block; margin-top: 14px; font-weight: 900; letter-spacing: 1px; }
        input, select {
            width: 100%; height: 56px; padding: 0 14px; border-radius: 12px; border: 1px solid #444;
            background: #2a2a2a; color: #fff; font-size: 22px; font-weight: 900; margin-top: 6px; outline: none;
        }

        .camera-box {
            width: 100%; height: 260px; background: #000; border-radius: 14px; border: 2px solid #333;
            margin-top: 14px; overflow: hidden; display: flex; align-items: center; justify-content: center;
        }
        video { width: 100%; height: 100%; object-fit: cover; }

        .thumb-gallery { display: flex; gap: 10px; margin-top: 14px; overflow-x: auto; padding-bottom: 4px; }
        .thumb-img { width: 75px; height: 75px; border-radius: 12px; object-fit: cover; border: 3px solid #ffab00; cursor: pointer; flex-shrink: 0; }

        .circle-cam-btn {
            width: 110px; height: 110px; background: #00e676; border: 6px solid #fff; border-radius: 50%;
            margin: 16px auto 0 auto; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 26px rgba(0, 230, 118, 0.6); cursor: pointer; user-select: none;
        }
        .circle-cam-btn:active { transform: scale(0.90); }
        .circle-cam-inner { width: 84px; height: 84px; border-radius: 50%; border: 3px solid #000; }

        #status { text-align: center; font-weight: 900; font-size: 16px; margin-top: 16px; min-height: 24px; color: #00e676; }
    </style>
</head>
<body>

<div class="header-box">
    <h1>MARK</h1>
    <div class="icon-btn" id="refreshBtn">🔄</div>
</div>

<div class="nav-bar">
    <a href="run.html" class="nav-tile nav-run">RUN</a>
    <a href="tow.html" class="nav-tile nav-tow">TOW</a>
    <a href="release.html" class="nav-tile nav-rel">REL</a>
    <a href="passes.html" class="nav-tile nav-pass">PASS</a>
</div>

<div class="card">
    <label>PROPERTY</label>
    <select id="propertySelect"><option value="">LOADING...</option></select>

    <label>REGO</label>
    <input type="text" id="regoInput" placeholder="REGO" style="font-size:28px; color:#ffab00; text-transform:uppercase;">

    <div class="camera-box"><video id="videoElem" autoplay playsinline></video></div>
    <div class="thumb-gallery" id="thumbGallery"></div>
    <div class="circle-cam-btn" id="snapBtn"><div class="circle-cam-inner"></div></div>
    <div id="status"></div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";

    const propertySelect = document.getElementById('propertySelect');
    const regoInput = document.getElementById('regoInput');
    const videoElem = document.getElementById('videoElem');
    const snapBtn = document.getElementById('snapBtn');
    const thumbGallery = document.getElementById('thumbGallery');
    const refreshBtn = document.getElementById('refreshBtn');
    const statusDiv = document.getElementById('status');
    let capturedPhoto = "";

    window.addEventListener('load', () => {
        loadProperties();
        initCamera();
    });

    refreshBtn.addEventListener('click', () => {
        window.location.reload(true);
    });

    async function loadProperties() {
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL + "?action=get_properties");
            const data = await res.json();
            propertySelect.innerHTML = "";
            data.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.name; opt.innerText = p.name;
                propertySelect.appendChild(opt);
            });
        } catch(e) {}
    }

    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            videoElem.srcObject = stream;
        } catch(e) {}
    }

    snapBtn.addEventListener('click', async () => {
        const rego = regoInput.value.trim().toUpperCase();
        if (!rego) { statusDiv.innerText = "ENTER REGO FIRST"; return; }

        const canvas = document.createElement('canvas');
        canvas.width = videoElem.videoWidth || 640;
        canvas.height = videoElem.videoHeight || 480;
        canvas.getContext('2d').drawImage(videoElem, 0, 0);
        capturedPhoto = canvas.toDataURL('image/jpeg', 0.8);

        thumbGallery.innerHTML = "";
        const img = document.createElement('img');
        img.src = capturedPhoto; img.className = 'thumb-img';
        thumbGallery.appendChild(img);

        const payload = {
            action: 'log_mark',
            property: propertySelect.value,
            rego: rego,
            photoBytes: capturedPhoto
        };

        statusDiv.innerText = "MARKING VEHICLE...";
        try {
            await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
            statusDiv.innerText = "✔ VEHICLE MARKED SUCCESS!";
        } catch(err) {
            let offlineQueue = JSON.parse(localStorage.getItem('offline_marks') || '[]');
            offlineQueue.push(payload);
            localStorage.setItem('offline_marks', JSON.stringify(offlineQueue));
            statusDiv.innerText = "⚠️ OFFLINE: LOGGED LOCALLY";
        }

        setTimeout(() => {
            regoInput.value = ""; capturedPhoto = ""; thumbGallery.innerHTML = ""; statusDiv.innerText = "";
        }, 1500);
    });

    window.addEventListener('online', async () => {
        let offlineQueue = JSON.parse(localStorage.getItem('offline_marks') || '[]');
        if (offlineQueue.length > 0) {
            statusDiv.innerText = "SYNCING OFFLINE LOGS...";
            for (let item of offlineQueue) {
                await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify(item) });
            }
            localStorage.removeItem('offline_marks');
            statusDiv.innerText = "✔ ALL OFFLINE LOGS SYNCED!";
        }
    });
</script>
</body>
</html>
