<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

    <title>MARK (DIAGNOSTIC MODE)</title>

    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            margin: 0; padding: 14px; background: #121212; color: #fff; 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }
        .card { background: #1e1e1e; border-radius: 18px; padding: 18px; width: 100%; max-width: 440px; border: 1px solid #333; margin-top: 20px; }
        label { font-size: 12px; text-transform: uppercase; color: #aaa; display: block; margin-top: 10px; font-weight: 900; }
        input, select {
            width: 100%; height: 50px; padding: 0 12px; border-radius: 10px; border: 1px solid #444;
            background: #2a2a2a; color: #fff; font-size: 20px; font-weight: 900; margin-top: 4px; outline: none;
        }
        .camera-box {
            width: 100%; height: 420px; background: #000; border-radius: 14px; border: 2px solid #333;
            margin-top: 10px; overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        .circle-cam-btn {
            position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
            width: 84px; height: 84px; background: #ffab00; border: 4px solid #fff; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 15;
        }
        .circle-cam-inner { width: 60px; height: 60px; border-radius: 50%; border: 2px solid #000; }
        #status { text-align: center; font-weight: 900; font-size: 15px; margin-top: 12px; min-height: 40px; color: #ff1744; word-break: break-word; }
        .manual-btn { background: #ffab00; color: #000; font-weight: 900; border: none; border-radius: 10px; height: 46px; font-size: 18px; width: 100%; margin-top: 10px; cursor: pointer; display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="color:#ffab00; margin:0; text-align:center;">ANPR DIAGNOSTIC</h2>
    
    <label>PROPERTY</label>
    <select id="propertySelect"><option value="GENERAL">GENERAL</option></select>

    <label>REGO</label>
    <input type="text" id="regoInput" placeholder="RESULT..." style="color:#ffab00; text-transform:uppercase;">

    <label>MARKING CAMERA</label>
    <div class="camera-box">
        <video id="videoElem" autoplay playsinline></video>
        <div class="circle-cam-btn" id="snapBtn"><div class="circle-cam-inner"></div></div>
    </div>

    <button class="manual-btn" id="manualLogBtn">LOG MANUALLY</button>
    <div id="status">TAP SNAP BUTTON TO TEST API</div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";
    const PLATE_RECOGNIZER_TOKEN = "e463d12224bd2d0aed2f0d912440ea2999cbfa75";

    const videoElem = document.getElementById('videoElem');
    const snapBtn = document.getElementById('snapBtn');
    const regoInput = document.getElementById('regoInput');
    const statusDiv = document.getElementById('status');
    const manualLogBtn = document.getElementById('manualLogBtn');

    window.addEventListener('load', async () => {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            videoElem.srcObject = stream;
        } catch(e) {
            statusDiv.innerText = "CAMERA ACCESS ERROR: " + e.message;
        }
    });

    snapBtn.addEventListener('click', async () => {
        statusDiv.style.color = "#ffab00";
        statusDiv.innerText = "CAPTURING FRAME...";

        const vw = videoElem.videoWidth || 1280;
        const vh = videoElem.videoHeight || 720;

        const canvas = document.createElement('canvas');
        canvas.width = vw;
        canvas.height = vh;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(videoElem, 0, 0, vw, vh);

        const b64Image = canvas.toDataURL('image/jpeg', 0.85);

        statusDiv.innerText = "SENDING TO PLATE RECOGNIZER...";

        canvas.toBlob(async (blob) => {
            if (!blob) {
                statusDiv.style.color = "#ff1744";
                statusDiv.innerText = "ERROR: COULD NOT CREATE IMAGE BLOB";
                return;
            }

            try {
                const formData = new FormData();
                formData.append('upload', blob, 'plate.jpg');
                formData.append('regions', 'au');

                const res = await fetch('https://api.platerecognizer.com/v1/plate-reader/', {
                    method: 'POST',
                    headers: { 'Authorization': 'Token ' + PLATE_RECOGNIZER_TOKEN },
                    body: formData
                });

                if (!res.ok) {
                    const errText = await res.text();
                    statusDiv.style.color = "#ff1744";
                    statusDiv.innerText = `API HTTP ERROR ${res.status}: ${errText.substring(0, 80)}`;
                    manualLogBtn.style.display = 'block';
                    return;
                }

                const data = await res.json();
                
                if (data.results && data.results.length > 0 && data.results[0].plate) {
                    const detectedRego = data.results[0].plate.toUpperCase();
                    regoInput.value = detectedRego;
                    statusDiv.style.color = "#00e676";
                    statusDiv.innerText = `✔ DETECTED: ${detectedRego}`;
                } else {
                    statusDiv.style.color = "#ff1744";
                    statusDiv.innerText = "❌ NO PLATE FOUND IN FRAME (TYPE MANUALLY)";
                    manualLogBtn.style.display = 'block';
                }

            } catch(err) {
                statusDiv.style.color = "#ff1744";
                statusDiv.innerText = "FETCH/NETWORK EXCEPTION: " + err.message;
                manualLogBtn.style.display = 'block';
            }
        }, 'image/jpeg', 0.85);
    });
</script>
</body>
</html>
