<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

    <title>MARK</title>
    
    <link rel="apple-touch-icon" href="icon-mark.png?v=70000">
    <link rel="icon" type="image/png" href="icon-mark.png?v=70000">
    <link rel="manifest" href="manifest-mark.json?v=70000">

    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            margin: 0; padding: 14px; background: #121212; color: #fff; 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
            touch-action: manipulation; user-select: none; -webkit-user-select: none;
        }
        
        .header-box { display: flex; align-items: center; justify-content: center; position: relative; width: 100%; max-width: 440px; margin-bottom: 10px; }
        .header-box h1 { margin: 0; font-size: 38px; font-weight: 900; color: #ffab00; letter-spacing: 2px; text-align: center; }
        .icon-btn { position: absolute; right: 0; background: #2a2a2a; border: 1px solid #444; border-radius: 10px; font-size: 20px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; }

        .sync-badge {
            background: #ffab00; color: #000; font-weight: 900; font-size: 12px;
            padding: 6px 12px; border-radius: 20px; margin-bottom: 10px; display: none;
            cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
        }

        .nav-bar { display: flex; gap: 8px; width: 100%; max-width: 440px; margin-bottom: 16px; }
        .nav-tile { flex: 1; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 900; text-decoration: none; color: #000; }
        .nav-run { background: #ffab00; }
        .nav-tow { background: #ff1744; color: #fff; }
        .nav-rel { background: #00e676; }
        .nav-pass { background: #ab47bc; color: #fff; }

        .card { background: #1e1e1e; border-radius: 18px; padding: 18px; width: 100%; max-width: 440px; border: 1px solid #333; margin-bottom: 16px; }
        
        label { font-size: 12px; text-transform: uppercase; color: #aaa; display: block; margin-top: 10px; font-weight: 900; letter-spacing: 1px; }
        input, select {
            width: 100%; height: 50px; padding: 0 12px; border-radius: 10px; border: 1px solid #444;
            background: #2a2a2a; color: #fff; font-size: 20px; font-weight: 900; margin-top: 4px; outline: none;
            -webkit-appearance: none;
        }

        .camera-box {
            width: 100%; height: 460px; aspect-ratio: 3/4; background: #000; border-radius: 14px; border: 2px solid #333;
            margin-top: 10px; overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative;
        }
        video { width: 100%; height: 100%; object-fit: cover; }

        .torch-btn {
            position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.65);
            border: 1px solid #ffab00; color: #ffab00; padding: 6px 14px; border-radius: 20px;
            font-size: 11px; font-weight: 900; cursor: pointer; z-index: 10;
        }

        .circle-cam-btn {
            position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
            width: 94px; height: 94px; background: #ffab00; border: 5px solid #fff; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 22px rgba(0, 0, 0, 0.7); cursor: pointer; user-select: none; z-index: 15;
        }
        .circle-cam-btn:active { transform: translateX(-50%) scale(0.90); }
        .circle-cam-inner { width: 68px; height: 68px; border-radius: 50%; border: 3px solid #000; }

        .overlay-tick {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 230, 118, 0.85); display: flex; align-items: center; justify-content: center;
            font-size: 120px; color: #fff; z-index: 20; opacity: 0; pointer-events: none;
            transition: opacity 0.15s ease-in-out;
        }
        .overlay-tick.show { opacity: 1; }

        .overlay-cross {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 23, 68, 0.85); display: flex; align-items: center; justify-content: center;
            font-size: 120px; color: #fff; z-index: 20; opacity: 0; pointer-events: none;
            transition: opacity 0.15s ease-in-out;
        }
        .overlay-cross.show { opacity: 1; }

        .manual-btn {
            background: #ffab00; color: #000; font-weight: 900; border: none; border-radius: 10px;
            height: 46px; font-size: 18px; width: 100%; margin-top: 10px; cursor: pointer; letter-spacing: 1px;
            display: none;
        }

        #status { text-align: center; font-weight: 900; font-size: 16px; margin-top: 12px; min-height: 24px; color: #ffab00; letter-spacing: 1px; }
    </style>
</head>
<body>

<div class="header-box">
    <h1>MARK</h1>
    <div class="icon-btn" id="refreshBtn">🔄</div>
</div>

<div class="sync-badge" id="syncBadge" onclick="processOfflineQueue()">⚡ OFFLINE QUEUE: <span id="queueCount">0</span> (AUTO-SYNCING)</div>

<div class="nav-bar">
    <a href="run.html?v=70000" class="nav-tile nav-run">RUN</a>
    <a href="tow.html?v=70000" class="nav-tile nav-tow">TOW</a>
    <a href="release.html?v=70000" class="nav-tile nav-rel">REL</a>
    <a href="passes.html?v=70000" class="nav-tile nav-pass">PASS</a>
</div>

<div class="card">
    <label>PROPERTY</label>
    <select id="propertySelect"><option value="">LOADING PROPERTIES...</option></select>

    <label>REGO</label>
    <input type="text" id="regoInput" placeholder="SCAN OR TYPE REGO..." style="color:#ffab00; text-transform:uppercase;">

    <label>MARKING CAMERA</label>
    <div class="camera-box">
        <button class="torch-btn" id="torchBtn">⚡ FLASH OFF</button>
        <video id="videoElem" autoplay playsinline></video>
        <div class="circle-cam-btn" id="snapBtn"><div class="circle-cam-inner"></div></div>
        <div class="overlay-tick" id="overlayTick">✔</div>
        <div class="overlay-cross" id="overlayCross">✖</div>
    </div>

    <button class="manual-btn" id="manualLogBtn">LOG REGO MANUALLY</button>
    <div id="status">READY</div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";
    const PLATE_RECOGNIZER_TOKEN = "74a8bb83a49461eef0266274ce63e1e198b4c888";

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js?v=70000').catch(()=>{});
    }

    const propertySelect = document.getElementById('propertySelect');
    const regoInput = document.getElementById('regoInput');
    const videoElem = document.getElementById('videoElem');
    const snapBtn = document.getElementById('snapBtn');
    const torchBtn = document.getElementById('torchBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const manualLogBtn = document.getElementById('manualLogBtn');
    const statusDiv = document.getElementById('status');
    const overlayTick = document.getElementById('overlayTick');
    const overlayCross = document.getElementById('overlayCross');
    const syncBadge = document.getElementById('syncBadge');
    const queueCount = document.getElementById('queueCount');

    let isProcessing = false;
    let videoTrack = null;
    let torchOn = false;
    let lastCapturedB64 = "";

    window.addEventListener('load', async () => {
        await loadProperties();
        initCamera();
        updateQueueUI();
        window.addEventListener('online', processOfflineQueue);
    });

    refreshBtn.addEventListener('click', async () => {
        if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            for (let registration of registrations) {
                await registration.unregister();
            }
        }
        window.location.reload(true);
    });

    async function loadProperties() {
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL + "?action=get_properties");
            const data = await res.json();
            localStorage.setItem('cached_properties', JSON.stringify(data));
            populatePropertiesUI(data);
        } catch(e) {
            const cached = localStorage.getItem('cached_properties');
            if (cached) populatePropertiesUI(JSON.parse(cached));
        }
    }

    function populatePropertiesUI(data) {
        propertySelect.innerHTML = "";
        data.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.name; opt.innerText = p.name;
            propertySelect.appendChild(opt);
        });
    }

    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { 
                    facingMode: 'environment',
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                } 
            });
            videoElem.srcObject = stream;
            videoTrack = stream.getVideoTracks()[0];
        } catch(e) {}
    }

    torchBtn.addEventListener('click', async (e) => {
        e.preventDefault();
        if (!videoTrack) return;
        try {
            torchOn = !torchOn;
            await videoTrack.applyConstraints({ advanced: [{ torch: torchOn }] });
            torchBtn.innerText = torchOn ? "⚡ FLASH ON" : "⚡ FLASH OFF";
            torchBtn.style.color = torchOn ? "#00e676" : "#ffab00";
        } catch(e) {}
    });

    snapBtn.addEventListener('click', async (e) => {
        e.preventDefault(); e.stopPropagation();
        if (isProcessing) return;

        isProcessing = true;
        manualLogBtn.style.display = 'none';
        statusDiv.innerText = "CAPTURING...";

        const canvas = document.createElement('canvas');
        canvas.width = 1024;
        canvas.height = 768;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(videoElem, 0, 0, 1024, 768);

        lastCapturedB64 = canvas.toDataURL('image/jpeg', 0.80);

        statusDiv.innerText = "READING PLATE...";

        canvas.toBlob(async (blob) => {
            if (!blob) {
                handleUnreadableState();
                return;
            }

            try {
                const formData = new FormData();
                formData.append('upload', blob, 'scan.jpg');
                formData.append('regions', 'au');

                const anprRes = await fetch('https://api.platerecognizer.com/v1/plate-reader/', {
                    method: 'POST',
                    headers: { 'Authorization': 'Token ' + PLATE_RECOGNIZER_TOKEN },
                    body: formData
                });

                if (!anprRes.ok) {
                    handleUnreadableState();
                    return;
                }

                const anprData = await anprRes.json();
                
                if (anprData.results && anprData.results.length > 0 && anprData.results[0].plate) {
                    const detectedRego = anprData.results[0].plate.toUpperCase();
                    regoInput.value = detectedRego;
                    
                    flashTickOverlay();
                    statusDiv.innerText = `✔ LOGGED: ${detectedRego}`;

                    const payload = {
                        id: 'MARK_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                        action: 'log_mark',
                        property: propertySelect.value,
                        rego: detectedRego,
                        photoBytes: lastCapturedB64
                    };

                    if (navigator.onLine) {
                        fetch(GOOGLE_SCRIPT_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify(payload)
                        }).catch(() => saveToOfflineQueue(payload));
                    } else {
                        saveToOfflineQueue(payload);
                    }

                    setTimeout(() => { resetForm(); }, 800);
                } else {
                    handleUnreadableState();
                }

            } catch(err) {
                handleUnreadableState();
            }
        }, 'image/jpeg', 0.80);
    });

    function handleUnreadableState() {
        flashCrossOverlay();
        statusDiv.innerText = "❌ UNREADABLE - TYPE REGO BELOW";
        regoInput.value = "";
        regoInput.focus();
        manualLogBtn.style.display = 'block';
        isProcessing = false;
    }

    manualLogBtn.addEventListener('click', (e) => {
        e.preventDefault();
        const typedRego = regoInput.value.trim().toUpperCase();
        if (!typedRego) {
            statusDiv.innerText = "ENTER A REGO FIRST";
            regoInput.focus();
            return;
        }

        flashTickOverlay();
        statusDiv.innerText = `✔ MANUALLY LOGGED: ${typedRego}`;

        const payload = {
            id: 'MARK_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
            action: 'log_mark',
            property: propertySelect.value,
            rego: typedRego,
            photoBytes: lastCapturedB64
        };

        if (navigator.onLine) {
            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            }).catch(() => saveToOfflineQueue(payload));
        } else {
            saveToOfflineQueue(payload);
        }

        setTimeout(() => { resetForm(); }, 800);
    });

    function flashTickOverlay() {
        overlayTick.classList.add('show');
        setTimeout(() => { overlayTick.classList.remove('show'); }, 400);
    }

    function flashCrossOverlay() {
        overlayCross.classList.add('show');
        setTimeout(() => { overlayCross.classList.remove('show'); }, 400);
    }

    function resetForm() {
        regoInput.value = "";
        statusDiv.innerText = "READY";
        manualLogBtn.style.display = 'none';
        isProcessing = false;
    }

    function saveToOfflineQueue(payload) {
        let queue = JSON.parse(localStorage.getItem('mark_offline_queue') || "[]");
        if (!queue.some(item => item.id === payload.id)) {
            queue.push(payload);
            localStorage.setItem('mark_offline_queue', JSON.stringify(queue));
        }
        updateQueueUI();
    }

    function updateQueueUI() {
        let queue = JSON.parse(localStorage.getItem('mark_offline_queue') || "[]");
        if (queue.length > 0) {
            queueCount.innerText = queue.length;
            syncBadge.style.display = 'block';
        } else {
            syncBadge.style.display = 'none';
        }
    }

    async function processOfflineQueue() {
        let queue = JSON.parse(localStorage.getItem('mark_offline_queue') || "[]");
        if (queue.length === 0 || !navigator.onLine) return;

        let remaining = [];

        for (let item of queue) {
            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(item)
                });
            } catch(e) {
                remaining.push(item);
            }
        }

        localStorage.setItem('mark_offline_queue', JSON.stringify(remaining));
        updateQueueUI();
    }
</script>
</body>
</html>
