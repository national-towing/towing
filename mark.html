<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

    <title>MARK</title>
    
    <link rel="apple-touch-icon" href="icon-mark.png?v=1900">
    <link rel="icon" type="image/png" href="icon-mark.png?v=1900">
    <link rel="manifest" href="manifest-mark.json?v=1900">

    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            margin: 0; padding: 8px 12px; background: #121212; color: #fff; 
            display: flex; flex-direction: column; align-items: center; 
            height: 100vh; max-height: 100vh; overflow: hidden;
        }
        
        .header-box { display: flex; align-items: center; justify-content: center; position: relative; width: 100%; max-width: 440px; margin-bottom: 4px; flex-shrink: 0; }
        .header-box h1 { margin: 0; font-size: 28px; font-weight: 900; color: #ffab00; letter-spacing: 2px; text-align: center; }
        .icon-btn { position: absolute; right: 0; background: #2a2a2a; border: 1px solid #444; border-radius: 10px; font-size: 16px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; }

        .sync-badge {
            background: #ffab00; color: #000; font-weight: 900; font-size: 11px;
            padding: 4px 10px; border-radius: 20px; margin-bottom: 4px; display: none;
            cursor: pointer; text-transform: uppercase; letter-spacing: 1px; flex-shrink: 0;
        }

        .nav-bar { display: flex; gap: 6px; width: 100%; max-width: 440px; margin-bottom: 6px; flex-shrink: 0; }
        .nav-tile { flex: 1; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 900; text-decoration: none; color: #000; }
        .nav-run { background: #ffab00; }
        .nav-tow { background: #ff1744; color: #fff; }
        .nav-rel { background: #00e676; }
        .nav-pass { background: #ab47bc; color: #fff; }

        .card { 
            background: #1e1e1e; border-radius: 16px; padding: 10px; width: 100%; max-width: 440px; 
            border: 1px solid #333; display: flex; flex-direction: column; flex: 1; overflow: hidden;
        }
        
        label { font-size: 10px; text-transform: uppercase; color: #aaa; display: block; margin-top: 2px; font-weight: 900; letter-spacing: 1px; flex-shrink: 0; }
        input, select {
            width: 100%; height: 38px; padding: 0 10px; border-radius: 8px; border: 1px solid #444;
            background: #2a2a2a; color: #fff; font-size: 16px; font-weight: 900; margin-top: 2px; outline: none;
            -webkit-appearance: none; flex-shrink: 0;
        }

        /* MAXIMIZED VIEWFINDER FRAME TO FILL SCREEN WITHOUT SCROLLING */
        .camera-box {
            width: 100%; flex: 1; background: #000; border-radius: 12px; border: 2px solid #333;
            margin-top: 4px; overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative;
            min-height: 220px;
        }
        
        video { width: 100%; height: 100%; object-fit: cover; }

        .torch-btn {
            position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.65);
            border: 1px solid #ffab00; color: #ffab00; padding: 5px 10px; border-radius: 20px;
            font-size: 10px; font-weight: 900; cursor: pointer; z-index: 10;
        }

        .thumb-preview { width: 100%; height: 100%; border-radius: 12px; object-fit: cover; background: #000; border: 2px solid #ffab00; display: none; }

        .feedback-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; align-items: center; justify-content: center;
            font-size: 85px; font-weight: 900; border-radius: 12px; z-index: 20;
            background: rgba(0,0,0,0.75);
        }
        .overlay-success { color: #00e676; border: 4px solid #00e676; }
        .overlay-error { color: #ff1744; border: 4px solid #ff1744; }

        /* FLOATING SNAP BUTTON ON CAMERA VIEW */
        .circle-cam-btn {
            position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
            width: 72px; height: 72px; background: #ffab00; border: 4px solid #fff; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.6); cursor: pointer; user-select: none; z-index: 15;
        }
        .circle-cam-btn:active { transform: translateX(-50%) scale(0.90); }
        .circle-cam-inner { width: 52px; height: 52px; border-radius: 50%; border: 2px solid #000; }

        .manual-btn {
            background: #ffab00; color: #000; font-weight: 900; border: none; border-radius: 10px;
            height: 40px; font-size: 16px; width: 100%; margin-top: 6px; cursor: pointer; letter-spacing: 1px;
            display: none; flex-shrink: 0;
        }

        #status { text-align: center; font-weight: 900; font-size: 16px; margin-top: 4px; min-height: 20px; color: #ffab00; text-transform: uppercase; letter-spacing: 1px; flex-shrink: 0; }
    </style>
</head>
<body>

<div class="header-box">
    <h1>MARK</h1>
    <div class="icon-btn" id="refreshBtn">🔄</div>
</div>

<div class="sync-badge" id="syncBadge" onclick="processOfflineQueue()">⚡ OFFLINE QUEUE: <span id="queueCount">0</span> (AUTO-SYNCING)</div>

<div class="nav-bar">
    <a href="run.html?v=1900" class="nav-tile nav-run">RUN</a>
    <a href="tow.html?v=1900" class="nav-tile nav-tow">TOW</a>
    <a href="release.html?v=1900" class="nav-tile nav-rel">REL</a>
    <a href="passes.html?v=1900" class="nav-tile nav-pass">PASS</a>
</div>

<div class="card">
    <label>PROPERTY</label>
    <select id="propertySelect" onchange="saveSelectedProperty(this.value)">
        <option value="">LOADING PROPERTIES...</option>
    </select>

    <label>REGO</label>
    <input type="text" id="regoInput" placeholder="REGO" style="color:#ffab00; text-transform:uppercase;">

    <label>MARKING CAMERA</label>
    <div class="camera-box" id="camBox">
        <button class="torch-btn" id="torchBtn">⚡ FLASH OFF</button>
        <video id="videoElem" autoplay playsinline></video>
        <img class="thumb-preview" id="thumbPreview">
        <div class="feedback-overlay" id="feedbackOverlay"></div>
        <div class="circle-cam-btn" id="snapBtn"><div class="circle-cam-inner"></div></div>
    </div>

    <button class="manual-btn" id="manualLogBtn">LOG MANUAL MARK</button>

    <div id="status">READY</div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";
    const PLATE_RECOGNIZER_TOKEN = "Token 74a8bb83a49461eef0266274ce63e1e198b4c888";

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js?v=1900').catch(()=>{});
    }

    const propertySelect = document.getElementById('propertySelect');
    const regoInput = document.getElementById('regoInput');
    const videoElem = document.getElementById('videoElem');
    const camBox = document.getElementById('camBox');
    const thumbPreview = document.getElementById('thumbPreview');
    const feedbackOverlay = document.getElementById('feedbackOverlay');
    const snapBtn = document.getElementById('snapBtn');
    const torchBtn = document.getElementById('torchBtn');
    const manualLogBtn = document.getElementById('manualLogBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const statusDiv = document.getElementById('status');
    const syncBadge = document.getElementById('syncBadge');
    const queueCount = document.getElementById('queueCount');

    let videoTrack = null;
    let torchOn = false;
    let lastCapturedPhotoBytes = "";

    window.addEventListener('load', async () => {
        await loadProperties();
        initCamera();
        updateQueueUI();
        window.addEventListener('online', processOfflineQueue);
    });

    refreshBtn.addEventListener('click', async () => {
        if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            for (let registration of registrations) {
                await registration.unregister();
            }
        }
        window.location.reload(true);
    });

    function saveSelectedProperty(val) {
        if (val) localStorage.setItem('sticky_selected_property', val);
    }

    async function loadProperties() {
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL + "?action=get_properties");
            const data = await res.json();
            localStorage.setItem('cached_properties', JSON.stringify(data));
            populatePropertiesUI(data);
        } catch(e) {
            const cached = localStorage.getItem('cached_properties');
            if (cached) populatePropertiesUI(JSON.parse(cached));
        }
    }

    function populatePropertiesUI(data) {
        propertySelect.innerHTML = "";
        data.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.name; opt.innerText = p.name;
            propertySelect.appendChild(opt);
        });

        const savedProp = localStorage.getItem('sticky_selected_property');
        if (savedProp) {
            propertySelect.value = savedProp;
        }
    }

    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { 
                    facingMode: 'environment',
                    width: { ideal: 1920 },
                    height: { ideal: 1080 }
                } 
            });
            videoElem.srcObject = stream;
            videoTrack = stream.getVideoTracks()[0];
        } catch(e) {}
    }

    torchBtn.addEventListener('click', async (e) => {
        e.preventDefault();
        if (!videoTrack) return;
        try {
            torchOn = !torchOn;
            await videoTrack.applyConstraints({ advanced: [{ torch: torchOn }] });
            torchBtn.innerText = torchOn ? "⚡ FLASH ON" : "⚡ FLASH OFF";
            torchBtn.style.color = torchOn ? "#00e676" : "#ffab00";
        } catch(e) {
            statusDiv.innerText = "ERROR";
            statusDiv.style.color = "#ff1744";
        }
    });

    // HIGH-SPEED PLATE RECOGNIZER ANPR CALL
    async function recognizePlate(base64Image) {
        try {
            const fetchRes = await fetch(base64Image);
            const blob = await fetchRes.blob();

            const formData = new FormData();
            formData.append('upload', blob, 'plate.jpg');
            formData.append('regions', 'au');

            const response = await fetch('https://api.platerecognizer.com/v1/plate-reader/', {
                method: 'POST',
                headers: { 'Authorization': PLATE_RECOGNIZER_TOKEN },
                body: formData
            });

            const result = await response.json();
            if (result.results && result.results.length > 0) {
                return result.results[0].plate.toUpperCase();
            }
        } catch(err) {}
        return null;
    }

    // 1. AUTO SNAP & ANPR
    snapBtn.addEventListener('click', async (e) => {
        e.preventDefault(); e.stopPropagation();

        const selectedProp = propertySelect.value;
        if (!selectedProp) {
            statusDiv.innerText = "SELECT PROPERTY";
            statusDiv.style.color = "#ff1744";
            return;
        }

        let manualRego = regoInput.value.trim().toUpperCase();

        const realW = videoElem.videoWidth || 1080;
        const realH = videoElem.videoHeight || 1920;

        const canvas = document.createElement('canvas');
        canvas.width = realW;
        canvas.height = realH;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(videoElem, 0, 0, realW, realH);
        
        lastCapturedPhotoBytes = canvas.toDataURL('image/jpeg', 0.65);

        statusDiv.innerText = "SCANNING...";
        statusDiv.style.color = "#ffab00";

        let detectedRego = manualRego;

        if (!detectedRego && navigator.onLine) {
            detectedRego = await recognizePlate(lastCapturedPhotoBytes);
        }

        if (detectedRego) {
            regoInput.value = detectedRego;
            
            const payload = {
                id: 'MARK_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                action: 'log_mark',
                property: selectedProp,
                rego: detectedRego,
                photoBytes: lastCapturedPhotoBytes
            };

            showVisualFeedback("✔", true);
            statusDiv.innerText = `LOGGED: ${detectedRego}`;
            statusDiv.style.color = "#00e676";

            if (navigator.onLine) {
                fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                }).catch(() => saveToOfflineQueue(payload));
            } else {
                saveToOfflineQueue(payload);
            }

            resetCameraAfterDelay(500);
        } else {
            showVisualFeedback("✖", false);
            statusDiv.innerText = "ERROR";
            statusDiv.style.color = "#ff1744";
            manualLogBtn.style.display = "block";
            regoInput.focus();
        }
    });

    // 2. MANUAL REGO OVERRIDE SUBMISSION
    manualLogBtn.addEventListener('click', async () => {
        const manualRego = regoInput.value.trim().toUpperCase();
        if (!manualRego) {
            statusDiv.innerText = "ENTER REGO FIRST";
            statusDiv.style.color = "#ff1744";
            return;
        }

        const payload = {
            id: 'MARK_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
            action: 'log_mark',
            property: propertySelect.value,
            rego: manualRego,
            photoBytes: lastCapturedPhotoBytes
        };

        showVisualFeedback("✔", true);
        statusDiv.innerText = `LOGGED: ${manualRego}`;
        statusDiv.style.color = "#00e676";

        if (navigator.onLine) {
            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            }).catch(() => saveToOfflineQueue(payload));
        } else {
            saveToOfflineQueue(payload);
        }

        manualLogBtn.style.display = "none";
        resetCameraAfterDelay(500);
    });

    function showVisualFeedback(symbol, isSuccess) {
        feedbackOverlay.innerText = symbol;
        feedbackOverlay.className = `feedback-overlay ${isSuccess ? 'overlay-success' : 'overlay-error'}`;
        feedbackOverlay.style.display = 'flex';
    }

    function resetCameraAfterDelay(ms) {
        setTimeout(() => {
            feedbackOverlay.style.display = 'none';
            statusDiv.innerText = "READY";
            statusDiv.style.color = "#ffab00";
            manualLogBtn.style.display = "none";
            regoInput.value = "";
        }, ms);
    }

    function saveToOfflineQueue(payload) {
        let queue = JSON.parse(localStorage.getItem('mark_offline_queue') || "[]");
        if (!queue.some(item => item.id === payload.id)) {
            queue.push(payload);
            localStorage.setItem('mark_offline_queue', JSON.stringify(queue));
        }
        updateQueueUI();
    }

    function updateQueueUI() {
        let queue = JSON.parse(localStorage.getItem('mark_offline_queue') || "[]");
        if (queue.length > 0) {
            queueCount.innerText = queue.length;
            syncBadge.style.display = 'block';
        } else {
            syncBadge.style.display = 'none';
        }
    }

    async function processOfflineQueue() {
        let queue = JSON.parse(localStorage.getItem('mark_offline_queue') || "[]");
        if (queue.length === 0 || !navigator.onLine) return;

        let remaining = [];

        for (let item of queue) {
            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(item)
                });
            } catch(e) {
                remaining.push(item);
            }
        }

        localStorage.setItem('mark_offline_queue', JSON.stringify(remaining));
        updateQueueUI();
    }
</script>
</body>
</html>
