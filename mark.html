<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta id="themeColor" name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>MARK</title>
    
    <link rel="apple-touch-icon" href="icon-mark.png?v=1002">
    <link rel="icon" type="image/png" href="icon-mark.png?v=1002">
    <link rel="manifest" href="manifest-mark.json?v=1002">

    <style>
        :root {
            --c-mark: #2979ff;
            --c-run: #ffab00;
            --c-tow: #ff1744;
            --c-pass: #ab47bc;
            --c-yard: #00b0ff;
            --c-rel: #00e676;
        }
        * { box-sizing: border-box; }
        html, body { 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: #121212; 
            color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            transition: background 0.3s ease;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            padding-top: max(16px, env(safe-area-inset-top));
            padding-bottom: max(20px, env(safe-area-inset-bottom));
        }
        
        .header-box { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            width: 100%; 
            max-width: 440px; 
            margin-bottom: 8px; 
            flex-shrink: 0;
            padding: 4px 10px;
            border-radius: 12px;
        }
        .header-box h1 { 
            margin: 0; 
            font-size: 36px; 
            font-weight: 900; 
            color: #ffab00; 
            letter-spacing: 2px; 
            text-align: center; 
        }

        .icon-btn { 
            position: absolute; 
            right: 4px; 
            background: #2a2a2a; 
            border: 1px solid #444; 
            border-radius: 10px; 
            font-size: 18px; 
            width: 40px; 
            height: 40px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            color: #fff; 
        }
        .icon-btn:active { transform: scale(0.92); }

        /* 3x2 Grid Navigation */
        .nav-grid-3x2 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; max-width: 440px; margin-bottom: 10px; flex-shrink: 0; }
        .nav-tile { height: 38px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; text-decoration: none; color: #000; text-transform: uppercase; letter-spacing: 0.5px; }
        .nav-tile:active { transform: scale(0.96); }
        .t-mark { background: var(--c-mark); color: #fff; box-shadow: 0 0 0 2px #fff; }
        .t-run  { background: var(--c-run); color: #000; }
        .t-tow  { background: var(--c-tow); color: #fff; }
        .t-pass { background: var(--c-pass); color: #fff; }
        .t-yard { background: var(--c-yard); color: #000; }
        .t-rel  { background: var(--c-rel); color: #000; }

        .card { 
            background: #1e1e1e; 
            border-radius: 18px; 
            padding: 12px; 
            width: 100%; 
            max-width: 440px; 
            border: 1px solid #333; 
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            margin-bottom: 4px;
            position: relative;
        }

        .prop-select-wrap { width: 100%; margin-bottom: 10px; flex-shrink: 0; }
        select {
            width: 100%; height: 48px; padding: 0 12px; border-radius: 10px; border: 1.5px solid #444;
            background: #2a2a2a; color: #fff; font-size: 17px; font-weight: 900; outline: none;
            -webkit-appearance: none;
        }
        select:focus { border-color: var(--c-mark); }

        /* CENTRAL NATIVE CAMERA TRIGGER */
        .camera-trigger-box {
            width: 100%;
            flex: 1;
            min-height: 0;
            background: #111;
            border-radius: 14px;
            border: 2.5px dashed #444;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            user-select: none;
        }
        .camera-trigger-box:active { 
            background: #181818; 
            border-color: var(--c-mark); 
        }

        .cam-icon-circle {
            width: 105px;
            height: 105px;
            background: #2a2a2a;
            border: 3.5px solid var(--c-mark);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: #fff;
            box-shadow: 0 8px 26px rgba(41, 121, 255, 0.35);
            margin-bottom: 14px;
        }
        .camera-trigger-box:active .cam-icon-circle {
            transform: scale(0.94);
        }

        .cam-launch-title {
            font-size: 20px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .cam-launch-sub {
            font-size: 12px;
            font-weight: 800;
            color: #888;
            margin-top: 4px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .preview-img-display {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            border-radius: 12px;
        }

        /* FULL-SCREEN RESULT FLASH OVERLAYS */
        .full-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; pointer-events: none; opacity: 0;
            transition: opacity 0.15s ease-in-out;
        }
        .full-overlay.green { background: rgba(0, 230, 118, 0.96); }
        .full-overlay.red { background: rgba(255, 23, 68, 0.96); }
        .full-overlay.show { opacity: 1; }
        .full-overlay-symbol { font-size: 130px; color: #fff; line-height: 1; text-shadow: 0 6px 24px rgba(0,0,0,0.4); }
        .full-overlay-text { font-size: 30px; font-weight: 950; color: #000; text-transform: uppercase; margin-top: 8px; letter-spacing: 2px; }

        /* MANUAL ENTRY MODAL */
        .manual-rego-modal {
            display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.88);
            border-radius: 14px; z-index: 25; flex-direction: column; align-items: center; justify-content: center;
            padding: 16px;
        }
        .manual-rego-card {
            width: 100%; max-width: 320px; background: #1e1e1e; border: 2px solid #ff1744;
            border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .manual-title { font-size: 18px; font-weight: 900; color: #ff1744; text-align: center; text-transform: uppercase; letter-spacing: 1px; }
        .manual-input {
            width: 100%; height: 50px; background: #2a2a2a; border: 2px solid #ffab00; border-radius: 10px;
            color: #fff; font-size: 24px; font-weight: 900; text-align: center; text-transform: uppercase; outline: none;
        }
        .manual-btn-row { display: flex; gap: 8px; margin-top: 4px; }
        .btn-cancel { flex: 1; height: 44px; border: none; border-radius: 8px; background: #333; color: #fff; font-weight: 900; cursor: pointer; text-transform: uppercase; }
        .btn-submit { flex: 1; height: 44px; border: none; border-radius: 8px; background: #00e676; color: #000; font-weight: 900; cursor: pointer; text-transform: uppercase; font-size: 15px; }

        #status { text-align: center; font-weight: 900; font-size: 13px; margin-top: 8px; color: #ffab00; flex-shrink: 0; min-height: 18px; }
    </style>
</head>
<body>

<div class="full-overlay green" id="greenOverlay">
    <div class="full-overlay-symbol">✔</div>
    <div class="full-overlay-text" id="greenText">MARKED</div>
</div>
<div class="full-overlay red" id="redOverlay">
    <div class="full-overlay-symbol">✖</div>
    <div class="full-overlay-text" id="redText">NO PLATE DETECTED</div>
</div>

<div class="header-box">
    <h1>MARK</h1>
    <div class="icon-btn" onclick="window.location.reload(true)">🔄</div>
</div>

<div class="nav-grid-3x2">
    <a href="mark.html" class="nav-tile t-mark">MARK</a>
    <a href="run.html" class="nav-tile t-run">RUN</a>
    <a href="tow.html" class="nav-tile t-tow">TOW</a>
    <a href="passes.html" class="nav-tile t-pass">PASS</a>
    <a href="yard.html" class="nav-tile t-yard">YARD</a>
    <a href="release.html" class="nav-tile t-rel">REL</a>
</div>

<div class="card">
    <div class="prop-select-wrap">
        <select id="propertySelect"><option value="">LOADING PROPERTIES...</option></select>
    </div>

    <div class="camera-trigger-box" onclick="launchNativeCamera()">
        <img id="lastSnapPreview" class="preview-img-display" alt="Mark Preview">
        <div class="cam-icon-circle">📷</div>
        <div class="cam-launch-title">SNAP VEHICLE</div>
        <div class="cam-launch-sub">Hardware Flash & Night Mode</div>

        <div class="manual-rego-modal" id="manualRegoModal" onclick="event.stopPropagation()">
            <div class="manual-rego-card">
                <div class="manual-title">⚠️ UNREADABLE PLATE</div>
                <input type="text" id="manualRegoInput" class="manual-input" placeholder="ENTER REGO" autocomplete="off" autocorrect="off">
                <div class="manual-btn-row">
                    <button type="button" class="btn-cancel" onclick="cancelManualMark()">RETAKE 📷</button>
                    <button type="button" class="btn-submit" onclick="submitManualMark()">MARK ✔</button>
                </div>
            </div>
        </div>
    </div>

    <input type="file" id="nativeCamInput" accept="image/*" capture="environment" style="display:none;" onchange="handleNativePhoto(this)">

    <div id="status">READY</div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";

    const propertySelect = document.getElementById('propertySelect');
    const nativeCamInput = document.getElementById('nativeCamInput');
    const lastSnapPreview = document.getElementById('lastSnapPreview');
    const statusDiv = document.getElementById('status');
    const greenOverlay = document.getElementById('greenOverlay');
    const redOverlay = document.getElementById('redOverlay');
    const greenText = document.getElementById('greenText');
    const redText = document.getElementById('redText');
    const manualRegoModal = document.getElementById('manualRegoModal');
    const manualRegoInput = document.getElementById('manualRegoInput');

    let isProcessing = false;
    let pendingFailedPhoto = "";

    // IMMEDIATELY SAVE PROPERTY TO LOCALSTORAGE ON EVERY USER CHANGE
    propertySelect.addEventListener('change', () => {
        if (propertySelect.value) {
            localStorage.setItem('last_property', propertySelect.value.trim());
        }
    });

    window.addEventListener('load', () => {
        loadProperties();
    });

    async function loadProperties() {
        const cached = localStorage.getItem('cached_properties');
        if (cached) {
            try { populatePropertyDropdown(JSON.parse(cached)); } catch(e) {}
        }
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL + "?action=get_properties");
            if (res.ok) {
                const data = await res.json();
                if (Array.isArray(data) && data.length > 0) {
                    localStorage.setItem('cached_properties', JSON.stringify(data));
                    populatePropertyDropdown(data);
                }
            }
        } catch(e) {}
    }

    function populatePropertyDropdown(properties) {
        propertySelect.innerHTML = "<option value=''>-- SELECT PROPERTY --</option>";
        const savedProp = (localStorage.getItem('last_property') || '').trim().toUpperCase();
        let matched = false;

        properties.forEach(p => {
            const propName = (typeof p === 'object' && p !== null) ? (p.name || p.property || p[0] || Object.values(p)[0]) : p;
            if (propName) {
                const opt = document.createElement('option');
                opt.value = propName;
                opt.innerText = propName;
                if (savedProp && propName.toUpperCase() === savedProp) {
                    opt.selected = true;
                    matched = true;
                }
                propertySelect.appendChild(opt);
            }
        });

        // Ensure saved property is retained
        if (matched && propertySelect.value) {
            localStorage.setItem('last_property', propertySelect.value);
        }
    }

    function launchNativeCamera() {
        if (isProcessing) return;
        const prop = propertySelect.value;
        if (!prop) {
            statusDiv.innerText = "⚠️ SELECT PROPERTY FIRST";
            triggerRedOverlay("SELECT PROPERTY");
            return;
        }
        nativeCamInput.value = "";
        nativeCamInput.click();
    }

    function handleNativePhoto(input) {
        if (!input.files || !input.files[0]) return;
        const file = input.files[0];
        const prop = propertySelect.value;

        isProcessing = true;
        statusDiv.innerText = "⚡ COMPRESSING & READING PLATE...";

        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const maxDim = 960;
                let w = img.width;
                let h = img.height;

                if (w > h) {
                    if (w > maxDim) {
                        h = Math.round((h * maxDim) / w);
                        w = maxDim;
                    }
                } else {
                    if (h > maxDim) {
                        w = Math.round((w * maxDim) / h);
                        h = maxDim;
                    }
                }

                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);

                const fastB64 = canvas.toDataURL('image/jpeg', 0.65);
                
                lastSnapPreview.src = fastB64;
                lastSnapPreview.style.display = "block";

                executeFastAnpr(fastB64, prop);
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    async function executeFastAnpr(b64, property) {
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'scan_npr', photoBytes: b64 })
            });
            const data = await res.json();
            const detectedRego = data && data.rego ? String(data.rego).trim().toUpperCase() : "";

            if (detectedRego) {
                triggerGreenOverlay(detectedRego);
                statusDiv.innerText = `✔ MARKED ${detectedRego}`;
                sendMarkToServer(detectedRego, property, b64);
                isProcessing = false;
            } else {
                triggerRedOverlay("NO PLATE DETECTED");
                pendingFailedPhoto = b64;
                openManualModal();
                isProcessing = false;
            }
        } catch(err) {
            triggerRedOverlay("SCAN ERROR");
            pendingFailedPhoto = b64;
            openManualModal();
            isProcessing = false;
        }
    }

    function sendMarkToServer(rego, property, photoBytes) {
        localStorage.setItem('last_property', property);
        const payload = {
            action: 'log_mark',
            property: property,
            rego: rego,
            photoBytes: photoBytes,
            timestamp: new Date().toISOString()
        };

        fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
        }).catch(() => {});
    }

    function openManualModal() {
        manualRegoModal.style.display = "flex";
        manualRegoInput.value = "";
        setTimeout(() => manualRegoInput.focus(), 150);
    }

    function cancelManualMark() {
        manualRegoModal.style.display = "none";
        pendingFailedPhoto = "";
        statusDiv.innerText = "READY";
    }

    function submitManualMark() {
        const manualRego = manualRegoInput.value.trim().toUpperCase();
        if (!manualRego || manualRego.length < 2) return;

        const property = propertySelect.value;
        manualRegoModal.style.display = "none";

        triggerGreenOverlay(manualRego);
        statusDiv.innerText = `✔ MARKED ${manualRego}`;
        sendMarkToServer(manualRego, property, pendingFailedPhoto);
        pendingFailedPhoto = "";
    }

    function triggerGreenOverlay(rego) {
        greenText.innerText = rego || "MARKED";
        greenOverlay.classList.add('show');
        if (navigator.vibrate) navigator.vibrate(80);
        setTimeout(() => {
            greenOverlay.classList.remove('show');
        }, 700);
    }

    function triggerRedOverlay(msg) {
        redText.innerText = msg || "NO PLATE DETECTED";
        redOverlay.classList.add('show');
        if (navigator.vibrate) navigator.vibrate([150, 60, 150]);
        setTimeout(() => {
            redOverlay.classList.remove('show');
        }, 700);
    }
</script>
</body>
</html>
