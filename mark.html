<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MARK PATROL</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MARK">
    
    <link rel="apple-touch-icon" href="icon-mark.png?v=2">
    <link rel="icon" type="image/png" href="icon-mark.png?v=2">
    <link rel="manifest" href="manifest-mark.json?v=2">

    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; padding: 12px; background: #121212; color: #fff; 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }
        .header { text-align: center; margin-bottom: 10px; }
        .header h1 { margin: 0; font-size: 28px; font-weight: 900; color: #2979ff; letter-spacing: 1px; }

        .card {
            background: #1e1e1e; border-radius: 16px; padding: 16px; width: 100%; max-width: 440px;
            border: 1px solid #2a2a2a; box-shadow: 0 4px 14px rgba(0,0,0,0.5);
        }

        label { font-size: 11px; text-transform: uppercase; color: #aaa; display: block; margin-top: 12px; font-weight: 800; }
        input, select {
            width: 100%; height: 46px; padding: 0 12px; border-radius: 10px; border: 1px solid #333;
            background: #2a2a2a; color: #fff; font-size: 16px; font-weight: 700; margin-top: 4px; outline: none;
        }

        .camera-box {
            width: 100%; height: 260px; background: #000; border-radius: 12px; border: 2px dashed #444;
            margin-top: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center;
        }
        video, img.preview { width: 100%; height: 100%; object-fit: contain; }

        .submit-btn {
            background: #2979ff; color: #fff; font-weight: 900; border: none; border-radius: 12px;
            height: 54px; font-size: 20px; width: 100%; margin-top: 18px; cursor: pointer; letter-spacing: 1px;
        }
        .submit-btn:active { transform: scale(0.97); }
        #status { text-align: center; font-weight: 800; font-size: 13px; margin-top: 12px; color: #00e676; }
        .offline-banner { background: #ffab00; color: #000; padding: 6px; text-align: center; font-weight: 900; font-size: 12px; border-radius: 6px; display: none; }
    </style>
</head>
<body>

<div class="header">
    <h1>MARK PATROL</h1>
</div>

<div class="card">
    <div id="offlineBanner" class="offline-banner">⚠️ BASEMENT / OFFLINE MODE</div>

    <label>Property Location</label>
    <select id="propSelect">
        <option value="" disabled selected>DETECTING GPS LOCATION...</option>
        <option value="OTHER">OTHER (MANUAL ENTRY)</option>
    </select>
    
    <div id="otherPropDiv" style="display:none;">
        <label>Manual Property Name</label>
        <input type="text" id="otherPropInput" placeholder="ENTER PROPERTY NAME">
    </div>

    <label>Vehicle Registration</label>
    <input type="text" id="regoInput" placeholder="REGO" style="font-size:22px; color:#2979ff; text-transform:uppercase; font-weight:900;">

    <label>Patrol Photo</label>
    <div class="camera-box">
        <video id="videoElem" autoplay playsinline></video>
        <img id="capturedImg" class="preview" style="display:none;">
    </div>
    <button id="snapBtn" style="margin-top:8px; height:40px; background:#333; color:#fff; border:1px solid #555; border-radius:8px; width:100%; font-weight:800;">📸 SNAP PATROL PHOTO</button>

    <button class="submit-btn" id="submitBtn">MARK VEHICLE</button>
    <div id="status"></div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";

    const propSelect = document.getElementById('propSelect');
    const otherPropDiv = document.getElementById('otherPropDiv');
    const otherPropInput = document.getElementById('otherPropInput');
    const regoInput = document.getElementById('regoInput');
    const videoElem = document.getElementById('videoElem');
    const capturedImg = document.getElementById('capturedImg');
    const snapBtn = document.getElementById('snapBtn');
    const submitBtn = document.getElementById('submitBtn');
    const statusDiv = document.getElementById('status');

    let capturedBase64 = "";

    propSelect.addEventListener('change', () => {
        if (propSelect.value === 'OTHER') {
            otherPropDiv.style.display = 'block';
        } else {
            otherPropDiv.style.display = 'none';
            localStorage.setItem('last_property', propSelect.value);
        }
    });

    window.addEventListener('load', () => {
        initCamera();
        loadProperties();
        checkNetwork();
    });

    async function loadProperties() {
        try {
            const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=get_properties`);
            const props = await res.json();
            propSelect.innerHTML = '<option value="" disabled>SELECT PROPERTY</option>';
            props.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.name;
                opt.innerText = p.name;
                propSelect.appendChild(opt);
            });
            const optOther = document.createElement('option');
            optOther.value = 'OTHER';
            optOther.innerText = 'OTHER (MANUAL ENTRY)';
            propSelect.appendChild(optOther);

            // Default to last used property if underground/no GPS
            const lastProp = localStorage.getItem('last_property');
            if (lastProp) propSelect.value = lastProp;
        } catch(e) {
            propSelect.value = 'OTHER';
            otherPropDiv.style.display = 'block';
        }
    }

    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            videoElem.srcObject = stream;
        } catch(e) {}
    }

    snapBtn.addEventListener('click', () => {
        const canvas = document.createElement('canvas');
        canvas.width = videoElem.videoWidth || 640;
        canvas.height = videoElem.videoHeight || 480;
        canvas.getContext('2d').drawImage(videoElem, 0, 0);
        capturedBase64 = canvas.toDataURL('image/jpeg', 0.8);
        capturedImg.src = capturedBase64;
        capturedImg.style.display = 'block';
        videoElem.style.display = 'none';
    });

    submitBtn.addEventListener('click', async () => {
        const rego = regoInput.value.trim().toUpperCase();
        if (!rego) { statusDiv.innerText = "ENTER REGO"; return; }

        const prop = propSelect.value === 'OTHER' ? otherPropInput.value.trim() : propSelect.value;
        const payload = {
            action: 'log_mark',
            rego: rego,
            property: prop,
            photoBytes: capturedBase64
        };

        if (!navigator.onLine) {
            saveOffline('mark_queue', payload);
            statusDiv.innerText = "⚠️ SAVED LOCALLY (OFFLINE BASEMENT). WILL SYNC ONEXIT.";
            return;
        }

        statusDiv.innerText = "MARKING VEHICLE...";
        await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
        statusDiv.innerText = "✔ VEHICLE MARKED SUCCESS!";
    });

    function saveOffline(key, data) {
        let queue = JSON.parse(localStorage.getItem(key) || "[]");
        queue.push(data);
        localStorage.setItem(key, JSON.stringify(queue));
    }

    function checkNetwork() {
        if (!navigator.onLine) document.getElementById('offlineBanner').style.display = 'block';
        window.addEventListener('online', () => {
            document.getElementById('offlineBanner').style.display = 'none';
            syncOffline();
        });
    }

    async function syncOffline() {
        let queue = JSON.parse(localStorage.getItem('mark_queue') || "[]");
        if (queue.length === 0) return;
        for (let item of queue) {
            await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify(item) });
        }
        localStorage.removeItem('mark_queue');
        statusDiv.innerText = "✔ OFFLINE MARKS SYNCED!";
    }
</script>
</body>
</html>
