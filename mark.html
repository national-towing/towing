<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta id="themeColor" name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>MARK</title>
    
    <link rel="apple-touch-icon" href="icon-mark.png?v=1002">
    <link rel="icon" type="image/png" href="icon-mark.png?v=1002">
    <link rel="manifest" href="manifest-mark.json?v=1002">

    <style>
        :root {
            --c-mark: #2979ff;
            --c-run: #ffab00;
            --c-tow: #ff1744;
            --c-admin: #ab47bc;
            --c-yard: #00b0ff;
            --c-rel: #00e676;
        }
        * { box-sizing: border-box; }
        html, body { 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: #121212; 
            color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            transition: background 0.3s ease;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            padding-top: max(16px, env(safe-area-inset-top));
            padding-bottom: max(20px, env(safe-area-inset-bottom));
        }
        
        .header-box { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            width: 100%; 
            max-width: 440px; 
            margin-bottom: 8px; 
            flex-shrink: 0;
            padding: 4px 10px;
            border-radius: 12px;
        }
        .header-box h1 { 
            margin: 0; 
            font-size: 32px; 
            font-weight: 900; 
            color: #ffab00; 
            letter-spacing: 2px; 
            text-align: center; 
        }

        .icon-btn { 
            position: absolute; 
            right: 4px; 
            background: #2a2a2a; 
            border: 1px solid #444; 
            border-radius: 10px; 
            font-size: 18px; 
            width: 40px; 
            height: 40px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            color: #fff; 
        }
        .icon-btn:active { transform: scale(0.92); }

        /* 3x2 Grid Navigation */
        .nav-grid-3x2 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; max-width: 440px; margin-bottom: 8px; flex-shrink: 0; }
        .nav-tile { height: 38px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; text-decoration: none; color: #000; text-transform: uppercase; letter-spacing: 0.5px; }
        .nav-tile:active { transform: scale(0.96); }
        .t-mark  { background: var(--c-mark); color: #fff; box-shadow: 0 0 0 2px #fff; }
        .t-run   { background: var(--c-run); color: #000; }
        .t-tow   { background: var(--c-tow); color: #fff; }
        .t-admin { background: var(--c-admin); color: #fff; }
        .t-yard  { background: var(--c-yard); color: #000; }
        .t-rel   { background: var(--c-rel); color: #000; }

        /* Sub-navigation bar */
        .sub-nav-bar {
            display: flex;
            width: 100%;
            max-width: 440px;
            background: #1e1e1e;
            border-radius: 10px;
            border: 1px solid #333;
            margin-bottom: 8px;
            overflow: hidden;
            flex-shrink: 0;
        }
        .sub-tab {
            flex: 1;
            height: 38px;
            border: none;
            background: transparent;
            color: #888;
            font-size: 12px;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s;
        }
        .sub-tab.active {
            background: var(--c-mark);
            color: #fff;
        }

        .card { 
            background: #1e1e1e; 
            border-radius: 18px; 
            padding: 12px; 
            width: 100%; 
            max-width: 440px; 
            border: 1px solid #333; 
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            position: relative;
        }

        .prop-select-wrap { width: 100%; margin-bottom: 10px; flex-shrink: 0; }
        select {
            width: 100%; height: 48px; padding: 0 12px; border-radius: 10px; border: 1.5px solid #444;
            background: #2a2a2a; color: #fff; font-size: 17px; font-weight: 900; outline: none;
            -webkit-appearance: none;
        }
        select:focus { border-color: var(--c-mark); }

        /* Camera trigger */
        .camera-trigger-box {
            width: 100%;
            flex: 1;
            min-height: 0;
            background: #111;
            border-radius: 14px;
            border: 2.5px dashed #444;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            user-select: none;
        }
        .camera-trigger-box:active { 
            background: #181818; 
            border-color: var(--c-mark); 
        }

        .cam-icon-circle {
            width: 105px;
            height: 105px;
            background: #2a2a2a;
            border: 3.5px solid var(--c-mark);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: #fff;
            box-shadow: 0 8px 26px rgba(41, 121, 255, 0.35);
            margin-bottom: 14px;
        }
        .camera-trigger-box:active .cam-icon-circle {
            transform: scale(0.94);
        }

        .cam-launch-title {
            font-size: 20px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .cam-launch-sub {
            font-size: 12px;
            font-weight: 800;
            color: #888;
            margin-top: 4px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .preview-img-display {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            border-radius: 12px;
        }

        /* Log views */
        .log-scroll-view {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 2px;
        }

        .log-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            flex-shrink: 0;
        }
        .log-bar-title {
            font-size: 13px;
            font-weight: 900;
            color: #ffab00;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-mini-refresh {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            padding: 5px 10px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 11px;
            cursor: pointer;
        }

        /* Property tile */
        .prop-tile {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #242424;
            border: 1.5px solid #383838;
            border-radius: 10px;
            padding: 12px 14px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .prop-tile:active { background: #333; transform: scale(0.98); }
        .prop-tile-name { font-weight: 900; font-size: 15px; color: #fff; }
        .prop-tile-count { 
            background: var(--c-mark); 
            color: #fff; 
            font-weight: 900; 
            font-size: 14px; 
            padding: 4px 10px; 
            border-radius: 12px;
        }

        /* Vehicle card */
        .v-card {
            display: flex;
            align-items: center;
            background: #242424;
            border: 1.5px solid #383838;
            border-radius: 10px;
            padding: 10px;
            gap: 10px;
            cursor: pointer;
        }
        .v-card:active { background: #333; }
        .v-thumb {
            width: 58px;
            height: 58px;
            border-radius: 6px;
            background: #111;
            object-fit: cover;
            flex-shrink: 0;
            border: 1px solid #444;
        }
        .v-info { flex: 1; min-width: 0; }
        .v-row-1 { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
        .v-rego { font-family: monospace; font-size: 17px; font-weight: 900; color: #fff; }
        .v-pass { font-size: 9px; font-weight: 900; padding: 2px 5px; border-radius: 4px; }
        .pass-y { background: var(--c-rel); color: #000; }
        .pass-n { background: var(--c-tow); color: #fff; }
        .v-desc { font-size: 12px; color: #bbb; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
        .v-times { font-size: 10px; color: #777; font-weight: 700; display: flex; gap: 8px; }

        .btn-back-prop {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #ffab00;
            font-size: 12px;
            font-weight: 800;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 8px;
            align-self: flex-start;
        }

        /* Edit modal */
        .edit-modal {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.92);
            border-radius: 18px;
            z-index: 50;
            flex-direction: column;
            padding: 14px;
            overflow-y: auto;
        }
        .edit-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .edit-title { font-size: 16px; font-weight: 900; color: #ffab00; text-transform: uppercase; }
        .btn-edit-close { background: none; border: none; font-size: 20px; color: #aaa; cursor: pointer; }

        .audit-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 12px;
        }
        .audit-box {
            background: #111;
            border: 1px dashed #444;
            border-radius: 8px;
            padding: 6px 8px;
            font-size: 10px;
            color: #888;
            font-weight: 800;
            text-align: center;
        }
        .audit-box strong { display: block; font-size: 11px; color: #00e676; margin-top: 2px; }

        .f-field { display: flex; flex-direction: column; gap: 3px; margin-bottom: 10px; }
        .f-field label { font-size: 10px; font-weight: 900; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
        .f-input {
            width: 100%;
            height: 40px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 0 10px;
            color: #fff;
            font-size: 14px;
            font-weight: 800;
            outline: none;
        }
        .f-input:focus { border-color: var(--c-mark); }
        .f-rego { font-size: 18px; font-family: monospace; text-transform: uppercase; letter-spacing: 1px; }

        .f-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        .edit-btn-row { display: flex; gap: 8px; margin-top: 8px; }
        .btn-save-edit {
            flex: 1;
            height: 44px;
            background: #00e676;
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 900;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* Overlay alerts */
        .full-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; pointer-events: none; opacity: 0;
            transition: opacity 0.15s ease-in-out;
        }
        .full-overlay.green { background: rgba(0, 230, 118, 0.96); }
        .full-overlay.red { background: rgba(255, 23, 68, 0.96); }
        .full-overlay.show { opacity: 1; }
        .full-overlay-symbol { font-size: 130px; color: #fff; line-height: 1; text-shadow: 0 6px 24px rgba(0,0,0,0.4); }
        .full-overlay-text { font-size: 30px; font-weight: 950; color: #000; text-transform: uppercase; margin-top: 8px; letter-spacing: 2px; }

        /* Manual modal */
        .manual-rego-modal {
            display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.88);
            border-radius: 14px; z-index: 25; flex-direction: column; align-items: center; justify-content: center;
            padding: 16px;
        }
        .manual-rego-card {
            width: 100%; max-width: 320px; background: #1e1e1e; border: 2px solid #ff1744;
            border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .manual-title { font-size: 18px; font-weight: 900; color: #ff1744; text-align: center; text-transform: uppercase; letter-spacing: 1px; }
        .manual-input {
            width: 100%; height: 50px; background: #2a2a2a; border: 2px solid #ffab00; border-radius: 10px;
            color: #fff; font-size: 24px; font-weight: 900; text-align: center; text-transform: uppercase; outline: none;
        }
        .manual-btn-row { display: flex; gap: 8px; margin-top: 4px; }
        .btn-cancel { flex: 1; height: 44px; border: none; border-radius: 8px; background: #333; color: #fff; font-weight: 900; cursor: pointer; text-transform: uppercase; }
        .btn-submit { flex: 1; height: 44px; border: none; border-radius: 8px; background: #00e676; color: #000; font-weight: 900; cursor: pointer; text-transform: uppercase; font-size: 15px; }

        #status { text-align: center; font-weight: 900; font-size: 13px; margin-top: 8px; color: #ffab00; flex-shrink: 0; min-height: 18px; }
    </style>
</head>
<body>

<div class="full-overlay green" id="greenOverlay">
    <div class="full-overlay-symbol">✔</div>
    <div class="full-overlay-text" id="greenText">MARKED</div>
</div>
<div class="full-overlay red" id="redOverlay">
    <div class="full-overlay-symbol">✖</div>
    <div class="full-overlay-text" id="redText">NO PLATE DETECTED</div>
</div>

<div class="header-box">
    <h1>MARK</h1>
    <div class="icon-btn" onclick="window.location.reload(true)">🔄</div>
</div>

<div class="nav-grid-3x2">
    <a href="mark.html" class="nav-tile t-mark">MARK</a>
    <a href="run.html" class="nav-tile t-run">RUN</a>
    <a href="tow.html" class="nav-tile t-tow">TOW</a>
    <a href="admin.html" class="nav-tile t-admin">ADMIN</a>
    <a href="yard.html" class="nav-tile t-yard">YARD</a>
    <a href="release.html" class="nav-tile t-rel">REL</a>
</div>

<!-- SUB-NAV TOGGLE -->
<div class="sub-nav-bar">
    <button class="sub-tab active" id="tabSnap" onclick="showView('snap')">📷 SNAP / MARK</button>
    <button class="sub-tab" id="tabLogs" onclick="showView('props')">📋 ACTIVE MARKS (<span id="totalMarksBadge">0</span>)</button>
</div>

<div class="card">
    <!-- VIEW 1: SNAP / SCAN -->
    <div id="viewSnap" style="display:flex; flex-direction:column; width:100%; height:100%;">
        <div class="prop-select-wrap">
            <select id="propertySelect"><option value="">LOADING PROPERTIES...</option></select>
        </div>

        <div class="camera-trigger-box" onclick="launchNativeCamera()">
            <img id="lastSnapPreview" class="preview-img-display" alt="Mark Preview">
            <div class="cam-icon-circle">📷</div>
            <div class="cam-launch-title">SNAP VEHICLE</div>
            <div class="cam-launch-sub">Hardware Flash & Night Mode</div>

            <div class="manual-rego-modal" id="manualRegoModal" onclick="event.stopPropagation()">
                <div class="manual-rego-card">
                    <div class="manual-title">⚠️ UNREADABLE PLATE</div>
                    <input type="text" id="manualRegoInput" class="manual-input" placeholder="ENTER REGO" autocomplete="off" autocorrect="off">
                    <div class="manual-btn-row">
                        <button type="button" class="btn-cancel" onclick="cancelManualMark()">RETAKE 📷</button>
                        <button type="button" class="btn-submit" onclick="submitManualMark()">MARK ✔</button>
                    </div>
                </div>
            </div>
        </div>

        <input type="file" id="nativeCamInput" accept="image/*" capture="environment" style="display:none;" onchange="handleNativePhoto(this)">
        <div id="status">READY</div>
    </div>

    <!-- VIEW 2: PROPERTY LIST -->
    <div id="viewProps" style="display:none; flex-direction:column; width:100%; height:100%;">
        <div class="log-bar">
            <span class="log-bar-title">Properties With Marks</span>
            <button class="btn-mini-refresh" onclick="fetchMarkingLogs()">🔄 REFRESH</button>
        </div>
        <div class="log-scroll-view" id="propertyTilesList">
            <div style="text-align:center; padding:20px; color:#888;">Loading active marks...</div>
        </div>
    </div>

    <!-- VIEW 3: VEHICLE DETAIL LIST (NEWEST AT TOP) -->
    <div id="viewVehicles" style="display:none; flex-direction:column; width:100%; height:100%;">
        <button class="btn-back-prop" onclick="showView('props')">◀ ALL PROPERTIES</button>
        <div class="log-bar">
            <span class="log-bar-title" id="selectedPropLabel">PROPERTY</span>
            <span id="propCountLabel" style="font-size:11px; color:#aaa; font-weight:800;"></span>
        </div>
        <div class="log-scroll-view" id="vehicleCardsList"></div>
    </div>

    <!-- VIEW 4: VEHICLE EDIT MODAL -->
    <div class="edit-modal" id="editModal">
        <div class="edit-title-row">
            <div class="edit-title">EDIT MARK DETAILS</div>
            <button class="btn-edit-close" onclick="closeEditModal()">✕</button>
        </div>

        <!-- READ-ONLY TIMESTAMPS -->
        <div class="audit-info-grid">
            <div class="audit-box">MARKED TIME<strong id="mMarkedTime">-</strong></div>
            <div class="audit-box">EXPIRY TIME<strong id="mExpiryTime">-</strong></div>
        </div>

        <form onsubmit="saveMarkEdit(event)">
            <input type="hidden" id="mRowIdx">
            <input type="hidden" id="mOrigRego">

            <div class="f-field">
                <label>Property</label>
                <select id="mProperty" class="f-input" required></select>
            </div>

            <div class="f-field">
                <label>Registration Number</label>
                <input type="text" id="mRego" class="f-input f-rego" required>
            </div>

            <div class="f-grid-2">
                <div class="f-field">
                    <label>Make</label>
                    <input type="text" id="mMake" class="f-input">
                </div>
                <div class="f-field">
                    <label>Model</label>
                    <input type="text" id="mModel" class="f-input">
                </div>
            </div>

            <div class="f-grid-2">
                <div class="f-field">
                    <label>Colour</label>
                    <select id="mColour" class="f-input">
                        <option value="White">White</option>
                        <option value="Black">Black</option>
                        <option value="Silver">Silver</option>
                        <option value="Grey">Grey</option>
                        <option value="Blue">Blue</option>
                        <option value="Red">Red</option>
                        <option value="Green">Green</option>
                        <option value="Yellow">Yellow</option>
                        <option value="Gold">Gold</option>
                        <option value="Bronze">Bronze</option>
                        <option value="Orange">Orange</option>
                        <option value="Purple">Purple</option>
                        <option value="Brown">Brown</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="f-field">
                    <label>Body Type</label>
                    <select id="mBodyType" class="f-input">
                        <option value="Sedan">Sedan</option>
                        <option value="Hatchback">Hatchback</option>
                        <option value="SUV">SUV</option>
                        <option value="Station Wagon">Station Wagon</option>
                        <option value="Utility">Utility</option>
                        <option value="Van">Van</option>
                        <option value="Coupe">Coupe</option>
                        <option value="Convertible">Convertible</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>

            <div class="edit-btn-row">
                <button type="button" class="btn-cancel" onclick="closeEditModal()">CANCEL</button>
                <button type="submit" id="btnSaveMark" class="btn-save-edit">SAVE CHANGES ✔</button>
            </div>
        </form>
    </div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";

    const propertySelect = document.getElementById('propertySelect');
    const nativeCamInput = document.getElementById('nativeCamInput');
    const lastSnapPreview = document.getElementById('lastSnapPreview');
    const statusDiv = document.getElementById('status');
    const greenOverlay = document.getElementById('greenOverlay');
    const redOverlay = document.getElementById('redOverlay');
    const greenText = document.getElementById('greenText');
    const redText = document.getElementById('redText');
    const manualRegoModal = document.getElementById('manualRegoModal');
    const manualRegoInput = document.getElementById('manualRegoInput');

    let isProcessing = false;
    let pendingFailedPhoto = "";
    let markingLogCache = [];
    let propertyListCache = [];
    let activeSelectedProperty = "";

    propertySelect.addEventListener('change', () => {
        if (propertySelect.value) {
            localStorage.setItem('last_property', propertySelect.value.trim());
        }
    });

    window.addEventListener('load', () => {
        loadProperties();
        fetchMarkingLogs(true);
    });

    function showView(view) {
        document.getElementById('viewSnap').style.display = view === 'snap' ? 'flex' : 'none';
        document.getElementById('viewProps').style.display = view === 'props' ? 'flex' : 'none';
        document.getElementById('viewVehicles').style.display = view === 'vehicles' ? 'flex' : 'none';

        document.getElementById('tabSnap').classList.toggle('active', view === 'snap');
        document.getElementById('tabLogs').classList.toggle('active', view === 'props' || view === 'vehicles');

        if (view === 'props') {
            fetchMarkingLogs();
        }
    }

    async function loadProperties() {
        const cached = localStorage.getItem('cached_properties');
        if (cached) {
            try { 
                propertyListCache = JSON.parse(cached);
                populatePropertyDropdown(propertyListCache); 
            } catch(e) {}
        }
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL + "?action=get_properties");
            if (res.ok) {
                const data = await res.json();
                if (Array.isArray(data) && data.length > 0) {
                    propertyListCache = data;
                    localStorage.setItem('cached_properties', JSON.stringify(data));
                    populatePropertyDropdown(data);
                }
            }
        } catch(e) {}
    }

    function populatePropertyDropdown(properties) {
        propertySelect.innerHTML = "<option value=''>-- SELECT PROPERTY --</option>";
        const savedProp = (localStorage.getItem('last_property') || '').trim().toUpperCase();
        let matched = false;

        properties.forEach(p => {
            const propName = (typeof p === 'object' && p !== null) ? (p.name || p.property || p[0] || Object.values(p)[0]) : p;
            if (propName) {
                const opt = document.createElement('option');
                opt.value = propName;
                opt.innerText = propName;
                if (savedProp && propName.toUpperCase() === savedProp) {
                    opt.selected = true;
                    matched = true;
                }
                propertySelect.appendChild(opt);
            }
        });

        if (matched && propertySelect.value) {
            localStorage.setItem('last_property', propertySelect.value);
        }
    }

    function launchNativeCamera() {
        if (isProcessing) return;
        const prop = propertySelect.value;
        if (!prop) {
            statusDiv.innerText = "⚠️ SELECT PROPERTY FIRST";
            triggerRedOverlay("SELECT PROPERTY");
            return;
        }
        nativeCamInput.value = "";
        nativeCamInput.click();
    }

    function handleNativePhoto(input) {
        if (!input.files || !input.files[0]) return;
        const file = input.files[0];
        const prop = propertySelect.value;

        isProcessing = true;
        statusDiv.innerText = "⚡ COMPRESSING & READING PLATE...";

        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const maxDim = 960;
                let w = img.width;
                let h = img.height;

                if (w > h) {
                    if (w > maxDim) {
                        h = Math.round((h * maxDim) / w);
                        w = maxDim;
                    }
                } else {
                    if (h > maxDim) {
                        w = Math.round((w * maxDim) / h);
                        h = maxDim;
                    }
                }

                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);

                const fastB64 = canvas.toDataURL('image/jpeg', 0.65);
                
                lastSnapPreview.src = fastB64;
                lastSnapPreview.style.display = "block";

                executeFastAnpr(fastB64, prop);
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    async function executeFastAnpr(b64, property) {
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'scan_npr', photoBytes: b64 })
            });
            const data = await res.json();
            const detectedRego = data && data.rego ? String(data.rego).trim().toUpperCase() : "";

            if (detectedRego) {
                triggerGreenOverlay(detectedRego);
                statusDiv.innerText = `✔ MARKED ${detectedRego}`;
                sendMarkToServer(detectedRego, property, b64);
                isProcessing = false;
            } else {
                triggerRedOverlay("NO PLATE DETECTED");
                pendingFailedPhoto = b64;
                openManualModal();
                isProcessing = false;
            }
        } catch(err) {
            triggerRedOverlay("SCAN ERROR");
            pendingFailedPhoto = b64;
            openManualModal();
            isProcessing = false;
        }
    }

    function sendMarkToServer(rego, property, photoBytes) {
        localStorage.setItem('last_property', property);
        const payload = {
            action: 'log_mark',
            property: property,
            rego: rego,
            photoBytes: photoBytes,
            timestamp: new Date().toISOString()
        };

        fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
        }).then(() => {
            fetchMarkingLogs(true);
        }).catch(() => {});
    }

    function openManualModal() {
        manualRegoModal.style.display = "flex";
        manualRegoInput.value = "";
        setTimeout(() => manualRegoInput.focus(), 150);
    }

    function cancelManualMark() {
        manualRegoModal.style.display = "none";
        pendingFailedPhoto = "";
        statusDiv.innerText = "READY";
    }

    function submitManualMark() {
        const manualRego = manualRegoInput.value.trim().toUpperCase();
        if (!manualRego || manualRego.length < 2) return;

        const property = propertySelect.value;
        manualRegoModal.style.display = "none";

        triggerGreenOverlay(manualRego);
        statusDiv.innerText = `✔ MARKED ${manualRego}`;
        sendMarkToServer(manualRego, property, pendingFailedPhoto);
        pendingFailedPhoto = "";
    }

    function triggerGreenOverlay(rego) {
        greenText.innerText = rego || "MARKED";
        greenOverlay.classList.add('show');
        if (navigator.vibrate) navigator.vibrate(80);
        setTimeout(() => {
            greenOverlay.classList.remove('show');
        }, 700);
    }

    function triggerRedOverlay(msg) {
        redText.innerText = msg || "NO PLATE DETECTED";
        redOverlay.classList.add('show');
        if (navigator.vibrate) navigator.vibrate([150, 60, 150]);
        setTimeout(() => {
            redOverlay.classList.remove('show');
        }, 700);
    }

    /* MARK LOG FETCH & RENDER ENGINE */
    async function fetchMarkingLogs(silent = false) {
        const container = document.getElementById('propertyTilesList');
        if (!silent) container.innerHTML = '<div style="text-align:center; padding:20px; color:#888;">Refreshing records...</div>';

        try {
            const res = await fetch(GOOGLE_SCRIPT_URL + "?action=get_marking_log");
            if (res.ok) {
                markingLogCache = await res.json();
                document.getElementById('totalMarksBadge').innerText = markingLogCache.length;
                renderPropertyTiles();
            }
        } catch(e) {
            if (!silent) container.innerHTML = '<div style="text-align:center; padding:20px; color:#ff1744;">Error loading log.</div>';
        }
    }

    function renderPropertyTiles() {
        const container = document.getElementById('propertyTilesList');
        if (!markingLogCache || markingLogCache.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:30px; color:#888; font-weight:800;">NO ACTIVE MARKS RECORDED</div>';
            return;
        }

        const propMap = {};
        markingLogCache.forEach(item => {
            const p = item.property || "GENERAL";
            propMap[p] = (propMap[p] || 0) + 1;
        });

        const sorted = Object.keys(propMap).sort();
        container.innerHTML = sorted.map(prop => `
            <div class="prop-tile" onclick="openPropertyVehicles('${prop.replace(/'/g, "\\'")}')">
                <div class="prop-tile-name">${prop}</div>
                <div class="prop-tile-count">${propMap[prop]}</div>
            </div>
        `).join('');
    }

    function openPropertyVehicles(propName) {
        activeSelectedProperty = propName;
        document.getElementById('selectedPropLabel').innerText = propName;
        
        const filtered = markingLogCache.filter(m => (m.property || "GENERAL") === propName);
        document.getElementById('propCountLabel').innerText = `${filtered.length} marked`;

        const container = document.getElementById('vehicleCardsList');
        container.innerHTML = filtered.map(v => `
            <div class="v-card" onclick="openEditModal(${v.rowIdx})">
                ${v.imageUrl ? `<img src="${v.imageUrl}" class="v-thumb" loading="lazy">` : `<div class="v-thumb" style="display:flex;align-items:center;justify-content:center;font-size:10px;color:#555;">NO PIC</div>`}
                <div class="v-info">
                    <div class="v-row-1">
                        <span class="v-rego">${v.rego}</span>
                        <span class="v-pass ${v.pass === 'YES' ? 'pass-y' : 'pass-n'}">${v.pass === 'YES' ? 'PASS ACTIVE' : 'NO PASS'}</span>
                    </div>
                    <div class="v-desc">
                        ${[v.colour, v.make, v.model].filter(Boolean).join(' ') || 'Unknown Vehicle'} • ${v.bodyType || 'Sedan'}
                    </div>
                    <div class="v-times">
                        <span>Marked: ${v.markedTime}</span>
                        <span>Expires: ${v.expiryTime}</span>
                    </div>
                </div>
                <div style="font-size:16px; color:#666;">✏️</div>
            </div>
        `).join('');

        showView('vehicles');
    }

    /* EDIT MODAL */
    function openEditModal(rowIdx) {
        const item = markingLogCache.find(v => v.rowIdx === rowIdx);
        if (!item) return;

        document.getElementById('mRowIdx').value = item.rowIdx;
        document.getElementById('mOrigRego').value = item.rego;
        document.getElementById('mMarkedTime').innerText = item.markedTime;
        document.getElementById('mExpiryTime').innerText = item.expiryTime;

        const propSel = document.getElementById('mProperty');
        propSel.innerHTML = "";
        
        const allProps = propertyListCache.length > 0 ? propertyListCache : [{ name: item.property }];
        allProps.forEach(p => {
            const pName = (typeof p === 'object' && p !== null) ? (p.name || p.property || p[0] || Object.values(p)[0]) : p;
            if (pName) {
                const opt = document.createElement('option');
                opt.value = pName;
                opt.innerText = pName;
                if (pName.toUpperCase() === (item.property || "").toUpperCase()) opt.selected = true;
                propSel.appendChild(opt);
            }
        });

        document.getElementById('mRego').value = item.rego;
        document.getElementById('mMake').value = item.make || "";
        document.getElementById('mModel').value = item.model || "";
        document.getElementById('mColour').value = item.colour || "Silver";
        document.getElementById('mBodyType').value = item.bodyType || "Sedan";

        document.getElementById('editModal').style.display = 'flex';
    }

    function closeEditModal() {
        document.getElementById('editModal').style.display = 'none';
    }

    async function saveMarkEdit(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSaveMark');
        btn.innerText = "SAVING...";
        btn.disabled = true;

        const payload = {
            action: "update_mark_details",
            rowIdx: document.getElementById('mRowIdx').value,
            origRego: document.getElementById('mOrigRego').value,
            property: document.getElementById('mProperty').value,
            rego: document.getElementById('mRego').value,
            make: document.getElementById('mMake').value,
            model: document.getElementById('mModel').value,
            colour: document.getElementById('mColour').value,
            bodyType: document.getElementById('mBodyType').value
        };

        try {
            const res = await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });
            const result = await res.json();
            if (result.status === "SUCCESS") {
                closeEditModal();
                await fetchMarkingLogs();
                if (activeSelectedProperty) {
                    openPropertyVehicles(payload.property || activeSelectedProperty);
                }
            } else {
                alert("Error updating mark: " + (result.message || "Failed"));
            }
        } catch(err) {
            alert("Connection error: " + err.message);
        } finally {
            btn.innerText = "SAVE CHANGES ✔";
            btn.disabled = false;
        }
    }
</script>
