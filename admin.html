<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>ADMIN</title>
    
    <link rel="apple-touch-icon" href="icon-mark.png?v=1002">
    <link rel="icon" type="image/png" href="icon-mark.png?v=1002">

    <style>
        :root {
            --c-mark: #2979ff;
            --c-run: #ffab00;
            --c-tow: #ff1744;
            --c-admin: #ab47bc;
            --c-yard: #00b0ff;
            --c-rel: #00e676;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body { 
            background: #121212; 
            color: #fff; 
            min-height: 100vh; 
            padding: 12px; 
            padding-top: max(16px, env(safe-area-inset-top));
            padding-bottom: max(40px, env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Benchmark Header Box */
        .header-box { display: flex; align-items: center; justify-content: center; position: relative; width: 100%; max-width: 440px; margin: 0 auto 12px auto; flex-shrink: 0; }
        .header-box h1 { margin: 0; font-size: 38px; font-weight: 900; color: var(--c-admin); letter-spacing: 2px; text-align: center; line-height: 1.2; padding-top: 4px; }
        .icon-btn { position: absolute; right: 0; background: #2a2a2a; border: 1px solid #444; border-radius: 10px; font-size: 18px; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; }
        .icon-btn:active { transform: scale(0.92); }

        /* Benchmark 3x2 Grid Navigation */
        .nav-grid-3x2 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; max-width: 440px; margin: 0 auto 12px auto; flex-shrink: 0; }
        .nav-tile { height: 38px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; text-decoration: none; color: #000; text-transform: uppercase; letter-spacing: 0.5px; }
        .nav-tile:active { transform: scale(0.96); }
        .t-mark  { background: var(--c-mark); color: #fff; }
        .t-run   { background: var(--c-run); color: #000; }
        .t-tow   { background: var(--c-tow); color: #fff; }
        .t-admin { background: var(--c-admin); color: #fff; box-shadow: 0 0 0 2px #fff; }
        .t-yard  { background: var(--c-yard); color: #000; }
        .t-rel   { background: var(--c-rel); color: #000; }

        /* Sub-Nav Switcher */
        .sub-nav-bar { display: flex; width: 100%; max-width: 440px; background: #1e1e1e; border-radius: 10px; border: 1px solid #333; margin-bottom: 12px; overflow: hidden; flex-shrink: 0; }
        .sub-tab { flex: 1; height: 40px; border: none; background: transparent; color: #888; font-size: 13px; font-weight: 900; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; transition: all 0.2s; }
        .sub-tab.active { background: var(--c-admin); color: #fff; }

        /* Search & Actions */
        .search-bar-wrap { width: 100%; max-width: 440px; margin: 0 auto 10px auto; display: flex; gap: 8px; flex-shrink: 0; }
        .search-input { flex: 1; height: 44px; background: #1e1e1e; border: 1px solid #333; border-radius: 10px; padding: 0 12px; color: #fff; font-size: 14px; font-weight: 700; outline: none; }
        .search-input:focus { border-color: var(--c-admin); }
        .btn-action-primary { height: 44px; padding: 0 16px; background: #00e676; color: #000; border: none; border-radius: 10px; font-weight: 900; font-size: 12px; cursor: pointer; text-transform: uppercase; white-space: nowrap; }
        
        .list-container { width: 100%; max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; flex: 1; overflow-y: auto; padding-bottom: 20px; }

        /* Passes: Group Tile (Blue) */
        .pass-group-tile { background: #1e1e1e; border: 1px solid #333; border-radius: 12px; padding: 14px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .pass-group-name { font-size: 16px; font-weight: 900; color: #fff; text-transform: uppercase; }
        .pass-group-count { background: #2979ff; color: #fff; font-size: 14px; font-weight: 900; padding: 4px 12px; border-radius: 8px; }

        /* Passes: Vehicle Detail Card */
        .pass-detail-card { background: #1e1e1e; border: 1px solid #333; border-left: 5px solid #ab47bc; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; }
        .pd-row-top { display: flex; justify-content: space-between; align-items: center; }
        .pd-rego { font-family: monospace; font-size: 22px; font-weight: 900; color: #fff; }
        .pd-exp { font-size: 13px; font-weight: 900; color: #ffab00; background: #2a2212; padding: 4px 8px; border-radius: 6px; }
        .pd-origin { font-size: 11px; color: #aaa; font-weight: 700; text-transform: uppercase; margin-top: 4px; }
        .btn-back { background: #2a2a2a; border: 1px solid #444; color: #ffab00; padding: 8px 16px; border-radius: 10px; font-weight: 900; font-size: 12px; cursor: pointer; align-self: flex-start; margin-bottom: 4px; text-transform: uppercase; }

        /* SOLID High-Contrast Property Tiles */
        .prop-tile { 
            border-radius: 12px; 
            padding: 14px; 
            cursor: pointer; 
            display: flex; 
            flex-direction: column; 
            gap: 4px; 
            border: none;
            transition: transform 0.1s ease;
        }
        .prop-tile:active { transform: scale(0.98); }

        /* Solid Green (REL Theme) */
        .tile-green { background: #00e676; color: #000; box-shadow: 0 4px 12px rgba(0, 230, 118, 0.25); }
        .tile-green .prop-tile-name { color: #000; font-weight: 950; }
        .tile-green .prop-tile-addr { color: #1a1a1a; font-weight: 700; }

        /* Solid Orange (RUN Theme) */
        .tile-orange { background: #ffab00; color: #000; box-shadow: 0 4px 12px rgba(255, 171, 0, 0.25); }
        .tile-orange .prop-tile-name { color: #000; font-weight: 950; }
        .tile-orange .prop-tile-addr { color: #222; font-weight: 700; }

        /* Solid Red (TOW Theme) */
        .tile-red { background: #ff1744; color: #fff; box-shadow: 0 4px 12px rgba(255, 23, 68, 0.3); }
        .tile-red .prop-tile-name { color: #fff; font-weight: 950; }
        .tile-red .prop-tile-addr { color: #f0f0f0; font-weight: 700; }

        .prop-tile-name { font-size: 17px; text-transform: uppercase; letter-spacing: 0.5px; }
        .prop-tile-addr { font-size: 12px; }

        /* View Tow Consent Button inside Modal */
        .btn-view-consent {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 44px;
            background: #00b0ff;
            color: #000;
            font-weight: 900;
            font-size: 13px;
            border-radius: 8px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        .btn-view-consent:active { transform: scale(0.98); }

        /* Shared Detail/Edit Fullscreen Sheet */
        .modal-sheet { display: none; position: fixed; inset: 0; background: #121212; z-index: 9999; flex-direction: column; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px; background: #1e1e1e; border-bottom: 1px solid #333; flex-shrink: 0; padding-top: max(16px, env(safe-area-inset-top)); }
        .modal-title { font-size: 16px; font-weight: 900; color: var(--c-admin); text-transform: uppercase; }
        .btn-close { background: none; border: none; font-size: 24px; color: #aaa; cursor: pointer; line-height: 1; }
        .modal-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px; display: flex; flex-direction: column; gap: 12px; padding-bottom: max(20px, env(safe-area-inset-bottom)); }
        
        .f-field { display: flex; flex-direction: column; gap: 4px; }
        .f-label { font-size: 11px; font-weight: 900; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
        .f-input { width: 100%; height: 44px; background: #242424; border: 1px solid #444; border-radius: 8px; padding: 0 12px; color: #fff; font-size: 15px; font-weight: 700; outline: none; }
        .f-input:focus { border-color: var(--c-admin); }
        .f-rego { font-family: monospace; font-size: 20px; text-transform: uppercase; }

        .modal-footer { padding: 16px; background: #1e1e1e; border-top: 1px solid #333; display: flex; gap: 8px; flex-shrink: 0; padding-bottom: max(16px, env(safe-area-inset-bottom)); }
        .btn-cancel-modal { flex: 1; height: 48px; background: #333; border: none; color: #fff; font-weight: 900; border-radius: 8px; cursor: pointer; text-transform: uppercase; }
        .btn-submit-modal { flex: 2; height: 48px; background: #00e676; border: none; color: #000; font-weight: 900; border-radius: 8px; cursor: pointer; text-transform: uppercase; font-size: 15px; }

        .loading-box { text-align: center; padding: 30px; color: #888; font-weight: 800; font-size: 14px; }
        .wrapper { width: 100%; display: flex; flex-direction: column; flex: 1; }
    </style>
</head>
<body>

<div class="header-box">
    <h1>ADMIN</h1>
    <div class="icon-btn" onclick="refreshActiveTab()">🔄</div>
</div>

<div class="nav-grid-3x2">
    <a href="mark.html" class="nav-tile t-mark">MARK</a>
    <a href="run.html" class="nav-tile t-run">RUN</a>
    <a href="tow.html" class="nav-tile t-tow">TOW</a>
    <a href="admin.html" class="nav-tile t-admin">ADMIN</a>
    <a href="yard.html" class="nav-tile t-yard">YARD</a>
    <a href="release.html" class="nav-tile t-rel">REL</a>
</div>

<div class="sub-nav-bar">
    <button class="sub-tab active" id="tabBtnPasses" onclick="switchAdminTab('passes')">🎫 PASSES (<span id="lblPassCount">0</span>)</button>
    <button class="sub-tab" id="tabBtnProps" onclick="switchAdminTab('props')">🏢 PROPERTIES (<span id="lblPropCount">0</span>)</button>
</div>

<!-- ==================== VIEW 1: PASSES ==================== -->
<div id="viewPasses" class="wrapper" style="display:flex;">
    <div class="search-bar-wrap">
        <input type="text" id="passSearch" class="search-input" placeholder="Search plate or property..." oninput="filterPassList()">
        <button class="btn-action-primary" onclick="openIssuePassModal()">➕ ISSUE PASS</button>
    </div>
    <div class="list-container" id="passList">
        <div class="loading-box">Loading active passes...</div>
    </div>
</div>

<!-- ==================== VIEW 2: PROPERTIES ==================== -->
<div id="viewProps" class="wrapper" style="display:none;">
    <div class="search-bar-wrap">
        <input type="text" id="propSearch" class="search-input" placeholder="Search property name..." oninput="filterPropList()">
        <button class="btn-action-primary" onclick="openPropertyDetail(-1)">➕ NEW PROPERTY</button>
    </div>
    <div class="list-container" id="propList">
        <div class="loading-box">Loading properties...</div>
    </div>
</div>

<!-- ==================== PASS MODAL ==================== -->
<div id="passModal" class="modal-sheet">
    <div class="modal-header">
        <div class="modal-title" id="passModalTitle">ISSUE VISITOR PASS</div>
        <button class="btn-close" onclick="closeModal('passModal')">✕</button>
    </div>
    <form class="modal-body" onsubmit="submitPassForm(event)">
        <input type="hidden" id="pRowIdx">
        
        <div class="f-field">
            <label class="f-label">Property</label>
            <select id="pProperty" class="f-input" required></select>
        </div>

        <div class="f-field">
            <label class="f-label">Vehicle Registration</label>
            <input type="text" id="pRego" class="f-input f-rego" placeholder="e.g. 790WSY" required>
        </div>

        <div class="f-field">
            <label class="f-label">Duration</label>
            <select id="pDuration" class="f-input">
                <option value="1">1 Day</option>
                <option value="2">2 Days</option>
                <option value="3">3 Days</option>
                <option value="7">7 Days (1 Week)</option>
                <option value="14">14 Days (2 Weeks)</option>
                <option value="30">30 Days (1 Month)</option>
            </select>
        </div>

        <div class="f-field">
            <label class="f-label">Notes (Origin / Bay / Name)</label>
            <input type="text" id="pNotes" class="f-input" placeholder="e.g. Unit 302 / Bay 4">
        </div>
    </form>
    <div class="modal-footer">
        <button type="button" class="btn-cancel-modal" onclick="closeModal('passModal')">Cancel</button>
        <button type="submit" id="btnSavePass" class="btn-submit-modal" onclick="document.querySelector('#passModal form').requestSubmit()">CONFIRM PASS ✔</button>
    </div>
</div>

<!-- ==================== PROPERTY MODAL ==================== -->
<div id="propModal" class="modal-sheet">
    <div class="modal-header">
        <div class="modal-title" id="propModalTitle">EDIT PROPERTY</div>
        <button class="btn-close" onclick="closeModal('propModal')">✕</button>
    </div>
    <div class="modal-body" id="propFormFields"></div>
    <div class="modal-footer">
        <button type="button" class="btn-cancel-modal" onclick="closeModal('propModal')">Cancel</button>
        <button type="button" id="btnSaveProp" class="btn-submit-modal" onclick="submitPropertyForm()">SAVE PROPERTY ✔</button>
    </div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";

    let activeTab = "passes";
    let passesCache = [];
    let propertiesCache = [];
    let propHeaders = [];
    let currentPropRowIdx = null;
    let activePropFilter = null;

    window.addEventListener('load', () => {
        const params = new URLSearchParams(window.location.search);
        if (params.get('tab') === 'props' || params.get('tab') === 'properties') {
            switchAdminTab('props');
        } else {
            loadPasses();
            loadPropertiesDropdown();
        }
    });

    function switchAdminTab(tab) {
        activeTab = tab;
        document.getElementById('tabBtnPasses').classList.toggle('active', tab === 'passes');
        document.getElementById('tabBtnProps').classList.toggle('active', tab === 'props');
        document.getElementById('viewPasses').style.display = tab === 'passes' ? 'flex' : 'none';
        document.getElementById('viewProps').style.display = tab === 'props' ? 'flex' : 'none';

        if (tab === 'passes') {
            loadPasses();
        } else {
            loadPropertiesData();
        }
    }

    function refreshActiveTab() {
        if (activeTab === 'passes') loadPasses();
        else loadPropertiesData();
    }

    function closeModal(id) {
        document.getElementById(id).style.display = 'none';
    }

    /* ==================== PASSES CONTROLLER ==================== */
    async function loadPasses() {
        const list = document.getElementById('passList');
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL + "?action=get_passes");
            passesCache = await res.json();
            document.getElementById('lblPassCount').innerText = passesCache.length;
            renderPassList(passesCache);
        } catch(e) {
            list.innerHTML = `<div class="loading-box" style="color:#ff1744;">Error loading passes.</div>`;
        }
    }

    function renderPassList(items) {
        const list = document.getElementById('passList');
        if (!items || items.length === 0) {
            list.innerHTML = `<div class="loading-box">NO ACTIVE PASSES</div>`;
            return;
        }

        if (activePropFilter) {
            const filtered = items.filter(p => (p.property || 'GENERAL').toUpperCase() === activePropFilter);
            
            let html = `<button class="btn-back" onclick="clearPassFilter()">◀ BACK TO PROPERTIES</button>`;
            html += `<div style="font-size:15px; font-weight:900; color:#ab47bc; margin:4px 0 10px 0; text-transform:uppercase;">${activePropFilter} (${filtered.length})</div>`;
            
            html += filtered.map(p => {
                const parts = (p.expiry || "").split(/[-\s]/);
                const shortExp = parts.length >= 3 ? `${parts[0]} ${parts[1]} ${parts[2]}` : (p.expiry || "N/A");
                return `
                <div class="pass-detail-card" onclick="openEditPassModal(${p.rowIdx})">
                    <div class="pd-row-top">
                        <span class="pd-rego">${p.rego}</span>
                        <span class="pd-exp">EXP: ${shortExp}</span>
                    </div>
                    <div class="pd-origin">ISSUED: ${p.notes || 'MANAGER PORTAL'}</div>
                </div>
            `}).join('');
            list.innerHTML = html;
        } else {
            const grouped = {};
            items.forEach(p => {
                const prop = (p.property || 'GENERAL').toUpperCase();
                grouped[prop] = (grouped[prop] || 0) + 1;
            });
            
            const sortedProps = Object.keys(grouped).sort();
            list.innerHTML = sortedProps.map(prop => `
                <div class="pass-group-tile" onclick="setPassFilter('${prop.replace(/'/g, "\\'")}')">
                    <span class="pass-group-name">${prop}</span>
                    <span class="pass-group-count">${grouped[prop]}</span>
                </div>
            `).join('');
        }
    }

    function setPassFilter(propName) {
        activePropFilter = propName;
        filterPassList();
    }

    function clearPassFilter() {
        activePropFilter = null;
        document.getElementById('passSearch').value = "";
        filterPassList();
    }

    function filterPassList() {
        const q = document.getElementById('passSearch').value.trim().toUpperCase();
        let filtered = passesCache;
        if (q) {
            filtered = passesCache.filter(p => 
                (p.rego && p.rego.includes(q)) || (p.property && p.property.toUpperCase().includes(q))
            );
            activePropFilter = "SEARCH RESULTS"; 
        } else if (activePropFilter === "SEARCH RESULTS") {
            activePropFilter = null;
        }
        renderPassList(filtered);
    }

    async function loadPropertiesDropdown() {
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL + "?action=get_properties");
            const data = await res.json();
            const select = document.getElementById('pProperty');
            select.innerHTML = "<option value=''>-- SELECT PROPERTY --</option>";
            data.forEach(p => {
                const name = typeof p === 'object' ? p.name : p;
                if (name) {
                    const opt = document.createElement('option');
                    opt.value = name;
                    opt.innerText = name;
                    select.appendChild(opt);
                }
            });
        } catch(e) {}
    }

    function openIssuePassModal() {
        document.getElementById('passModalTitle').innerText = "ISSUE VISITOR PASS";
        document.getElementById('pRowIdx').value = "";
        document.getElementById('pRego').value = "";
        document.getElementById('pNotes').value = "";
        document.getElementById('pDuration').value = "1";
        document.getElementById('passModal').style.display = 'flex';
    }

    function openEditPassModal(rowIdx) {
        const pass = passesCache.find(p => p.rowIdx === rowIdx);
        if (!pass) return;

        document.getElementById('passModalTitle').innerText = "EDIT PASS: " + pass.rego;
        document.getElementById('pRowIdx').value = pass.rowIdx;
        document.getElementById('pProperty').value = pass.property;
        document.getElementById('pRego').value = pass.rego;
        document.getElementById('pNotes').value = pass.notes || "";
        
        const days = parseInt(pass.duration, 10);
        document.getElementById('pDuration').value = !isNaN(days) ? String(days) : "1";
        
        document.getElementById('passModal').style.display = 'flex';
    }

    async function submitPassForm(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSavePass');
        btn.innerText = "SAVING...";
        btn.disabled = true;

        const rowIdx = document.getElementById('pRowIdx').value;
        const payload = {
            action: rowIdx ? "update_pass" : "add_pass",
            rowIdx: rowIdx,
            property: document.getElementById('pProperty').value,
            rego: document.getElementById('pRego').value.trim().toUpperCase(),
            newRego: document.getElementById('pRego').value.trim().toUpperCase(),
            duration: document.getElementById('pDuration').value,
            notes: document.getElementById('pNotes').value.trim()
        };

        try {
            const res = await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });
            const result = await res.json();
            if (result.status === "SUCCESS") {
                closeModal('passModal');
                loadPasses();
            } else {
                alert("Error: " + (result.message || "Failed to save pass"));
            }
        } catch(err) {
            alert("Network connection error.");
        } finally {
            btn.innerText = "CONFIRM PASS ✔";
            btn.disabled = false;
        }
    }

    /* ==================== PROPERTIES CONTROLLER ==================== */
    async function loadPropertiesData() {
        const list = document.getElementById('propList');
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL + "?action=get_all_properties_data");
            const data = await res.json();
            if (data && data.status === "SUCCESS") {
                propHeaders = Array.isArray(data.headers) ? data.headers : [];
                propertiesCache = Array.isArray(data.rows) ? data.rows : [];
                document.getElementById('lblPropCount').innerText = propertiesCache.length;
                renderPropList(propertiesCache);
            } else {
                list.innerHTML = `<div class="loading-box" style="color:#ff1744;">Error loading properties.</div>`;
            }
        } catch(e) {
            console.error("loadPropertiesData error:", e);
            list.innerHTML = `<div class="loading-box" style="color:#ff1744;">Error loading properties: ${e.message}</div>`;
        }
    }

    function formatDateString(str) {
        if (!str) return "";
        const s = String(str);
        if (s.includes("T") && s.includes("Z")) {
            const d = new Date(s);
            if (!isNaN(d.getTime())) {
                const dd = String(d.getDate()).padStart(2, '0');
                const mm = String(d.getMonth() + 1).padStart(2, '0');
                const yyyy = d.getFullYear();
                return `${dd}/${mm}/${yyyy}`;
            }
        }
        return str;
    }

    function parseAustralianDate(str) {
        if (!str) return null;
        if (str instanceof Date) return str;
        const s = String(str).trim();
        if (s.toUpperCase() === "OPEN ENDED") return "OPEN ENDED";
        
        // Handle DD/MM/YYYY or DD-MM-YYYY
        const dmy = s.match(/^(\d{1,2})[\/\.-](\d{1,2})[\/\.-](\d{2,4})/);
        if (dmy) {
            let yr = parseInt(dmy[3], 10);
            if (yr < 100) yr += 2000;
            return new Date(yr, parseInt(dmy[2], 10) - 1, parseInt(dmy[1], 10));
        }

        // Handle DD Mon YY (e.g., "12 Mar 27" or "19 Aug 21")
        const monMap = { JAN:0, FEB:1, MAR:2, APR:3, MAY:4, JUN:5, JUL:6, AUG:7, SEP:8, OCT:9, NOV:10, DEC:11 };
        const dMonY = s.match(/^(\d{1,2})\s+([A-Za-z]{3})\s+(\d{2,4})/);
        if (dMonY) {
            let yr = parseInt(dMonY[3], 10);
            if (yr < 100) yr += 2000;
            const m = monMap[dMonY[2].toUpperCase()];
            if (m !== undefined) return new Date(yr, m, parseInt(dMonY[1], 10));
        }

        const fallback = new Date(s);
        return isNaN(fallback.getTime()) ? null : fallback;
    }

    function renderPropList(items) {
        const list = document.getElementById('propList');
        if (!items || !Array.isArray(items) || items.length === 0) {
            list.innerHTML = `<div class="loading-box">NO PROPERTIES RECORDED</div>`;
            return;
        }

        const getIdx = (name, fallback) => {
            if (!Array.isArray(propHeaders)) return fallback;
            const idx = propHeaders.findIndex(h => h && String(h).toUpperCase().includes(name.toUpperCase()));
            return idx !== -1 ? idx : fallback;
        };

        const authNameIdx  = getIdx("Auth Person Name", 4);
        const authPhoneIdx = getIdx("Auth Person Phone", 6);
        const authEmailIdx = getIdx("Auth Person Email", 7);
        const saDateIdx    = getIdx("SA Date", 13);
        
        // Match TC Link or legacy TC On File
        let tcLinkIdx = getIdx("TC LINK", -1);
        if (tcLinkIdx === -1) tcLinkIdx = getIdx("TC ON FILE", 15);

        const tcExpIdx = getIdx("TC EXPIRY", 17);

        const now = new Date();
        const oneMonthFromNow = new Date(now.getTime() + (30 * 24 * 60 * 60 * 1000));

        list.innerHTML = items.map((r, idx) => {
            const vals = r.values || [];
            const name = String(vals[0] || "Unnamed").trim();
            const addr = String(vals[1] || "").trim();
            const suburb = String(vals[2] || "").trim();

            let displayLoc = addr;
            if (suburb) {
                displayLoc = displayLoc ? `${displayLoc}, ${suburb}` : suburb;
            }
            if (!displayLoc) displayLoc = "No Address Provided";
            
            const authName  = String(vals[authNameIdx] || "").trim();
            const authPhone = String(vals[authPhoneIdx] || "").trim();
            const authEmail = String(vals[authEmailIdx] || "").trim();
            const saDateRaw = String(vals[saDateIdx] || "").trim();
            const tcLinkVal = String(vals[tcLinkIdx] || "").trim();
            const tcExpRaw  = String(vals[tcExpIdx] || "").trim();

            const parsedExpiry = parseAustralianDate(tcExpRaw);

            // 1. RED CONDITIONS:
            // - TC Expiry is completely blank
            // - TC Expiry is less than 1 month away (and not "Open Ended")
            // - SA Date is completely blank
            let isRed = false;
            if (!tcExpRaw || !saDateRaw) {
                isRed = true;
            } else if (parsedExpiry !== "OPEN ENDED") {
                if (!parsedExpiry || parsedExpiry < oneMonthFromNow) {
                    isRed = true;
                }
            }

            let statusClass = "tile-green";
            if (isRed) {
                statusClass = "tile-red";
            } else {
                // 2. ORANGE CONDITIONS:
                // Missing any of: Auth Person Name, Phone, Email, or TC Link is NO / blank
                const tcUp = tcLinkVal.toUpperCase();
                const hasValidConsent = tcLinkVal.includes("http://") || tcLinkVal.includes("https://") || tcLinkVal.includes("drive.google") || tcUp === "YES";

                if (!authName || !authPhone || !authEmail || !hasValidConsent || tcUp === "NO") {
                    statusClass = "tile-orange";
                }
            }

            return `
                <div class="prop-tile ${statusClass}" onclick="openPropertyDetail(${idx})">
                    <div class="prop-tile-name">${name}</div>
                    <div class="prop-tile-addr">${displayLoc}</div>
                </div>
            `;
        }).join('');
    }

    function filterPropList() {
        const q = document.getElementById('propSearch').value.trim().toUpperCase();
        if (!q) { renderPropList(propertiesCache); return; }
        const filtered = propertiesCache.filter(r => 
            String(r.values[0] || '').toUpperCase().includes(q) || 
            String(r.values[1] || '').toUpperCase().includes(q) ||
            String(r.values[2] || '').toUpperCase().includes(q)
        );
        renderPropList(filtered);
    }

    function openPropertyDetail(idx) {
        const fieldsContainer = document.getElementById('propFormFields');
        let vals = [];

        if (idx === -1) {
            currentPropRowIdx = -1;
            document.getElementById('propModalTitle').innerText = "ADD NEW PROPERTY";
            vals = new Array(propHeaders.length || 20).fill("");
        } else {
            const rowData = propertiesCache[idx];
            currentPropRowIdx = rowData.rowIdx;
            document.getElementById('propModalTitle').innerText = String(rowData.values[0] || "EDIT PROPERTY");
            vals = rowData.values;
        }

        fieldsContainer.innerHTML = propHeaders.map((header, colIdx) => {
            let val = String(vals[colIdx] || "");
            const cleanHeader = String(header || "").trim().toUpperCase();
            
            // If the column is TC LINK and contains a URL, add the prominent blue view button
            let extraHtml = "";
            if ((cleanHeader.includes("TC LINK") || cleanHeader.includes("TC ON FILE")) && (val.includes("http://") || val.includes("https://") || val.includes("drive.google"))) {
                extraHtml = `<a href="${val}" target="_blank" rel="noopener noreferrer" class="btn-view-consent">📂 VIEW TOW CONSENT</a>`;
            }

            val = formatDateString(val).replace(/"/g, '&quot;');
            return `
                <div class="f-field">
                    <label class="f-label">${header || `Column ${colIdx + 1}`}</label>
                    ${extraHtml}
                    <input type="text" class="f-input" id="col_${colIdx}" value="${val}">
                </div>
            `;
        }).join('');

        document.getElementById('propModal').style.display = 'flex';
    }

    async function submitPropertyForm() {
        const btn = document.getElementById('btnSaveProp');
        btn.innerText = "SAVING...";
        btn.disabled = true;

        const newValues = [];
        for (let i = 0; i < propHeaders.length; i++) {
            const el = document.getElementById('col_' + i);
            newValues.push(el ? el.value.trim() : "");
        }

        const payload = {
            action: currentPropRowIdx === -1 ? "add_new_property" : "update_property_data",
            rowIdx: currentPropRowIdx,
            values: newValues
        };

        try {
            const res = await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });
            const result = await res.json();
            if (result.status === "SUCCESS") {
                closeModal('propModal');
                loadPropertiesData();
                loadPropertiesDropdown();
            } else {
                alert("Error: " + (result.message || "Failed to save"));
            }
        } catch(err) {
            alert("Network connection error.");
        } finally {
            btn.innerText = "SAVE PROPERTY ✔";
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
