<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

    <title>TOW</title>
    
    <link rel="apple-touch-icon" href="icon-tow.png?v=10003">
    <link rel="icon" type="image/png" href="icon-tow.png?v=10003">
    <link rel="manifest" href="manifest-tow.json?v=10003">

    <style>
        :root {
            --c-mark: #2979ff;
            --c-run: #ffab00;
            --c-tow: #ff1744;
            --c-pass: #ab47bc;
            --c-yard: #00b0ff;
            --c-rel: #00e676;
        }
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            margin: 0; padding: 14px; background: #121212; color: #fff; 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }
        
        .header-box { display: flex; align-items: center; justify-content: center; position: relative; width: 100%; max-width: 440px; margin-bottom: 10px; }
        .header-box h1 { margin: 0; font-size: 38px; font-weight: 900; color: #ff1744; letter-spacing: 2px; text-align: center; }
        .icon-btn { position: absolute; right: 0; background: #2a2a2a; border: 1px solid #444; border-radius: 10px; font-size: 20px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; }

        .sync-badge {
            background: #ffab00; color: #000; font-weight: 900; font-size: 12px;
            padding: 6px 14px; border-radius: 20px; margin-bottom: 10px; display: none;
            cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
        }

        /* 3x2 Grid Navigation */
        .nav-grid-3x2 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; max-width: 440px; margin: 0 auto 14px auto; }
        .nav-tile { height: 38px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; text-decoration: none; color: #000; text-transform: uppercase; letter-spacing: 0.5px; }
        .nav-tile:active { transform: scale(0.96); }
        .t-mark { background: var(--c-mark); color: #fff; }
        .t-run  { background: var(--c-run); color: #000; }
        .t-tow  { background: var(--c-tow); color: #fff; box-shadow: 0 0 0 2px #fff; }
        .t-pass { background: var(--c-pass); color: #fff; }
        .t-yard { background: var(--c-yard); color: #000; }
        .t-rel  { background: var(--c-rel); color: #000; }

        .card { background: #1e1e1e; border-radius: 18px; padding: 18px; width: 100%; max-width: 440px; border: 1px solid #333; margin-bottom: 16px; }
        
        label { font-size: 12px; text-transform: uppercase; color: #aaa; display: block; margin-top: 10px; font-weight: 900; letter-spacing: 1px; }
        input, select {
            width: 100%; height: 50px; padding: 0 12px; border-radius: 10px; border: 1px solid #444;
            background: #2a2a2a; color: #fff; font-size: 20px; font-weight: 900; margin-top: 4px; outline: none;
            -webkit-appearance: none; transition: border 0.2s ease, background 0.2s ease, color 0.2s ease;
        }

        /* PLACEHOLDER STYLING */
        ::placeholder { color: #888888 !important; opacity: 1; }
        input::placeholder, textarea::placeholder { color: #888888 !important; opacity: 1; }

        select option { background: #2a2a2a; color: #ffffff; }
        select option[value=""] { color: #888888; }

        /* LIVE VALIDATION STYLES */
        .field-missing { border: 2px solid #ffab00 !important; background: #332600 !important; }
        .field-valid { border: 1px solid #444 !important; background: #2a2a2a !important; }

        .row-rego-state { display: flex; gap: 10px; }
        .row-rego-state > div:first-child { flex: 2; }
        .row-rego-state > div:last-child { flex: 1; }

        .row-2 { display: flex; gap: 10px; }
        .row-2 > div { flex: 1; }

        .open-cam-btn {
            background: #2a1215; border: 2px dashed #ff1744; color: #ff1744;
            font-size: 16px; font-weight: 900; border-radius: 12px; padding: 16px;
            width: 100%; margin-top: 14px; cursor: pointer; text-align: center;
            letter-spacing: 1px; text-transform: uppercase; transition: border 0.2s ease, background 0.2s ease;
        }
        .open-cam-btn:active { background: #3d1b20; transform: scale(0.98); }

        .photo-count-banner {
            font-size: 13px; font-weight: 900; color: #00e676; margin-top: 10px;
            text-align: center; text-transform: uppercase; letter-spacing: 1px;
        }

        .thumb-gallery { display: flex; gap: 10px; margin-top: 10px; overflow-x: auto; padding-bottom: 6px; }
        .thumb-container { position: relative; flex-shrink: 0; }
        .thumb-img { width: 78px; height: 78px; border-radius: 10px; object-fit: cover; border: 2px solid #ff1744; cursor: pointer; }
        .thumb-del {
            position: absolute; top: -6px; right: -6px; background: #ff1744; color: #fff;
            border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center;
            justify-content: center; font-size: 12px; font-weight: 900; border: 2px solid #1e1e1e;
        }

        .submit-btn {
            background: #ff1744; color: #fff; font-weight: 900; border: none; border-radius: 14px;
            height: 62px; font-size: 26px; width: 100%; margin-top: 18px; cursor: pointer; letter-spacing: 2px;
            transition: opacity 0.3s ease;
        }
        .submit-btn:active { transform: scale(0.98); }
        .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }

        #status { text-align: center; font-weight: 900; font-size: 15px; margin-top: 12px; min-height: 24px; color: #ffab00; }

        /* FULLSCREEN SUCCESS OVERLAY */
        #successOverlay {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(0, 230, 118, 0.95); z-index: 999999; flex-direction: column;
            align-items: center; justify-content: center; text-align: center;
        }
        #successOverlay h1 { font-size: 48px; font-weight: 900; color: #000; margin: 0 0 10px 0; letter-spacing: 2px; text-transform: uppercase; }
        #successOverlay p { font-size: 18px; font-weight: 800; color: #111; margin: 0 0 40px 0; max-width: 80%; }
        .ok-btn {
            background: #000; color: #00e676; font-size: 32px; font-weight: 900; border: none;
            border-radius: 16px; padding: 20px 60px; cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            letter-spacing: 3px; width: 250px;
        }
        .ok-btn:active { transform: scale(0.95); }

        /* FULLSCREEN CAMERA MODAL */
        .cam-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; z-index: 99999; flex-direction: column;
        }
        .cam-modal.show { display: flex; }
        
        .cam-header {
            height: 55px; background: rgba(0,0,0,0.8); display: flex;
            align-items: center; justify-content: space-between; padding: 0 16px;
            position: absolute; top: 0; left: 0; width: 100%; z-index: 10;
        }
        .cam-done-btn {
            background: #00e676; color: #000; font-size: 14px; font-weight: 900;
            padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer;
        }
        .cam-counter { font-size: 15px; font-weight: 900; color: #ffab00; }

        .cam-viewfinder { flex: 1; width: 100%; height: 100%; position: relative; overflow: hidden; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }

        .cam-torch-btn {
            position: absolute; top: 70px; right: 16px; background: rgba(0,0,0,0.75);
            border: 1.5px solid #ffab00; color: #ffab00; padding: 6px 14px; border-radius: 20px;
            font-size: 11px; font-weight: 900; cursor: pointer; z-index: 20; letter-spacing: 0.5px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .cam-snap-btn {
            position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
            width: 88px; height: 88px; background: #ff1744; border: 5px solid #fff; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 25px rgba(0,0,0,0.8); cursor: pointer; z-index: 10;
        }
        .cam-snap-btn:active { transform: translateX(-50%) scale(0.90); }
        .cam-snap-inner { width: 64px; height: 64px; border-radius: 50%; border: 3px solid #000; }
    </style>
</head>
<body>

<div class="header-box">
    <h1>TOW</h1>
    <div class="icon-btn" id="refreshBtn">🔄</div>
</div>

<div class="sync-badge" id="syncBadge" onclick="processOfflineQueue()">⚡ BASEMENT QUEUE: <span id="queueCount">0</span> (SAVED LOCALLY)</div>

<div class="nav-grid-3x2">
    <a href="mark.html" class="nav-tile t-mark">MARK</a>
    <a href="run.html" class="nav-tile t-run">RUN</a>
    <a href="tow.html" class="nav-tile t-tow">TOW</a>
    <a href="passes.html" class="nav-tile t-pass">PASS</a>
    <a href="yard.html" class="nav-tile t-yard">YARD</a>
    <a href="release.html" class="nav-tile t-rel">REL</a>
</div>

<div class="card">
    <label>PROPERTY</label>
    <select id="propertySelect">
        <option value="" disabled selected>PROPERTY</option>
    </select>

    <div class="row-rego-state">
        <div>
            <label>REGO</label>
            <input type="text" id="regoInput" placeholder="REGO" style="color:#ff1744; text-transform:uppercase;">
        </div>
        <div>
            <label>STATE</label>
            <select id="stateSelect" style="color:#ffab00;">
                <option value="QLD" selected>QLD</option>
                <option value="NSW">NSW</option>
                <option value="VIC">VIC</option>
                <option value="NT">NT</option>
                <option value="SA">SA</option>
                <option value="TAS">TAS</option>
                <option value="ACT">ACT</option>
                <option value="WA">WA</option>
            </select>
        </div>
    </div>

    <div class="row-2">
        <div>
            <label>MAKE</label>
            <select id="makeSelect" onchange="checkMakeOther(this)">
                <option value="" disabled selected>MAKE</option>
                <option value="Toyota">Toyota</option>
                <option value="Holden">Holden</option>
                <option value="Ford">Ford</option>
                <option value="Hyundai">Hyundai</option>
                <option value="Nissan">Nissan</option>
                <option value="Mitsubishi">Mitsubishi</option>
                <option value="Mazda">Mazda</option>
                <option value="MG">MG</option>
                <option value="Subaru">Subaru</option>
                <option value="Honda">Honda</option>
                <option value="Volkswagen">Volkswagen</option>
                <option value="Kia">Kia</option>
                <option value="BMW">BMW</option>
                <option value="Mercedes-Benz">Mercedes-Benz</option>
                <option value="Audi">Audi</option>
                <option value="Jeep">Jeep</option>
                <option value="Other">Other</option>
            </select>
            <input type="text" id="makeOtherInput" placeholder="ENTER MAKE" style="display:none; margin-top:4px; font-size:18px;">
        </div>
        <div>
            <label>MODEL</label>
            <input type="text" id="modelInput" placeholder="MODEL">
        </div>
    </div>

    <div class="row-2">
        <div>
            <label>COLOUR</label>
            <select id="colourSelect" onchange="checkColourOther(this)">
                <option value="" disabled selected>COLOUR</option>
                <option value="White">White</option>
                <option value="Black">Black</option>
                <option value="Silver">Silver</option>
                <option value="Grey">Grey</option>
                <option value="Blue">Blue</option>
                <option value="Red">Red</option>
                <option value="Green">Green</option>
                <option value="Yellow">Yellow</option>
                <option value="Gold">Gold</option>
                <option value="Bronze">Bronze</option>
                <option value="Orange">Orange</option>
                <option value="Purple">Purple</option>
                <option value="Brown">Brown</option>
                <option value="Other">Other</option>
            </select>
            <input type="text" id="colourOtherInput" placeholder="ENTER COLOUR" style="display:none; margin-top:4px; font-size:18px;">
        </div>
        <div>
            <label>BODY TYPE</label>
            <select id="bodyTypeSelect">
                <option value="" disabled selected>BODY TYPE</option>
                <option value="Sedan">Sedan</option>
                <option value="Hatchback">Hatchback</option>
                <option value="Station Wagon">Station Wagon</option>
                <option value="Utility">Utility</option>
                <option value="Van">Van</option>
                <option value="Other">Other</option>
            </select>
        </div>
    </div>

    <label>DRIVER / OFFICER</label>
    <select id="officerSelect" onchange="checkOfficerOther(this)">
        <option value="Brian" selected>Brian</option>
        <option value="Brett">Brett</option>
        <option value="Other">Other...</option>
    </select>
    <input type="text" id="officerOtherInput" placeholder="ENTER DRIVER NAME" style="display:none; margin-top:4px; font-size:18px;">

    <!-- CAMERA LAUNCHER -->
    <button type="button" class="open-cam-btn field-missing" id="openCamBtn">📷 CAPTURE CONDITION PHOTOS</button>
    <div class="photo-count-banner" id="photoCountBanner">0 PHOTOS TAKEN</div>
    <div id="compPhotoBanner" style="display:none; font-size:12px; font-weight:900; color:#00e676; text-align:center; margin-top:8px;">✔ SIDE-BY-SIDE VERIFICATION ATTACHED</div>
    <div class="thumb-gallery" id="thumbGallery"></div>

    <button class="submit-btn" id="submitBtn" disabled>LOG TOW</button>
    <div id="status"></div>
</div>

<!-- FULLSCREEN SUCCESS OVERLAY -->
<div id="successOverlay">
    <h1 id="successRego">VEHICLE TOWED</h1>
    <p>Secured and syncing in background.</p>
    <button class="ok-btn" onclick="window.location.href='tow.html';">OK</button>
</div>

<!-- FULLSCREEN VIEW FINDER -->
<div class="cam-modal" id="camModal">
    <div class="cam-header">
        <span class="cam-counter" id="modalCounter">0 PHOTOS</span>
        <button class="cam-done-btn" id="camDoneBtn">DONE ✓</button>
    </div>
    <div class="cam-viewfinder">
        <video id="videoElem" autoplay playsinline></video>
        <button class="cam-torch-btn" id="torchBtn">⚡ FLASH: AUTO</button>
        <div class="cam-snap-btn" id="snapBtn"><div class="cam-snap-inner"></div></div>
    </div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";

    const propertySelect = document.getElementById('propertySelect');
    const regoInput = document.getElementById('regoInput');
    const stateSelect = document.getElementById('stateSelect');
    const makeSelect = document.getElementById('makeSelect');
    const makeOtherInput = document.getElementById('makeOtherInput');
    const modelInput = document.getElementById('modelInput');
    const colourSelect = document.getElementById('colourSelect');
    const colourOtherInput = document.getElementById('colourOtherInput');
    const bodyTypeSelect = document.getElementById('bodyTypeSelect');
    const officerSelect = document.getElementById('officerSelect');
    const officerOtherInput = document.getElementById('officerOtherInput');

    const openCamBtn = document.getElementById('openCamBtn');
    const camModal = document.getElementById('camModal');
    const camDoneBtn = document.getElementById('camDoneBtn');
    const modalCounter = document.getElementById('modalCounter');
    const photoCountBanner = document.getElementById('photoCountBanner');
    const compPhotoBanner = document.getElementById('compPhotoBanner');
    const videoElem = document.getElementById('videoElem');
    const snapBtn = document.getElementById('snapBtn');
    const torchBtn = document.getElementById('torchBtn');
    const thumbGallery = document.getElementById('thumbGallery');
    const submitBtn = document.getElementById('submitBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const statusDiv = document.getElementById('status');
    const syncBadge = document.getElementById('syncBadge');
    const queueCount = document.getElementById('queueCount');
    const successOverlay = document.getElementById('successOverlay');
    const successRego = document.getElementById('successRego');

    let conditionPhotos = [];
    let isSubmitting = false;
    let videoStream = null;
    let videoTrack = null;
    let trackCapabilities = {};
    let targetProperty = "";

    // FLASH STATE: 'auto' | 'torch' | 'off'
    let flashMode = localStorage.getItem('tow_flash_mode') || 'auto';

    (function readUrlParamsNow() {
        const params = new URLSearchParams(window.location.search);
        const urlRego = params.get('rego');
        const urlProp = params.get('prop');
        if (urlRego) regoInput.value = urlRego.trim().toUpperCase();
        if (urlProp) targetProperty = decodeURIComponent(urlProp).trim().toUpperCase();
    })();

    // Synchronize select font colors to match grey placeholders until an option is picked
    function syncDropdownColors() {
        document.querySelectorAll('select').forEach(sel => {
            const updateColor = () => {
                if (!sel.value || sel.value === "") {
                    sel.style.color = "#888888";
                } else if (sel.id === 'stateSelect') {
                    sel.style.color = "#ffab00";
                } else {
                    sel.style.color = "#ffffff";
                }
            };
            updateColor();
            sel.removeEventListener('change', updateColor);
            sel.addEventListener('change', updateColor);
        });
    }

    window.addEventListener('DOMContentLoaded', () => {
        updateTorchUI();
        loadProperties();
        updateQueueUI();
        checkCompPhoto();
        setupLiveValidation();
        syncDropdownColors();
        window.addEventListener('online', syncPendingTowsInBackground);
        syncPendingTowsInBackground();
        setInterval(syncPendingTowsInBackground, 10000);
    });

    regoInput.addEventListener('input', checkCompPhoto);
    regoInput.addEventListener('change', checkCompPhoto);

    function checkCompPhoto() {
        const rego = regoInput.value.trim().toUpperCase();
        if (compPhotoBanner) {
            if (rego && localStorage.getItem('pending_comp_' + rego)) {
                compPhotoBanner.style.display = 'block';
            } else {
                compPhotoBanner.style.display = 'none';
            }
        }
    }

    refreshBtn.addEventListener('click', () => { window.location.reload(true); });

    function checkMakeOther(s) { 
        makeOtherInput.style.display = s.value === "Other" ? 'block' : 'none'; 
        syncDropdownColors();
    }
    function checkColourOther(s) { 
        colourOtherInput.style.display = s.value === "Other" ? 'block' : 'none'; 
        syncDropdownColors();
    }
    function checkOfficerOther(s) { 
        officerOtherInput.style.display = s.value === "Other" ? 'block' : 'none'; 
        syncDropdownColors();
    }

    async function loadProperties() {
        const cached = localStorage.getItem('cached_properties');
        if (cached) { try { populatePropertiesUI(JSON.parse(cached)); } catch(e) {} }

        try {
            const res = await fetch(GOOGLE_SCRIPT_URL + "?action=get_properties");
            const data = await res.json();
            localStorage.setItem('cached_properties', JSON.stringify(data));
            populatePropertiesUI(data);
        } catch(e) {}
    }

    function populatePropertiesUI(data) {
        if (!Array.isArray(data) || data.length === 0) return;
        propertySelect.innerHTML = '<option value="" disabled selected>PROPERTY</option>';
        data.forEach(p => {
            const propName = (typeof p === 'object' && p !== null) ? (p.name || p.property || p[0] || Object.values(p)[0]) : p;
            if (propName) {
                const opt = document.createElement('option');
                opt.value = propName; opt.innerText = propName;
                if (targetProperty && propName.toUpperCase() === targetProperty) opt.selected = true;
                propertySelect.appendChild(opt);
            }
        });
        validateForm();
        syncDropdownColors();
    }

    // --- LIVE VALIDATION LOGIC ---
    function setupLiveValidation() {
        const inputs = [propertySelect, regoInput, makeSelect, makeOtherInput, modelInput, colourSelect, colourOtherInput, bodyTypeSelect];
        inputs.forEach(elem => {
            if (elem) {
                elem.addEventListener('input', () => { validateForm(); syncDropdownColors(); });
                elem.addEventListener('change', () => { validateForm(); syncDropdownColors(); });
            }
        });
        validateForm();
    }

    function validateForm() {
        let isValid = true;
        function mark(elem, cond) {
            if (!elem) return;
            if (cond) {
                elem.classList.remove('field-missing'); 
                elem.classList.add('field-valid');
            } else {
                elem.classList.remove('field-valid'); 
                elem.classList.add('field-missing');
                isValid = false;
            }
        }

        mark(propertySelect, propertySelect && propertySelect.value !== "");
        mark(regoInput, regoInput && regoInput.value.trim() !== "");
        
        mark(makeSelect, makeSelect && makeSelect.value !== "");
        if (makeSelect && makeSelect.value === "Other") {
            mark(makeOtherInput, makeOtherInput && makeOtherInput.value.trim() !== "");
        }

        mark(modelInput, modelInput && modelInput.value.trim() !== "");
        
        mark(colourSelect, colourSelect && colourSelect.value !== "");
        if (colourSelect && colourSelect.value === "Other") {
            mark(colourOtherInput, colourOtherInput && colourOtherInput.value.trim() !== "");
        }

        mark(bodyTypeSelect, bodyTypeSelect && bodyTypeSelect.value !== "");

        if (conditionPhotos.length === 0) {
            isValid = false;
            openCamBtn.classList.add('field-missing');
        } else {
            openCamBtn.classList.remove('field-missing');
        }

        if (isValid) {
            submitBtn.disabled = false;
            submitBtn.style.opacity = "1";
        } else {
            submitBtn.disabled = true;
            submitBtn.style.opacity = "0.5";
        }
        
        return isValid;
    }

    // --- FULLSCREEN CAMERA CONTROLS ---
    openCamBtn.addEventListener('click', async () => {
        camModal.classList.add('show');
        await startCamera();
    });

    camDoneBtn.addEventListener('click', () => {
        stopCamera();
        camModal.classList.remove('show');
    });

    function updateTorchUI() {
        if (flashMode === 'auto') {
            torchBtn.innerText = "⚡ FLASH: AUTO";
            torchBtn.style.borderColor = "#ffab00";
            torchBtn.style.color = "#ffab00";
        } else if (flashMode === 'torch') {
            torchBtn.innerText = "🔦 TORCH: ON";
            torchBtn.style.borderColor = "#00e676";
            torchBtn.style.color = "#00e676";
        } else {
            torchBtn.innerText = "⚡ FLASH: OFF";
            torchBtn.style.borderColor = "#ff1744";
            torchBtn.style.color = "#ff1744";
        }
    }

    torchBtn.addEventListener('click', async () => {
        if (flashMode === 'auto') flashMode = 'torch';
        else if (flashMode === 'torch') flashMode = 'off';
        else flashMode = 'auto';

        localStorage.setItem('tow_flash_mode', flashMode);
        updateTorchUI();

        if (videoTrack && trackCapabilities.torch) {
            try {
                await videoTrack.applyConstraints({
                    advanced: [{ torch: (flashMode === 'torch') }]
                });
            } catch(e) {}
        }
    });

    function isLowLight(video) {
        try {
            const miniCanvas = document.createElement('canvas');
            miniCanvas.width = 20;
            miniCanvas.height = 20;
            const miniCtx = miniCanvas.getContext('2d', { willReadFrequently: true });
            miniCtx.drawImage(video, 0, 0, 20, 20);
            const imgData = miniCtx.getImageData(0, 0, 20, 20).data;
            let totalLuminance = 0;
            for (let i = 0; i < imgData.length; i += 4) {
                totalLuminance += (0.299 * imgData[i] + 0.587 * imgData[i+1] + 0.114 * imgData[i+2]);
            }
            const avgLuminance = totalLuminance / (imgData.length / 4);
            return avgLuminance < 50;
        } catch(e) {
            return false;
        }
    }

    async function startCamera() {
        try {
            videoStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: false
            });
            videoElem.srcObject = videoStream;
            videoTrack = videoStream.getVideoTracks()[0];

            if (videoTrack) {
                trackCapabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
                if (!trackCapabilities.torch) {
                    torchBtn.style.display = 'none';
                } else {
                    torchBtn.style.display = 'block';
                    if (flashMode === 'torch') {
                        try {
                            await videoTrack.applyConstraints({ advanced: [{ torch: true }] });
                        } catch(e) {}
                    }
                }
            }
        } catch(err) {
            alert("Camera error: " + err.message);
        }
    }

    function stopCamera() {
        if (videoStream) {
            videoStream.getTracks().forEach(t => t.stop());
            videoStream = null;
            videoTrack = null;
        }
    }

    snapBtn.addEventListener('click', async () => {
        let firedFlash = false;
        const needsFlash = (flashMode === 'torch') || (flashMode === 'auto' && isLowLight(videoElem));

        if (needsFlash && videoTrack && trackCapabilities.torch) {
            try {
                await videoTrack.applyConstraints({ advanced: [{ torch: true }] });
                firedFlash = true;
                if (flashMode !== 'torch') {
                    await new Promise(r => setTimeout(r, 300));
                }
            } catch(e) {}
        }

        const vW = videoElem.videoWidth || 1280;
        const vH = videoElem.videoHeight || 720;
        const aspect = vH / vW;
        
        const canvas = document.createElement('canvas');
        canvas.width = 600;
        canvas.height = Math.round(600 * aspect);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(videoElem, 0, 0, canvas.width, canvas.height);
        
        const b64 = canvas.toDataURL('image/jpeg', 0.45);
        conditionPhotos.push(b64);

        if (firedFlash && flashMode !== 'torch' && videoTrack && trackCapabilities.torch) {
            try {
                await videoTrack.applyConstraints({ advanced: [{ torch: false }] });
            } catch(e) {}
        }

        renderThumbs();
        modalCounter.innerText = `${conditionPhotos.length} PHOTOS TAKEN`;
        
        if (navigator.vibrate) navigator.vibrate(40);
    });

    function renderThumbs() {
        thumbGallery.innerHTML = "";
        conditionPhotos.forEach((src, idx) => {
            const wrap = document.createElement('div');
            wrap.className = 'thumb-container';

            const img = document.createElement('img');
            img.src = src; img.className = 'thumb-img';

            const del = document.createElement('div');
            del.className = 'thumb-del';
            del.innerText = '✕';
            del.onclick = (e) => {
                e.stopPropagation();
                conditionPhotos.splice(idx, 1);
                renderThumbs();
            };

            wrap.appendChild(img);
            wrap.appendChild(del);
            thumbGallery.appendChild(wrap);
        });

        const countText = `${conditionPhotos.length} CONDITION PHOTOS CAPTURED`;
        photoCountBanner.innerText = countText;
        modalCounter.innerText = countText;
        validateForm();
    }

    // --- INSTANT BACKGROUND SUBMISSION ---
    submitBtn.addEventListener('click', (e) => {
        e.preventDefault();
        
        if (!validateForm()) {
            statusDiv.innerText = "⚠️ FILL HIGHLIGHTED FIELDS & ATTACH PHOTO";
            return; 
        }
        if (isSubmitting) return;

        const rego = regoInput.value.trim().toUpperCase();
        isSubmitting = true;
        submitBtn.disabled = true;
        submitBtn.style.opacity = "0.5";
        statusDiv.style.color = "#ffab00";
        statusDiv.innerText = "SECURING TOW...";

        const finalMake = makeSelect.value === "Other" ? makeOtherInput.value.trim() : makeSelect.value;
        const finalColour = colourSelect.value === "Other" ? colourOtherInput.value.trim() : colourSelect.value;
        const driver = officerSelect.value === "Other" ? officerOtherInput.value.trim() : officerSelect.value;

        const compB64 = localStorage.getItem('pending_comp_' + rego) || "";

        const payload = {
            id: 'TOW_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
            action: 'log_tow',
            property: propertySelect.value || targetProperty || 'GENERAL',
            rego: rego,
            state: stateSelect.value,
            make: finalMake,
            model: modelInput.value.trim(),
            colour: finalColour,
            bodyType: bodyTypeSelect.value,
            officer: driver,
            photoBytes: conditionPhotos.length > 0 ? conditionPhotos[0] : "",
            photos: conditionPhotos,
            comparisonPhoto: compB64,
            timestamp: new Date().toISOString()
        };

        // 1. Blacklist immediately so vehicle vanishes from RUN permanently
        try {
            let blacklisted = JSON.parse(localStorage.getItem('towed_blacklist') || "{}");
            blacklisted[rego] = Date.now();
            localStorage.setItem('towed_blacklist', JSON.stringify(blacklisted));

            let cachedRun = JSON.parse(localStorage.getItem('cached_run_data') || "[]");
            cachedRun = cachedRun.filter(item => String(item.rego).trim().toUpperCase() !== rego);
            localStorage.setItem('cached_run_data', JSON.stringify(cachedRun));
            localStorage.removeItem('pending_comp_' + rego);
        } catch(err) {}

        // 2. Safely put into offline queue
        saveToOfflineQueue(payload);

        // 3. Fire async upload without waiting (Non-blocking)
        if (navigator.onLine) {
            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            }).then(res => res.json())
              .then(data => {
                  if (data && data.status === "SUCCESS") {
                      removeFromOfflineQueue(payload.id);
                  }
              }).catch(e => console.warn("Background upload paused, keeping in queue"));
        }

        // 4. Instantly show Green Success Screen
        successRego.innerText = rego + " LOGGED";
        successOverlay.style.display = "flex";
    });

    function saveToOfflineQueue(payload) {
        let queue = JSON.parse(localStorage.getItem('tow_offline_queue') || "[]");
        if (!queue.some(item => item.id === payload.id)) {
            queue.push(payload);
            localStorage.setItem('tow_offline_queue', JSON.stringify(queue));
        }
        updateQueueUI();
    }

    function removeFromOfflineQueue(id) {
        let queue = JSON.parse(localStorage.getItem('tow_offline_queue') || "[]");
        queue = queue.filter(item => item.id !== id);
        localStorage.setItem('tow_offline_queue', JSON.stringify(queue));
        updateQueueUI();
    }

    function updateQueueUI() {
        let queue = JSON.parse(localStorage.getItem('tow_offline_queue') || "[]");
        if (queue.length > 0 && !navigator.onLine) {
            queueCount.innerText = queue.length;
            syncBadge.style.display = 'block';
        } else {
            syncBadge.style.display = 'none';
        }
    }

    let isSyncingQueue = false;
    async function syncPendingTowsInBackground() {
        if (isSyncingQueue || !navigator.onLine) return;
        let queue = JSON.parse(localStorage.getItem('tow_offline_queue') || "[]");
        if (queue.length === 0) {
            updateQueueUI();
            return;
        }

        isSyncingQueue = true;
        for (let i = 0; i < queue.length; i++) {
            const item = queue[i];
            try {
                const res = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(item)
                });
                const resJson = await res.json();
                if (resJson && resJson.status === "SUCCESS") {
                    removeFromOfflineQueue(item.id);
                }
            } catch(err) {
                break;
            }
        }
        isSyncingQueue = false;
        updateQueueUI();
    }

    async function processOfflineQueue() {
        await syncPendingTowsInBackground();
    }
</script>
