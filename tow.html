<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOW</title>
    
    <link rel="apple-touch-icon" href="icon-tow.png?v=8">
    <link rel="icon" type="image/png" href="icon-tow.png?v=8">
    <link rel="manifest" href="manifest-tow.json?v=8">

    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            margin: 0; padding: 14px; background: #121212; color: #fff; 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; 
        }
        .header h1 { margin: 0 0 10px 0; font-size: 38px; font-weight: 900; color: #ff1744; letter-spacing: 2px; text-align: center; }
        
        /* UNIVERSAL TILE HEADER NAVIGATION BAR */
        .nav-bar { display: flex; gap: 8px; width: 100%; max-width: 440px; margin-bottom: 16px; }
        .nav-tile { flex: 1; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 900; text-decoration: none; color: #000; }
        .nav-run { background: #ffab00; }
        .nav-tow { background: #ff1744; color: #fff; }
        .nav-rel { background: #00e676; }
        .nav-pass { background: #ab47bc; color: #fff; }

        .card { background: #1e1e1e; border-radius: 18px; padding: 18px; width: 100%; max-width: 440px; border: 1px solid #333; }
        
        label { font-size: 13px; text-transform: uppercase; color: #aaa; display: block; margin-top: 14px; font-weight: 900; letter-spacing: 1px; }
        input, select {
            width: 100%; height: 56px; padding: 0 14px; border-radius: 12px; border: 1px solid #444;
            background: #2a2a2a; color: #fff; font-size: 22px; font-weight: 900; margin-top: 6px; outline: none;
        }

        .camera-box {
            width: 100%; height: 280px; background: #000; border-radius: 14px; border: 2px solid #333;
            margin-top: 14px; overflow: hidden; display: flex; align-items: center; justify-content: center;
        }
        video { width: 100%; height: 100%; object-fit: cover; }

        .thumb-gallery { display: flex; gap: 10px; margin-top: 14px; overflow-x: auto; padding-bottom: 4px; }
        .thumb-img { width: 75px; height: 75px; border-radius: 12px; object-fit: cover; border: 3px solid #ff1744; cursor: pointer; flex-shrink: 0; }

        .circle-cam-btn {
            width: 120px; height: 120px; background: #00e676; border: 6px solid #fff; border-radius: 50%;
            margin: 16px auto 0 auto; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 26px rgba(0, 230, 118, 0.6); cursor: pointer; user-select: none;
        }
        .circle-cam-btn:active { transform: scale(0.90); }
        .circle-cam-inner { width: 92px; height: 92px; border-radius: 50%; border: 3px solid #000; }

        .submit-btn {
            background: #ff1744; color: #fff; font-weight: 900; border: none; border-radius: 14px;
            height: 60px; font-size: 28px; width: 100%; margin-top: 20px; cursor: pointer; letter-spacing: 2px;
        }
        .submit-btn:active { transform: scale(0.97); }
        
        .copy-policelink-btn {
            display: none; width: 100%; height: 54px; background: #2979ff; color: #fff; font-weight: 900;
            border: none; border-radius: 14px; margin-top: 14px; font-size: 20px; cursor: pointer; letter-spacing: 1px;
        }
        .copy-policelink-btn:active { transform: scale(0.97); }

        .row-2 { display: flex; gap: 10px; }
        .row-2 > div { flex: 1; }
        #status { text-align: center; font-weight: 900; font-size: 16px; margin-top: 16px; min-height: 24px; color: #00e676; }

        .modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); z-index: 100; justify-content: center; align-items: center; 
        }
    </style>
</head>
<body>

<div class="header"><h1>TOW</h1></div>

<!-- STANDARD NAV BAR -->
<div class="nav-bar">
    <a href="run.html" class="nav-tile nav-run">RUN</a>
    <a href="tow.html" class="nav-tile nav-tow">TOW</a>
    <a href="release.html" class="nav-tile nav-rel">REL</a>
    <a href="passes.html" class="nav-tile nav-pass">PASS</a>
</div>

<div class="card">
    <label>REGO</label>
    <input type="text" id="regoInput" placeholder="REGO" style="font-size:28px; color:#ff1744; text-transform:uppercase;">

    <div class="row-2">
        <div><label>MAKE</label><input type="text" id="makeInput" placeholder="MAKE"></div>
        <div><label>MODEL</label><input type="text" id="modelInput" placeholder="MODEL"></div>
    </div>

    <div class="row-2">
        <div><label>COLOUR</label><input type="text" id="colourInput" placeholder="COLOUR"></div>
        <div>
            <label>BODY</label>
            <select id="bodySelect">
                <option value="Sedan" selected>Sedan</option>
                <option value="Hatchback">Hatchback</option>
                <option value="Station Wagon">Station Wagon</option>
                <option value="Utility">Utility</option>
                <option value="Van">Van</option>
                <option value="Other">Other</option>
            </select>
        </div>
    </div>

    <label>PROPERTY</label>
    <input type="text" id="propertyInput" placeholder="PROPERTY">

    <div class="camera-box"><video id="videoElem" autoplay playsinline></video></div>
    
    <div class="thumb-gallery" id="thumbGallery"></div>

    <div class="circle-cam-btn" id="snapBtn"><div class="circle-cam-inner"></div></div>

    <button class="submit-btn" id="submitBtn">TOW</button>
    <button class="copy-policelink-btn" id="copyPolicelinkBtn">📋 COPY POLICELINK DATA</button>
    <div id="status"></div>
</div>

<div class="modal" id="imgModal">
    <div style="display:flex; flex-direction:column; align-items:center; width:100%; height:100%; justify-content:center;">
        <img id="modalImg" src="" style="max-width:90%; max-height:75%; border-radius:12px; border:2px solid #fff;">
        <button onclick="document.getElementById('imgModal').style.display='none'" 
                style="margin-top:20px; background:#ff1744; color:#fff; font-weight:900; border:none; border-radius:12px; height:50px; width:200px; font-size:18px; cursor:pointer;">
            ⬅ BACK
        </button>
    </div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";

    const regoInput = document.getElementById('regoInput');
    const makeInput = document.getElementById('makeInput');
    const modelInput = document.getElementById('modelInput');
    const colourInput = document.getElementById('colourInput');
    const bodySelect = document.getElementById('bodySelect');
    const propertyInput = document.getElementById('propertyInput');
    const videoElem = document.getElementById('videoElem');
    const snapBtn = document.getElementById('snapBtn');
    const thumbGallery = document.getElementById('thumbGallery');
    const submitBtn = document.getElementById('submitBtn');
    const copyPolicelinkBtn = document.getElementById('copyPolicelinkBtn');
    const statusDiv = document.getElementById('status');
    const photos = [];

    window.addEventListener('load', () => {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('rego')) regoInput.value = urlParams.get('rego');
        if (urlParams.get('prop')) propertyInput.value = urlParams.get('prop');
        initCamera();
    });

    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            videoElem.srcObject = stream;
        } catch(e) {}
    }

    snapBtn.addEventListener('click', () => {
        const canvas = document.createElement('canvas');
        canvas.width = videoElem.videoWidth || 640;
        canvas.height = videoElem.videoHeight || 480;
        canvas.getContext('2d').drawImage(videoElem, 0, 0);
        const b64 = canvas.toDataURL('image/jpeg', 0.8);
        photos.push(b64);

        const img = document.createElement('img');
        img.src = b64; img.className = 'thumb-img';
        img.onclick = () => {
            document.getElementById('modalImg').src = b64;
            document.getElementById('imgModal').style.display = 'flex';
        };
        thumbGallery.appendChild(img);
    });

    submitBtn.addEventListener('click', async () => {
        const rego = regoInput.value.trim().toUpperCase();
        if (!rego) { statusDiv.innerText = "ENTER REGO"; return; }

        const payload = {
            action: 'log_tow', rego: rego, make: makeInput.value.trim(), model: modelInput.value.trim(),
            colour: colourInput.value.trim(), bodyType: bodySelect.value, property: propertyInput.value.trim(), officer: "Driver"
        };

        statusDiv.innerText = "LOGGING TOW...";
        await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
        statusDiv.innerText = "✔ VEHICLE TOWED SUCCESS!";

        // SHOW AND CONFIGURE POLICELINK COPY BUTTON
        copyPolicelinkBtn.style.display = 'block';
        copyPolicelinkBtn.onclick = () => {
            const policelinkData = {
                rego: rego,
                make: makeInput.value.trim(),
                model: modelInput.value.trim(),
                colour: colourInput.value.trim(),
                body: bodySelect.value,
                location: propertyInput.value.trim(),
                holdingYard: "4 Lau Place, Ashmore QLD 4124",
                company: "National Towing and Carparking Solutions",
                phone: "0450605370"
            };
            navigator.clipboard.writeText(JSON.stringify(policelinkData));
            copyPolicelinkBtn.innerText = "✔ COPIED TO CLIPBOARD!";
            setTimeout(() => { copyPolicelinkBtn.innerText = "📋 COPY POLICELINK DATA"; }, 3000);
        };
    });
</script>
</body>
</html>
