<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

    <title>TOW</title>
    
    <link rel="apple-touch-icon" href="icon-tow.png?v=700">
    <link rel="icon" type="image/png" href="icon-tow.png?v=700">
    <link rel="manifest" href="manifest-tow.json?v=700">

    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            margin: 0; padding: 14px; background: #121212; color: #fff; 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; 
        }
        
        .header-box { display: flex; align-items: center; justify-content: center; position: relative; width: 100%; max-width: 440px; margin-bottom: 10px; }
        .header-box h1 { margin: 0; font-size: 38px; font-weight: 900; color: #ff1744; letter-spacing: 2px; text-align: center; }
        .icon-btn { position: absolute; right: 0; background: #2a2a2a; border: 1px solid #444; border-radius: 10px; font-size: 20px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; }

        .sync-badge {
            background: #ffab00; color: #000; font-weight: 900; font-size: 11px;
            padding: 8px 14px; border-radius: 20px; margin-bottom: 10px; display: none;
            cursor: pointer; text-transform: uppercase; letter-spacing: 1px; text-align: center;
        }

        .nav-bar { display: flex; gap: 8px; width: 100%; max-width: 440px; margin-bottom: 16px; }
        .nav-tile { flex: 1; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 900; text-decoration: none; color: #000; }
        .nav-run { background: #ffab00; }
        .nav-tow { background: #ff1744; color: #fff; }
        .nav-rel { background: #00e676; }
        .nav-pass { background: #ab47bc; color: #fff; }

        .card { background: #1e1e1e; border-radius: 18px; padding: 18px; width: 100%; max-width: 440px; border: 1px solid #333; margin-bottom: 16px; }
        
        label { font-size: 12px; text-transform: uppercase; color: #aaa; display: block; margin-top: 10px; font-weight: 900; letter-spacing: 1px; }
        input, select {
            width: 100%; height: 50px; padding: 0 12px; border-radius: 10px; border: 1px solid #444;
            background: #2a2a2a; color: #fff; font-size: 20px; font-weight: 900; margin-top: 4px; outline: none;
            -webkit-appearance: none;
        }

        .camera-box {
            width: 100%; height: 260px; background: #000; border-radius: 14px; border: 2px solid #333;
            margin-top: 10px; overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative;
        }
        video { width: 100%; height: 100%; object-fit: cover; }

        .torch-btn {
            position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.65);
            border: 1px solid #ff1744; color: #ff1744; padding: 6px 14px; border-radius: 20px;
            font-size: 11px; font-weight: 900; cursor: pointer; z-index: 10;
        }

        .action-btn {
            background: #ff1744; color: #fff; font-weight: 900; border: none; border-radius: 10px;
            height: 54px; font-size: 20px; width: 100%; margin-top: 16px; cursor: pointer; letter-spacing: 1px;
        }

        #status { text-align: center; font-weight: 900; font-size: 16px; margin-top: 12px; min-height: 24px; color: #ff1744; letter-spacing: 1px; }
    </style>
</head>
<body>

<div class="header-box">
    <h1>TOW</h1>
    <div class="icon-btn" id="refreshBtn">🔄</div>
</div>

<div class="sync-badge" id="syncBadge" onclick="processOfflineQueue()">⚡ OFFLINE TOW QUEUE: <span id="queueCount">0</span> (TAP TO SYNC / DOUBLE-TAP CLEAR)</div>

<div class="nav-bar">
    <a href="run.html" class="nav-tile nav-run">RUN</a>
    <a href="tow.html" class="nav-tile nav-tow">TOW</a>
    <a href="release.html" class="nav-tile nav-rel">REL</a>
    <a href="passes.html" class="nav-tile nav-pass">PASS</a>
</div>

<div class="card">
    <label>PROPERTY</label>
    <select id="propertySelect"><option value="">LOADING PROPERTIES...</option></select>

    <label>REGISTRATION</label>
    <input type="text" id="regoInput" placeholder="ENTER REGO..." style="color:#ff1744; text-transform:uppercase;">

    <label>REASON FOR TOW</label>
    <select id="reasonSelect">
        <option value="UNAUTHORIZED PARKING">UNAUTHORIZED PARKING</option>
        <option value="EXPIRED TIME LIMIT">EXPIRED TIME LIMIT</option>
        <option value="NO VISITOR PASS">NO VISITOR PASS</option>
        <option value="PARKED IN NO PARKING ZONE">PARKED IN NO PARKING ZONE</option>
        <option value="BLOCKING DRIVEWAY / FIRE HYDRANT">BLOCKING DRIVEWAY / FIRE HYDRANT</option>
    </select>

    <label>HOOKUP PHOTO EVIDENCE</label>
    <div class="camera-box">
        <button class="torch-btn" id="torchBtn">⚡ FLASH OFF</button>
        <video id="videoElem" autoplay playsinline></video>
    </div>

    <button class="action-btn" id="logTowBtn">LOG TOW NOW</button>
    <div id="status">READY</div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(()=>{});
    }

    const propertySelect = document.getElementById('propertySelect');
    const regoInput = document.getElementById('regoInput');
    const reasonSelect = document.getElementById('reasonSelect');
    const videoElem = document.getElementById('videoElem');
    const torchBtn = document.getElementById('torchBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const logTowBtn = document.getElementById('logTowBtn');
    const statusDiv = document.getElementById('status');
    const syncBadge = document.getElementById('syncBadge');
    const queueCount = document.getElementById('queueCount');

    let videoTrack = null;
    let torchOn = false;

    window.addEventListener('load', async () => {
        const urlParams = new URLSearchParams(window.location.search);
        const urlRego = urlParams.get('rego');
        const urlProp = urlParams.get('prop');

        await loadProperties();
        if (urlProp) propertySelect.value = urlProp;
        if (urlRego) regoInput.value = urlRego.toUpperCase();

        initCamera();
        updateQueueUI();
        window.addEventListener('online', processOfflineQueue);
    });

    refreshBtn.addEventListener('click', () => { window.location.reload(true); });

    async function loadProperties() {
        const cached = localStorage.getItem('cached_properties');
        if (cached) populatePropertiesUI(JSON.parse(cached));

        if (navigator.onLine) {
            try {
                const res = await fetch(GOOGLE_SCRIPT_URL + "?action=get_properties");
                const data = await res.json();
                if (Array.isArray(data) && data.length > 0) {
                    localStorage.setItem('cached_properties', JSON.stringify(data));
                    populatePropertiesUI(data);
                }
            } catch(e) {}
        }
    }

    function populatePropertiesUI(data) {
        propertySelect.innerHTML = "";
        data.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.name; opt.innerText = p.name;
            propertySelect.appendChild(opt);
        });
    }

    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } } 
            });
            videoElem.srcObject = stream;
            videoTrack = stream.getVideoTracks()[0];
        } catch(e) {}
    }

    torchBtn.addEventListener('click', async (e) => {
        e.preventDefault();
        if (!videoTrack) return;
        try {
            torchOn = !torchOn;
            await videoTrack.applyConstraints({ advanced: [{ torch: torchOn }] });
            torchBtn.innerText = torchOn ? "⚡ FLASH ON" : "⚡ FLASH OFF";
            torchBtn.style.color = torchOn ? "#00e676" : "#ff1744";
        } catch(e) {}
    });

    logTowBtn.addEventListener('click', async (e) => {
        e.preventDefault();
        const rego = regoInput.value.trim().toUpperCase();
        if (!rego) {
            statusDiv.innerText = "ENTER REGISTRATION FIRST";
            regoInput.focus();
            return;
        }

        logTowBtn.disabled = true;
        statusDiv.innerText = "CAPTURING & LOGGING...";

        const canvas = document.createElement('canvas');
        canvas.width = videoElem.videoWidth || 1280;
        canvas.height = videoElem.videoHeight || 720;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(videoElem, 0, 0, canvas.width, canvas.height);

        const offCanvas = document.createElement('canvas');
        offCanvas.width = 720;
        offCanvas.height = Math.round(720 * (canvas.height / canvas.width));
        const offCtx = offCanvas.getContext('2d');
        offCtx.drawImage(canvas, 0, 0, offCanvas.width, offCanvas.height);
        
        const photoB64 = offCanvas.toDataURL('image/jpeg', 0.70);

        const payload = {
            id: 'TOW_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
            action: 'log_tow',
            property: propertySelect.value,
            rego: rego,
            reason: reasonSelect.value,
            photoBytes: photoB64,
            timestamp: new Date().toISOString()
        };

        if (!navigator.onLine) {
            saveToOfflineQueue(payload);
            statusDiv.innerText = `⚡ TOW QUEUED OFFLINE: ${rego}`;
            setTimeout(() => { resetForm(); }, 1000);
            return;
        }

        try {
            await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });

            statusDiv.innerText = `✔ LOGGED TOW: ${rego}`;
            setTimeout(() => { resetForm(); }, 1000);

        } catch(err) {
            saveToOfflineQueue(payload);
            statusDiv.innerText = `⚡ TOW QUEUED OFFLINE: ${rego}`;
            setTimeout(() => { resetForm(); }, 1000);
        }
    });

    function resetForm() {
        regoInput.value = "";
        statusDiv.innerText = "READY";
        logTowBtn.disabled = false;
    }

    function saveToOfflineQueue(payload) {
        try {
            let queue = JSON.parse(localStorage.getItem('tow_offline_queue') || "[]");
            if (!queue.some(item => item.id === payload.id)) {
                queue.push(payload);
                localStorage.setItem('tow_offline_queue', JSON.stringify(queue));
            }
            updateQueueUI();
        } catch(e) {
            alert("Storage full! Reconnect to sync.");
        }
    }

    function updateQueueUI() {
        let queue = JSON.parse(localStorage.getItem('tow_offline_queue') || "[]");
        if (queue.length > 0) {
            queueCount.innerText = queue.length;
            syncBadge.style.display = 'block';
        } else {
            syncBadge.style.display = 'none';
        }
    }

    let lastSyncTap = 0;
    async function processOfflineQueue() {
        const now = Date.now();
        if (now - lastSyncTap < 1000) {
            if (confirm("Clear stuck offline tow queue items?")) {
                localStorage.removeItem('tow_offline_queue');
                updateQueueUI();
                statusDiv.innerText = "QUEUE CLEARED";
                return;
            }
        }
        lastSyncTap = now;

        let queue = JSON.parse(localStorage.getItem('tow_offline_queue') || "[]");
        if (queue.length === 0 || !navigator.onLine) return;

        statusDiv.innerText = "SYNCING OFFLINE TOWS...";
        let remaining = [];

        for (let item of queue) {
            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(item)
                });
            } catch(e) {
                const itemTime = new Date(item.timestamp).getTime();
                if (Date.now() - itemTime < 86400000) {
                    remaining.push(item);
                }
            }
        }

        localStorage.setItem('tow_offline_queue', JSON.stringify(remaining));
        updateQueueUI();
        
        if (remaining.length === 0) {
            statusDiv.innerText = "✔ OFFLINE TOWS SYNCED!";
            setTimeout(() => { statusDiv.innerText = "READY"; }, 1500);
        } else {
            statusDiv.innerText = "PARTIAL SYNC. TAP BADGE TO RETRY.";
        }
    }
</script>
</body>
</html>
