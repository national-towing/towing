<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>TOW</title>
    
    <link rel="apple-touch-icon" href="icon-tow.png?v=10009">
    <link rel="icon" type="image/png" href="icon-tow.png?v=10009">
    <link rel="manifest" href="manifest-tow.json?v=10009">

    <style>
        :root {
            --c-mark: #2979ff;
            --c-run: #ffab00;
            --c-tow: #ff1744;
            --c-pass: #ab47bc;
            --c-yard: #00b0ff;
            --c-rel: #00e676;
            --text-placeholder: #888888;
        }
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            margin: 0; padding: 12px; background: #121212; color: #fff; 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
            padding-top: max(16px, env(safe-area-inset-top));
            padding-bottom: max(30px, env(safe-area-inset-bottom));
        }
        
        .header-box { display: flex; align-items: center; justify-content: center; position: relative; width: 100%; max-width: 440px; margin: 0 auto 12px auto; flex-shrink: 0; }
        .header-box h1 { margin: 0; font-size: 38px; font-weight: 900; color: var(--c-tow); letter-spacing: 2px; text-align: center; line-height: 1.2; padding-top: 4px; cursor: pointer; }
        .icon-btn { position: absolute; right: 0; background: #2a2a2a; border: 1px solid #444; border-radius: 10px; font-size: 18px; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; }
        .icon-btn:active { transform: scale(0.92); }

        .nav-grid-3x2 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; max-width: 440px; margin: 0 auto 12px auto; flex-shrink: 0; }
        .nav-tile { height: 38px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; text-decoration: none; color: #000; text-transform: uppercase; letter-spacing: 0.5px; }
        .nav-tile:active { transform: scale(0.96); }
        .t-mark { background: var(--c-mark); color: #fff; }
        .t-run  { background: var(--c-run); color: #000; }
        .t-tow  { background: var(--c-tow); color: #fff; box-shadow: 0 0 0 2px #fff; }
        .t-admin { background: var(--c-pass); color: #fff; }
        .t-yard { background: var(--c-yard); color: #000; }
        .t-rel  { background: var(--c-rel); color: #000; }

        .card { background: #1e1e1e; border-radius: 18px; padding: 16px; width: 100%; max-width: 440px; border: 1px solid #333; margin-bottom: 16px; }
        
        label { font-size: 11px; text-transform: uppercase; color: #aaa; display: block; margin-top: 10px; font-weight: 900; letter-spacing: 1px; }
        
        input, select {
            width: 100%; height: 50px; padding: 0 12px; border-radius: 10px; border: 1.5px solid #444;
            background: #2a2a2a; color: #fff; font-size: 19px; font-weight: 900; margin-top: 4px; outline: none;
            -webkit-appearance: none; transition: border 0.2s ease, background 0.2s ease, color 0.2s ease;
        }
        input:focus, select:focus { border-color: #ff1744; }

        ::placeholder { color: var(--text-placeholder) !important; font-weight: 700; opacity: 1; }
        select.unselected { color: var(--text-placeholder) !important; font-weight: 700; }
        select option { background: #2a2a2a; color: #ffffff; font-weight: 800; }

        .field-missing { border-color: #ffab00 !important; background: #2b2207 !important; }
        .field-valid { border-color: #444 !important; background: #2a2a2a !important; }

        .row-rego-state { display: flex; gap: 8px; }
        .row-rego-state > div:first-child { flex: 2; }
        .row-rego-state > div:last-child { flex: 1; }

        .row-2 { display: flex; gap: 8px; }
        .row-2 > div { flex: 1; }

        /* Comparison Button */
        .comp-btn {
            background: #0088cc; border: 2px solid #00b0ff; color: #fff;
            font-size: 17px; font-weight: 900; border-radius: 12px; height: 54px;
            width: 100%; margin-top: 6px; cursor: pointer; text-align: center;
            letter-spacing: 0.5px; text-transform: uppercase; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 4px 14px rgba(0, 176, 255, 0.25);
        }
        .comp-btn:active { transform: scale(0.98); }
        .comp-btn.comp-ready {
            background: #0d2818; border: 2px solid #00e676; color: #00e676;
            box-shadow: 0 4px 14px rgba(0, 230, 118, 0.2);
        }
        
        .comp-preview-wrap {
            display: none; margin-top: 8px; border-radius: 12px; overflow: hidden;
            border: 2px solid #00e676; background: #000; position: relative; cursor: pointer;
        }
        .comp-preview-img { width: 100%; height: 140px; object-fit: contain; display: block; }
        .comp-preview-badge {
            position: absolute; bottom: 4px; right: 8px; background: rgba(0,0,0,0.85);
            color: #00e676; font-size: 11px; font-weight: 900; padding: 3px 8px; border-radius: 4px;
        }

        /* Condition Snap Button */
        .cond-snap-btn {
            background: #00a854; border: 2px solid #00e676; color: #000;
            font-size: 17px; font-weight: 900; border-radius: 12px; height: 54px;
            width: 100%; margin-top: 6px; cursor: pointer; text-align: center;
            letter-spacing: 1px; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 4px 14px rgba(0, 230, 118, 0.25);
        }
        .cond-snap-btn:active { transform: scale(0.98); }

        .batch-select-label {
            display: block; text-align: center; font-size: 12px; font-weight: 900;
            color: #00b0ff; margin-top: 8px; cursor: pointer; letter-spacing: 0.5px; text-transform: uppercase;
            padding: 10px; border-radius: 8px; background: #141f29; border: 1.5px solid #0088cc;
        }
        .batch-select-label:active { background: #1f364d; }

        .thumb-gallery { display: flex; gap: 8px; margin-top: 8px; overflow-x: auto; padding-bottom: 4px; min-height: 80px; align-items: center; }
        .thumb-container { position: relative; flex-shrink: 0; }
        .thumb-img { width: 74px; height: 74px; border-radius: 8px; object-fit: cover; border: 2px solid #00e676; }
        .thumb-del {
            position: absolute; top: -6px; right: -6px; background: #ff1744; color: #fff;
            border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center;
            justify-content: center; font-size: 12px; font-weight: 900; border: 2px solid #1e1e1e; cursor: pointer;
        }

        .submit-btn {
            background: #ff1744; color: #fff; font-weight: 900; border: none; border-radius: 14px;
            height: 60px; font-size: 24px; width: 100%; margin-top: 18px; cursor: pointer; letter-spacing: 1.5px;
            text-transform: uppercase; box-shadow: 0 4px 16px rgba(255, 23, 68, 0.4);
        }
        .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }

        #status { text-align: center; font-weight: 900; font-size: 14px; margin-top: 10px; min-height: 22px; color: #ffab00; }

        /* Ghost Alignment Viewfinder Modal */
        .overlay-modal { display: none; position: fixed; inset: 0; background: #000; z-index: 100005; flex-direction: column; }
        .overlay-modal.show { display: flex; }
        .modal-header { height: 54px; background: #1e1e1e; display: flex; justify-content: space-between; align-items: center; padding: 0 16px; border-bottom: 1px solid #333; }
        .modal-title { font-weight: 900; font-size: 15px; color: #00e676; text-transform: uppercase; }
        .close-btn { color: #ff1744; font-weight: 900; font-size: 26px; cursor: pointer; }
        
        .opacity-bar { 
            background: #2a2a2a; padding: 8px 16px; display: flex; align-items: center; gap: 12px; 
            font-size: 12px; font-weight: 900; color: #ffab00; border-bottom: 1px solid #333; text-transform: uppercase; 
        }
        .opacity-bar input { flex: 1; accent-color: #ffab00; }
        .torch-btn {
            background: #333; border: 1.5px solid #ffab00; color: #ffab00; border-radius: 8px;
            font-size: 12px; font-weight: 900; padding: 4px 10px; cursor: pointer;
        }

        .viewfinder-container { flex: 1; position: relative; overflow: hidden; background: #000; }
        #overlayVideo { width: 100%; height: 100%; object-fit: cover; }
        #ghostImage { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.45; pointer-events: none; }
        
        .modal-footer { height: 86px; background: #1e1e1e; display: flex; gap: 8px; padding: 0 10px; align-items: center; border-top: 1px solid #333; }
        .btn-modal-action { flex: 1; height: 56px; border: none; border-radius: 12px; font-weight: 900; font-size: 14px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; }
        .btn-snap-live { background: #00e676; color: #000; }
        .btn-snap-native { background: #00b0ff; color: #000; }

        /* Fullscreen Success Overlay */
        #successOverlay {
            display: none; position: fixed; inset: 0;
            background-color: rgba(0, 230, 118, 0.96); z-index: 999999; flex-direction: column;
            align-items: center; justify-content: center; text-align: center; padding: 20px;
        }
        #successOverlay h1 { font-size: 44px; font-weight: 950; color: #000; margin: 0 0 10px 0; text-transform: uppercase; }
        #successOverlay p { font-size: 17px; font-weight: 800; color: #111; margin: 0 0 30px 0; max-width: 80%; }
        .ok-btn {
            background: #000; color: #00e676; font-size: 28px; font-weight: 900; border: none;
            border-radius: 14px; padding: 18px 50px; cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            letter-spacing: 2px;
        }
    
        .truck-btn-row { display: flex; gap: 8px; width: 100%; margin-top: 4px; }
        .btn-truck-half { flex: 1; height: 50px; border-radius: 10px; font-size: 19px; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; letter-spacing: 1px; outline: none; transition: all 0.15s ease; opacity: 0.45; }
        .btn-white-3921 { background: #ffffff; color: #000000; border: 2px solid #ffffff; }
        .btn-black-3676 { background: #000000; color: #ffffff; border: 2px solid #555555; }
        .btn-truck-half.active { opacity: 1 !important; border: 3px solid #00e676 !important; box-shadow: 0 0 16px rgba(0, 230, 118, 0.45); transform: scale(1.02); }
    </style>
</head>
<body>

<div class="header-box">
    <h1 id="diagnosticTrigger">TOW</h1>
    <div class="icon-btn" onclick="window.location.reload(true)">🔄</div>
</div>

<div class="nav-grid-3x2">
    <a href="mark.html" class="nav-tile t-mark">MARK</a>
    <a href="run.html" class="nav-tile t-run">RUN</a>
    <a href="tow.html" class="nav-tile t-tow">TOW</a>
    <a href="admin.html" class="nav-tile t-admin">ADMIN</a>
    <a href="yard.html" class="nav-tile t-yard">YARD</a>
    <a href="release.html" class="nav-tile t-rel">REL</a>
</div>

<div class="card">
    <label>PROPERTY</label>
    <select id="propertySelect" class="unselected">
        <option value="" disabled selected>PROPERTY</option>
    </select>

    <div class="row-rego-state">
        <div>
            <label>REGO</label>
            <input type="text" id="regoInput" placeholder="REGO" style="color:#ff1744; text-transform:uppercase;" onfocus="handleFieldFocus(this)">
        </div>
        <div>
            <label>STATE</label>
            <select id="stateSelect" style="color:#ffab00;">
                <option value="QLD" selected>QLD</option>
                <option value="NSW">NSW</option>
                <option value="VIC">VIC</option>
                <option value="NT">NT</option>
                <option value="SA">SA</option>
                <option value="TAS">TAS</option>
                <option value="ACT">ACT</option>
                <option value="WA">WA</option>
            </select>
        </div>
    </div>

    <div class="row-2">
        <div>
            <label>MAKE</label>
            <select id="makeSelect" class="unselected" onchange="checkMakeOther(this)">
                <option value="" disabled selected>MAKE</option>
                <option value="Toyota">Toyota</option>
                <option value="Holden">Holden</option>
                <option value="Ford">Ford</option>
                <option value="Hyundai">Hyundai</option>
                <option value="Nissan">Nissan</option>
                <option value="Mitsubishi">Mitsubishi</option>
                <option value="Mazda">Mazda</option>
                <option value="MG">MG</option>
                <option value="Subaru">Subaru</option>
                <option value="Honda">Honda</option>
                <option value="Volkswagen">Volkswagen</option>
                <option value="Kia">Kia</option>
                <option value="BMW">BMW</option>
                <option value="Mercedes-Benz">Mercedes-Benz</option>
                <option value="Audi">Audi</option>
                <option value="Jeep">Jeep</option>
                <option value="Other">Other</option>
            </select>
            <input type="text" id="makeOtherInput" placeholder="ENTER MAKE" style="display:none; margin-top:4px;" onfocus="handleFieldFocus(this)">
        </div>
        <div>
            <label>MODEL</label>
            <input type="text" id="modelInput" placeholder="MODEL" onfocus="handleFieldFocus(this)">
        </div>
    </div>

    <div class="row-2">
        <div>
            <label>COLOUR</label>
            <select id="colourSelect" class="unselected" onchange="checkColourOther(this)">
                <option value="" disabled selected>COLOUR</option>
                <option value="White">White</option>
                <option value="Black">Black</option>
                <option value="Silver">Silver</option>
                <option value="Grey">Grey</option>
                <option value="Blue">Blue</option>
                <option value="Red">Red</option>
                <option value="Green">Green</option>
                <option value="Yellow">Yellow</option>
                <option value="Gold">Gold</option>
                <option value="Bronze">Bronze</option>
                <option value="Orange">Orange</option>
                <option value="Purple">Purple</option>
                <option value="Brown">Brown</option>
                <option value="Other">Other</option>
            </select>
            <input type="text" id="colourOtherInput" placeholder="ENTER COLOUR" style="display:none; margin-top:4px;" onfocus="handleFieldFocus(this)">
        </div>
        <div>
            <label>BODY TYPE</label>
            <select id="bodyTypeSelect" class="unselected">
                <option value="" disabled selected>BODY TYPE</option>
                <option value="Sedan">Sedan</option>
                <option value="Hatchback">Hatchback</option>
                <option value="SUV">SUV</option>
                <option value="Station Wagon">Station Wagon</option>
                <option value="Utility">Utility</option>
                <option value="Van">Van</option>
                <option value="Other">Other</option>
            </select>
        </div>
    </div>

    <label>TRUCK</label>
    <div class="truck-btn-row" id="truckBtnRow">
        <button type="button" class="btn-truck-half btn-white-3921" id="btnTruck3921" onclick="selectTruck('3921')">3921</button>
        <button type="button" class="btn-truck-half btn-black-3676" id="btnTruck3676" onclick="selectTruck('3676')">3676</button>
    </div>
    <input type="hidden" id="truckSelectedInput" value="">

    <!-- Comparison Button -->
    <label>SIDE-BY-SIDE COMPARISON (VERIFICATION)</label>
    <button type="button" class="comp-btn" id="compBtn" onclick="openComparisonWorkflow()">
        <span id="compBtnText">📷 ALIGN & SNAP COMPARISON</span>
    </button>
    <div class="comp-preview-wrap" id="compPreviewWrap" onclick="openComparisonWorkflow()">
        <img id="compPreviewImg" class="comp-preview-img" alt="Comparison Preview">
        <span class="comp-preview-badge">SIDE-BY-SIDE VERIFIED (TAP TO RETAKE)</span>
    </div>
    <input type="file" id="nativeCompInput" accept="image/*" capture="environment" style="display:none;" onchange="handleNativeCompPhoto(this)">

    <!-- Condition Photos Button -->
    <label>CONDITION PHOTOS</label>
    <button type="button" class="cond-snap-btn" id="condSnapBtn" onclick="triggerNativeConditionSnap()">
        📷 SNAP COND PHOTOS
    </button>

    <label class="batch-select-label">
        🖼️ OR SELECT MULTIPLE FROM CAMERA ROLL
        <input type="file" id="batchCondInput" accept="image/*" multiple style="display:none;" onchange="handleBatchConditionPhotos(this)">
    </label>
    <input type="file" id="nativeCondInput" accept="image/*" capture="environment" style="display:none;" onchange="handleSingleConditionPhoto(this)">

    <div class="thumb-gallery" id="thumbGallery"></div>

    <button class="submit-btn" id="submitBtn" disabled>LOG TOW</button>
    <div id="status"></div>
</div>

<!-- Ghost Alignment Viewfinder Modal -->
<div id="overlayModal" class="overlay-modal">
    <div class="modal-header">
        <span class="modal-title" id="modalRegoTitle">ALIGN & VERIFY TOW</span>
        <span class="close-btn" onclick="closeOverlayModal()">✕</span>
    </div>
    <div class="opacity-bar">
        <span>GHOST:</span>
        <input type="range" id="opacitySlider" min="0" max="100" value="45">
        <button type="button" class="torch-btn" id="torchBtn" onclick="toggleTorch()">🔦 TORCH</button>
    </div>
    <div class="viewfinder-container">
        <video id="overlayVideo" autoplay playsinline muted></video>
        <img id="ghostImage" alt="Ghost Overlay">
    </div>
    <div class="modal-footer">
        <button type="button" class="btn-modal-action btn-snap-live" onclick="snapLiveGhostPhoto()">⚡ SNAP ALIGNED (IN-APP)</button>
        <button type="button" class="btn-modal-action btn-snap-native" onclick="launchNativeFromGhost()">📷 NATIVE CAMERA</button>
    </div>
</div>

<div id="successOverlay">
    <h1 id="successRego">VEHICLE TOWED</h1>
    <p>Secured and syncing in background.</p>
    <button class="ok-btn" onclick="resetTowForm()">OK</button>
</div>

<!-- Multi-Snap Camera Viewfinder Modal -->
<div id="condVidModal" class="overlay-modal" style="z-index:100010;">
    <div class="modal-header">
        <button type="button" class="torch-btn" id="condTorchBtn" onclick="toggleCondTorch()">🔦 TORCH</button>
        <div style="color:#00e676; font-weight:900; text-transform:uppercase;">MULTI-SNAP</div>
        <button type="button" class="torch-btn" style="color:#fff; border-color:#fff;" onclick="closeCondVidModal()">✔ DONE (<span id="multiSnapCount">0</span>)</button>
    </div>
    <div class="viewfinder-container">
        <video id="condVideoElem" autoplay playsinline muted style="width:100%; height:100%; object-fit:cover;"></video>
        <div class="thumb-gallery" id="modalThumbGallery" style="position:absolute; bottom:120px; left:0; width:100%; padding:0 10px; min-height:80px; overflow-x:auto;"></div>
        <div style="position:absolute; bottom:20px; left:50%; transform:translateX(-50%); width:84px; height:84px; background:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer;" onclick="snapCondFrame()">
            <div style="width:68px; height:68px; background:#00e676; border-radius:50%;"></div>
        </div>
        <div id="condFlashIndicator" style="display:none; position:absolute; inset:0; background:#fff; z-index:10; opacity:0.8;"></div>
    </div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";

    const propertySelect = document.getElementById('propertySelect');
    const regoInput = document.getElementById('regoInput');
    const stateSelect = document.getElementById('stateSelect');
    const makeSelect = document.getElementById('makeSelect');
    const makeOtherInput = document.getElementById('makeOtherInput');
    const modelInput = document.getElementById('modelInput');
    const colourSelect = document.getElementById('colourSelect');
    const colourOtherInput = document.getElementById('colourOtherInput');
    const bodyTypeSelect = document.getElementById('bodyTypeSelect');

    const compBtn = document.getElementById('compBtn');
    const compBtnText = document.getElementById('compBtnText');
    const compPreviewWrap = document.getElementById('compPreviewWrap');
    const compPreviewImg = document.getElementById('compPreviewImg');
    const nativeCompInput = document.getElementById('nativeCompInput');

    const overlayModal = document.getElementById('overlayModal');
    const overlayVideo = document.getElementById('overlayVideo');
    const ghostImage = document.getElementById('ghostImage');
    const opacitySlider = document.getElementById('opacitySlider');

    const condSnapBtn = document.getElementById('condSnapBtn');
    const nativeCondInput = document.getElementById('nativeCondInput');
    const thumbGallery = document.getElementById('thumbGallery');
    const submitBtn = document.getElementById('submitBtn');
    const statusDiv = document.getElementById('status');
    const successOverlay = document.getElementById('successOverlay');
    const successRego = document.getElementById('successRego');

    let conditionPhotos = [];
    let isSubmitting = false;
    let targetProperty = "";
    let initialLoadedRego = "";
    let cachedMarkImageUrl = "";
    let cachedMarkedTimestamp = "";
    let overlayStream = null;
    let isTorchOn = false;

    function handleFieldFocus(input) {
        const val = input.value.trim().toUpperCase();
        if (["MODEL", "REGO", "VEHICLE", "UNKNOWN", "ENTER MAKE", "ENTER COLOUR"].includes(val)) {
            input.value = "";
        } else if (input.value) {
            input.select();
        }
    }

    function syncDropdownColors() {
        [propertySelect, makeSelect, colourSelect, bodyTypeSelect].forEach(sel => {
            if (sel) {
                if (!sel.value || sel.value === "") {
                    sel.classList.add('unselected');
                } else {
                    sel.classList.remove('unselected');
                }
            }
        });
    }

    window.addEventListener('DOMContentLoaded', () => {
        loadProperties();
        readUrlParamsAndPopulate();
        checkExistingCompPhoto();
        setupLiveValidation();
        syncDropdownColors();
        setupGhostSlider();

        // 3-Tap Force Sync diagnostic trigger
        const diagTrigger = document.getElementById('diagnosticTrigger');
        if (diagTrigger) {
            diagTrigger.addEventListener('click', (e) => {
                if (e.detail === 3) {
                    statusDiv.style.color = "#ffab00";
                    statusDiv.innerText = "🛠️ DIAGNOSTIC FORCE SYNC STARTED...";
                    syncPendingTowsInBackground();
                }
            });
        }

        window.addEventListener('online', () => { syncPendingTowsInBackground(); processPolicelinkBotQueue(); });
        window.addEventListener('focus', () => { syncPendingTowsInBackground(); processPolicelinkBotQueue(); });
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                syncPendingTowsInBackground();
                processPolicelinkBotQueue();
            }
        });
        syncPendingTowsInBackground();
        processPolicelinkBotQueue();
        setInterval(() => { syncPendingTowsInBackground(); processPolicelinkBotQueue(); }, 10000);
    });

    regoInput.addEventListener('input', () => { checkExistingCompPhoto(); autoPopulateFromCache(); });
    regoInput.addEventListener('change', () => { checkExistingCompPhoto(); autoPopulateFromCache(); });

    let selectedTruck = "";
    function selectTruck(truckNum) {
        selectedTruck = truckNum;
        document.getElementById('truckSelectedInput').value = truckNum;
        document.getElementById('btnTruck3921').classList.toggle('active', truckNum === '3921');
        document.getElementById('btnTruck3676').classList.toggle('active', truckNum === '3676');
        validateForm();
    }

    function readUrlParamsAndPopulate() {
        const params = new URLSearchParams(window.location.search);
        const urlRego = (params.get('rego') || '').trim().toUpperCase();
        const urlProp = (params.get('prop') || '').trim();
        const urlMake = (params.get('make') || '').trim();
        const urlModel = (params.get('model') || '').trim();
        const urlColour = (params.get('colour') || '').trim();
        const urlBody = (params.get('body') || '').trim();
        const urlImg = (params.get('img') || '').trim();
        const urlMkd = (params.get('mkd') || '').trim();
        const shouldOpenComp = params.get('openComp') === "1";

        if (urlRego) { regoInput.value = urlRego; initialLoadedRego = urlRego; }
        if (urlProp) targetProperty = decodeURIComponent(urlProp).toUpperCase();
        if (urlImg) cachedMarkImageUrl = decodeURIComponent(urlImg);
        if (urlMkd) cachedMarkedTimestamp = decodeURIComponent(urlMkd);

        let cachedCar = null;
        try {
            const cachedRun = JSON.parse(localStorage.getItem('cached_run_data') || '[]');
            cachedCar = cachedRun.find(c => String(c.rego).trim().toUpperCase() === urlRego) || null;
            if (cachedCar) {
                if (!cachedMarkImageUrl) cachedMarkImageUrl = cachedCar.imageUrl || cachedCar.image || "";
                if (!cachedMarkedTimestamp) cachedMarkedTimestamp = cachedCar.markedTimeStr || cachedCar.markedTime || "";
            }
        } catch(e) {}

        const makeVal = urlMake || (cachedCar ? cachedCar.make : "");
        const modelVal = urlModel || (cachedCar ? cachedCar.model : "");
        const colourVal = urlColour || (cachedCar ? cachedCar.colour : "");
        const bodyVal = urlBody || (cachedCar ? cachedCar.bodyType : "");

        if (makeVal) {
            let matched = false;
            for (let i = 0; i < makeSelect.options.length; i++) {
                if (makeSelect.options[i].value.toLowerCase() === makeVal.toLowerCase()) {
                    makeSelect.selectedIndex = i; matched = true; break;
                }
            }
            if (!matched) {
                makeSelect.value = "Other"; makeOtherInput.style.display = 'block'; makeOtherInput.value = makeVal;
            }
        }

        if (modelVal) modelInput.value = modelVal;

        if (colourVal) {
            let matched = false;
            for (let i = 0; i < colourSelect.options.length; i++) {
                if (colourSelect.options[i].value.toLowerCase() === colourVal.toLowerCase()) {
                    colourSelect.selectedIndex = i; matched = true; break;
                }
            }
            if (!matched) {
                colourSelect.value = "Other"; colourOtherInput.style.display = 'block'; colourOtherInput.value = colourVal;
            }
        }

        if (bodyVal) {
            for (let i = 0; i < bodyTypeSelect.options.length; i++) {
                const optVal = bodyTypeSelect.options[i].value.toLowerCase();
                const bLower = bodyVal.toLowerCase();
                if (optVal === bLower || (bLower === "ute" && optVal === "utility") || (bLower === "wagon" && optVal === "station wagon")) {
                    bodyTypeSelect.selectedIndex = i; break;
                }
            }
        }

        syncDropdownColors();
        validateForm();

        if (shouldOpenComp && urlRego) {
            setTimeout(openComparisonWorkflow, 300);
        }
    }

    function drawCover(ctx, img, dx, dy, dw, dh) {
        const imgRatio = img.width / img.height;
        const targetRatio = dw / dh;
        let sx, sy, sw, sh;
        if (imgRatio > targetRatio) {
            sh = img.height;
            sw = img.height * targetRatio;
            sx = (img.width - sw) / 2;
            sy = 0;
        } else {
            sw = img.width;
            sh = img.width / targetRatio;
            sx = 0;
            sy = (img.height - sh) / 2;
        }
        ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh);
    }

    function stitchSideBySide(markSrc, towSrc, mkdTime, callback) {
        const nowD = new Date();
        const days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
        const dayName = days[nowD.getDay()];
        const hh = String(nowD.getHours()).padStart(2, '0');
        const mm = String(nowD.getMinutes()).padStart(2, '0');
        const towTime = `${dayName} ${hh}:${mm}`;
        const markLabel = mkdTime ? `MARKED: ${mkdTime}` : "MARKED VEHICLE";

        const towImg = new Image();
        towImg.onload = function() {
            if (markSrc) {
                const markImg = new Image();
                markImg.crossOrigin = "anonymous";
                markImg.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = 1200; canvas.height = 800;
                    const ctx = canvas.getContext('2d');

                    drawCover(ctx, markImg, 0, 0, 600, 800);
                    drawCover(ctx, towImg, 600, 0, 600, 800);

                    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 4;
                    ctx.beginPath(); ctx.moveTo(600, 0); ctx.lineTo(600, 800); ctx.stroke();

                    ctx.fillStyle = "rgba(0,0,0,0.80)";
                    ctx.fillRect(0, 730, 600, 70);
                    ctx.fillRect(600, 730, 600, 70);

                    ctx.font = "bold 24px sans-serif";
                    ctx.fillStyle = "#ffab00";
                    ctx.fillText(markLabel, 20, 774);

                    ctx.fillStyle = "#00e676";
                    ctx.fillText(`TOWED: ${towTime}`, 620, 774);

                    try {
                        callback(canvas.toDataURL('image/jpeg', 0.70));
                    } catch(err) {
                        fallbackTowOnlyCanvas(towImg, towTime, callback);
                    }
                };
                markImg.onerror = function() {
                    fallbackTowOnlyCanvas(towImg, towTime, callback);
                };
                markImg.src = markSrc;
            } else {
                fallbackTowOnlyCanvas(towImg, towTime, callback);
            }
        };
        towImg.src = towSrc;
    }

    function fallbackTowOnlyCanvas(towImg, towTime, callback) {
        const canvas = document.createElement('canvas');
        canvas.width = 960; canvas.height = 720;
        const ctx = canvas.getContext('2d');
        drawCover(ctx, towImg, 0, 0, 960, 720);
        ctx.fillStyle = "rgba(0,0,0,0.80)";
        ctx.fillRect(0, 650, 960, 70);
        ctx.font = "bold 26px sans-serif";
        ctx.fillStyle = "#00e676";
        ctx.fillText(`TOWED: ${towTime}`, 20, 695);
        callback(canvas.toDataURL('image/jpeg', 0.70));
    }

    function applyBurnedTimestamp(b64Src, type, callback) {
        const img = new Image();
        img.onload = function() {
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height + 65;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0);
            
            const now = new Date();
            const days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
            const dayName = days[now.getDay()];
            const dd = String(now.getDate()).padStart(2, '0');
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const hh = String(now.getHours()).padStart(2, '0');
            const mins = String(now.getMinutes()).padStart(2, '0');
            const dStr = `${dayName} ${dd}/${mm} ${hh}:${mins}`;
            
            ctx.fillStyle = "#00e676";
            ctx.font = "bold 32px sans-serif";
            ctx.fillText(`${type}: ${dStr}`, 25, canvas.height - 22);
            
            const regoVal = document.getElementById('regoInput').value.trim().toUpperCase();
            if (regoVal) {
                ctx.fillStyle = "#ffffff";
                ctx.textAlign = "right";
                ctx.fillText(`REGO: ${regoVal}`, canvas.width - 25, canvas.height - 22);
            }
            
            callback(canvas.toDataURL('image/jpeg', 0.65));
        };
        img.src = b64Src;
    }

    function compressAndAddPhoto(file) {
        statusDiv.style.color = "#ffab00";
        statusDiv.innerText = "⚡ COMPRESSING CONDITION PHOTO...";

        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const maxDim = 800;
                let w = img.width, h = img.height;
                if (w > h) {
                    if (w > maxDim) { h = Math.round((h * maxDim) / w); w = maxDim; }
                } else {
                    if (h > maxDim) { w = Math.round((w * maxDim) / h); h = maxDim; }
                }
                canvas.width = w; canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);

                const fastB64 = canvas.toDataURL('image/jpeg', 0.55);
                applyBurnedTimestamp(fastB64, "COND", function(stamped) {
                    conditionPhotos.push(stamped);
                    renderThumbs();
                });
                if (navigator.vibrate) navigator.vibrate(40);

                if (conditionPhotos.length === 1 && (!regoInput.value || !makeSelect.value || !modelInput.value)) {
                    triggerStandaloneAiClassification(fastB64);
                } else {
                    statusDiv.innerText = "";
                }
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

            wrap.appendChild(del);

        });
        validateForm();
    }

    async function triggerStandaloneAiClassification(b64) {
        statusDiv.style.color = "#ffab00";
        statusDiv.innerText = "🔍 AI SCANNING REGO & VEHICLE DETAILS...";

        const needsRego = !regoInput.value || regoInput.value.trim() === "";
        const needsMMCT = !makeSelect.value || !modelInput.value;

        const anprTask = needsRego ? fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'scan_npr', photoBytes: b64 })
        }).then(r => r.json()).catch(() => null) : Promise.resolve(null);

        const aiTask = needsMMCT ? fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'ai_classify', photoBytes: b64 })
        }).then(r => r.json()).catch(() => null) : Promise.resolve(null);

        try {
            const [anprRes, aiRes] = await Promise.all([anprTask, aiTask]);

            if (anprRes && anprRes.rego && (!regoInput.value || regoInput.value.trim() === "")) {
                regoInput.value = anprRes.rego.trim().toUpperCase();
            }

            if (aiRes && aiRes.status === "SUCCESS" && aiRes.result) {
                const r = aiRes.result;
                if (r.make && (!makeSelect.value || makeSelect.value === "")) {
                    let matched = false;
                    for (let i = 0; i < makeSelect.options.length; i++) {
                        if (makeSelect.options[i].value.toLowerCase() === r.make.toLowerCase()) {
                            makeSelect.selectedIndex = i; matched = true; break;
                        }
                    }
                    if (!matched) {
                        makeSelect.value = "Other"; makeOtherInput.style.display = 'block'; makeOtherInput.value = r.make;
                    }
                }
                if (r.model && !modelInput.value) modelInput.value = r.model;
                if (r.colour && (!colourSelect.value || colourSelect.value === "")) {
                    let matched = false;
                    for (let i = 0; i < colourSelect.options.length; i++) {
                        if (colourSelect.options[i].value.toLowerCase() === r.colour.toLowerCase()) {
                            colourSelect.selectedIndex = i; matched = true; break;
                        }
                    }
                    if (!matched) {
                        colourSelect.value = "Other"; colourOtherInput.style.display = 'block'; colourOtherInput.value = r.colour;
                    }
                }
                if (r.bodyType && (!bodyTypeSelect.value || bodyTypeSelect.value === "")) {
                    for (let i = 0; i < bodyTypeSelect.options.length; i++) {
                        const optVal = bodyTypeSelect.options[i].value.toLowerCase();
                        const bLower = r.bodyType.toLowerCase();
                        if (optVal === bLower || (bLower === "ute" && optVal === "utility") || (bLower === "wagon" && optVal === "station wagon")) {
                            bodyTypeSelect.selectedIndex = i; break;
                        }
                    }
                }
            }

            syncDropdownColors();
            validateForm();
            statusDiv.style.color = "#00e676";
            statusDiv.innerText = "✔ DETAILS AUTO-POPULATED";
            setTimeout(() => { statusDiv.innerText = ""; }, 2500);
        } catch(e) {
            statusDiv.innerText = "";
        }
    }

    // ============================================================
    // 3. STORAGE & SUBMISSION
    // ============================================================
   submitBtn.addEventListener('click', (e) => {
        e.preventDefault();
        if (!validateForm() || isSubmitting) return;

        const rego = regoInput.value.trim().toUpperCase();
        isSubmitting = true;
        submitBtn.disabled = true;
        submitBtn.style.opacity = "0.5";
        statusDiv.style.color = "#ffab00";
        statusDiv.innerText = "SECURING TOW LOG...";

        const finalMake = makeSelect.value === "Other" ? makeOtherInput.value.trim() : makeSelect.value;
        const finalColour = colourSelect.value === "Other" ? colourOtherInput.value.trim() : colourSelect.value;
        const compB64 = localStorage.getItem('pending_comp_' + rego) || (initialLoadedRego ? localStorage.getItem('pending_comp_' + initialLoadedRego) : '') || "";
        const propName = propertySelect.value || targetProperty || 'GENERAL';

        const payload = {
            id: 'TOW_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
            action: 'log_tow',
            property: propName,
            origRego: initialLoadedRego || rego,
            rego: rego,
            state: stateSelect.value,
            make: finalMake,
            model: modelInput.value.trim(),
            colour: finalColour,
            bodyType: bodyTypeSelect.value,
            officer: selectedTruck,
            truck: selectedTruck,
            photoBytes: conditionPhotos.length > 0 ? conditionPhotos[0] : "",
            comparisonPhoto: compB64,
            timestamp: new Date().toISOString()
        };

        // Resolve shortform property address for QPS Geocoder
        let resolvedPropAddress = propName;
        try {
            const cachedProps = JSON.parse(localStorage.getItem('cached_properties') || '[]');
            const matchedProp = cachedProps.find(p => p && p.name && p.name.toUpperCase() === propName.toUpperCase());
            if (matchedProp && matchedProp.policelinkAddress) {
                resolvedPropAddress = matchedProp.policelinkAddress;
            }
        } catch(err) {}

        const nowD = new Date();
        const plDate = String(nowD.getDate()).padStart(2, '0') + '/' + String(nowD.getMonth() + 1).padStart(2, '0') + '/' + nowD.getFullYear();
        const plTime = String(nowD.getHours()).padStart(2, '0') + ':' + String(nowD.getMinutes()).padStart(2, '0') + ':00';

        const plPayload = {
            id: 'PL_' + Date.now() + '_' + rego,
            rego: rego,
            state: stateSelect.value || 'QLD',
            date: plDate,
            time: plTime,
            property: propName,
            propertyAddress: resolvedPropAddress,
            yardAddress: "2 Hinde Street, Ashm",
            make: finalMake,
            model: modelInput.value.trim(),
            colour: finalColour || 'White',
            bodyType: bodyTypeSelect.value || 'Sedan',
            inFlightAt: 0
        };

        try {
            let blacklisted = JSON.parse(localStorage.getItem('towed_blacklist') || "{}");
            blacklisted[rego] = Date.now();
            localStorage.setItem('towed_blacklist', JSON.stringify(blacklisted));

            if (initialLoadedRego && initialLoadedRego !== rego) {
                blacklisted[initialLoadedRego] = Date.now();
                localStorage.setItem('towed_blacklist', JSON.stringify(blacklisted));
            }

            let cachedRun = JSON.parse(localStorage.getItem('cached_run_data') || "[]");
            cachedRun = cachedRun.filter(item => {
                const r = String(item.rego).trim().toUpperCase();
                return r !== rego && (!initialLoadedRego || r !== initialLoadedRego);
            });
            localStorage.setItem('cached_run_data', JSON.stringify(cachedRun));
            localStorage.removeItem('pending_comp_' + rego);
            if (initialLoadedRego) localStorage.removeItem('pending_comp_' + initialLoadedRego);
        } catch(err) {}

        // 1. Save & sync tow record immediately
        saveToOfflineQueue(payload);
        syncPendingTowsInBackground();

        // 2. Fire Policelink Bot non-blocking in background
        queuePolicelinkBot(plPayload);
        processPolicelinkBotQueue();

        // 3. Immediately display completion overlay so operator can log next tow right away
        successRego.innerText = rego + " LOGGED";
        successOverlay.style.display = "flex";
    });
    
    function saveToOfflineQueue(payload) {
        try {
            const safePayload = JSON.parse(JSON.stringify(payload));
            if (safePayload.photos) delete safePayload.photos;

            let queue = [];
            try { queue = JSON.parse(localStorage.getItem('tow_offline_queue') || "[]"); } catch(e){}
            
            if (!queue.some(item => item.id === safePayload.id)) {
                queue.push(safePayload);
                localStorage.setItem('tow_offline_queue', JSON.stringify(queue));
            }
        } catch(e) {
            if (e.name === 'QuotaExceededError' || e.name === 'NS_ERROR_DOM_QUOTA_REACHED') {
                localStorage.removeItem('cached_run_data');
                localStorage.removeItem('cached_properties');
                try {
                    let queue = JSON.parse(localStorage.getItem('tow_offline_queue') || "[]");
                    const safePayload = JSON.parse(JSON.stringify(payload));
                    if (safePayload.photos) delete safePayload.photos;
                    queue.push(safePayload);
                    localStorage.setItem('tow_offline_queue', JSON.stringify(queue));
                } catch(retryErr) {}
            }
        }
    }

    function removeFromOfflineQueue(id) {
        try {
            let queue = JSON.parse(localStorage.getItem('tow_offline_queue') || "[]");
            queue = queue.filter(item => item.id !== id);
            localStorage.setItem('tow_offline_queue', JSON.stringify(queue));
        } catch(e) {}
    }

    let isSyncingQueue = false;
    async function syncPendingTowsInBackground() {
        if (isSyncingQueue || !navigator.onLine) return;
        let queue = [];
        try {
            queue = JSON.parse(localStorage.getItem('tow_offline_queue') || "[]");
        } catch(e) { return; }
        
        if (queue.length === 0) return;

        isSyncingQueue = true;
        statusDiv.style.color = "#ffab00";
        statusDiv.innerText = `⚡ SYNCING QUEUED TOW (1/${queue.length})...`;

        for (let i = 0; i < queue.length; i++) {
            const item = queue[i];
            if (item.photos) delete item.photos;

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 20000);

                const res = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(item),
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                const resJson = await res.json();
                if (resJson && resJson.status === "SUCCESS") {
                    removeFromOfflineQueue(item.id);
                    statusDiv.style.color = "#00e676";
                    statusDiv.innerText = "✔ BASEMENT TOW SYNCED TO MASTER LOG";
                    await new Promise(r => setTimeout(r, 2000));
                } else {
                    statusDiv.style.color = "#ff1744";
                    statusDiv.innerText = "⚠️ SYNC REJECTED: " + (resJson.message || "Server Error");
                    if (resJson.message && resJson.message.includes("Missing REGO")) {
                        removeFromOfflineQueue(item.id);
                    } else {
                        await new Promise(r => setTimeout(r, 4000));
                        break;
                    }
                }
            } catch(err) {
                statusDiv.style.color = "#ff1744";
                statusDiv.innerText = "⚠️ NETWORK STALLED. WILL RETRY SHORTLY...";
                break; 
            }
        }
        isSyncingQueue = false;
        
        let finalQueue = [];
        try { finalQueue = JSON.parse(localStorage.getItem('tow_offline_queue') || "[]"); } catch(e){}
        if (finalQueue.length === 0) statusDiv.innerText = "";
    }
    // ============================================================
    // 4. NON-BLOCKING BACKGROUND POLICELINK BOT QUEUE
    // ============================================================
    function queuePolicelinkBot(plPayload) {
        try {
            let plQueue = JSON.parse(localStorage.getItem('pl_bot_queue') || "[]");
            if (!plQueue.some(item => item.rego === plPayload.rego)) {
                plQueue.push(plPayload);
                localStorage.setItem('pl_bot_queue', JSON.stringify(plQueue));
            }
        } catch(e) {}
    }

    function removePolicelinkJob(id) {
        try {
            let plQueue = JSON.parse(localStorage.getItem('pl_bot_queue') || "[]");
            plQueue = plQueue.filter(item => item.id !== id);
            localStorage.setItem('pl_bot_queue', JSON.stringify(plQueue));
        } catch(e) {}
    }

    async function savePlStatusToYardLog(rego, refStatus) {
        // Retry up to 4 times (3s apart) in case Yard_Log row is still being written
        for (let attempt = 0; attempt < 4; attempt++) {
            try {
                const res = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: 'save_yard_details',
                        rego: rego,
                        policelinkRef: refStatus
                    })
                });
                const json = await res.json();
                if (json && json.status === "SUCCESS") return true;
            } catch(e) {}
            await new Promise(r => setTimeout(r, 3000));
        }
        return false;
    }

    let isProcessingPlQueue = false;
    async function processPolicelinkBotQueue() {
        if (isProcessingPlQueue || !navigator.onLine) return;
        let plQueue = [];
        try {
            plQueue = JSON.parse(localStorage.getItem('pl_bot_queue') || "[]");
        } catch(e) { return; }

        if (plQueue.length === 0) return;
        isProcessingPlQueue = true;

        for (let i = 0; i < plQueue.length; i++) {
            const job = plQueue[i];
            // Skip if another tab/reload started this job within the last 45 seconds
            if (job.inFlightAt && (Date.now() - job.inFlightAt) < 45000) continue;

            try {
                job.inFlightAt = Date.now();
                localStorage.setItem('pl_bot_queue', JSON.stringify(plQueue));

                const res = await fetch("https://ashmorehomeserver.tail394009.ts.net/api/lodge-tow", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(job),
                    keepalive: true
                });
                const result = await res.json();

                if (result && result.success) {
                    removePolicelinkJob(job.id);
                    await savePlStatusToYardLog(job.rego, result.ref || "SUBMITTED");
                } else {
                    throw new Error((result && result.error) || "Bot error");
                }
            } catch(err) {
                // If aborted due to page navigation, leave in queue for yard.html to complete
                if (err && err.name === 'AbortError' || document.visibilityState === 'hidden') {
                    job.inFlightAt = 0;
                    localStorage.setItem('pl_bot_queue', JSON.stringify(plQueue));
                    break;
                }
                // First attempt failed -> remove from auto-queue and flag FAILED_1 so Yard App shows Blue Retry button
                removePolicelinkJob(job.id);
                await savePlStatusToYardLog(job.rego, "FAILED_1");
            }
        }

        isProcessingPlQueue = false;
    }
    function resetTowForm() {
        isSubmitting = false;
        initialLoadedRego = "";
        regoInput.value = "";
        modelInput.value = "";
        makeSelect.selectedIndex = 0;
        makeOtherInput.value = "";
        makeOtherInput.style.display = "none";
        colourSelect.selectedIndex = 0;
        colourOtherInput.value = "";
        colourOtherInput.style.display = "none";
        bodyTypeSelect.selectedIndex = 0;

        conditionPhotos = [];
        renderThumbs();

        compPreviewWrap.style.display = "none";
        compPreviewImg.src = "";
        compBtn.classList.remove("comp-ready");
        compBtnText.innerText = "📷 ALIGN & SNAP COMPARISON";
        cachedMarkImageUrl = "";
        cachedMarkedTimestamp = "";

        syncDropdownColors();
        validateForm();
        successOverlay.style.display = "none";
        window.scrollTo(0, 0);
    }
</script>
