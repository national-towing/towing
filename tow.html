<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>TOW</title>
    
    <link rel="apple-touch-icon" href="icon-tow.png?v=44">
    <link rel="icon" type="image/png" href="icon-tow.png?v=44">
    <link rel="manifest" href="manifest-tow.json?v=44">

    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            margin: 0; padding: 14px; background: #121212; color: #fff; 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; 
        }
        
        .header-box { display: flex; align-items: center; justify-content: center; position: relative; width: 100%; max-width: 440px; margin-bottom: 10px; }
        .header-box h1 { margin: 0; font-size: 38px; font-weight: 900; color: #ff1744; letter-spacing: 2px; text-align: center; }
        .icon-btn { position: absolute; right: 0; background: #2a2a2a; border: 1px solid #444; border-radius: 10px; font-size: 20px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; }
        .icon-btn:active { transform: scale(0.9); }

        .nav-bar { display: flex; gap: 8px; width: 100%; max-width: 440px; margin-bottom: 16px; }
        .nav-tile { flex: 1; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 900; text-decoration: none; color: #000; }
        .nav-run { background: #ffab00; }
        .nav-tow { background: #ff1744; color: #fff; }
        .nav-rel { background: #00e676; }
        .nav-pass { background: #ab47bc; color: #fff; }

        .card { background: #1e1e1e; border-radius: 18px; padding: 18px; width: 100%; max-width: 440px; border: 1px solid #333; margin-bottom: 16px; }
        
        label { font-size: 12px; text-transform: uppercase; color: #aaa; display: block; margin-top: 10px; font-weight: 900; letter-spacing: 1px; }
        input, select {
            width: 100%; height: 50px; padding: 0 12px; border-radius: 10px; border: 1px solid #444;
            background: #2a2a2a; color: #fff; font-size: 20px; font-weight: 900; margin-top: 4px; outline: none;
            -webkit-appearance: none;
        }

        .row-rego-state { display: flex; gap: 10px; }
        .row-rego-state > div:first-child { flex: 2; }
        .row-rego-state > div:last-child { flex: 1; }

        .row-2 { display: flex; gap: 10px; }
        .row-2 > div { flex: 1; }

        .camera-box {
            width: 100%; height: 200px; background: #000; border-radius: 12px; border: 2px solid #333;
            margin-top: 10px; overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative;
        }
        video { width: 100%; height: 100%; object-fit: cover; }

        .thumb-gallery { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; padding-bottom: 4px; }
        .thumb-img { width: 70px; height: 70px; border-radius: 10px; object-fit: cover; border: 2px solid #ff1744; cursor: pointer; flex-shrink: 0; }

        .circle-cam-btn {
            width: 90px; height: 90px; background: #ff1744; border: 5px solid #fff; border-radius: 50%;
            margin: 12px auto 0 auto; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 18px rgba(255, 23, 68, 0.4); cursor: pointer; user-select: none;
        }
        .circle-cam-btn:active { transform: scale(0.90); }
        .circle-cam-inner { width: 66px; height: 66px; border-radius: 50%; border: 2px solid #000; }

        .submit-btn {
            background: #ff1744; color: #fff; font-weight: 900; border: none; border-radius: 14px;
            height: 60px; font-size: 26px; width: 100%; margin-top: 18px; cursor: pointer; letter-spacing: 2px;
        }
        .submit-btn:active { transform: scale(0.97); }

        #status { text-align: center; font-weight: 900; font-size: 15px; margin-top: 12px; min-height: 24px; color: #ffab00; }
    </style>
</head>
<body>

<div class="header-box">
    <h1>TOW</h1>
    <div class="icon-btn" id="refreshBtn">🔄</div>
</div>

<div class="nav-bar">
    <a href="run.html" class="nav-tile nav-run">RUN</a>
    <a href="tow.html" class="nav-tile nav-tow">TOW</a>
    <a href="release.html" class="nav-tile nav-rel">REL</a>
    <a href="passes.html" class="nav-tile nav-pass">PASS</a>
</div>

<div class="card">
    <label>PROPERTY</label>
    <select id="propertySelect"><option value="">LOADING PROPERTIES...</option></select>

    <div class="row-rego-state">
        <div>
            <label>REGO</label>
            <input type="text" id="regoInput" placeholder="REGO" style="color:#ff1744; text-transform:uppercase;">
        </div>
        <div>
            <label>STATE</label>
            <select id="stateSelect" style="color:#ffab00;">
                <option value="QLD" selected>QLD</option>
                <option value="NSW">NSW</option>
                <option value="VIC">VIC</option>
                <option value="NT">NT</option>
                <option value="SA">SA</option>
                <option value="TAS">TAS</option>
                <option value="ACT">ACT</option>
                <option value="WA">WA</option>
            </select>
        </div>
    </div>

    <div class="row-2">
        <div>
            <label>MAKE</label>
            <select id="makeSelect" onchange="checkMakeOther(this)">
                <option value="">MAKE</option>
                <option value="Toyota">Toyota</option>
                <option value="Holden">Holden</option>
                <option value="Ford">Ford</option>
                <option value="Hyundai">Hyundai</option>
                <option value="Nissan">Nissan</option>
                <option value="Mitsubishi">Mitsubishi</option>
                <option value="Mazda">Mazda</option>
                <option value="Subaru">Subaru</option>
                <option value="Honda">Honda</option>
                <option value="Volkswagen">Volkswagen</option>
                <option value="Kia">Kia</option>
                <option value="BMW">BMW</option>
                <option value="Mercedes-Benz">Mercedes-Benz</option>
                <option value="Audi">Audi</option>
                <option value="Jeep">Jeep</option>
                <option value="Other">Other</option>
            </select>
            <input type="text" id="makeOtherInput" placeholder="ENTER MAKE" style="display:none; margin-top:4px; font-size:18px;">
        </div>
        <div>
            <label>MODEL</label>
            <input type="text" id="modelInput" placeholder="MODEL">
        </div>
    </div>

    <div class="row-2">
        <div>
            <label>COLOUR</label>
            <select id="colourSelect" onchange="checkColourOther(this)">
                <option value="">COLOUR</option>
                <option value="White">White</option>
                <option value="Black">Black</option>
                <option value="Silver">Silver</option>
                <option value="Grey">Grey</option>
                <option value="Blue">Blue</option>
                <option value="Red">Red</option>
                <option value="Green">Green</option>
                <option value="Yellow">Yellow</option>
                <option value="Gold">Gold</option>
                <option value="Bronze">Bronze</option>
                <option value="Orange">Orange</option>
                <option value="Purple">Purple</option>
                <option value="Brown">Brown</option>
                <option value="Other">Other</option>
            </select>
            <input type="text" id="colourOtherInput" placeholder="ENTER COLOUR" style="display:none; margin-top:4px; font-size:18px;">
        </div>
        <div>
            <label>BODY TYPE</label>
            <select id="bodyTypeSelect">
                <option value="Sedan" selected>Sedan</option>
                <option value="Hatchback">Hatchback</option>
                <option value="Station Wagon">Station Wagon</option>
                <option value="Utility">Utility</option>
                <option value="Van">Van</option>
                <option value="Other">Other</option>
            </select>
        </div>
    </div>

    <label>DRIVER / OFFICER</label>
    <select id="officerSelect" onchange="checkOfficerOther(this)">
        <option value="Brian" selected>Brian</option>
        <option value="Brett">Brett</option>
        <option value="Other">Other...</option>
    </select>
    <input type="text" id="officerOtherInput" placeholder="ENTER DRIVER NAME" style="display:none; margin-top:4px; font-size:18px;">

    <label>CONDITION PHOTOS (SNAP 4 SIDES & DAMAGE)</label>
    <div class="camera-box"><video id="videoElem" autoplay playsinline></video></div>
    <div class="thumb-gallery" id="thumbGallery"></div>
    <div class="circle-cam-btn" id="snapBtn"><div class="circle-cam-inner"></div></div>

    <button class="submit-btn" id="submitBtn">LOG TOW</button>
    <div id="status"></div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";

    const propertySelect = document.getElementById('propertySelect');
    const regoInput = document.getElementById('regoInput');
    const stateSelect = document.getElementById('stateSelect');
    const makeSelect = document.getElementById('makeSelect');
    const makeOtherInput = document.getElementById('makeOtherInput');
    const modelInput = document.getElementById('modelInput');
    const colourSelect = document.getElementById('colourSelect');
    const colourOtherInput = document.getElementById('colourOtherInput');
    const bodyTypeSelect = document.getElementById('bodyTypeSelect');
    const officerSelect = document.getElementById('officerSelect');
    const officerOtherInput = document.getElementById('officerOtherInput');

    const videoElem = document.getElementById('videoElem');
    const snapBtn = document.getElementById('snapBtn');
    const thumbGallery = document.getElementById('thumbGallery');
    const submitBtn = document.getElementById('submitBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const statusDiv = document.getElementById('status');

    let conditionPhotos = [];
    let isSubmitting = false;

    window.addEventListener('load', async () => {
        await loadProperties();
        checkURLParams();
        initCamera();
    });

    refreshBtn.addEventListener('click', () => {
        window.location.reload(true);
    });

    function checkURLParams() {
        const params = new URLSearchParams(window.location.search);
        const urlRego = params.get('rego');
        const urlProp = params.get('prop');
        
        if (urlRego) regoInput.value = urlRego.toUpperCase();
        if (urlProp) {
            const propName = decodeURIComponent(urlProp).trim();
            for (let i = 0; i < propertySelect.options.length; i++) {
                if (propertySelect.options[i].value.trim().toUpperCase() === propName.toUpperCase()) {
                    propertySelect.selectedIndex = i;
                    break;
                }
            }
        }
    }

    function checkMakeOther(selectElem) {
        if (selectElem.value === "Other") {
            makeOtherInput.style.display = 'block';
            makeOtherInput.focus();
        } else {
            makeOtherInput.style.display = 'none';
        }
    }

    function checkColourOther(selectElem) {
        if (selectElem.value === "Other") {
            colourOtherInput.style.display = 'block';
            colourOtherInput.focus();
        } else {
            colourOtherInput.style.display = 'none';
        }
    }

    function checkOfficerOther(selectElem) {
        if (selectElem.value === "Other") {
            officerOtherInput.style.display = 'block';
            officerOtherInput.focus();
        } else {
            officerOtherInput.style.display = 'none';
        }
    }

    async function loadProperties() {
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL + "?action=get_properties");
            const data = await res.json();
            propertySelect.innerHTML = "";
            data.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.name; opt.innerText = p.name;
                propertySelect.appendChild(opt);
            });
        } catch(e) {}
    }

    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            videoElem.srcObject = stream;
        } catch(e) {}
    }

    snapBtn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();

        const canvas = document.createElement('canvas');
        canvas.width = videoElem.videoWidth || 1024;
        canvas.height = videoElem.videoHeight || 576;
        canvas.getContext('2d').drawImage(videoElem, 0, 0);
        const b64 = canvas.toDataURL('image/jpeg', 0.65);
        conditionPhotos.push(b64);

        const img = document.createElement('img');
        img.src = b64; img.className = 'thumb-img';
        thumbGallery.appendChild(img);

        statusDiv.innerText = `✔ PHOTO ${conditionPhotos.length} CAPTURED`;
    });

    submitBtn.addEventListener('click', async (e) => {
        e.preventDefault();
        if (isSubmitting) return;

        const rego = regoInput.value.trim().toUpperCase();
        if (!rego) { statusDiv.innerText = "ENTER REGO FIRST"; return; }

        isSubmitting = true;
        submitBtn.disabled = true;
        submitBtn.style.opacity = "0.5";

        const finalMake = makeSelect.value === "Other" ? makeOtherInput.value.trim() : makeSelect.value;
        const finalColour = colourSelect.value === "Other" ? colourOtherInput.value.trim() : colourSelect.value;
        const driver = officerSelect.value === "Other" ? officerOtherInput.value.trim() : officerSelect.value;

        const payload = {
            action: 'log_tow',
            property: propertySelect.value,
            rego: rego,
            state: stateSelect.value,
            make: finalMake,
            model: modelInput.value.trim(),
            colour: finalColour,
            bodyType: bodyTypeSelect.value,
            officer: driver,
            photos: conditionPhotos
        };

        statusDiv.innerText = "LOGGING TOW TO YARD...";
        try {
            await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
            statusDiv.innerText = "✔ TOW LOGGED SUCCESS!";
        } catch(err) {
            statusDiv.innerText = "ERROR LOGGING TOW";
        }

        setTimeout(() => {
            window.location.href = "run.html";
        }, 1200);
    });
</script>
</body>
</html>
