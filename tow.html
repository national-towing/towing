<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

    <title>TOW</title>

    <link rel="apple-touch-icon" href="icon-manager.png?v=2">
    <link rel="icon" type="image/png" href="icon-manager.png?v=2">
    <link rel="manifest" href="manifest-tow.json?v=2">

    <style>
        :root {
            --bg: #121212; --card-bg: #1e1e1e; --border: #333333;
            --c-mark: #2979ff; --c-run: #ffab00; --c-tow: #ff1744;
            --c-pass: #ab47bc; --c-yard: #00b0ff; --c-rel: #00e676;
        }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: 14px; background: var(--bg); color: #fff; display: flex; flex-direction: column; align-items: center; }

        .header-box { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 440px; margin-bottom: 12px; }
        .nav-grid-3x2 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; max-width: 440px; margin: 0 auto 14px auto; }
        .nav-tile { height: 38px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; text-decoration: none; color: #000; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .t-mark { background: var(--c-mark); color: #fff; }
        .t-run { background: var(--c-run); color: #000; }
        .t-tow { background: var(--c-tow); color: #fff; box-shadow: 0 0 0 2px #fff; }
        .t-pass { background: var(--c-pass); color: #fff; }
        .t-yard { background: var(--c-yard); color: #000; }
        .t-rel { background: var(--c-rel); color: #000; }

        .card { background: var(--card-bg); border-radius: 18px; padding: 18px; width: 100%; max-width: 440px; border: 1px solid var(--border); margin-bottom: 16px; }
        label { font-size: 12px; font-weight: 900; color: #888; text-transform: uppercase; margin-top: 14px; display: block; }
        input, select { width: 100%; height: 52px; padding: 0 12px; border-radius: 10px; border: 1px solid #444; background: #2a2a2a; color: #fff; font-size: 18px; font-weight: 900; outline: none; margin-top: 4px; }
        
        .row-2 { display: flex; gap: 8px; }
        .row-2 > div { flex: 1; }

        .cam-btn { width: 100%; height: 60px; border: 2.5px dashed var(--c-tow); border-radius: 12px; background: #2a1215; color: var(--c-tow); font-size: 18px; font-weight: 900; display: flex; align-items: center; justify-content: center; cursor: pointer; margin-top: 12px; }
        
        .thumb-gallery { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; padding-bottom: 6px; }
        .thumb { width: 70px; height: 70px; border-radius: 10px; object-fit: cover; border: 2px solid var(--c-tow); flex-shrink: 0; }

        .submit-btn { width: 100%; height: 60px; border-radius: 14px; border: none; background: var(--c-tow); color: #fff; font-size: 24px; font-weight: 900; cursor: pointer; margin-top: 20px; letter-spacing: 2px; }
        .submit-btn:disabled { opacity: 0.5; }
        #status { text-align: center; color: var(--c-run); font-weight: 900; margin-top: 12px; min-height: 24px; }
    </style>
</head>
<body>

<div class="header-box">
    <div style="display:flex; align-items:center; gap:10px;">
        <img src="icon-manager.png" alt="Logo" style="width:40px; height:40px; border-radius:8px; object-fit:contain; border:1px solid #444; background:#000;">
        <div style="display:flex; flex-direction:column;">
            <span style="font-size:17px; font-weight:900; color:#ffab00; letter-spacing:1px; line-height:1;">NATIONAL TOWING</span>
            <span style="font-size:11px; font-weight:800; color:#aaa; letter-spacing:1px;">OPERATIONS HUB</span>
        </div>
    </div>
</div>

<div class="nav-grid-3x2">
    <a href="mark.html" class="nav-tile t-mark">MARK</a>
    <a href="run.html" class="nav-tile t-run">RUN</a>
    <a href="tow.html" class="nav-tile t-tow">TOW</a>
    <a href="passes.html" class="nav-tile t-pass">PASS</a>
    <a href="yard.html" class="nav-tile t-yard">YARD</a>
    <a href="release.html" class="nav-tile t-rel">REL</a>
</div>

<div class="card">
    <div class="row-2">
        <div>
            <label>REGO</label>
            <input type="text" id="regoInput" placeholder="REGO" style="color:var(--c-tow); text-transform:uppercase;">
        </div>
        <div>
            <label>PROPERTY</label>
            <select id="propertySelect"><option value="">LOADING...</option></select>
        </div>
    </div>

    <label>CONDITION PHOTOS (REQ: 3)</label>
    <button type="button" class="cam-btn" onclick="document.getElementById('condInput').click()">📷 SNAP CONDITION</button>
    <input type="file" id="condInput" accept="image/*" capture="environment" style="display:none;" onchange="processCondPhoto(this)">
    <div class="thumb-gallery" id="condGallery"></div>

    <div class="row-2">
        <div>
            <label>MAKE</label>
            <input type="text" id="makeInput" placeholder="MAKE">
        </div>
        <div>
            <label>MODEL</label>
            <input type="text" id="modelInput" placeholder="MODEL">
        </div>
    </div>

    <div class="row-2">
        <div>
            <label>COLOUR</label>
            <select id="colourSelect">
                <option value="White" selected>White</option>
                <option value="Black">Black</option>
                <option value="Silver">Silver</option>
                <option value="Grey">Grey</option>
                <option value="Blue">Blue</option>
                <option value="Red">Red</option>
                <option value="Green">Green</option>
                <option value="Yellow">Yellow</option>
                <option value="Brown">Brown</option>
                <option value="Gold">Gold</option>
                <option value="Other">Other</option>
            </select>
        </div>
        <div>
            <label>BODY TYPE</label>
            <select id="bodyTypeSelect">
                <option value="Sedan" selected>Sedan</option>
                <option value="Hatchback">Hatchback</option>
                <option value="SUV">SUV</option>
                <option value="Ute">Ute</option>
                <option value="Van">Van</option>
                <option value="Wagon">Wagon</option>
                <option value="Coupe">Coupe</option>
                <option value="Convertible">Convertible</option>
            </select>
        </div>
    </div>
    
    <label>DRIVER</label>
    <select id="driverSelect">
        <option value="Brian" selected>Brian</option>
        <option value="Brett">Brett</option>
    </select>

    <button type="button" class="submit-btn" id="submitBtn">CONFIRM TOW</button>
    <div id="status"></div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "[https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec](https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec)";
    
    let condPhotos = [];
    let isSubmitting = false;

    window.addEventListener('load', async () => {
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL + "?action=get_properties");
            const props = await res.json();
            const sel = document.getElementById('propertySelect');
            sel.innerHTML = "<option value='GENERAL'>GENERAL</option>";
            props.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.name; opt.innerText = p.name;
                sel.appendChild(opt);
            });
        } catch(e) {}

        const cachedRun = JSON.parse(localStorage.getItem('cached_run_data') || "[]");
        const urlParams = new URLSearchParams(window.location.search);
        const targetRego = (urlParams.get('rego') || '').trim().toUpperCase();
        
        if (targetRego) {
            document.getElementById('regoInput').value = targetRego;
            const match = cachedRun.find(c => c.rego === targetRego);
            if (match) {
                document.getElementById('propertySelect').value = match.property || 'GENERAL';
                if (match.make) document.getElementById('makeInput').value = match.make;
                if (match.model) document.getElementById('modelInput').value = match.model;
                if (match.colour) {
                    const cOpts = Array.from(document.getElementById('colourSelect').options);
                    const found = cOpts.find(o => o.value.toUpperCase() === match.colour.toUpperCase());
                    if (found) document.getElementById('colourSelect').value = found.value;
                }
                if (match.bodyType) {
                    const bOpts = Array.from(document.getElementById('bodyTypeSelect').options);
                    const found = bOpts.find(o => o.value.toUpperCase() === match.bodyType.toUpperCase());
                    if (found) document.getElementById('bodyTypeSelect').value = found.value;
                }
            }
        }
    });

    function processCondPhoto(input) {
        if (!input.files || !input.files[0]) return;
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const MAX_W = 1000;
                let w = img.width, h = img.height;
                if (w > MAX_W) { h = Math.round((MAX_W / w) * h); w = MAX_W; }
                canvas.width = w; canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);
                const b64 = canvas.toDataURL('image/jpeg', 0.6);
                
                condPhotos.push(b64);
                const thumb = document.createElement('img');
                thumb.className = 'thumb'; thumb.src = b64;
                document.getElementById('condGallery').appendChild(thumb);
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    document.getElementById('submitBtn').addEventListener('click', async () => {
        if (isSubmitting) return;
        const rego = document.getElementById('regoInput').value.trim().toUpperCase();
        if (!rego || condPhotos.length < 1) { document.getElementById('status').innerText = "⚠️ ENTER REGO & ADD CONDITION PHOTOS"; return; }
        
        isSubmitting = true;
        document.getElementById('submitBtn').disabled = true;
        document.getElementById('submitBtn').innerText = "TOWING...";
        
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST', body: JSON.stringify({
                    action: 'log_tow',
                    rego: rego,
                    property: document.getElementById('propertySelect').value,
                    make: document.getElementById('makeInput').value.trim(),
                    model: document.getElementById('modelInput').value.trim(),
                    colour: document.getElementById('colourSelect').value,
                    bodyType: document.getElementById('bodyTypeSelect').value,
                    officer: document.getElementById('driverSelect').value,
                    photos: condPhotos
                })
            });
            const data = await res.json();
            if (data.status === "SUCCESS") {
                window.location.href = "yard.html";
            } else {
                document.getElementById('status').innerText = "ERROR: " + data.message;
                isSubmitting = false;
                document.getElementById('submitBtn').disabled = false;
                document.getElementById('submitBtn').innerText = "CONFIRM TOW";
            }
        } catch(e) {
            document.getElementById('status').innerText = "NETWORK ERROR";
            isSubmitting = false;
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('submitBtn').innerText = "CONFIRM TOW";
        }
    });
</script>
</body>
</html>
