<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>TOW</title>
    
    <link rel="apple-touch-icon" href="icon-tow.png?v=1002">
    <link rel="icon" type="image/png" href="icon-tow.png?v=1002">
    <link rel="manifest" href="manifest-tow.json?v=1002">

    <style>
        :root {
            --c-mark: #2979ff;
            --c-run: #ffab00;
            --c-tow: #ff1744;
            --c-admin: #ab47bc;
            --c-yard: #00b0ff;
            --c-rel: #00e676;
        }
        * { box-sizing: border-box; }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #121212;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            padding-top: max(16px, env(safe-area-inset-top));
            padding-bottom: max(20px, env(safe-area-inset-bottom));
        }

        .header-box {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            max-width: 440px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }
        .header-box h1 {
            margin: 0;
            font-size: 32px;
            font-weight: 900;
            color: var(--c-tow);
            letter-spacing: 2px;
            text-align: center;
        }
        .icon-btn {
            position: absolute;
            right: 0;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            font-size: 18px;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #fff;
        }
        .icon-btn:active { transform: scale(0.92); }

        /* 3x2 Grid Navigation */
        .nav-grid-3x2 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            width: 100%;
            max-width: 440px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }
        .nav-tile {
            height: 38px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 900;
            text-decoration: none;
            color: #000;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .nav-tile:active { transform: scale(0.96); }
        .t-mark  { background: var(--c-mark); color: #fff; }
        .t-run   { background: var(--c-run); color: #000; }
        .t-tow   { background: var(--c-tow); color: #fff; box-shadow: 0 0 0 2px #fff; }
        .t-admin { background: var(--c-admin); color: #fff; }
        .t-yard  { background: var(--c-yard); color: #000; }
        .t-rel   { background: var(--c-rel); color: #000; }

        .container {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 14px;
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 14px;
            gap: 10px;
        }

        .f-field { display: flex; flex-direction: column; gap: 4px; }
        .f-label { font-size: 10px; font-weight: 900; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
        .f-input {
            width: 100%;
            height: 42px;
            background: #242424;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 0 10px;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            outline: none;
        }
        .f-input:focus { border-color: var(--c-tow); }
        .f-rego { font-family: monospace; font-size: 20px; text-transform: uppercase; }

        .f-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        .cam-box {
            width: 100%;
            height: 120px;
            background: #111;
            border: 2px dashed #444;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            position: relative;
        }
        .cam-box img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
        .cam-box-label { font-size: 11px; font-weight: 900; color: #aaa; text-transform: uppercase; margin-top: 4px; }

        .btn-submit-tow {
            height: 48px;
            background: var(--c-tow);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 8px;
            flex-shrink: 0;
        }
        .btn-submit-tow:disabled { background: #555; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="header-box">
    <h1>TOW VEHICLE</h1>
    <div class="icon-btn" onclick="window.location.reload(true)">🔄</div>
</div>

<div class="nav-grid-3x2">
    <a href="mark.html" class="nav-tile t-mark">MARK</a>
    <a href="run.html" class="nav-tile t-run">RUN</a>
    <a href="tow.html" class="nav-tile t-tow">TOW</a>
    <a href="admin.html" class="nav-tile t-admin">ADMIN</a>
    <a href="yard.html" class="nav-tile t-yard">YARD</a>
    <a href="release.html" class="nav-tile t-rel">REL</a>
</div>

<form class="container" onsubmit="submitTow(event)">
    <div class="f-field">
        <label class="f-label">Property</label>
        <select id="towProperty" class="f-input" required></select>
    </div>

    <div class="f-field">
        <label class="f-label">Registration Number</label>
        <input type="text" id="towRego" class="f-input f-rego" placeholder="ENTER PLATE" required>
    </div>

    <!-- AI CAMERA HOOK -->
    <div class="f-field">
        <label class="f-label">Vehicle Photo (AI Vision Scan)</label>
        <div class="cam-box" onclick="triggerCam('mainCamInput')">
            <img id="mainCamPreview" style="display:none;">
            <div style="font-size:32px;">📷</div>
            <div class="cam-box-label" id="camStatus">Tap to Photograph Vehicle</div>
        </div>
        <input type="file" id="mainCamInput" accept="image/*" capture="environment" style="display:none;" onchange="handleTowPhoto(this)">
    </div>

    <div class="f-grid-2">
        <div class="f-field">
            <label class="f-label">Make</label>
            <input type="text" id="towMake" class="f-input" placeholder="e.g. Toyota">
        </div>
        <div class="f-field">
            <label class="f-label">Model</label>
            <input type="text" id="towModel" class="f-input" placeholder="e.g. Corolla">
        </div>
    </div>

    <div class="f-grid-2">
        <div class="f-field">
            <label class="f-label">Colour</label>
            <select id="towColour" class="f-input">
                <option value="White">White</option>
                <option value="Black">Black</option>
                <option value="Silver">Silver</option>
                <option value="Grey">Grey</option>
                <option value="Blue">Blue</option>
                <option value="Red">Red</option>
                <option value="Green">Green</option>
                <option value="Yellow">Yellow</option>
                <option value="Gold">Gold</option>
                <option value="Bronze">Bronze</option>
                <option value="Orange">Orange</option>
                <option value="Purple">Purple</option>
                <option value="Brown">Brown</option>
                <option value="Other">Other</option>
            </select>
        </div>
        <div class="f-field">
            <label class="f-label">Body Type</label>
            <select id="towBodyType" class="f-input">
                <option value="Sedan">Sedan</option>
                <option value="Hatchback">Hatchback</option>
                <option value="SUV">SUV</option>
                <option value="Station Wagon">Station Wagon</option>
                <option value="Utility">Utility</option>
                <option value="Van">Van</option>
                <option value="Coupe">Coupe</option>
                <option value="Convertible">Convertible</option>
                <option value="Other">Other</option>
            </select>
        </div>
    </div>

    <div class="f-grid-2">
        <div class="f-field">
            <label class="f-label">Driver</label>
            <select id="towDriver" class="f-input">
                <option value="Brian">Brian (Truck 3676)</option>
                <option value="Brett">Brett (Truck 3921)</option>
            </select>
        </div>
        <div class="f-field">
            <label class="f-label">Tow Reason</label>
            <input type="text" id="towReason" class="f-input" value="EXPIRED PARKING / NO PASS">
        </div>
    </div>

    <button type="submit" id="btnSubmit" class="btn-submit-tow">IMPOUND VEHICLE 🚨</button>
</form>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";
    let capturedPhotoBase64 = "";

    window.addEventListener('load', () => {
        loadProperties();
        
        // Auto-fill from URL params if coming from Run app
        const params = new URLSearchParams(window.location.search);
        if (params.get('rego')) document.getElementById('towRego').value = params.get('rego').toUpperCase();
        if (params.get('make')) document.getElementById('towMake').value = params.get('make');
        if (params.get('model')) document.getElementById('towModel').value = params.get('model');
    });

    async function loadProperties() {
        const propSel = document.getElementById('towProperty');
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL + "?action=get_properties");
            const data = await res.json();
            propSel.innerHTML = "<option value=''>-- SELECT PROPERTY --</option>";
            data.forEach(p => {
                const name = typeof p === 'object' ? p.name : p;
                if (name) {
                    const opt = document.createElement('option');
                    opt.value = name;
                    opt.innerText = name;
                    propSel.appendChild(opt);
                }
            });
            const params = new URLSearchParams(window.location.search);
            if (params.get('property')) propSel.value = params.get('property');
        } catch(e) {}
    }

    function triggerCam(id) {
        document.getElementById(id).click();
    }

    function handleTowPhoto(input) {
        if (!input.files || !input.files[0]) return;
        const file = input.files[0];
        document.getElementById('camStatus').innerText = "Analyzing with AI...";

        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const maxDim = 960;
                let w = img.width, h = img.height;
                if (w > maxDim || h > maxDim) {
                    if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
                    else { w = Math.round((w * maxDim) / h); h = maxDim; }
                }
                canvas.width = w; canvas.height = h;
                canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                capturedPhotoBase64 = canvas.toDataURL('image/jpeg', 0.65);
                
                const prev = document.getElementById('mainCamPreview');
                prev.src = capturedPhotoBase64;
                prev.style.display = 'block';

                // Query ANPR & Gemini Server-Side
                queryAiClassification(capturedPhotoBase64);
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    async function queryAiClassification(b64) {
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'ai_classify', photoBytes: b64 })
            });
            const data = await res.json();
            if (data.status === "SUCCESS" && data.result) {
                if (data.result.make) document.getElementById('towMake').value = data.result.make;
                if (data.result.model) document.getElementById('towModel').value = data.result.model;
                if (data.result.colour) document.getElementById('towColour').value = data.result.colour;
                if (data.result.bodyType) document.getElementById('towBodyType').value = data.result.bodyType;
                document.getElementById('camStatus').innerText = "AI Identified Vehicle ✔";
            }
        } catch(e) {
            document.getElementById('camStatus').innerText = "Photo Saved";
        }
    }

    async function submitTow(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        btn.innerText = "IMPOUNDING TO YARD...";
        btn.disabled = true;

        const payload = {
            action: 'log_tow',
            property: document.getElementById('towProperty').value,
            rego: document.getElementById('towRego').value.trim().toUpperCase(),
            make: document.getElementById('towMake').value.trim(),
            model: document.getElementById('towModel').value.trim(),
            colour: document.getElementById('towColour').value,
            bodyType: document.getElementById('towBodyType').value,
            officer: document.getElementById('towDriver').value,
            reason: document.getElementById('towReason').value,
            photoBytes: capturedPhotoBase64
        };

        try {
            const res = await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (data.status === "SUCCESS") {
                alert(`Vehicle ${payload.rego} successfully impounded into Yard Log!`);
                window.location.href = "yard.html";
            } else {
                alert("Error: " + data.message);
                btn.innerText = "IMPOUND VEHICLE 🚨";
                btn.disabled = false;
            }
        } catch(err) {
            alert("Network error processing tow.");
            btn.innerText = "IMPOUND VEHICLE 🚨";
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
