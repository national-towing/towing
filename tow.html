<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>TOW</title>
    
    <link rel="apple-touch-icon" href="icon-tow.png?v=21">
    <link rel="icon" type="image/png" href="icon-tow.png?v=21">
    <link rel="manifest" href="manifest-tow.json?v=21">

    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            margin: 0; padding: 14px; background: #121212; color: #fff; 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; 
        }
        
        .header-box { display: flex; align-items: center; justify-content: center; position: relative; width: 100%; max-width: 440px; margin-bottom: 10px; }
        .header-box h1 { margin: 0; font-size: 38px; font-weight: 900; color: #ff1744; letter-spacing: 2px; text-align: center; }
        .icon-btn { position: absolute; right: 0; background: #2a2a2a; border: 1px solid #444; border-radius: 10px; font-size: 20px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; }
        .icon-btn:active { transform: scale(0.9); }

        .nav-bar { display: flex; gap: 8px; width: 100%; max-width: 440px; margin-bottom: 16px; }
        .nav-tile { flex: 1; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 900; text-decoration: none; color: #000; }
        .nav-run { background: #ffab00; }
        .nav-tow { background: #ff1744; color: #fff; }
        .nav-rel { background: #00e676; }
        .nav-pass { background: #ab47bc; color: #fff; }

        .card { background: #1e1e1e; border-radius: 18px; padding: 18px; width: 100%; max-width: 440px; border: 1px solid #333; }
        
        label { font-size: 13px; text-transform: uppercase; color: #aaa; display: block; margin-top: 14px; font-weight: 900; letter-spacing: 1px; }
        input, select {
            width: 100%; height: 56px; padding: 0 14px; border-radius: 12px; border: 1px solid #444;
            background: #2a2a2a; color: #fff; font-size: 20px; font-weight: 900; margin-top: 6px; outline: none;
            -webkit-appearance: none;
        }

        .camera-box {
            width: 100%; height: 260px; background: #000; border-radius: 14px; border: 2px solid #333;
            margin-top: 14px; overflow: hidden; display: flex; align-items: center; justify-content: center;
        }
        video { width: 100%; height: 100%; object-fit: cover; }

        .thumb-gallery { display: flex; gap: 10px; margin-top: 14px; overflow-x: auto; padding-bottom: 4px; }
        .thumb-img { width: 75px; height: 75px; border-radius: 12px; object-fit: cover; border: 3px solid #ff1744; cursor: pointer; flex-shrink: 0; }

        .circle-cam-btn {
            width: 110px; height: 110px; background: #00e676; border: 6px solid #fff; border-radius: 50%;
            margin: 16px auto 0 auto; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 26px rgba(0, 230, 118, 0.6); cursor: pointer; user-select: none;
        }
        .circle-cam-btn:active { transform: scale(0.90); }
        .circle-cam-inner { width: 84px; height: 84px; border-radius: 50%; border: 3px solid #000; }

        .submit-btn {
            background: #ff1744; color: #fff; font-weight: 900; border: none; border-radius: 14px;
            height: 60px; font-size: 28px; width: 100%; margin-top: 20px; cursor: pointer; letter-spacing: 2px;
        }
        .submit-btn:active { transform: scale(0.97); }
        
        .policelink-btn {
            display: none; width: 100%; height: 56px; background: #2979ff; color: #fff; font-weight: 900;
            border: none; border-radius: 14px; margin-top: 14px; font-size: 20px; cursor: pointer; letter-spacing: 1px;
            text-align: center; line-height: 56px; text-decoration: none;
        }

        .row-2 { display: flex; gap: 10px; }
        .row-2 > div { flex: 1; }
        #status { text-align: center; font-weight: 900; font-size: 16px; margin-top: 16px; min-height: 24px; color: #00e676; }
    </style>
</head>
<body>

<div class="header-box">
    <h1>TOW</h1>
    <div class="icon-btn" id="refreshBtn">🔄</div>
</div>

<div class="nav-bar">
    <a href="run.html" class="nav-tile nav-run">RUN</a>
    <a href="tow.html" class="nav-tile nav-tow">TOW</a>
    <a href="release.html" class="nav-tile nav-rel">REL</a>
    <a href="passes.html" class="nav-tile nav-pass">PASS</a>
</div>

<div class="card">
    <label>REGO</label>
    <input type="text" id="regoInput" placeholder="REGO" style="font-size:28px; color:#ff1744; text-transform:uppercase;">

    <div class="row-2">
        <div>
            <label>MAKE</label>
            <select id="makeSelect" onchange="checkOther(this, 'makeCustomInput')">
                <option value="Toyota" selected>Toyota</option>
                <option value="Holden">Holden</option>
                <option value="Ford">Ford</option>
                <option value="Mazda">Mazda</option>
                <option value="Hyundai">Hyundai</option>
                <option value="Nissan">Nissan</option>
                <option value="Mitsubishi">Mitsubishi</option>
                <option value="Volkswagen">Volkswagen</option>
                <option value="Subaru">Subaru</option>
                <option value="Kia">Kia</option>
                <option value="BMW">BMW</option>
                <option value="Mercedes-Benz">Mercedes-Benz</option>
                <option value="OTHER">Other...</option>
            </select>
            <input type="text" id="makeCustomInput" placeholder="ENTER MAKE" style="display:none; margin-top:6px;">
        </div>
        <div>
            <label>MODEL</label>
            <select id="modelSelect" onchange="checkOther(this, 'modelCustomInput')">
                <option value="Corolla" selected>Corolla</option>
                <option value="Camry">Camry</option>
                <option value="Hilux">Hilux</option>
                <option value="Commodore">Commodore</option>
                <option value="Falcon">Falcon</option>
                <option value="Ranger">Ranger</option>
                <option value="CX-5">CX-5</option>
                <option value="i30">i30</option>
                <option value="Tucson">Tucson</option>
                <option value="Swift">Swift</option>
                <option value="Triton">Triton</option>
                <option value="Golf">Golf</option>
                <option value="OTHER">Other...</option>
            </select>
            <input type="text" id="modelCustomInput" placeholder="ENTER MODEL" style="display:none; margin-top:6px;">
        </div>
    </div>

    <div class="row-2">
        <div>
            <label>COLOUR</label>
            <select id="colourSelect" onchange="checkOther(this, 'colourCustomInput')">
                <option value="White" selected>White</option>
                <option value="Black">Black</option>
                <option value="Silver">Silver</option>
                <option value="Grey">Grey</option>
                <option value="Blue">Blue</option>
                <option value="Red">Red</option>
                <option value="Green">Green</option>
                <option value="Yellow">Yellow</option>
                <option value="Gold">Gold</option>
                <option value="OTHER">Other...</option>
            </select>
            <input type="text" id="colourCustomInput" placeholder="ENTER COLOUR" style="display:none; margin-top:6px;">
        </div>
        <div>
            <label>BODY</label>
            <select id="bodySelect">
                <option value="Sedan" selected>Sedan</option>
                <option value="Hatchback">Hatchback</option>
                <option value="Station Wagon">Station Wagon</option>
                <option value="Utility">Utility</option>
                <option value="Van">Van</option>
                <option value="Other">Other</option>
            </select>
        </div>
    </div>

    <div class="row-2">
        <div>
            <label>DRIVER</label>
            <select id="driverSelect">
                <option value="Brett">Brett</option>
                <option value="Brian" selected>Brian</option>
                <option value="Other">Other</option>
            </select>
        </div>
        <div>
            <label>PROPERTY</label>
            <select id="propertySelect"><option value="">LOADING...</option></select>
        </div>
    </div>

    <div class="camera-box"><video id="videoElem" autoplay playsinline></video></div>
    <div class="thumb-gallery" id="thumbGallery"></div>
    <div class="circle-cam-btn" id="snapBtn"><div class="circle-cam-inner"></div></div>

    <button class="submit-btn" id="submitBtn">TOW</button>
    <a href="#" target="_blank" class="policelink-btn" id="policelinkBtn">🚨 OPEN POLICELINK FORM</a>
    <div id="status"></div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";

    const regoInput = document.getElementById('regoInput');
    const makeSelect = document.getElementById('makeSelect');
    const makeCustomInput = document.getElementById('makeCustomInput');
    const modelSelect = document.getElementById('modelSelect');
    const modelCustomInput = document.getElementById('modelCustomInput');
    const colourSelect = document.getElementById('colourSelect');
    const colourCustomInput = document.getElementById('colourCustomInput');
    const bodySelect = document.getElementById('bodySelect');
    const driverSelect = document.getElementById('driverSelect');
    const propertySelect = document.getElementById('propertySelect');
    const videoElem = document.getElementById('videoElem');
    const snapBtn = document.getElementById('snapBtn');
    const thumbGallery = document.getElementById('thumbGallery');
    const submitBtn = document.getElementById('submitBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const policelinkBtn = document.getElementById('policelinkBtn');
    const statusDiv = document.getElementById('status');
    const photos = [];

    window.addEventListener('load', () => {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('rego')) regoInput.value = urlParams.get('rego');
        loadProperties(urlParams.get('prop'));
        initCamera();
    });

    refreshBtn.addEventListener('click', () => {
        window.location.reload(true);
    });

    function checkOther(selectElem, customInputId) {
        const customInput = document.getElementById(customInputId);
        if (selectElem.value === "OTHER") {
            customInput.style.display = 'block';
            customInput.focus();
        } else {
            customInput.style.display = 'none';
        }
    }

    async function loadProperties(selectedProp) {
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL + "?action=get_properties");
            const data = await res.json();
            propertySelect.innerHTML = "";
            data.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.name; opt.innerText = p.name;
                if (selectedProp && p.name.toUpperCase() === selectedProp.toUpperCase()) opt.selected = true;
                propertySelect.appendChild(opt);
            });
        } catch(e) {}
    }

    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            videoElem.srcObject = stream;
        } catch(e) {}
    }

    snapBtn.addEventListener('click', () => {
        const canvas = document.createElement('canvas');
        canvas.width = videoElem.videoWidth || 640;
        canvas.height = videoElem.videoHeight || 480;
        canvas.getContext('2d').drawImage(videoElem, 0, 0);
        const b64 = canvas.toDataURL('image/jpeg', 0.8);
        photos.push(b64);

        const img = document.createElement('img');
        img.src = b64; img.className = 'thumb-img';
        thumbGallery.appendChild(img);
    });

    submitBtn.addEventListener('click', async () => {
        const rego = regoInput.value.trim().toUpperCase();
        if (!rego) { statusDiv.innerText = "ENTER REGO"; return; }

        const finalMake = makeSelect.value === "OTHER" ? makeCustomInput.value.trim() : makeSelect.value;
        const finalModel = modelSelect.value === "OTHER" ? modelCustomInput.value.trim() : modelSelect.value;
        const finalColour = colourSelect.value === "OTHER" ? colourCustomInput.value.trim() : colourSelect.value;

        const payload = {
            action: 'log_tow', 
            rego: rego, 
            make: finalMake, 
            model: finalModel,
            colour: finalColour, 
            bodyType: bodySelect.value, 
            property: propertySelect.value, 
            officer: driverSelect.value,
            photos: photos
        };

        statusDiv.innerText = "LOGGING TOW & SAVING PHOTOS...";
        try {
            await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
            statusDiv.innerText = "✔ VEHICLE TOWED SUCCESS!";
        } catch(err) {
            let offlineQueue = JSON.parse(localStorage.getItem('offline_tows') || '[]');
            offlineQueue.push(payload);
            localStorage.setItem('offline_tows', JSON.stringify(offlineQueue));
            statusDiv.innerText = "⚠️ OFFLINE: LOGGED LOCALLY";
        }

        const qpsLaunchUrl = `https://www.police.qld.gov.au/policelink-reporting/tow-notification-launch?rego=${encodeURIComponent(rego)}&make=${encodeURIComponent(finalMake)}&model=${encodeURIComponent(finalModel)}&colour=${encodeURIComponent(finalColour)}&location=${encodeURIComponent(propertySelect.value)}`;
        
        policelinkBtn.href = qpsLaunchUrl;
        policelinkBtn.style.display = 'block';
    });
</script>
</body>
</html>
