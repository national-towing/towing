<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TOW</title>
    <link rel="apple-touch-icon" href="icon-tow.png?v=10004">
    <link rel="icon" type="image/png" href="icon-tow.png?v=10004">
    <style>
        :root { --c-mark: #2979ff; --c-run: #ffab00; --c-tow: #ff1744; --c-pass: #ab47bc; --c-yard: #00b0ff; --c-rel: #00e676; }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; margin: 0; padding: 12px; background: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .header-box { display: flex; align-items: center; justify-content: center; position: relative; width: 100%; max-width: 440px; margin-bottom: 8px; }
        .header-box h1 { margin: 0; font-size: 34px; font-weight: 900; color: #ff1744; letter-spacing: 2px; }
        .icon-btn { position: absolute; right: 0; background: #2a2a2a; border: 1px solid #444; border-radius: 8px; font-size: 18px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; }
        .sync-badge { background: #ffab00; color: #000; font-weight: 900; font-size: 12px; padding: 6px 14px; border-radius: 20px; margin-bottom: 8px; display: none; cursor: pointer; }
        .nav-grid-3x2 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; max-width: 440px; margin-bottom: 12px; }
        .nav-tile { height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; text-decoration: none; color: #000; text-transform: uppercase; }
        .t-mark { background: var(--c-mark); color: #fff; }
        .t-run  { background: var(--c-run); color: #000; }
        .t-tow  { background: var(--c-tow); color: #fff; box-shadow: 0 0 0 2px #fff; }
        .t-pass { background: var(--c-pass); color: #fff; }
        .t-yard { background: var(--c-yard); color: #000; }
        .t-rel  { background: var(--c-rel); color: #000; }
        .card { background: #1e1e1e; border-radius: 16px; padding: 16px; width: 100%; max-width: 440px; border: 1px solid #333; margin-bottom: 16px; }
        label { font-size: 11px; text-transform: uppercase; color: #aaa; display: block; margin-top: 8px; font-weight: 900; }
        input, select { width: 100%; height: 48px; padding: 0 12px; border-radius: 8px; border: 1.5px solid #444; background: #2a2a2a; color: #fff; font-size: 18px; font-weight: 800; margin-top: 4px; outline: none; -webkit-appearance: none; }
        ::placeholder { color: #888888 !important; }
        .field-missing { border-color: #ffab00 !important; background: #2e2208 !important; }
        .row-2 { display: flex; gap: 8px; }
        .row-2 > div { flex: 1; }
        .open-cam-btn { background: #2a1215; border: 2px dashed #ff1744; color: #ff1744; font-size: 15px; font-weight: 900; border-radius: 10px; padding: 14px; width: 100%; margin-top: 12px; cursor: pointer; text-transform: uppercase; }
        .thumb-gallery { display: flex; gap: 8px; margin-top: 8px; overflow-x: auto; }
        .thumb-container { position: relative; flex-shrink: 0; }
        .thumb-img { width: 72px; height: 72px; border-radius: 8px; object-fit: cover; border: 2px solid #ff1744; }
        .thumb-del { position: absolute; top: -6px; right: -6px; background: #ff1744; color: #fff; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; cursor: pointer; }
        .submit-btn { background: #ff1744; color: #fff; font-weight: 900; border: none; border-radius: 12px; height: 56px; font-size: 22px; width: 100%; margin-top: 16px; cursor: pointer; text-transform: uppercase; }
        .submit-btn:disabled { opacity: 0.5; }
        #status { text-align: center; font-weight: 800; font-size: 14px; margin-top: 10px; min-height: 20px; color: #ffab00; }
        .cam-modal { display: none; position: fixed; inset: 0; background: #000; z-index: 99999; flex-direction: column; }
        .cam-modal.show { display: flex; }
        .cam-header { height: 50px; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: space-between; padding: 0 14px; position: absolute; top: 0; width: 100%; z-index: 10; }
        .cam-snap-btn { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 80px; height: 80px; background: #ff1744; border: 4px solid #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .cam-snap-inner { width: 58px; height: 58px; border-radius: 50%; border: 3px solid #000; }
    </style>
</head>
<body>
<div class="header-box"><h1>TOW</h1><div class="icon-btn" onclick="window.location.reload(true)">🔄</div></div>
<div class="sync-badge" id="syncBadge" onclick="syncPendingTows()">⚡ OFFLINE QUEUE: <span id="queueCount">0</span> (SAVED LOCALLY)</div>
<div class="nav-grid-3x2">
    <a href="mark.html" class="nav-tile t-mark">MARK</a><a href="run.html" class="nav-tile t-run">RUN</a><a href="tow.html" class="nav-tile t-tow">TOW</a>
    <a href="passes.html" class="nav-tile t-pass">PASS</a><a href="yard.html" class="nav-tile t-yard">YARD</a><a href="release.html" class="nav-tile t-rel">REL</a>
</div>

<div class="card">
    <label>PROPERTY</label>
    <select id="propertySelect"><option value="">PROPERTY</option></select>

    <div class="row-2">
        <div style="flex:2;"><label>REGO</label><input type="text" id="regoInput" placeholder="REGO" style="color:#ff1744; text-transform:uppercase;" onfocus="handleFieldFocus(this)"></div>
        <div style="flex:1;"><label>STATE</label><select id="stateSelect"><option value="QLD" selected>QLD</option><option value="NSW">NSW</option><option value="VIC">VIC</option><option value="SA">SA</option><option value="WA">WA</option><option value="TAS">TAS</option><option value="NT">NT</option><option value="ACT">ACT</option></select></div>
    </div>

    <div class="row-2">
        <div>
            <label>MAKE</label>
            <select id="makeSelect" onchange="checkMakeOther(this)">
                <option value="">MAKE</option><option value="Toyota">Toyota</option><option value="Holden">Holden</option><option value="Ford">Ford</option><option value="Hyundai">Hyundai</option><option value="Nissan">Nissan</option><option value="Mitsubishi">Mitsubishi</option><option value="Mazda">Mazda</option><option value="Subaru">Subaru</option><option value="Volkswagen">Volkswagen</option><option value="BMW">BMW</option><option value="Mercedes-Benz">Mercedes-Benz</option><option value="Kia">Kia</option><option value="Other">Other</option>
            </select>
            <input type="text" id="makeOtherInput" placeholder="ENTER MAKE" style="display:none; margin-top:4px;" onfocus="handleFieldFocus(this)">
        </div>
        <div>
            <label>MODEL</label>
            <input type="text" id="modelInput" placeholder="MODEL" onfocus="handleFieldFocus(this)">
        </div>
    </div>

    <div class="row-2">
        <div>
            <label>COLOUR</label>
            <select id="colourSelect" onchange="checkColourOther(this)">
                <option value="">COLOUR</option><option value="White">White</option><option value="Black">Black</option><option value="Silver">Silver</option><option value="Grey">Grey</option><option value="Blue">Blue</option><option value="Red">Red</option><option value="Green">Green</option><option value="Yellow">Yellow</option><option value="Gold">Gold</option><option value="Other">Other</option>
            </select>
            <input type="text" id="colourOtherInput" placeholder="ENTER COLOUR" style="display:none; margin-top:4px;" onfocus="handleFieldFocus(this)">
        </div>
        <div>
            <label>BODY TYPE</label>
            <select id="bodyTypeSelect"><option value="Sedan">Sedan</option><option value="Hatchback">Hatchback</option><option value="SUV">SUV</option><option value="Station Wagon">Station Wagon</option><option value="Utility">Utility</option><option value="Van">Van</option><option value="Other">Other</option></select>
        </div>
    </div>

    <label>DRIVER</label>
    <select id="officerSelect"><option value="Brian" selected>Brian</option><option value="Brett">Brett</option></select>

    <button type="button" class="open-cam-btn field-missing" id="openCamBtn" onclick="openCamera()">📷 CAPTURE CONDITION PHOTOS</button>
    <div id="compPhotoBanner" style="display:none; font-size:12px; font-weight:900; color:#00e676; text-align:center; margin-top:6px;">✔ SIDE-BY-SIDE VERIFICATION ATTACHED</div>
    <div class="thumb-gallery" id="thumbGallery"></div>

    <button class="submit-btn" id="submitBtn" disabled onclick="submitTow()">LOG TOW</button>
    <div id="status"></div>
</div>

<div class="cam-modal" id="camModal">
    <div class="cam-header">
        <span style="font-weight:900; color:#ffab00;" id="modalCounter">0 PHOTOS</span>
        <button style="background:#2a2a2a; border:1px solid #ffab00; color:#ffab00; padding:6px 12px; border-radius:6px; font-weight:900;" onclick="toggleTowTorch()">🔦 TORCH</button>
        <button style="background:#00e676; border:none; padding:6px 14px; border-radius:6px; font-weight:900;" onclick="closeCamera()">DONE ✓</button>
    </div>
    <div style="flex:1; position:relative; overflow:hidden;">
        <video id="videoElem" autoplay playsinline style="width:100%; height:100%; object-fit:cover;"></video>
        <button id="camRetryBtn" style="display:none; position:absolute; top:40%; left:50%; transform:translate(-50%,-50%); background:#ff1744; color:#fff; border:none; padding:12px 20px; border-radius:8px; font-weight:900;" onclick="startCameraStream()">🔄 RESTART CAMERA</button>
        <div class="cam-snap-btn" onclick="takeConditionSnap()"><div class="cam-snap-inner"></div></div>
    </div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";
    let conditionPhotos = [];
    let videoStream = null;
    let videoTrack = null;
    let isTorchOn = false;

    // --- INDEXED-DB OFFLINE STORAGE ---
    const DB_NAME = "NationalTowingDB";
    let db = null;
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = (e) => { e.target.result.createObjectStore("tows", { keyPath: "id" }); };
    req.onsuccess = (e) => { db = e.target.result; updateQueueUI(); syncPendingTows(); };

    window.addEventListener('DOMContentLoaded', () => {
        loadProperties();
        populateFromUrl();
        checkCompPhoto();
        setupValidation();
        window.addEventListener('online', syncPendingTows);
    });

    function handleFieldFocus(input) {
        if (input.value === "Vehicle" || input.value === "Unknown" || input.value === "MODEL" || input.value === "REGO") {
            input.value = "";
        } else {
            input.select();
        }
    }

    function checkMakeOther(s) { document.getElementById('makeOtherInput').style.display = s.value === 'Other' ? 'block' : 'none'; validate(); }
    function checkColourOther(s) { document.getElementById('colourOtherInput').style.display = s.value === 'Other' ? 'block' : 'none'; validate(); }

    function populateFromUrl() {
        const p = new URLSearchParams(window.location.search);
        if (p.get('rego')) document.getElementById('regoInput').value = p.get('rego').toUpperCase();
        if (p.get('model')) document.getElementById('modelInput').value = p.get('model');
        validate();
    }

    function checkCompPhoto() {
        const rego = document.getElementById('regoInput').value.trim().toUpperCase();
        document.getElementById('compPhotoBanner').style.display = (rego && localStorage.getItem('pending_comp_' + rego)) ? 'block' : 'none';
    }

    async function loadProperties() {
        const sel = document.getElementById('propertySelect');
        const cached = localStorage.getItem('cached_properties');
        if (cached) { try { populateProps(JSON.parse(cached)); } catch(e) {} }
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL + "?action=get_properties");
            const data = await res.json();
            populateProps(data);
        } catch(e) {}
    }
    function populateProps(list) {
        const sel = document.getElementById('propertySelect');
        sel.innerHTML = '<option value="">PROPERTY</option>';
        const params = new URLSearchParams(window.location.search);
        const target = (params.get('prop') || '').toUpperCase();
        list.forEach(p => {
            const name = p.name || p;
            const opt = document.createElement('option');
            opt.value = name; opt.innerText = name;
            if (target && name.toUpperCase() === target) opt.selected = true;
            sel.appendChild(opt);
        });
        validate();
    }

    function setupValidation() {
        ['propertySelect','regoInput','makeSelect','modelInput','colourSelect'].forEach(id => {
            document.getElementById(id).addEventListener('input', validate);
            document.getElementById(id).addEventListener('change', validate);
        });
    }

    function validate() {
        const valid = document.getElementById('propertySelect').value !== "" &&
                      document.getElementById('regoInput').value.trim() !== "" &&
                      document.getElementById('makeSelect').value !== "" &&
                      document.getElementById('modelInput').value.trim() !== "" &&
                      document.getElementById('colourSelect').value !== "" &&
                      conditionPhotos.length > 0;
        document.getElementById('submitBtn').disabled = !valid;
        return valid;
    }

    // --- CAMERA ENGINE ---
    async function openCamera() {
        document.getElementById('camModal').classList.add('show');
        await startCameraStream();
    }
    async function startCameraStream() {
        document.getElementById('camRetryBtn').style.display = 'none';
        try {
            videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 } } });
            document.getElementById('videoElem').srcObject = videoStream;
            videoTrack = videoStream.getVideoTracks()[0];
        } catch(e) { document.getElementById('camRetryBtn').style.display = 'block'; }
    }
    function closeCamera() {
        if (videoStream) { videoStream.getTracks().forEach(t => t.stop()); videoStream = null; videoTrack = null; }
        document.getElementById('camModal').classList.remove('show');
        validate();
    }
    async function toggleTowTorch() {
        if (!videoTrack) return;
        isTorchOn = !isTorchOn;
        try { await videoTrack.applyConstraints({ advanced: [{ torch: isTorchOn }] }); } catch(e) {}
    }

    function takeConditionSnap() {
        const vid = document.getElementById('videoElem');
        const canvas = document.createElement('canvas');
        canvas.width = 800; canvas.height = 600;
        canvas.getContext('2d').drawImage(vid, 0, 0, 800, 600);
        const b64 = canvas.toDataURL('image/jpeg', 0.55);
        conditionPhotos.push(b64);
        renderThumbs();
        if (conditionPhotos.length === 1 && (!document.getElementById('regoInput').value || !document.getElementById('modelInput').value)) {
            triggerAiAutofill(b64);
        }
    }

    async function triggerAiAutofill(b64) {
        document.getElementById('status').innerText = "🔍 AI IDENTIFYING CAR...";
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'ai_classify', photoBytes: b64 }) });
            const data = await res.json();
            if (data.result) {
                if (data.result.make && !document.getElementById('makeSelect').value) document.getElementById('makeSelect').value = data.result.make;
                if (data.result.model && !document.getElementById('modelInput').value) document.getElementById('modelInput').value = data.result.model;
                if (data.result.colour && !document.getElementById('colourSelect').value) document.getElementById('colourSelect').value = data.result.colour;
                validate();
            }
        } catch(e) {}
        document.getElementById('status').innerText = "";
    }

    function renderThumbs() {
        const gal = document.getElementById('thumbGallery');
        gal.innerHTML = "";
        conditionPhotos.forEach((src, idx) => {
            const wrap = document.createElement('div');
            wrap.className = 'thumb-container';
            wrap.innerHTML = `<img src="${src}" class="thumb-img"><div class="thumb-del" onclick="conditionPhotos.splice(${idx},1); renderThumbs(); validate();">✕</div>`;
            gal.appendChild(wrap);
        });
        document.getElementById('modalCounter').innerText = `${conditionPhotos.length} PHOTOS`;
    }

    // --- SUBMISSION & INDEXED-DB OFFLINE QUEUE ---
    function submitTow() {
        if (!validate()) return;
        const rego = document.getElementById('regoInput').value.trim().toUpperCase();
        const make = document.getElementById('makeSelect').value === 'Other' ? document.getElementById('makeOtherInput').value : document.getElementById('makeSelect').value;
        const colour = document.getElementById('colourSelect').value === 'Other' ? document.getElementById('colourOtherInput').value : document.getElementById('colourSelect').value;
        const comp = localStorage.getItem('pending_comp_' + rego) || "";

        const payload = {
            id: 'TOW_' + Date.now(),
            action: 'log_tow',
            property: document.getElementById('propertySelect').value,
            rego: rego,
            state: document.getElementById('stateSelect').value,
            make: make,
            model: document.getElementById('modelInput').value.trim(),
            colour: colour,
            bodyType: document.getElementById('bodyTypeSelect').value,
            officer: document.getElementById('officerSelect').value,
            photos: conditionPhotos,
            photoBytes: conditionPhotos[0] || "",
            comparisonPhoto: comp,
            timestamp: new Date().toISOString()
        };

        localStorage.removeItem('pending_comp_' + rego);
        saveTowToDB(payload);
        alert(`✔ ${rego} LOGGED LOCALLY\nSyncing in background.`);
        window.location.href = 'run.html';
    }

    function saveTowToDB(item) {
        if (!db) return;
        const tx = db.transaction("tows", "readwrite");
        tx.objectStore("tows").put(item);
        updateQueueUI();
        syncPendingTows();
    }

    function updateQueueUI() {
        if (!db) return;
        const tx = db.transaction("tows", "readonly");
        const countReq = tx.objectStore("tows").count();
        countReq.onsuccess = () => {
            const c = countReq.result;
            document.getElementById('queueCount').innerText = c;
            document.getElementById('syncBadge').style.display = c > 0 ? 'block' : 'none';
        };
    }

    async function syncPendingTows() {
        if (!db || !navigator.onLine) return;
        const tx = db.transaction("tows", "readonly");
        const getReq = tx.objectStore("tows").getAll();
        getReq.onsuccess = async () => {
            const list = getReq.result;
            for (const item of list) {
                try {
                    const res = await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify(item) });
                    const rJson = await res.json();
                    if (rJson.status === "SUCCESS") {
                        const delTx = db.transaction("tows", "readwrite");
                        delTx.objectStore("tows").delete(item.id);
                        delTx.oncomplete = updateQueueUI;
                    }
                } catch(e) { break; }
            }
        };
    }
</script>
</body>
</html>
