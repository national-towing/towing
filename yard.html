<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>YARD</title>
    
    <link rel="apple-touch-icon" href="icon-yard.png?v=1002">
    <link rel="icon" type="image/png" href="icon-yard.png?v=1002">
    <link rel="manifest" href="manifest-yard.json?v=1002">

    <style>
        :root {
            --c-mark: #2979ff;
            --c-run: #ffab00;
            --c-tow: #ff1744;
            --c-admin: #ab47bc;
            --c-yard: #00b0ff;
            --c-rel: #00e676;
        }
        * { box-sizing: border-box; }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #121212;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            padding-top: max(16px, env(safe-area-inset-top));
            padding-bottom: max(20px, env(safe-area-inset-bottom));
        }

        .header-box {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            max-width: 440px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }
        .header-box h1 {
            margin: 0;
            font-size: 32px;
            font-weight: 900;
            color: var(--c-yard);
            letter-spacing: 2px;
            text-align: center;
        }
        .icon-btn {
            position: absolute;
            right: 0;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            font-size: 18px;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #fff;
        }
        .icon-btn:active { transform: scale(0.92); }

        /* 3x2 Grid Navigation */
        .nav-grid-3x2 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            width: 100%;
            max-width: 440px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }
        .nav-tile {
            height: 38px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 900;
            text-decoration: none;
            color: #000;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .nav-tile:active { transform: scale(0.96); }
        .t-mark  { background: var(--c-mark); color: #fff; }
        .t-run   { background: var(--c-run); color: #000; }
        .t-tow   { background: var(--c-tow); color: #fff; }
        .t-admin { background: var(--c-admin); color: #fff; }
        .t-yard  { background: var(--c-yard); color: #000; box-shadow: 0 0 0 2px #fff; }
        .t-rel   { background: var(--c-rel); color: #000; }

        .container {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 14px;
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            overflow: hidden;
            position: relative;
        }

        .search-bar {
            padding: 10px;
            background: #181818;
            border-bottom: 1px solid #2d2d2d;
            flex-shrink: 0;
        }
        .search-input {
            width: 100%;
            height: 38px;
            background: #242424;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 0 10px;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            outline: none;
        }
        .search-input:focus { border-color: var(--c-yard); }

        .yard-scroll {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .yard-card {
            background: #242424;
            border: 1px solid #383838;
            border-radius: 10px;
            padding: 10px;
            display: flex;
            gap: 10px;
            cursor: pointer;
            align-items: center;
        }
        .yard-card:active { background: #2f2f2f; }
        .y-thumb {
            width: 60px;
            height: 60px;
            border-radius: 6px;
            background: #111;
            object-fit: cover;
            flex-shrink: 0;
            border: 1px solid #444;
        }
        .y-info { flex: 1; min-width: 0; }
        .y-row-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
        .y-rego { font-family: monospace; font-size: 18px; font-weight: 900; color: #fff; }
        .y-prop { font-size: 10px; font-weight: 800; color: #ffab00; background: #333; padding: 2px 6px; border-radius: 4px; }
        .y-desc { font-size: 12px; color: #bbb; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .y-time { font-size: 10px; color: #777; font-weight: 700; }

        /* Edit Yard Vehicle Modal */
        .modal-sheet {
            display: none;
            position: absolute;
            inset: 0;
            background: #181818;
            z-index: 50;
            flex-direction: column;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #1e1e1e;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
        }
        .modal-title { font-size: 15px; font-weight: 900; color: var(--c-yard); text-transform: uppercase; }
        .btn-close { background: none; border: none; font-size: 20px; color: #aaa; cursor: pointer; }

        .modal-body {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .f-field { display: flex; flex-direction: column; gap: 4px; }
        .f-label { font-size: 10px; font-weight: 900; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
        .f-input {
            width: 100%;
            height: 42px;
            background: #242424;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 0 10px;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            outline: none;
        }
        .f-input:focus { border-color: var(--c-yard); }
        .f-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        .modal-footer {
            padding: 12px;
            background: #1e1e1e;
            border-top: 1px solid #333;
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .btn-cancel { flex: 1; height: 44px; background: #333; border: none; color: #fff; font-weight: 900; border-radius: 8px; cursor: pointer; text-transform: uppercase; }
        .btn-submit { flex: 2; height: 44px; background: #00e676; border: none; color: #000; font-weight: 900; border-radius: 8px; cursor: pointer; text-transform: uppercase; font-size: 14px; }
    </style>
</head>
<body>

<div class="header-box">
    <h1>IMPOUND YARD</h1>
    <div class="icon-btn" onclick="fetchYardVehicles()">🔄</div>
</div>

<div class="nav-grid-3x2">
    <a href="mark.html" class="nav-tile t-mark">MARK</a>
    <a href="run.html" class="nav-tile t-run">RUN</a>
    <a href="tow.html" class="nav-tile t-tow">TOW</a>
    <a href="admin.html" class="nav-tile t-admin">ADMIN</a>
    <a href="yard.html" class="nav-tile t-yard">YARD</a>
    <a href="release.html" class="nav-tile t-rel">REL</a>
</div>

<div class="container">
    <div class="search-bar">
        <input type="text" id="yardSearch" class="search-input" placeholder="Search yard plates..." oninput="filterYard()">
    </div>
    <div class="yard-scroll" id="yardList">
        <div style="text-align:center; padding:30px; color:#888;">Loading Yard Vehicles...</div>
    </div>

    <!-- EDIT YARD DETAIL MODAL -->
    <div id="yardEditModal" class="modal-sheet">
        <div class="modal-header">
            <div class="modal-title" id="yardModalTitle">EDIT IMPOUND DETAILS</div>
            <button class="btn-close" onclick="closeYardModal()">✕</button>
        </div>
        <form class="modal-body" onsubmit="saveYardDetails(event)">
            <input type="hidden" id="yRowIdx">
            <input type="hidden" id="yOrigRego">

            <div class="f-field">
                <label class="f-label">Property Towed From</label>
                <input type="text" id="yProperty" class="f-input" required>
            </div>

            <div class="f-field">
                <label class="f-label">Vehicle Registration</label>
                <input type="text" id="yRego" class="f-input" style="font-family:monospace; font-size:18px;" required>
            </div>

            <div class="f-grid-2">
                <div class="f-field">
                    <label class="f-label">Make</label>
                    <input type="text" id="yMake" class="f-input">
                </div>
                <div class="f-field">
                    <label class="f-label">Model</label>
                    <input type="text" id="yModel" class="f-input">
                </div>
            </div>

            <div class="f-grid-2">
                <div class="f-field">
                    <label class="f-label">Colour</label>
                    <input type="text" id="yColour" class="f-input">
                </div>
                <div class="f-field">
                    <label class="f-label">Body Type</label>
                    <input type="text" id="yBodyType" class="f-input">
                </div>
            </div>

            <div class="f-field">
                <label class="f-label">Policelink Ref # (Col AD)</label>
                <input type="text" id="yPolicelink" class="f-input" placeholder="e.g. 12345678">
            </div>

            <div class="f-field">
                <label class="f-label">Caller Phone (Col AE)</label>
                <input type="text" id="yCallerPhone" class="f-input" placeholder="e.g. 0400 000 000">
            </div>

            <div class="f-field">
                <label class="f-label">Notes (Col AF)</label>
                <input type="text" id="yNotes" class="f-input" placeholder="Yard position / comments">
            </div>

            <div class="modal-footer" style="padding:0; margin-top:auto;">
                <button type="button" class="btn-cancel" onclick="closeYardModal()">Cancel</button>
                <button type="submit" id="btnSaveYard" class="btn-submit">SAVE DETAILS ✔</button>
            </div>
        </form>
    </div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";
    let yardCache = [];

    window.addEventListener('load', fetchYardVehicles);

    async function fetchYardVehicles() {
        const list = document.getElementById('yardList');
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL + "?action=get_tow_history");
            yardCache = await res.json();
            renderYard(yardCache);
        } catch(e) {
            list.innerHTML = `<div style="text-align:center; padding:30px; color:#ff1744;">Error loading yard list.</div>`;
        }
    }

    function renderYard(items) {
        const list = document.getElementById('yardList');
        if (!items || items.length === 0) {
            list.innerHTML = `<div style="text-align:center; padding:30px; color:#888;">NO VEHICLES IN YARD</div>`;
            return;
        }

        list.innerHTML = items.map(v => `
            <div class="yard-card" onclick="openYardModal(${v.rowIdx})">
                ${v.imageUrl ? `<img src="${v.imageUrl}" class="y-thumb" loading="lazy">` : `<div class="y-thumb" style="display:flex;align-items:center;justify-content:center;color:#666;font-size:10px;">NO PIC</div>`}
                <div class="y-info">
                    <div class="y-row-top">
                        <span class="y-rego">${v.rego}</span>
                        <span class="y-prop">${v.property || 'GENERAL'}</span>
                    </div>
                    <div class="y-desc">${[v.colour, v.make, v.model].filter(Boolean).join(' ') || 'Vehicle'} • ${v.bodyType || 'Sedan'}</div>
                    <div class="y-time">Towed: ${v.towedTime || 'Recent'} • Ref: ${v.policelinkRef || 'None'}</div>
                </div>
            </div>
        `).join('');
    }

    function filterYard() {
        const q = document.getElementById('yardSearch').value.trim().toUpperCase();
        if (!q) { renderYard(yardCache); return; }
        const filtered = yardCache.filter(v => 
            v.rego.includes(q) || (v.property && v.property.toUpperCase().includes(q))
        );
        renderYard(filtered);
    }

    function openYardModal(rowIdx) {
        const v = yardCache.find(item => item.rowIdx === rowIdx);
        if (!v) return;

        document.getElementById('yRowIdx').value = v.rowIdx;
        document.getElementById('yOrigRego').value = v.rego;
        document.getElementById('yProperty').value = v.property;
        document.getElementById('yRego').value = v.rego;
        document.getElementById('yMake').value = v.make;
        document.getElementById('yModel').value = v.model;
        document.getElementById('yColour').value = v.colour;
        document.getElementById('yBodyType').value = v.bodyType;
        document.getElementById('yPolicelink').value = v.policelinkRef || "";
        document.getElementById('yCallerPhone').value = v.callerPhone || "";
        document.getElementById('yNotes').value = v.notes || "";

        document.getElementById('yardEditModal').style.display = 'flex';
    }

    function closeYardModal() {
        document.getElementById('yardEditModal').style.display = 'none';
    }

    async function saveYardDetails(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSaveYard');
        btn.innerText = "SAVING...";
        btn.disabled = true;

        const payload = {
            action: 'save_yard_details',
            rowIdx: document.getElementById('yRowIdx').value,
            origRego: document.getElementById('yOrigRego').value,
            property: document.getElementById('yProperty').value,
            rego: document.getElementById('yRego').value.trim().toUpperCase(),
            make: document.getElementById('yMake').value.trim(),
            model: document.getElementById('yModel').value.trim(),
            colour: document.getElementById('yColour').value.trim(),
            bodyType: document.getElementById('yBodyType').value.trim(),
            policelinkRef: document.getElementById('yPolicelink').value.trim(),
            callerPhone: document.getElementById('yCallerPhone').value.trim(),
            notes: document.getElementById('yNotes').value.trim()
        };

        try {
            const res = await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (data.status === "SUCCESS") {
                closeYardModal();
                fetchYardVehicles();
            } else {
                alert("Error: " + data.message);
            }
        } catch(err) {
            alert("Network error.");
        } finally {
            btn.innerText = "SAVE DETAILS ✔";
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
