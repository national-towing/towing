<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>YARD</title>
  
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --border: #333333;
      --text: #ffffff;
      --text-muted: #888888;
      --c-mark: #2979ff;
      --c-run: #ffab00;
      --c-tow: #ff1744;
      --c-pass: #ab47bc;
      --c-yard: #00b0ff;
      --c-rel: #00e676;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body { 
      background: var(--bg); 
      color: var(--text); 
      padding: 14px;
      padding-top: max(16px, env(safe-area-inset-top)); 
      padding-bottom: max(30px, env(safe-area-inset-bottom));
    }

    /* Header & 3x2 Grid */
    .header-box { display: flex; align-items: center; justify-content: center; position: relative; width: 100%; max-width: 440px; margin: 0 auto 12px auto; }
    .header-box h1 { margin: 0; font-size: 36px; font-weight: 900; color: var(--c-yard); letter-spacing: 2px; }
    .icon-btn { position: absolute; right: 0; background: #2a2a2a; border: 1px solid #444; border-radius: 10px; font-size: 18px; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; }
    .icon-btn:active { transform: scale(0.92); }

    .nav-grid-3x2 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; max-width: 440px; margin: 0 auto 14px auto; }
    .nav-tile { height: 38px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; text-decoration: none; color: #000; text-transform: uppercase; letter-spacing: 0.5px; }
    .nav-tile:active { transform: scale(0.96); }
    .t-mark { background: var(--c-mark); color: #fff; }
    .t-run  { background: var(--c-run); color: #000; }
    .t-tow  { background: var(--c-tow); color: #fff; }
    .t-pass { background: var(--c-pass); color: #fff; }
    .t-yard { background: var(--c-yard); color: #000; box-shadow: 0 0 0 2px #fff; }
    .t-rel  { background: var(--c-rel); color: #000; }

    /* Search Filter */
    .controls-wrap { width: 100%; max-width: 440px; margin: 0 auto 14px auto; display: flex; gap: 8px; }
    .search-input { flex: 1; height: 46px; background: #1e1e1e; border: 1px solid var(--border); border-radius: 10px; padding: 0 12px; color: #fff; font-size: 16px; font-weight: 700; outline: none; }
    .search-input:focus { border-color: var(--c-yard); }

    /* Cards */
    .card-list { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 440px; margin: 0 auto; }
    .yard-card { background: var(--card-bg); border: 1px solid var(--border); border-left: 5px solid var(--c-yard); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    
    .card-row-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .rego-text { font-size: 26px; font-weight: 900; letter-spacing: 1px; color: #facc15; }
    .prop-text { font-size: 19px; font-weight: 900; color: #aaa; text-align: right; max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .card-body { display: flex; gap: 12px; align-items: center; }
    
    .thumb-wrap { 
      width: 90px; 
      height: 75px; 
      border-radius: 8px; 
      overflow: hidden; 
      background: #000; 
      border: 1.5px solid var(--border); 
      flex-shrink: 0; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
    }
    .thumb-img { width: 100%; height: 100%; object-fit: contain; background: #000; cursor: pointer; }
    .no-img { font-size: 10px; font-weight: 800; color: #555; text-align: center; }

    .details-wrap { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .veh-line { font-size: 17px; font-weight: 900; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .time-sub-line { color: #aaa; font-size: 13px; font-weight: 800; }
    .meta-sub-line { color: #888; font-size: 12px; font-weight: 700; display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }

    .phone-tag { 
      color: var(--c-rel); 
      font-size: 13px; 
      font-weight: 900; 
      margin-top: 4px; 
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #0d2818;
      border: 1.5px solid var(--c-rel);
      padding: 4px 10px;
      border-radius: 8px;
      width: fit-content;
    }
    .phone-tag:active { transform: scale(0.96); background: #1b4d2e; }

    /* Action Buttons */
    .action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
    .action-row.has-folder { grid-template-columns: 0.9fr 1fr 1.2fr; }
    .btn-action {
      height: 46px; border: none; border-radius: 10px; font-size: 14px; font-weight: 900;
      cursor: pointer; letter-spacing: 0.5px; display: flex; align-items: center; justify-content: center;
      gap: 5px; text-decoration: none; text-transform: uppercase;
    }
    .btn-folder { background: #2a2a2a; border: 1.5px solid #00b0ff; color: #00b0ff; }
    .btn-sms { background: #0284c7; color: #fff; }
    .btn-rel { background: var(--c-rel); color: #000; }
    .btn-rel:active { background: #00c853; }

    #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; align-items: center; justify-content: center; padding: 14px; }
    #lightbox img { max-width: 100%; max-height: 85vh; border-radius: 10px; border: 2px solid #555; object-fit: contain; }
  </style>
</head>
<body>

  <div class="header-box">
    <h1>YARD</h1>
    <div class="icon-btn" onclick="fetchYardInventory()">🔄</div>
  </div>

  <div class="nav-grid-3x2">
    <a href="mark.html" class="nav-tile t-mark">MARK</a>
    <a href="run.html" class="nav-tile t-run">RUN</a>
    <a href="tow.html" class="nav-tile t-tow">TOW</a>
    <a href="passes.html" class="nav-tile t-pass">PASS</a>
    <a href="yard.html" class="nav-tile t-yard">YARD</a>
    <a href="release.html" class="nav-tile t-rel">REL</a>
  </div>

  <div class="controls-wrap">
    <input type="text" id="searchInput" class="search-input" placeholder="Search Rego, Property..." oninput="filterYardCards()">
  </div>

  <div id="loading" style="text-align:center; padding: 20px; color:var(--text-muted); font-weight:700;">Connecting to Yard Log...</div>
  <div id="cardList" class="card-list"></div>

  <div id="lightbox" onclick="this.style.display='none'">
    <img id="lightImg">
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";

    let yardInventory = [];

    window.addEventListener('DOMContentLoaded', () => {
      // Load cache first so screen is never blank
      const cached = localStorage.getItem('cached_yard_inventory');
      if (cached) {
        try {
          yardInventory = JSON.parse(cached);
          renderCards(yardInventory);
          document.getElementById('loading').style.display = 'none';
        } catch(e) {}
      }
      fetchYardInventory();
    });

    async function fetchYardInventory() {
      try {
        const resp = await fetch(GOOGLE_SCRIPT_URL + "?action=get_yard_vehicles");
        const data = await resp.json();
        if (Array.isArray(data)) {
          yardInventory = data;
          localStorage.setItem('cached_yard_inventory', JSON.stringify(yardInventory));
          renderCards(yardInventory);
        }
      } catch(e) {
        if (!yardInventory || yardInventory.length === 0) {
          document.getElementById('cardList').innerHTML = '<div style="color:#ff1744; text-align:center; padding:30px; font-weight:800;">Connection retry required. Tap 🔄 above.</div>';
        }
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    }

    function renderCards(vehicles) {
      const list = document.getElementById('cardList');
      list.innerHTML = '';
      if (!Array.isArray(vehicles) || vehicles.length === 0) {
        list.innerHTML = '<div style="color:var(--text-muted); text-align:center; padding:40px 10px; font-weight:800;">HOLDING YARD EMPTY</div>';
        return;
      }

      vehicles.forEach((v) => {
        const card = document.createElement('div');
        card.className = 'yard-card';

        const thumbContent = v.imageUrl 
          ? `<img src="${v.imageUrl}" class="thumb-img" onclick="showLightbox('${v.imageUrl}')">`
          : `<div class="no-img">NO PHOTO</div>`;

        const phoneDisplay = v.callerPhone 
          ? `<a href="tel:${v.callerPhone.replace(/[^\d+]/g, '')}" class="phone-tag">📞 ${v.callerPhone}</a>` 
          : '';

        const makeModel = [v.make, v.model].filter(Boolean).join(' - ');
        const vehDesc = makeModel 
          ? (v.colour ? `${makeModel} (${v.colour})` : makeModel) 
          : (v.colour || 'Vehicle');

        let metaTags = [];
        if (v.driver) metaTags.push(`Driver: ${v.driver}`);
        if (v.policelinkRef) metaTags.push(`Ref: ${v.policelinkRef}`);

        const hasFolder = !!v.folderUrl;

        card.innerHTML = `
          <div class="card-row-top">
            <span class="rego-text">${v.rego}</span>
            <span class="prop-text">${v.property || 'GENERAL'}</span>
          </div>

          <div class="card-body">
            <div class="thumb-wrap">${thumbContent}</div>
            <div class="details-wrap">
              <div class="veh-line">${vehDesc}</div>
              ${v.markedTime ? `<div class="time-sub-line">Marked: ${v.markedTime}</div>` : ''}
              <div class="time-sub-line">Towed: ${v.towedTime || 'Today'}</div>
              ${metaTags.length > 0 ? `<div class="meta-sub-line">${metaTags.map(m => `<span>• ${m}</span>`).join('')}</div>` : ''}
              ${phoneDisplay ? `<div>${phoneDisplay}</div>` : ''}
            </div>
          </div>

          <div class="action-row ${hasFolder ? 'has-folder' : ''}">
            ${hasFolder ? `<a href="${v.folderUrl}" target="_blank" class="btn-action btn-folder">📁 FOLDER</a>` : ''}
            <button class="btn-action btn-sms" onclick="sendImpoundSms('${v.rego}', '${v.property}', '${v.callerPhone || ''}')">💬 SMS</button>
            <a href="release.html?rego=${encodeURIComponent(v.rego)}" class="btn-action btn-rel">RELEASE ➔</a>
          </div>
        `;
        list.appendChild(card);
      });
    }

    function filterYardCards() {
      const q = document.getElementById('searchInput').value.trim().toUpperCase();
      renderCards(yardInventory.filter(v => 
        (v.rego && v.rego.toUpperCase().includes(q)) || 
        (v.property && v.property.toUpperCase().includes(q))
      ));
    }

    function sendImpoundSms(rego, prop, defaultPhone) {
      const p = prompt("Customer Mobile Number:", defaultPhone || "");
      if (!p) return;
      const clean = p.replace(/[^\d+]/g, '');
      const body = `National Towing Impound Notice\n\nVehicle: (${rego})\nTowed From: ${prop || 'Private Property'}\n\nCollect from:\n4 Lau Place, Ashmore QLD 4214\n\nFee: $450.05 Paid in full\nPlease call ahead: 0450 605 370`;
      window.location.href = `sms:${clean}?body=${encodeURIComponent(body)}`;
    }

    function showLightbox(url) {
      document.getElementById('lightImg').src = url;
      document.getElementById('lightbox').style.display = 'flex';
    }
  </script>
</body>
</html>
