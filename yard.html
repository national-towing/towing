<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>YARD</title>
  <style>
    :root { --bg: #121212; --card-bg: #1e1e1e; --border: #333333; --text: #ffffff; --c-yard: #00b0ff; --c-rel: #00e676; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 12px; padding-bottom: 40px; }
    .header-box { display: flex; align-items: center; justify-content: center; position: relative; width: 100%; max-width: 440px; margin: 0 auto 10px auto; }
    .header-box h1 { font-size: 34px; font-weight: 900; color: var(--c-yard); letter-spacing: 2px; }
    .icon-btn { position: absolute; right: 0; background: #2a2a2a; border: 1px solid #444; border-radius: 8px; font-size: 18px; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; }
    .nav-grid-3x2 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; max-width: 440px; margin: 0 auto 12px auto; }
    .nav-tile { height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; text-decoration: none; color: #000; text-transform: uppercase; }
    .t-mark { background: #2979ff; color: #fff; }
    .t-run  { background: #ffab00; color: #000; }
    .t-tow  { background: #ff1744; color: #fff; }
    .t-pass { background: #ab47bc; color: #fff; }
    .t-yard { background: var(--c-yard); color: #000; box-shadow: 0 0 0 2px #fff; }
    .t-rel  { background: var(--c-rel); color: #000; }
    .search-input { width: 100%; max-width: 440px; height: 44px; background: #1e1e1e; border: 1px solid var(--border); border-radius: 10px; padding: 0 12px; color: #fff; font-size: 16px; font-weight: 700; outline: none; margin: 0 auto 12px auto; display: block; }

    .card-list { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 440px; margin: 0 auto; }
    .yard-card { background: var(--card-bg); border: 1px solid var(--border); border-left: 5px solid var(--c-yard); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .card-row-top { display: flex; justify-content: space-between; align-items: center; }
    .rego-text { font-size: 24px; font-weight: 900; letter-spacing: 1px; color: #facc15; }
    .prop-text { font-size: 18px; font-weight: 900; color: #aaa; }
    .card-body { display: flex; gap: 10px; align-items: center; }
    
    /* ADAPTIVE THUMBNAIL BOX (PRESERVES SIDE-BY-SIDE COMPOSITE) */
    .thumb-wrap { width: 100px; height: 75px; border-radius: 8px; overflow: hidden; background: #000; border: 1.5px solid var(--border); flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .thumb-img { width: 100%; height: 100%; object-fit: contain; }
    .details-wrap { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .veh-line { font-size: 17px; font-weight: 900; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .time-line { color: #888; font-size: 13px; font-weight: 800; }
    
    .action-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 4px; }
    .btn-action { height: 42px; border: none; border-radius: 8px; font-size: 14px; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none; text-transform: uppercase; }
    .btn-folder { background: #333; color: #00b0ff; border: 1px solid #00b0ff; }
    .btn-sms { background: #0284c7; color: #fff; }
    .btn-rel { background: var(--c-rel); color: #000; }
    #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; align-items: center; justify-content: center; padding: 12px; }
    #lightbox img { max-width: 100%; max-height: 90vh; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="header-box"><h1>YARD</h1><div class="icon-btn" onclick="fetchYard()">🔄</div></div>
  <div class="nav-grid-3x2">
    <a href="mark.html" class="nav-tile t-mark">MARK</a><a href="run.html" class="nav-tile t-run">RUN</a><a href="tow.html" class="nav-tile t-tow">TOW</a>
    <a href="passes.html" class="nav-tile t-pass">PASS</a><a href="yard.html" class="nav-tile t-yard">YARD</a><a href="release.html" class="nav-tile t-rel">REL</a>
  </div>
  <input type="text" id="searchInput" class="search-input" placeholder="Search Rego, Property..." oninput="filterCards()">
  <div id="cardList" class="card-list"></div>
  <div id="lightbox" onclick="this.style.display='none'"><img id="lightImg"></div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";
    let inventory = [];

    window.addEventListener('DOMContentLoaded', fetchYard);

    async function fetchYard() {
      document.getElementById('cardList').innerHTML = '<div style="text-align:center; padding:30px; font-weight:800; color:#888;">LOADING HOLDING YARD...</div>';
      try {
        const resp = await fetch(GOOGLE_SCRIPT_URL + "?action=get_yard_vehicles");
        inventory = await resp.json();
        render(inventory);
      } catch(e) {
        document.getElementById('cardList').innerHTML = '<div style="color:#ff1744; text-align:center; font-weight:800;">Error connecting to Yard Log. Tap 🔄 to retry.</div>';
      }
    }

    function render(list) {
      const container = document.getElementById('cardList');
      container.innerHTML = "";
      if (!list || list.length === 0) { container.innerHTML = '<div style="text-align:center; padding:40px; color:#666; font-weight:800;">HOLDING YARD EMPTY</div>'; return; }

      list.forEach(v => {
        const card = document.createElement('div');
        card.className = 'yard-card';
        const img = v.imageUrl ? `<img src="${v.imageUrl}" class="thumb-img" onclick="showLight('${v.imageUrl}')">` : '<div style="font-size:10px; color:#555;">NO PHOTO</div>';
        const folderBtn = v.folderUrl ? `<a href="${v.folderUrl}" target="_blank" class="btn-action btn-folder">📁 FOLDER</a>` : `<button class="btn-action btn-folder" style="opacity:0.4;">📁 FOLDER</button>`;

        card.innerHTML = `
          <div class="card-row-top">
            <span class="rego-text">${v.rego}</span>
            <span class="prop-text">${v.property || 'GENERAL'}</span>
          </div>
          <div class="card-body">
            <div class="thumb-wrap">${img}</div>
            <div class="details-wrap">
              <div class="veh-line">${v.make} ${v.model} (${v.colour})</div>
              <div class="time-line">Marked: ${v.markedTime || 'N/A'}</div>
              <div class="time-line">Towed: ${v.towedTime || 'Today'}</div>
              ${v.callerPhone ? `<div><a href="tel:${v.callerPhone}" style="color:var(--c-rel); font-weight:900; font-size:13px; text-decoration:none;">📞 ${v.callerPhone}</a></div>` : ''}
            </div>
          </div>
          <div class="action-row">
            ${folderBtn}
            <button class="btn-action btn-sms" onclick="sendSms('${v.rego}','${v.property}','${v.callerPhone||''}')">💬 SMS</button>
            <a href="release.html?rego=${encodeURIComponent(v.rego)}" class="btn-action btn-rel">RELEASE ➔</a>
          </div>`;
        container.appendChild(card);
      });
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.trim().toUpperCase();
      render(inventory.filter(v => v.rego.includes(q) || v.property.toUpperCase().includes(q)));
    }
    function showLight(url) { document.getElementById('lightImg').src = url; document.getElementById('lightbox').style.display = 'flex'; }
    function sendSms(rego, prop, phone) {
      const p = prompt("Customer Mobile:", phone);
      if (!p) return;
      const body = `National Towing Impound Notice\n\nVehicle: (${rego})\nTowed From: ${prop}\n\nCollect from:\n4 Lau Place, Ashmore QLD 4214\nFee: $450.05\n\nCall ahead: 0450 605 370`;
      window.location.href = `sms:${p}?body=${encodeURIComponent(body)}`;
    }
  </script>
</body>
</html>
