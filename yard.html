<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YARD | National Towing</title>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --accent: #00b0ff;
      --accent-active: #0091ea;
      --success: #00e676;
      --warning: #ffab00;
      --danger: #ff1744;
      --text: #ffffff;
      --text-muted: #888888;
      --border: #333333;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 12px; padding-bottom: 75px; }

    /* Top Sub-Nav Bar */
    .top-nav { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 4px; }
    .nav-btn {
      flex: 1; min-width: 60px; text-align: center; padding: 8px 4px; border-radius: 8px;
      font-size: 11px; font-weight: 900; text-decoration: none; color: #fff; background: #222;
      border: 1px solid var(--border); text-transform: uppercase;
    }
    .nav-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

    /* Header */
    .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .header-title { font-size: 1.25rem; font-weight: 900; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px; }
    .count-pill { background: var(--accent); color: #000; font-size: 0.75rem; font-weight: 900; padding: 2px 8px; border-radius: 12px; }
    .btn-sync { background: none; border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 700; }

    /* Search */
    .search-box { width: 100%; margin-bottom: 12px; }
    .search-input { width: 100%; padding: 12px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; color: #fff; font-size: 1rem; outline: none; }
    .search-input:focus { border-color: var(--accent); }

    /* Card List */
    .card-list { display: flex; flex-direction: column; gap: 10px; }
    .yard-card { background: var(--card-bg); border: 1px solid var(--border); border-left: 5px solid var(--accent); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
    .card-top { display: flex; justify-content: space-between; align-items: baseline; }
    .rego-badge { font-size: 1.4rem; font-weight: 900; letter-spacing: 1.5px; color: #facc15; }
    .prop-name { font-size: 0.85rem; color: #aaa; font-weight: 700; text-align: right; }
    .veh-desc { font-size: 0.95rem; font-weight: 600; color: #e0e0e0; }
    .meta-line { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); border-top: 1px dashed var(--border); padding-top: 6px; }

    /* Action Buttons */
    .card-actions { display: grid; grid-template-columns: 1.2fr 1fr; gap: 8px; margin-top: 4px; }
    .btn { padding: 10px; border-radius: 8px; font-size: 0.85rem; font-weight: 900; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; text-transform: uppercase; }
    .btn-sms { background: #0284c7; color: #fff; }
    .btn-sms:active { background: #0369a1; }
    .btn-rel { background: var(--success); color: #000; }
    .btn-rel:active { background: #00c853; }

    /* SMS Modal */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; padding: 16px; }
    .modal-box { background: #1e1e1e; border: 1px solid var(--border); border-radius: 14px; width: 100%; max-width: 380px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
    .modal-title { font-size: 1.1rem; font-weight: 900; color: #fff; }
    .phone-field { width: 100%; padding: 12px; font-size: 1.25rem; font-weight: 700; background: #121212; border: 1px solid var(--border); border-radius: 8px; color: #fff; text-align: center; letter-spacing: 1.5px; outline: none; }
    .phone-field:focus { border-color: var(--accent); }
    .modal-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
    .btn-close { background: #424242; color: #fff; }
  </style>
</head>
<body>

  <!-- Top Quick-Switch App Navigation -->
  <div class="top-nav">
    <a href="index.html" class="nav-btn">HUB</a>
    <a href="run.html" class="nav-btn">RUN</a>
    <a href="tow.html" class="nav-btn">TOW</a>
    <a href="yard.html" class="nav-btn active">YARD</a>
    <a href="release.html" class="nav-btn">REL</a>
    <a href="passes.html" class="nav-btn">PASS</a>
  </div>

  <div class="header-row">
    <div class="header-title">
      <span>HOLDING YARD</span>
      <span id="yardCount" class="count-pill">0</span>
    </div>
    <button class="btn-sync" onclick="loadYardVehicles()">🔄 Sync</button>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" class="search-input" placeholder="Search Rego, Property or Make..." oninput="filterYardCards()">
  </div>

  <div id="loading" style="text-align:center; padding: 40px 10px; color:var(--text-muted);">Syncing yard vehicles from Google Sheets...</div>
  <div id="yardList" class="card-list"></div>

  <!-- Advise Owner SMS Modal -->
  <div id="smsModal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-title">📱 Advise Vehicle Owner</div>
      <div id="modalVehDetails" style="font-size:0.85rem; color:#aaa;"></div>
      <input type="tel" id="ownerPhone" class="phone-field" placeholder="04xx xxx xxx" inputmode="numeric">
      <div class="modal-btns">
        <button class="btn btn-close" onclick="closeModal()">Cancel</button>
        <button class="btn btn-sms" onclick="sendNativeSms()">Open SMS 💬</button>
      </div>
    </div>
  </div>

  <script>
    // Config: Pointing to your deployed Google Apps Script Engine
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwPz26Xo8_7n-r51U8yA7RknrR-gZ58gGzB1yN9/exec";

    let yardInventory = [];
    let activeVehicle = null;

    async function loadYardVehicles() {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('yardList').innerHTML = '';
      try {
        const resp = await fetch(SCRIPT_URL + "?action=get_yard_vehicles");
        yardInventory = await resp.json();
        document.getElementById('yardCount').textContent = yardInventory.length;
        renderYardList(yardInventory);
      } catch(err) {
        document.getElementById('yardList').innerHTML = '<div style="color:var(--danger); text-align:center; padding:20px;">Could not connect to Yard Log. Tap 🔄 Sync to retry.</div>';
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    }

    function renderYardList(vehicles) {
      const container = document.getElementById('yardList');
      container.innerHTML = '';

      if (!vehicles || vehicles.length === 0) {
        container.innerHTML = '<div style="color:var(--text-muted); text-align:center; padding:40px;">No vehicles currently recorded in yard.</div>';
        return;
      }

      vehicles.forEach(v => {
        const card = document.createElement('div');
        card.className = 'yard-card';
        card.innerHTML = `
          <div class="card-top">
            <div class="rego-badge">${v.rego}</div>
            <div class="prop-name">${v.property || 'GENERAL'}</div>
          </div>
          <div class="veh-desc">${v.colour || ''} ${v.make || ''} ${v.model || ''} (${v.bodyType || 'Sedan'})</div>
          <div class="meta-line">
            <span>Towed: ${v.dateTowed || 'Today'}</span>
            <span>SVN: ${v.policelinkRef ? v.policelinkRef : '<span style="color:#f59e0b;">Pending</span>'}</span>
          </div>
          <div class="card-actions">
            <button class="btn btn-sms" onclick='openModal(${JSON.stringify(v)})'>💬 Advise Owner</button>
            <a href="release.html?rego=${encodeURIComponent(v.rego)}" class="btn btn-rel">Release ➡️</a>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function filterYardCards() {
      const q = document.getElementById('searchInput').value.trim().toUpperCase();
      const filtered = yardInventory.filter(v => 
        (v.rego && v.rego.toUpperCase().includes(q)) ||
        (v.property && v.property.toUpperCase().includes(q)) ||
        (v.make && v.make.toUpperCase().includes(q)) ||
        (v.model && v.model.toUpperCase().includes(q))
      );
      renderYardList(filtered);
    }

    function openModal(vehicle) {
      activeVehicle = vehicle;
      document.getElementById('modalVehDetails').textContent = 
        `${vehicle.rego} — ${vehicle.colour || ''} ${vehicle.make || ''} ${vehicle.model || ''}`;
      document.getElementById('ownerPhone').value = '';
      document.getElementById('smsModal').style.display = 'flex';
      setTimeout(() => document.getElementById('ownerPhone').focus(), 150);
    }

    function closeModal() {
      document.getElementById('smsModal').style.display = 'none';
      activeVehicle = null;
    }

    function sendNativeSms() {
      if (!activeVehicle) return;
      const phoneInput = document.getElementById('ownerPhone').value.trim();
      const cleanPhone = phoneInput.replace(/[^\d+]/g, '');

      if (!cleanPhone || cleanPhone.length < 8) {
        alert('Please enter a valid mobile number.');
        return;
      }

      const vehInfo = `${activeVehicle.colour || ''} ${activeVehicle.make || ''} ${activeVehicle.model || ''}`.trim();
      
      const textMessage = 
`National Towing & Impound Notice

Vehicle: ${vehInfo} (${activeVehicle.rego})
Holding Yard: 4 Lau Place, Ashmore QLD 4214
Standard Release Fee: $450.05 (Tow & Holding)

Release Requirements:
1. Physical Driver Licence / Photo ID
2. Proof of ownership or written letter of authorization from registered owner
3. Payment upon collection (Card / EFTPOS)

Holding Yard Enquiries: 0450 605 370
(Please notify staff 20 minutes prior to arrival)`;

      // Standard mobile SMS protocol link (uses phone's native SIM plan)
      window.location.href = `sms:${cleanPhone}?body=${encodeURIComponent(textMessage)}`;
      closeModal();
    }

    // Auto-fetch yard records on launch
    loadYardVehicles();
  </script>
</body>
</html>
