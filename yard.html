<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YARD</title>
  
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --border: #333333;
      --text: #ffffff;
      --text-muted: #888888;
      --c-mark: #2979ff;
      --c-run: #ffab00;
      --c-tow: #ff1744;
      --c-pass: #ab47bc;
      --c-yard: #00b0ff;
      --c-rel: #00e676;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 12px; padding-bottom: 40px; }

    /* Header (38px standard) & 3x2 Navigation Grid */
    .header-box { display: flex; align-items: center; justify-content: center; position: relative; width: 100%; max-width: 440px; margin: 0 auto 10px auto; }
    .header-box h1 { margin: 0; font-size: 38px; font-weight: 900; color: var(--c-yard); letter-spacing: 2px; }
    .icon-btn { position: absolute; right: 0; background: #2a2a2a; border: 1px solid #444; border-radius: 10px; font-size: 18px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; }

    .nav-grid-3x2 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; max-width: 440px; margin: 0 auto 14px auto; }
    .nav-tile { height: 38px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; text-decoration: none; color: #000; text-transform: uppercase; letter-spacing: 0.5px; }
    .nav-tile:active { transform: scale(0.96); }
    .t-mark { background: var(--c-mark); color: #fff; }
    .t-run  { background: var(--c-run); color: #000; }
    .t-tow  { background: var(--c-tow); color: #fff; }
    .t-pass { background: var(--c-pass); color: #fff; }
    .t-yard { background: var(--c-yard); color: #000; box-shadow: 0 0 0 2px #fff; }
    .t-rel  { background: var(--c-rel); color: #000; }

    /* Search Filter */
    .controls-wrap { width: 100%; max-width: 440px; margin: 0 auto 12px auto; display: flex; gap: 8px; }
    .search-input { flex: 1; height: 46px; background: #1e1e1e; border: 1px solid var(--border); border-radius: 10px; padding: 0 12px; color: #fff; font-size: 16px; font-weight: 700; outline: none; }
    .search-input:focus { border-color: var(--c-yard); }

    /* Yard Cards */
    .card-list { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 440px; margin: 0 auto; }
    .yard-card { background: var(--card-bg); border: 1px solid var(--border); border-left: 5px solid var(--c-yard); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    
    .card-row-top { display: flex; justify-content: space-between; align-items: center; }
    .rego-text { font-size: 26px; font-weight: 900; letter-spacing: 1px; color: #facc15; }
    .prop-text { font-size: 13px; font-weight: 700; color: #aaa; text-align: right; max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .card-body { display: flex; gap: 12px; align-items: center; }
    .thumb-wrap { width: 72px; height: 72px; border-radius: 10px; overflow: hidden; background: #000; border: 1.5px solid var(--border); flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative; }
    .thumb-img { width: 100%; height: 100%; object-fit: cover; }
    .no-img { font-size: 10px; font-weight: 800; color: #555; text-align: center; }

    .details-wrap { flex: 1; display: flex; flex-direction: column; gap: 3px; font-size: 13px; min-width: 0; }
    .veh-line { font-weight: 800; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .towed-line { color: var(--text-muted); font-size: 12px; font-weight: 700; }
    .phone-tag { color: var(--c-rel); font-size: 11px; font-weight: 800; }

    /* Interactive Notes Banner on Tile */
    .notes-box {
      background: #141414; border: 1px dashed #444; border-left: 3px solid #ffab00;
      padding: 6px 10px; border-radius: 6px; font-size: 12px; color: #ffab00; font-weight: 600;
      cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    }
    .notes-box:active { background: #222; }

    /* 50/50 Split Action Buttons */
    .action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
    .btn-action {
      height: 48px; border: none; border-radius: 10px; font-size: 16px; font-weight: 900;
      cursor: pointer; letter-spacing: 1px; display: flex; align-items: center; justify-content: center;
      gap: 6px; text-decoration: none; text-transform: uppercase;
    }
    .btn-sms { background: #0284c7; color: #fff; }
    .btn-sms:active { background: #0369a1; }
    .btn-rel { background: var(--c-rel); color: #000; }
    .btn-rel:active { background: #00c853; }

    /* Modal Overlays (SMS & Notes) */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; padding: 14px; }
    .modal-box { background: #1c1c1c; border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 400px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
    .modal-title { font-size: 18px; font-weight: 900; color: #fff; display: flex; justify-content: space-between; align-items: center; }
    
    .phone-input-wrap { display: flex; gap: 6px; }
    .phone-input { flex: 1; height: 48px; background: #2a2a2a; border: 1px solid #444; border-radius: 10px; color: #fff; font-size: 18px; font-weight: 900; padding: 0 12px; text-align: center; outline: none; }
    .btn-paste { background: #ffab00; color: #000; border: none; border-radius: 10px; padding: 0 14px; font-size: 13px; font-weight: 900; cursor: pointer; }

    .textarea-notes { width: 100%; height: 80px; background: #2a2a2a; border: 1px solid #444; border-radius: 10px; color: #fff; font-size: 14px; font-weight: 600; padding: 10px; outline: none; resize: none; }
    .quick-tags-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .quick-tag { background: #2a2a2a; border: 1px solid #444; color: #aaa; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 800; cursor: pointer; }
    .quick-tag:active { background: #ffab00; color: #000; }

    .modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
    .btn-m-cancel { height: 46px; background: #333; color: #fff; border: none; border-radius: 10px; font-weight: 900; font-size: 14px; cursor: pointer; }
    .btn-m-save { height: 46px; background: var(--c-yard); color: #000; border: none; border-radius: 10px; font-weight: 900; font-size: 15px; cursor: pointer; }
    .btn-m-send { height: 46px; background: #0284c7; color: #fff; border: none; border-radius: 10px; font-weight: 900; font-size: 15px; cursor: pointer; }

    /* Photo Lightbox */
    #photoLightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; align-items: center; justify-content: center; padding: 16px; }
    #lightboxImg { max-width: 100%; max-height: 85vh; border-radius: 10px; border: 2px solid #555; }
  </style>
</head>
<body>

  <!-- Top Title Bar -->
  <div class="header-box">
    <h1>YARD</h1>
    <div class="icon-btn" onclick="fetchYardInventory()">🔄</div>
  </div>

  <!-- 3x2 Grid Navigation -->
  <div class="nav-grid-3x2">
    <a href="mark.html" class="nav-tile t-mark">MARK</a>
    <a href="run.html" class="nav-tile t-run">RUN</a>
    <a href="tow.html" class="nav-tile t-tow">TOW</a>
    <a href="passes.html" class="nav-tile t-pass">PASS</a>
    <a href="yard.html" class="nav-tile t-yard">YARD</a>
    <a href="release.html" class="nav-tile t-rel">REL</a>
  </div>

  <!-- Search Filter -->
  <div class="controls-wrap">
    <input type="text" id="searchInput" class="search-input" placeholder="Search Rego, Property..." oninput="filterYardCards()">
  </div>

  <!-- Yard Stack -->
  <div id="loading" style="text-align:center; padding: 40px; color:var(--text-muted); font-weight:700;">Loading Holding Yard...</div>
  <div id="cardList" class="card-list"></div>

  <!-- 1-Click Clipboard SMS Modal -->
  <div id="smsModal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-title">
        <span id="smsModalPlate" style="color:#facc15;">790WSY</span>
        <span style="font-size:12px; color:#aaa;" id="smsModalProp">Waterpoint</span>
      </div>

      <label style="font-size:11px; text-transform:uppercase; color:#aaa; font-weight:800;">Customer Mobile</label>
      <div class="phone-input-wrap">
        <input type="tel" id="callerPhoneInput" class="phone-input" placeholder="04xx xxx xxx">
        <button type="button" class="btn-paste" onclick="pasteFromClipboard()">📋 PASTE</button>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-m-cancel" onclick="closeSmsModal()">CANCEL</button>
        <button type="button" class="btn-m-send" onclick="submitYardContactAndSms()">SEND SMS 💬</button>
      </div>
    </div>
  </div>

  <!-- Dedicated Notes Modal -->
  <div id="notesModal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-title">
        <span id="notesModalPlate" style="color:#facc15;">790WSY</span>
        <span style="font-size:12px; color:#aaa;">YARD NOTE</span>
      </div>

      <div class="quick-tags-row">
        <span class="quick-tag" onclick="appendTag('Collecting Today')">+ Collecting Today</span>
        <span class="quick-tag" onclick="appendTag('Collecting Tomorrow')">+ Collecting Tomorrow</span>
        <span class="quick-tag" onclick="appendTag('Customer Called')">+ Customer Called</span>
        <span class="quick-tag" onclick="appendTag('Dispute / Hold')">+ Dispute / Hold</span>
      </div>

      <textarea id="notesModalText" class="textarea-notes" placeholder="Enter notes or updates here..."></textarea>

      <div class="modal-actions">
        <button type="button" class="btn-m-cancel" onclick="closeNotesModal()">CANCEL</button>
        <button type="button" class="btn-m-save" onclick="saveVehicleNotes()">SAVE NOTE</button>
      </div>
    </div>
  </div>

  <!-- Fullscreen Photo Lightbox -->
  <div id="photoLightbox" onclick="this.style.display='none'">
    <img id="lightboxImg" src="">
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";

    let yardInventory = [];
    let selectedVehicle = null;

    window.addEventListener('DOMContentLoaded', () => {
      fetchYardInventory();
    });

    async function fetchYardInventory() {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('cardList').innerHTML = '';
      try {
        const resp = await fetch(GOOGLE_SCRIPT_URL + "?action=get_yard_vehicles");
        yardInventory = await resp.json();
        renderCards(yardInventory);
      } catch(e) {
        document.getElementById('cardList').innerHTML = '<div style="color:#ff1744; text-align:center; padding:30px; font-weight:800;">Error connecting to Yard Log. Tap 🔄 to retry.</div>';
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    }

    function renderCards(vehicles) {
      const list = document.getElementById('cardList');
      list.innerHTML = '';
      if (!Array.isArray(vehicles) || vehicles.length === 0) {
        list.innerHTML = '<div style="color:var(--text-muted); text-align:center; padding:50px 10px; font-weight:800;">HOLDING YARD EMPTY</div>';
        return;
      }

      vehicles.forEach(v => {
        const card = document.createElement('div');
        card.className = 'yard-card';

        const thumbContent = v.imageUrl 
          ? `<img src="${v.imageUrl}" class="thumb-img" onclick="showLightbox('${v.imageUrl}')">`
          : `<div class="no-img">NO PHOTO</div>`;

        const phoneDisplay = v.callerPhone ? `<span class="phone-tag">📞 ${v.callerPhone}</span>` : '';
        const noteDisplay = v.notes ? `📝 ${v.notes}` : `+ Add Note...`;

        card.innerHTML = `
          <div class="card-row-top">
            <span class="rego-text">${v.rego}</span>
            <span class="prop-text">${v.property || 'GENERAL'}</span>
          </div>

          <div class="card-body">
            <div class="thumb-wrap">${thumbContent}</div>
            <div class="details-wrap">
              <div class="veh-line">${v.colour || ''} ${v.make || ''} ${v.model || ''}</div>
              <div class="towed-line">Towed: ${v.towedTime || 'Today'}</div>
              <div>${phoneDisplay}</div>
            </div>
          </div>

          <div class="notes-box" onclick='openNotesModal(${JSON.stringify(v)})'>
            <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${noteDisplay}</span>
            <span style="font-size:10px; color:#888;">EDIT ✎</span>
          </div>

          <div class="action-row">
            <button class="btn-action btn-sms" onclick='openSmsModal(${JSON.stringify(v)})'>💬 SMS</button>
            <a href="release.html" class="btn-action btn-rel">RELEASE ➔</a>
          </div>
        `;
        list.appendChild(card);
      });
    }

    function filterYardCards() {
      const q = document.getElementById('searchInput').value.trim().toUpperCase();
      const filtered = yardInventory.filter(v => 
        (v.rego && v.rego.toUpperCase().includes(q)) || 
        (v.property && v.property.toUpperCase().includes(q)) ||
        (v.make && v.make.toUpperCase().includes(q)) ||
        (v.notes && v.notes.toUpperCase().includes(q))
      );
      renderCards(filtered);
    }

    // --- SMS MODAL LOGIC ---
    function openSmsModal(veh) {
      selectedVehicle = veh;
      document.getElementById('smsModalPlate').innerText = veh.rego;
      document.getElementById('smsModalProp').innerText = veh.property || 'GENERAL';
      document.getElementById('callerPhoneInput').value = veh.callerPhone || '';
      document.getElementById('smsModal').style.display = 'flex';
      setTimeout(() => document.getElementById('callerPhoneInput').focus(), 150);
    }

    function closeSmsModal() {
      document.getElementById('smsModal').style.display = 'none';
      selectedVehicle = null;
    }

    async function pasteFromClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        const clean = text.replace(/[^\d+]/g, '');
        if (clean) document.getElementById('callerPhoneInput').value = clean;
      } catch(err) {
        document.getElementById('callerPhoneInput').focus();
      }
    }

    function submitYardContactAndSms() {
      if (!selectedVehicle) return;
      const phone = document.getElementById('callerPhoneInput').value.trim();
      const cleanPhone = phone.replace(/[^\d+]/g, '');

      if (!cleanPhone || cleanPhone.length < 8) {
        alert("Please enter or paste a valid mobile number.");
        return;
      }

      fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'save_yard_details',
          rego: selectedVehicle.rego,
          phone: cleanPhone,
          notes: selectedVehicle.notes || ''
        })
      }).catch(e => console.warn(e));

      const vehDesc = `${selectedVehicle.colour || ''} ${selectedVehicle.make || ''} ${selectedVehicle.model || ''}`.trim();
      const msgBody = 
National Towing Impound Notice

Vehicle: ${vehDesc} (${selectedVehicle.rego})
Towed From: ${selectedVehicle.property || 'Private Property'}

Can be collected from the Holding Yard at 
4 Lau Place, Ashmore QLD 4214 
Take the first left off Hinde Street into Lau Place

Mandatory Release Requirements:
1. Drivers Licence / Photo ID
2. Tow & Release Fee: $450.05 paid in full

Please call ahead to arrange a suitable time for collection
Phone: 0450 605 370

Thank you;

      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      const delim = isIOS ? '&' : '?';
      const smsUri = `sms:${cleanPhone}${delim}body=${encodeURIComponent(msgBody)}`;

      selectedVehicle.callerPhone = cleanPhone;
      renderCards(yardInventory);
      closeSmsModal();

      window.location.href = smsUri;
    }

    // --- NOTES MODAL LOGIC ---
    function openNotesModal(veh) {
      selectedVehicle = veh;
      document.getElementById('notesModalPlate').innerText = veh.rego;
      document.getElementById('notesModalText').value = veh.notes || '';
      document.getElementById('notesModal').style.display = 'flex';
      setTimeout(() => document.getElementById('notesModalText').focus(), 150);
    }

    function closeNotesModal() {
      document.getElementById('notesModal').style.display = 'none';
      selectedVehicle = null;
    }

    function appendTag(tagText) {
      const cur = document.getElementById('notesModalText').value.trim();
      document.getElementById('notesModalText').value = cur ? `${cur}; ${tagText}` : tagText;
    }

    function saveVehicleNotes() {
      if (!selectedVehicle) return;
      const updatedNote = document.getElementById('notesModalText').value.trim();

      fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'save_yard_details',
          rego: selectedVehicle.rego,
          phone: selectedVehicle.callerPhone || '',
          notes: updatedNote
        })
      }).catch(e => console.warn(e));

      selectedVehicle.notes = updatedNote;
      renderCards(yardInventory);
      closeNotesModal();
    }

    function showLightbox(url) {
      document.getElementById('lightboxImg').src = url;
      document.getElementById('photoLightbox').style.display = 'flex';
    }
  </script>
</body>
</html>
