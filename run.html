<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

    <title>RUN</title>
    
    <link rel="apple-touch-icon" href="icon-run.png?v=702">
    <link rel="icon" type="image/png" href="icon-run.png?v=702">
    <link rel="manifest" href="manifest-run.json?v=702">

    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            margin: 0; padding: 14px; background: #121212; color: #fff; 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; 
        }
        
        .header-box { display: flex; align-items: center; justify-content: center; position: relative; width: 100%; max-width: 440px; margin-bottom: 10px; }
        .header-box h1 { margin: 0; font-size: 38px; font-weight: 900; color: #ffab00; letter-spacing: 2px; text-align: center; }
        .icon-btn { position: absolute; right: 0; background: #2a2a2a; border: 1px solid #444; border-radius: 10px; font-size: 20px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; }
        .icon-btn:active { transform: scale(0.9); }

        .nav-bar { display: flex; gap: 8px; width: 100%; max-width: 440px; margin-bottom: 16px; }
        .nav-tile { flex: 1; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 900; text-decoration: none; color: #000; }
        .nav-run { background: #ffab00; }
        .nav-tow { background: #ff1744; color: #fff; }
        .nav-rel { background: #00e676; }
        .nav-pass { background: #ab47bc; color: #fff; }

        .container { width: 100%; max-width: 440px; }

        .prop-summary-card {
            background: #1e1e1e; border-radius: 16px; padding: 14px; margin-bottom: 12px;
            border: 1px solid #333; display: flex; align-items: center; justify-content: space-between;
        }
        .prop-name {
            font-size: 19px; font-weight: 900; color: #ffab00; text-transform: uppercase;
            letter-spacing: 1px; cursor: pointer; flex: 1; padding-right: 8px;
        }

        .count-btns { display: flex; gap: 8px; }
        
        .cnt-btn {
            width: 58px; height: 58px; border-radius: 10px; border: none;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; text-decoration: none; padding: 0;
        }
        .cnt-btn:active { transform: scale(0.92); }

        .cnt-num { font-size: 22px; font-weight: 900; line-height: 1; margin-bottom: 2px; }
        .cnt-lbl { font-size: 10px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; line-height: 1; }

        .btn-red { background: #ff1744; color: #fff; }
        .btn-orange { background: #ffab00; color: #000; }
        .btn-blue { background: #29b6f6; color: #000; }

        .back-btn {
            background: #2a2a2a; border: 1px solid #444; color: #ffab00; padding: 8px 16px;
            border-radius: 10px; font-weight: 900; margin-bottom: 14px; cursor: pointer; display: inline-block;
        }
        .detail-title { font-size: 24px; font-weight: 900; color: #ffab00; margin-bottom: 12px; text-transform: uppercase; }

        .car-tile {
            background: #1e1e1e; border-radius: 14px; padding: 16px; margin-bottom: 12px;
            display: flex; align-items: center; justify-content: space-between; border: 2px solid #333;
            text-decoration: none; color: #fff; transition: transform 0.1s ease; cursor: pointer;
        }
        .car-tile:active { transform: scale(0.98); }

        .tile-ready { border-color: #ff1744; background: #2a1215; }
        .tile-wait { border-color: #ffab00; background: #2a2212; }
        .tile-pass { border-color: #29b6f6; background: #0d212d; }

        .rego-header-line { display: flex; align-items: baseline; gap: 12px; }
        .car-rego { font-size: 32px; font-weight: 900; letter-spacing: 1px; line-height: 1; }
        .tile-ready .car-rego { color: #ff1744; }
        .tile-wait .car-rego { color: #ffab00; }
        .tile-pass .car-rego { color: #29b6f6; }

        .car-time-mkd { font-size: 13px; color: #aaa; font-weight: 700; line-height: 1; }
        .car-time-exp { font-size: 22px; color: #fff; font-weight: 900; margin-top: 6px; letter-spacing: 0.5px; }

        .tile-right-box { display: flex; align-items: center; gap: 8px; }

        .pic-preview-btn {
            width: 44px; height: 44px; border-radius: 10px; background: #2a2a2a;
            border: 1px solid #555; font-size: 20px; display: flex; align-items: center;
            justify-content: center; cursor: pointer; color: #fff; flex-shrink: 0;
        }
        .pic-preview-btn:active { transform: scale(0.90); background: #333; }

        .badge { padding: 10px 14px; border-radius: 8px; font-size: 15px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }
        .badge-ready { background: #ff1744; color: #fff; }
        .badge-wait { background: #ffab00; color: #000; }
        .badge-pass { background: #29b6f6; color: #000; }

        .empty-msg { text-align: center; color: #666; font-weight: 800; font-size: 16px; margin-top: 40px; }

        /* Camera Overlay Modal */
        .overlay-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 9999; flex-direction: column; }
        .overlay-modal.show { display: flex; }
        .modal-header { height: 50px; background: #1e1e1e; display: flex; justify-content: space-between; align-items: center; padding: 0 16px; border-bottom: 1px solid #333; }
        .modal-title { font-weight: bold; font-size: 15px; color: #fff; }
        .close-btn { color: #ff1744; font-weight: bold; font-size: 22px; cursor: pointer; }
        
        .opacity-bar { background: #2a2a2a; padding: 8px 16px; display: flex; align-items: center; gap: 12px; font-size: 12px; font-weight: bold; color: #ffab00; border-bottom: 1px solid #333; }
        .opacity-bar input { flex: 1; accent-color: #ff1744; }

        .viewfinder-container { flex: 1; position: relative; overflow: hidden; background: #000; }
        #overlayVideo { width: 100%; height: 100%; object-fit: cover; }
        #ghostImage { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.45; pointer-events: none; }
        
        .overlay-torch-btn {
            position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.75);
            border: 1.5px solid #ffab00; color: #ffab00; padding: 6px 14px; border-radius: 20px;
            font-size: 11px; font-weight: 900; cursor: pointer; z-index: 20; letter-spacing: 0.5px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .modal-footer { height: 75px; background: #1e1e1e; display: flex; justify-content: space-evenly; align-items: center; border-top: 1px solid #333; padding: 0 10px; gap: 10px; }
        .match-btn { flex: 1; background: #ff1744; color: #fff; border: none; padding: 14px 0; border-radius: 10px; font-weight: 900; font-size: 14px; cursor: pointer; text-transform: uppercase; }
        .skip-btn { flex: 1; background: #444; color: #fff; border: none; padding: 14px 0; border-radius: 10px; font-weight: 900; font-size: 14px; cursor: pointer; text-transform: uppercase; }

        /* Fullscreen Mark Image Preview Modal */
        .preview-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #121212; z-index: 10000; flex-direction: column; }
        .preview-modal.show { display: flex; }
        .preview-header { height: 60px; background: #1e1e1e; border-bottom: 1px solid #333; display: flex; align-items: center; padding: 0 14px; gap: 12px; flex-shrink: 0; }
        .preview-back-btn { background: #2a2a2a; border: 1px solid #555; color: #ffab00; font-size: 14px; font-weight: 900; padding: 8px 14px; border-radius: 8px; cursor: pointer; }
        .preview-back-btn:active { transform: scale(0.95); }
        .preview-titles { display: flex; flex-direction: column; min-width: 0; }
        .preview-rego { font-size: 18px; font-weight: 900; color: #fff; letter-spacing: 1px; line-height: 1.2; }
        .preview-meta { font-size: 11px; color: #aaa; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .preview-body { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; padding: 10px; }
        #previewImg { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
    </style>
</head>
<body>

<div class="header-box">
    <h1>RUN</h1>
    <div class="icon-btn" id="refreshBtn">🔄</div>
</div>

<div class="nav-bar">
    <a href="run.html" class="nav-tile nav-run">RUN</a>
    <a href="tow.html" class="nav-tile nav-tow">TOW</a>
    <a href="release.html" class="nav-tile nav-rel">REL</a>
    <a href="passes.html" class="nav-tile nav-pass">PASS</a>
</div>

<div class="container" id="runContainer">
    <div class="empty-msg">LOADING RUN...</div>
</div>

<!-- Overlay Comparison Viewfinder -->
<div id="overlayModal" class="overlay-modal">
    <div class="modal-header">
        <span class="modal-title" id="modalRegoTitle">ALIGN & VERIFY TOW</span>
        <span class="close-btn" onclick="closeOverlayModal()">✕</span>
    </div>
    
    <div class="opacity-bar">
        <span>GHOST OPACITY:</span>
        <input type="range" id="opacitySlider" min="0" max="100" value="45">
    </div>

    <div class="viewfinder-container">
        <video id="overlayVideo" autoplay playsinline muted></video>
        <img id="ghostImage" alt="Ghost Overlay">
        <button class="overlay-torch-btn" id="overlayTorchBtn">⚡ FLASH: AUTO</button>
    </div>
    
    <div class="modal-footer">
        <button id="matchBtn" class="match-btn">MATCH & TOW</button>
        <button id="skipBtn" class="skip-btn">SKIP & TOW</button>
    </div>
</div>

<!-- Fullscreen Mark Image Preview Modal -->
<div id="previewModal" class="preview-modal">
    <div class="preview-header">
        <button class="preview-back-btn" onclick="closePhotoPreview()">← BACK</button>
        <div class="preview-titles">
            <span class="preview-rego" id="previewTitle"></span>
            <span class="preview-meta" id="previewMeta"></span>
        </div>
    </div>
    <div class="preview-body">
        <img id="previewImg" alt="Mark Photo">
        <div id="previewEmpty" class="empty-msg" style="display:none;">NO MARK PHOTO ATTACHED</div>
    </div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(()=>{});
    }

    const runContainer = document.getElementById('runContainer');
    const refreshBtn = document.getElementById('refreshBtn');
    const overlayModal = document.getElementById('overlayModal');
    const overlayVideo = document.getElementById('overlayVideo');
    const ghostImage = document.getElementById('ghostImage');
    const modalRegoTitle = document.getElementById('modalRegoTitle');
    const opacitySlider = document.getElementById('opacitySlider');
    const matchBtn = document.getElementById('matchBtn');
    const skipBtn = document.getElementById('skipBtn');
    const overlayTorchBtn = document.getElementById('overlayTorchBtn');

    let rawData = [];
    let propertyGroups = {};
    let activeCar = null;
    let videoStream = null;
    let overlayVideoTrack = null;
    let overlayTrackCaps = {};

    // FLASH STATE: 'auto' | 'torch' | 'off'
    let overlayFlashMode = localStorage.getItem('run_flash_mode') || 'auto';

    window.addEventListener('load', () => {
        updateOverlayTorchUI();
        loadTowRun();
    });

    refreshBtn.addEventListener('click', () => {
        runContainer.innerHTML = "<div class='empty-msg'>REFRESHING...</div>";
        loadTowRun();
    });

    opacitySlider.addEventListener('input', (e) => {
        ghostImage.style.opacity = e.target.value / 100;
    });

    function updateOverlayTorchUI() {
        if (!overlayTorchBtn) return;
        if (overlayFlashMode === 'auto') {
            overlayTorchBtn.innerText = "⚡ FLASH: AUTO";
            overlayTorchBtn.style.borderColor = "#ffab00";
            overlayTorchBtn.style.color = "#ffab00";
        } else if (overlayFlashMode === 'torch') {
            overlayTorchBtn.innerText = "🔦 TORCH: ON";
            overlayTorchBtn.style.borderColor = "#00e676";
            overlayTorchBtn.style.color = "#00e676";
        } else {
            overlayTorchBtn.innerText = "⚡ FLASH: OFF";
            overlayTorchBtn.style.borderColor = "#ff1744";
            overlayTorchBtn.style.color = "#ff1744";
        }
    }

    overlayTorchBtn.addEventListener('click', async () => {
        if (overlayFlashMode === 'auto') overlayFlashMode = 'torch';
        else if (overlayFlashMode === 'torch') overlayFlashMode = 'off';
        else overlayFlashMode = 'auto';

        localStorage.setItem('run_flash_mode', overlayFlashMode);
        updateOverlayTorchUI();

        if (overlayVideoTrack && overlayTrackCaps.torch) {
            try {
                await overlayVideoTrack.applyConstraints({
                    advanced: [{ torch: (overlayFlashMode === 'torch') }]
                });
            } catch(e) {}
        }
    });

    function isLowLight(video) {
        try {
            const miniCanvas = document.createElement('canvas');
            miniCanvas.width = 20;
            miniCanvas.height = 20;
            const miniCtx = miniCanvas.getContext('2d', { willReadFrequently: true });
            miniCtx.drawImage(video, 0, 0, 20, 20);
            const imgData = miniCtx.getImageData(0, 0, 20, 20).data;
            let totalLuminance = 0;
            for (let i = 0; i < imgData.length; i += 4) {
                totalLuminance += (0.299 * imgData[i] + 0.587 * imgData[i+1] + 0.114 * imgData[i+2]);
            }
            const avgLuminance = totalLuminance / (imgData.length / 4);
            return avgLuminance < 50;
        } catch(e) {
            return false;
        }
    }

    async function loadTowRun() {
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL + "?action=get_run");
            rawData = await res.json();
            localStorage.setItem('cached_run_data', JSON.stringify(rawData));
            parseAndRenderRun(rawData);
        } catch(e) {
            const cached = localStorage.getItem('cached_run_data');
            if (cached) {
                rawData = JSON.parse(cached);
                parseAndRenderRun(rawData);
            } else {
                runContainer.innerHTML = "<div class='empty-msg'>NO OFFLINE DATA STORED</div>";
            }
        }
    }

    function parseAndRenderRun(data) {
        if (!data || !Array.isArray(data) || data.length === 0) {
            runContainer.innerHTML = "<div class='empty-msg'>NO CARS ON RUN</div>";
            return;
        }

        const blacklisted = JSON.parse(localStorage.getItem('towed_blacklist') || "{}");
        const offlineQueue = JSON.parse(localStorage.getItem('tow_offline_queue') || "[]");
        const offlineRegos = new Set(offlineQueue.map(item => String(item.rego || '').trim().toUpperCase()));
        const nowMs = Date.now();

        data = data.filter(item => {
            const r = String(item.rego || '').trim().toUpperCase();
            if (!r) return false;
            if (offlineRegos.has(r)) return false;
            if (blacklisted[r] && (nowMs - blacklisted[r] < 4 * 60 * 60 * 1000)) return false;
            return true;
        });

        if (data.length === 0) {
            runContainer.innerHTML = "<div class='empty-msg'>NO CARS ON RUN</div>";
            return;
        }

        propertyGroups = {};

        data.forEach(item => {
            const prop = item.property || "GENERAL";
            if (!propertyGroups[prop]) propertyGroups[prop] = [];

            let status = "WAIT";
            if (item.pass === "YES") {
                status = "PASS";
            } else if (item.rawExpiryMs > 0 && nowMs >= item.rawExpiryMs) {
                status = "READY";
            } else {
                let expMs = item.rawExpiryMs || 0;
                if (!expMs && item.expiryTime) {
                    const cleanExp = item.expiryTime.replace(/^[A-Za-z]+\s+/, "");
                    const parts = cleanExp.split(/[\s-:]+/);
                    if (parts.length >= 4) {
                        const day = parseInt(parts[0], 10);
                        const month = parseInt(parts[1], 10) - 1;
                        const year = new Date().getFullYear();
                        const hours = parseInt(parts[2], 10);
                        const mins = parseInt(parts[3], 10);
                        expMs = new Date(year, month, day, hours, mins).getTime();
                    }
                }
                if (expMs > 0 && nowMs >= expMs) {
                    status = "READY";
                }
            }

            const cleanMkd = formatCleanDisplayTime(item.markedTime);
            const cleanExp = formatCleanDisplayTime(item.expiryTime);

            propertyGroups[prop].push({
                rego: item.rego,
                markedTimeStr: cleanMkd,
                expiryTimeStr: cleanExp,
                status: status,
                property: prop,
                imageUrl: item.imageUrl || item.image || ""
            });
        });

        renderSummaryView();
    }

    function formatCleanDisplayTime(rawStr) {
        if (!rawStr) return "N/A";
        if (String(rawStr).includes("T")) {
            const d = new Date(rawStr);
            if (!isNaN(d.getTime())) {
                const days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
                const dayName = days[d.getDay()];
                const hh = String(d.getHours()).padStart(2, '0');
                const mm = String(d.getMinutes()).padStart(2, '0');
                return `${dayName} ${hh}:${mm}`;
            }
        }
        const parts = String(rawStr).trim().split(/\s+/);
        if (parts.length >= 3) {
            return `${parts[0]} ${parts[2]}`;
        }
        return String(rawStr);
    }

    function renderSummaryView() {
        const sortedProps = Object.keys(propertyGroups).sort((a, b) => {
            let redA = propertyGroups[a].filter(c => c.status === "READY").length;
            let redB = propertyGroups[b].filter(c => c.status === "READY").length;
            if (redB !== redA) return redB - redA;

            let orangeA = propertyGroups[a].filter(c => c.status === "WAIT").length;
            let orangeB = propertyGroups[b].filter(c => c.status === "WAIT").length;
            if (orangeB !== orangeA) return orangeB - orangeA;

            let blueA = propertyGroups[a].filter(c => c.status === "PASS").length;
            let blueB = propertyGroups[b].filter(c => c.status === "PASS").length;
            if (blueB !== blueA) return blueB - blueA;

            return a.localeCompare(b);
        });

        runContainer.innerHTML = "";

        sortedProps.forEach(prop => {
            const redCount = propertyGroups[prop].filter(c => c.status === "READY").length;
            const orangeCount = propertyGroups[prop].filter(c => c.status === "WAIT").length;
            const blueCount = propertyGroups[prop].filter(c => c.status === "PASS").length;

            const card = document.createElement('div');
            card.className = 'prop-summary-card';

            card.innerHTML = `
                <div class="prop-name" onclick="renderDetailView('${prop}', 'ALL')">${prop}</div>
                <div class="count-btns">
                    <button class="cnt-btn btn-red" onclick="renderDetailView('${prop}', 'READY')">
                        <span class="cnt-num">${redCount}</span>
                        <span class="cnt-lbl">TOW</span>
                    </button>
                    <button class="cnt-btn btn-orange" onclick="renderDetailView('${prop}', 'WAIT')">
                        <span class="cnt-num">${orangeCount}</span>
                        <span class="cnt-lbl">WAIT</span>
                    </button>
                    <button class="cnt-btn btn-blue" onclick="renderDetailView('${prop}', 'PASS')">
                        <span class="cnt-num">${blueCount}</span>
                        <span class="cnt-lbl">PASS</span>
                    </button>
                </div>
            `;

            runContainer.appendChild(card);
        });
    }

    function renderDetailView(prop, filterStatus) {
        runContainer.innerHTML = "";

        const backBtn = document.createElement('div');
        backBtn.className = 'back-btn';
        backBtn.innerText = "← BACK TO ALL PROPERTIES";
        backBtn.onclick = renderSummaryView;
        runContainer.appendChild(backBtn);

        const title = document.createElement('div');
        title.className = 'detail-title';
        title.innerText = `${prop} ${filterStatus !== 'ALL' ? '(' + filterStatus + ')' : ''}`;
        runContainer.appendChild(title);

        let cars = propertyGroups[prop] || [];
        if (filterStatus !== 'ALL') {
            cars = cars.filter(c => c.status === filterStatus);
        }

        const statusOrder = { "READY": 1, "WAIT": 2, "PASS": 3 };
        cars.sort((a, b) => statusOrder[a.status] - statusOrder[b.status]);

        if (cars.length === 0) {
            runContainer.innerHTML += `<div class="empty-msg">NO ${filterStatus} VEHICLES</div>`;
            return;
        }

        cars.forEach(car => {
            const tile = document.createElement('div');
            
            if (car.status === "READY") {
                tile.className = 'car-tile tile-ready';
                tile.addEventListener('click', (e) => {
                    e.preventDefault();
                    openOverlayModal(car);
                });
            } else if (car.status === "WAIT") {
                tile.className = 'car-tile tile-wait';
                tile.addEventListener('click', () => {
                    window.location.href = `tow.html?rego=${encodeURIComponent(car.rego)}&prop=${encodeURIComponent(car.property)}`;
                });
            } else {
                tile.className = 'car-tile tile-pass';
                tile.addEventListener('click', () => {
                    window.location.href = `passes.html`;
                });
            }

            tile.innerHTML = `
                <div>
                    <div class="rego-header-line">
                        <span class="car-rego">${car.rego}</span>
                        <span class="car-time-mkd">MKD: ${car.markedTimeStr}</span>
                    </div>
                    <div class="car-time-exp">EXP: ${car.expiryTimeStr}</div>
                </div>
                <div class="tile-right-box">
                    <button class="pic-preview-btn" title="View Mark Photo">📷</button>
                    <div class="badge badge-${car.status.toLowerCase()}">${car.status === "READY" ? "TOW" : car.status}</div>
                </div>
            `;

            const previewBtn = tile.querySelector('.pic-preview-btn');
            previewBtn.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                openPhotoPreview(car);
            });

            runContainer.appendChild(tile);
        });
    }

    // --- MARK PHOTO PREVIEW LOGIC ---
    function openPhotoPreview(car) {
        const previewModal = document.getElementById('previewModal');
        const previewTitle = document.getElementById('previewTitle');
        const previewMeta = document.getElementById('previewMeta');
        const previewImg = document.getElementById('previewImg');
        const previewEmpty = document.getElementById('previewEmpty');

        previewTitle.innerText = `${car.rego} (${car.property})`;
        previewMeta.innerText = `MARKED: ${car.markedTimeStr} | EXP: ${car.expiryTimeStr}`;

        if (car.imageUrl) {
            let displayUrl = car.imageUrl;
            const idMatch = car.imageUrl.match(/[-\w]{25,}/);
            if (idMatch) {
                displayUrl = "https://lh3.googleusercontent.com/d/" + idMatch[0];
            }
            previewImg.src = displayUrl;
            previewImg.style.display = "block";
            previewEmpty.style.display = "none";
        } else {
            previewImg.style.display = "none";
            previewEmpty.style.display = "block";
        }

        previewModal.classList.add('show');
    }

    function closePhotoPreview() {
        const previewModal = document.getElementById('previewModal');
        previewModal.classList.remove('show');
        const previewImg = document.getElementById('previewImg');
        if (previewImg) previewImg.src = "";
    }

    // --- OVERLAY CAMERA & VERIFICATION LOGIC ---
    async function openOverlayModal(car) {
        try {
            activeCar = car;
            modalRegoTitle.innerText = `${car.rego} (${car.property})`;
            
            if (car.imageUrl) {
                let fastUrl = car.imageUrl;
                const idMatch = car.imageUrl.match(/[-\w]{25,}/);
                if (idMatch) {
                    fastUrl = "https://lh3.googleusercontent.com/d/" + idMatch[0];
                }
                ghostImage.crossOrigin = "anonymous";
                ghostImage.src = fastUrl;
            } else {
                ghostImage.removeAttribute("crossOrigin");
                ghostImage.src = "";
            }

            overlayModal.classList.add('show');
            await startOverlayCamera();
        } catch(err) {
            alert("Error opening comparison: " + err.message);
        }
    }
    
    async function startOverlayCamera() {
        try {
            videoStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: false
            });
            overlayVideo.srcObject = videoStream;
            overlayVideoTrack = videoStream.getVideoTracks()[0];

            if (overlayVideoTrack) {
                overlayTrackCaps = overlayVideoTrack.getCapabilities ? overlayVideoTrack.getCapabilities() : {};
                if (!overlayTrackCaps.torch) {
                    if (overlayTorchBtn) overlayTorchBtn.style.display = 'none';
                } else {
                    if (overlayTorchBtn) overlayTorchBtn.style.display = 'block';
                    if (overlayFlashMode === 'torch') {
                        try {
                            await overlayVideoTrack.applyConstraints({ advanced: [{ torch: true }] });
                        } catch(e) {}
                    }
                }
            }
        } catch(err) {
            alert("Unable to access camera: " + err.message);
        }
    }

    function closeOverlayModal() {
        stopOverlayCamera();
        overlayModal.classList.remove('show');
    }

    function stopOverlayCamera() {
        if (videoStream) {
            videoStream.getTracks().forEach(track => track.stop());
            videoStream = null;
            overlayVideoTrack = null;
        }
    }

    skipBtn.addEventListener('click', () => {
        if (!activeCar) return;
        stopOverlayCamera();
        window.location.href = `tow.html?rego=${encodeURIComponent(activeCar.rego)}&prop=${encodeURIComponent(activeCar.property)}`;
    });

    matchBtn.addEventListener('click', async () => {
        if (!activeCar) return;

        matchBtn.disabled = true;
        matchBtn.innerText = "CAPTURING...";

        let firedFlash = false;
        const needsFlash = (overlayFlashMode === 'torch') || (overlayFlashMode === 'auto' && isLowLight(overlayVideo));

        // 1. Trigger torch strobe if low light with 300ms AE/AF lock
        if (needsFlash && overlayVideoTrack && overlayTrackCaps.torch) {
            try {
                await overlayVideoTrack.applyConstraints({ advanced: [{ torch: true }] });
                firedFlash = true;
                if (overlayFlashMode !== 'torch') {
                    await new Promise(r => setTimeout(r, 300));
                }
            } catch(e) {}
        }

        const videoRatio = (overlayVideo.videoHeight && overlayVideo.videoWidth) 
            ? (overlayVideo.videoHeight / overlayVideo.videoWidth) 
            : 0.75;

        const frameW = 600;
        const frameH = Math.round(frameW * videoRatio);

        const liveCanvas = document.createElement('canvas');
        liveCanvas.width = frameW;
        liveCanvas.height = frameH;
        const liveCtx = liveCanvas.getContext('2d');
        liveCtx.drawImage(overlayVideo, 0, 0, frameW, frameH);

        // 2. Shut off flash strobe immediately (keep lit if continuous torch mode)
        if (firedFlash && overlayFlashMode !== 'torch' && overlayVideoTrack && overlayTrackCaps.torch) {
            try {
                await overlayVideoTrack.applyConstraints({ advanced: [{ torch: false }] });
            } catch(e) {}
        }

        const compositeCanvas = document.createElement('canvas');
        compositeCanvas.width = frameW * 2;
        compositeCanvas.height = frameH;
        const compCtx = compositeCanvas.getContext('2d');
        compCtx.drawImage(liveCanvas, frameW, 0);

        const now = new Date();
        const towTimeTag = formatDateTag(now);
        const markTimeTag = activeCar.markedTimeStr ? activeCar.markedTimeStr : towTimeTag;

        const finalizeAndRedirect = (canvasToUpload) => {
            let compositeB64 = "";
            try {
                compositeB64 = canvasToUpload.toDataURL('image/jpeg', 0.45);
            } catch(e) {
                compositeB64 = liveCanvas.toDataURL('image/jpeg', 0.45);
            }

            try { 
                localStorage.setItem('pending_comp_' + activeCar.rego, compositeB64); 
            } catch(e) {}

            stopOverlayCamera();
            window.location.href = `tow.html?rego=${encodeURIComponent(activeCar.rego)}&prop=${encodeURIComponent(activeCar.property)}`;
        };

        const markImg = new Image();
        markImg.crossOrigin = "anonymous";
        let isTimedOut = false;
        const markTimer = setTimeout(() => {
            isTimedOut = true;
            finalizeAndRedirect(liveCanvas);
        }, 1200);

        markImg.onload = () => {
            if (isTimedOut) return;
            clearTimeout(markTimer);
            try { 
                compCtx.drawImage(markImg, 0, 0, frameW, frameH); 
                compCtx.fillStyle = "#ff1744";
                compCtx.font = "bold 16px sans-serif";
                compCtx.fillText(`ORIGINAL MARK ${markTimeTag}`, 15, 25);
                compCtx.fillText(`TOW VERIFICATION ${towTimeTag}`, frameW + 15, 25);
                finalizeAndRedirect(compositeCanvas);
            } catch(e) {
                finalizeAndRedirect(liveCanvas);
            }
        };
        markImg.onerror = () => { 
            if (isTimedOut) return;
            clearTimeout(markTimer);
            finalizeAndRedirect(liveCanvas); 
        };

        if (ghostImage.src && ghostImage.src !== "") {
            markImg.src = ghostImage.src;
        } else {
            markImg.onerror();
        }
    });

    function formatDateTag(d) {
        if (!d || isNaN(d.getTime())) return "";
        const dd = String(d.getDate()).padStart(2, '0');
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        let hh = d.getHours();
        const min = String(d.getMinutes()).padStart(2, '0');
        const ampm = hh >= 12 ? 'PM' : 'AM';
        hh = hh % 12;
        hh = hh ? hh : 12;
        return `${dd}/${mm} ${String(hh).padStart(2, '0')}:${min} ${ampm}`;
    }

    // AUTOMATIC BACKGROUND TOW UPLOADER
    window.addEventListener('load', () => {
        syncPendingTowsInBackground();
        setInterval(syncPendingTowsInBackground, 8000);
    });
    window.addEventListener('online', syncPendingTowsInBackground);

    let isSyncingQueue = false;
    async function syncPendingTowsInBackground() {
        if (isSyncingQueue || !navigator.onLine) return;
        let queue = JSON.parse(localStorage.getItem('tow_offline_queue') || "[]");
        if (queue.length === 0) return;

        isSyncingQueue = true;
        for (let i = 0; i < queue.length; i++) {
            const item = queue[i];
            try {
                const res = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(item)
                });
                const resJson = await res.json();
                if (resJson && resJson.status === "SUCCESS") {
                    let updatedQueue = JSON.parse(localStorage.getItem('tow_offline_queue') || "[]");
                    updatedQueue = updatedQueue.filter(q => q.id !== item.id);
                    localStorage.setItem('tow_offline_queue', JSON.stringify(updatedQueue));
                }
            } catch(err) {
                console.warn("[Background Sync] Postponed due to network:", err);
                break;
            }
        }
        isSyncingQueue = false;
    }
</script>
