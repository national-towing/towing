<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="National Towing">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

    <title>RUN</title>
    
    <link rel="apple-touch-icon" href="icon-manager.png?v=2">
    <link rel="icon" type="image/png" href="icon-manager.png?v=2">
    <link rel="manifest" href="manifest-run.json?v=2">

    <style>
        :root {
            --c-mark: #2979ff;
            --c-run: #ffab00;
            --c-tow: #ff1744;
            --c-pass: #ab47bc;
            --c-yard: #00b0ff;
            --c-rel: #00e676;
        }
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            margin: 0; padding: 14px; background: #121212; color: #fff; 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; 
        }
        
        .header-box { display: flex; align-items: center; justify-content: center; position: relative; width: 100%; max-width: 440px; margin-bottom: 10px; }
        .header-box h1 { margin: 0; font-size: 38px; font-weight: 900; color: #ffab00; letter-spacing: 2px; text-align: center; }
        .icon-btn { position: absolute; right: 0; background: #2a2a2a; border: 1px solid #444; border-radius: 10px; font-size: 20px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; }
        .icon-btn:active { transform: scale(0.9); }

        /* 3x2 Grid Navigation */
        .nav-grid-3x2 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; max-width: 440px; margin: 0 auto 10px auto; }
        .nav-tile { height: 38px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; text-decoration: none; color: #000; text-transform: uppercase; letter-spacing: 0.5px; }
        .nav-tile:active { transform: scale(0.96); }
        .t-mark { background: var(--c-mark); color: #fff; }
        .t-run  { background: var(--c-run); color: #000; box-shadow: 0 0 0 2px #fff; }
        .t-tow  { background: var(--c-tow); color: #fff; }
        .t-pass { background: var(--c-pass); color: #fff; }
        .t-yard { background: var(--c-yard); color: #000; }
        .t-rel  { background: var(--c-rel); color: #000; }

        /* DRIVE-BY HUD CHECK BUTTON */
        .hud-check-btn {
            width: 100%; max-width: 440px; height: 56px; border-radius: 12px; border: none;
            background: linear-gradient(135deg, #ff1744 0%, #ffab00 100%); color: #000;
            font-size: 20px; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase;
            display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 12px;
            cursor: pointer; box-shadow: 0 4px 15px rgba(255, 23, 68, 0.4);
        }
        .hud-check-btn:active { transform: scale(0.97); }

        .container { width: 100%; max-width: 440px; }

        .prop-summary-card {
            background: #1e1e1e; border-radius: 16px; padding: 14px; margin-bottom: 12px;
            border: 1px solid #333; display: flex; align-items: center; justify-content: space-between;
        }
        .prop-name {
            font-size: 19px; font-weight: 900; color: #ffab00; text-transform: uppercase;
            letter-spacing: 1px; cursor: pointer; flex: 1; padding-right: 8px;
        }

        .count-btns { display: flex; gap: 8px; }
        .cnt-btn {
            width: 58px; height: 58px; border-radius: 10px; border: none;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; text-decoration: none; padding: 0;
        }
        .cnt-btn:active { transform: scale(0.92); }
        .cnt-num { font-size: 22px; font-weight: 900; line-height: 1; margin-bottom: 2px; }
        .cnt-lbl { font-size: 10px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; line-height: 1; }

        .btn-red { background: #ff1744; color: #fff; }
        .btn-orange { background: #ffab00; color: #000; }
        .btn-blue { background: #29b6f6; color: #000; }

        .back-btn {
            background: #2a2a2a; border: 1px solid #444; color: #ffab00; padding: 8px 16px;
            border-radius: 10px; font-weight: 900; margin-bottom: 10px; cursor: pointer; display: inline-block;
        }
        .detail-title { font-size: 22px; font-weight: 900; color: #ffab00; margin-bottom: 10px; text-transform: uppercase; }

        .car-tile {
            background: #1e1e1e; border-radius: 14px; padding: 16px; margin-bottom: 12px;
            display: flex; align-items: center; justify-content: space-between; border: 2px solid #333;
            text-decoration: none; color: #fff; transition: transform 0.1s ease; cursor: pointer;
        }
        .car-tile:active { transform: scale(0.98); }
        .tile-ready { border-color: #ff1744; background: #2a1215; }
        .tile-wait { border-color: #ffab00; background: #2a2212; }
        .tile-pass { border-color: #29b6f6; background: #0d212d; }

        .rego-header-line { display: flex; align-items: baseline; gap: 12px; }
        .car-rego { font-size: 32px; font-weight: 900; letter-spacing: 1px; line-height: 1; }
        .tile-ready .car-rego { color: #ff1744; }
        .tile-wait .car-rego { color: #ffab00; }
        .tile-pass .car-rego { color: #29b6f6; }

        .car-time-mkd { font-size: 13px; color: #aaa; font-weight: 700; line-height: 1; }
        .car-time-exp { font-size: 22px; color: #fff; font-weight: 900; margin-top: 6px; letter-spacing: 0.5px; }

        .tile-right-box { display: flex; align-items: center; gap: 8px; }
        .pic-preview-btn {
            width: 44px; height: 44px; border-radius: 10px; background: #2a2a2a;
            border: 1px solid #555; font-size: 20px; display: flex; align-items: center;
            justify-content: center; cursor: pointer; color: #fff; flex-shrink: 0;
        }
        .badge { padding: 10px 14px; border-radius: 8px; font-size: 15px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }
        .badge-ready { background: #ff1744; color: #fff; }
        .badge-wait { background: #ffab00; color: #000; }
        .badge-pass { background: #29b6f6; color: #000; }

        .empty-msg { text-align: center; color: #666; font-weight: 800; font-size: 16px; margin-top: 40px; }

        /* DRIVE-BY HUD CAMERA MODAL */
        #hudCamModal {
            display: none; position: fixed; inset: 0; background: #000; z-index: 99999;
            flex-direction: column;
        }
        .hud-cam-header {
            height: 52px; background: rgba(0,0,0,0.85); display: flex; align-items: center;
            justify-content: space-between; padding: 0 16px; position: absolute; top: 0; left: 0; width: 100%; z-index: 10;
        }
        .hud-cam-view { flex: 1; width: 100%; height: 100%; position: relative; overflow: hidden; }
        #hudVideo { width: 100%; height: 100%; object-fit: cover; }
        
        .hud-target-reticle {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            width: 75%; height: 90px; border: 2.5px dashed #00e676; border-radius: 12px;
            pointer-events: none; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
        }
        .hud-target-hint {
            position: absolute; top: -24px; left: 0; width: 100%; text-align: center;
            color: #00e676; font-weight: 900; font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
        }

        .hud-snap-trigger {
            position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
            width: 86px; height: 86px; background: #fff; border: 5px solid #000; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 20;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }
        .hud-snap-trigger:active { transform: translateX(-50%) scale(0.92); }
        .hud-snap-inner { width: 62px; height: 62px; background: #ff1744; border-radius: 50%; }

        /* INSTANT 2-SECOND HUD OVERLAY FLASH */
        #hudFlashOverlay {
            display: none; position: fixed; inset: 0; z-index: 100000;
            flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 24px; transition: opacity 0.2s ease;
        }
        .hud-flash-tow    { background: rgba(255, 23, 68, 0.96); }   /* RED */
        .hud-flash-pass   { background: rgba(41, 182, 246, 0.96); }  /* BLUE */
        .hud-flash-nomark { background: rgba(0, 230, 118, 0.96); }   /* GREEN */
        .hud-flash-wait   { background: rgba(255, 171, 0, 0.96); }   /* ORANGE */

        .hud-main-status {
            font-size: 78px; font-weight: 950; color: #000; letter-spacing: 3px;
            text-transform: uppercase; line-height: 0.95; margin: 0; text-shadow: 0 2px 10px rgba(255,255,255,0.3);
        }
        .hud-sub-plate {
            font-size: 44px; font-weight: 900; color: #fff; margin-top: 14px;
            letter-spacing: 2px; text-transform: uppercase; line-height: 1;
        }
        .hud-detail-line {
            font-size: 20px; font-weight: 800; color: #000; margin-top: 10px;
            text-transform: uppercase; letter-spacing: 1px; max-width: 90%;
        }

        /* Fullscreen Comparison & Preview Modals */
        .overlay-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 9999; flex-direction: column; }
        .overlay-modal.show { display: flex; }
        .modal-header { height: 50px; background: #1e1e1e; display: flex; justify-content: space-between; align-items: center; padding: 0 16px; border-bottom: 1px solid #333; }
        .modal-title { font-weight: bold; font-size: 15px; color: #fff; }
        .close-btn { color: #ff1744; font-weight: bold; font-size: 22px; cursor: pointer; }
        .opacity-bar { background: #2a2a2a; padding: 8px 16px; display: flex; align-items: center; gap: 12px; font-size: 12px; font-weight: bold; color: #ffab00; border-bottom: 1px solid #333; }
        .opacity-bar input { flex: 1; accent-color: #ff1744; }
        .viewfinder-container { flex: 1; position: relative; overflow: hidden; background: #000; }
        #overlayVideo { width: 100%; height: 100%; object-fit: cover; }
        #ghostImage { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.45; pointer-events: none; }
        .modal-footer { height: 75px; background: #1e1e1e; display: flex; justify-content: space-evenly; align-items: center; border-top: 1px solid #333; padding: 0 10px; gap: 10px; }
        .match-btn { flex: 1; background: #ff1744; color: #fff; border: none; padding: 14px 0; border-radius: 10px; font-weight: 900; font-size: 14px; cursor: pointer; text-transform: uppercase; }
        .skip-btn { flex: 1; background: #444; color: #fff; border: none; padding: 14px 0; border-radius: 10px; font-weight: 900; font-size: 14px; cursor: pointer; text-transform: uppercase; }

        .preview-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #121212; z-index: 10000; flex-direction: column; }
        .preview-modal.show { display: flex; }
        .preview-header { height: 60px; background: #1e1e1e; border-bottom: 1px solid #333; display: flex; align-items: center; padding: 0 14px; gap: 12px; flex-shrink: 0; }
        .preview-back-btn { background: #2a2a2a; border: 1px solid #555; color: #ffab00; font-size: 14px; font-weight: 900; padding: 8px 14px; border-radius: 8px; cursor: pointer; }
        .preview-body { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; padding: 10px; }
        #previewImg { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
    </style>
</head>
<body>

<div class="header-box">
    <h1>RUN</h1>
    <div class="icon-btn" id="refreshBtn">🔄</div>
</div>

<div class="nav-grid-3x2">
    <a href="mark.html" class="nav-tile t-mark">MARK</a>
    <a href="run.html" class="nav-tile t-run">RUN</a>
    <a href="tow.html" class="nav-tile t-tow">TOW</a>
    <a href="passes.html" class="nav-tile t-pass">PASS</a>
    <a href="yard.html" class="nav-tile t-yard">YARD</a>
    <a href="release.html" class="nav-tile t-rel">REL</a>
</div>

<!-- TOP DRIVE-BY CHECK BUTTON (ALWAYS AVAILABLE) -->
<button type="button" class="hud-check-btn" onclick="openDriveByCam()">
    <span>📷 CHECK VEHICLE</span>
</button>

<div class="container" id="runContainer">
    <div class="empty-msg">LOADING RUN...</div>
</div>

<!-- DRIVE-BY HUD CAMERA MODAL -->
<div id="hudCamModal">
    <div class="hud-cam-header">
        <span style="font-weight:900; color:#ffab00; font-size:14px;">⚡ DRIVE-BY PLATE CHECK</span>
        <button type="button" style="background:#333; color:#fff; border:none; padding:6px 14px; border-radius:6px; font-weight:900;" onclick="closeDriveByCam()">CLOSE</button>
    </div>
    <div class="hud-cam-view">
        <video id="hudVideo" autoplay playsinline muted></video>
        <div class="hud-target-reticle">
            <div class="hud-target-hint">ALIGN PLATE INSIDE BOX</div>
        </div>
        <div class="hud-snap-trigger" id="hudSnapBtn" onclick="triggerDriveByScan()">
            <div class="hud-snap-inner"></div>
        </div>
    </div>
</div>

<!-- INSTANT 2-SECOND HUD FULLSCREEN RESULT -->
<div id="hudFlashOverlay" onclick="dismissHudFlash()">
    <div class="hud-main-status" id="hudStatusText">TOW</div>
    <div class="hud-sub-plate" id="hudPlateText">790WSY</div>
    <div class="hud-detail-line" id="hudDetailText">EXPIRED - READY TO TOW</div>
</div>

<!-- Comparison & Preview Modals -->
<div id="overlayModal" class="overlay-modal">
    <div class="modal-header">
        <span class="modal-title" id="modalRegoTitle">ALIGN & VERIFY TOW</span>
        <span class="close-btn" onclick="closeOverlayModal()">✕</span>
    </div>
    <div class="opacity-bar">
        <span>GHOST OPACITY:</span>
        <input type="range" id="opacitySlider" min="0" max="100" value="45">
    </div>
    <div class="viewfinder-container">
        <video id="overlayVideo" autoplay playsinline muted></video>
        <img id="ghostImage" alt="Ghost Overlay">
    </div>
    <div class="modal-footer">
        <button id="matchBtn" class="match-btn">MATCH & TOW</button>
        <button id="skipBtn" class="skip-btn">SKIP & TOW</button>
    </div>
</div>

<div id="previewModal" class="preview-modal">
    <div class="preview-header">
        <button class="preview-back-btn" onclick="closePhotoPreview()">← BACK</button>
        <div style="display:flex; flex-direction:column;">
            <span style="font-size:18px; font-weight:900; color:#fff;" id="previewTitle"></span>
            <span style="font-size:11px; color:#aaa;" id="previewMeta"></span>
        </div>
    </div>
    <div class="preview-body">
        <img id="previewImg" alt="Mark Photo">
    </div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";
    const ANPR_API_KEY = "74a8bb83a49461eef0266274ce63e1e198b4c888";

    let rawData = [];
    let propertyGroups = {};
    let hudStream = null;
    let hudTimer = null;
    let isProcessingScan = false;

    window.addEventListener('load', () => {
        loadTowRun();
    });

    document.getElementById('refreshBtn').addEventListener('click', () => {
        document.getElementById('runContainer').innerHTML = "<div class='empty-msg'>REFRESHING...</div>";
        loadTowRun();
    });

    async function loadTowRun() {
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL + "?action=get_run");
            rawData = await res.json();
            localStorage.setItem('cached_run_data', JSON.stringify(rawData));
            parseAndRenderRun(rawData);
        } catch(e) {
            const cached = localStorage.getItem('cached_run_data');
            if (cached) {
                rawData = JSON.parse(cached);
                parseAndRenderRun(rawData);
            }
        }
    }

    function parseAndRenderRun(data) {
        if (!data || !Array.isArray(data) || data.length === 0) {
            document.getElementById('runContainer').innerHTML = "<div class='empty-msg'>NO CARS ON RUN</div>";
            return;
        }

        const blacklisted = JSON.parse(localStorage.getItem('towed_blacklist') || "{}");
        const nowMs = Date.now();

        data = data.filter(item => {
            const r = String(item.rego || '').trim().toUpperCase();
            if (!r || (blacklisted[r] && (nowMs - blacklisted[r] < 4 * 60 * 60 * 1000))) return false;
            return true;
        });

        propertyGroups = {};
        data.forEach(item => {
            const prop = item.property || "GENERAL";
            if (!propertyGroups[prop]) propertyGroups[prop] = [];

            let status = "WAIT";
            if (item.pass === "YES") {
                status = "PASS";
            } else if (item.rawExpiryMs > 0 && nowMs >= item.rawExpiryMs) {
                status = "READY";
            } else {
                let expMs = item.rawExpiryMs || 0;
                if (!expMs && item.expiryTime) {
                    const cleanExp = item.expiryTime.replace(/^[A-Za-z]+\s+/, "");
                    const parts = cleanExp.split(/[\s-:]+/);
                    if (parts.length >= 4) {
                        expMs = new Date(new Date().getFullYear(), parseInt(parts[1], 10) - 1, parseInt(parts[0], 10), parseInt(parts[2], 10), parseInt(parts[3], 10)).getTime();
                    }
                }
                if (expMs > 0 && nowMs >= expMs) status = "READY";
            }

            propertyGroups[prop].push({
                rego: item.rego,
                markedTimeStr: formatCleanDisplayTime(item.markedTime),
                expiryTimeStr: formatCleanDisplayTime(item.expiryTime),
                status: status,
                property: prop,
                imageUrl: item.imageUrl || item.image || ""
            });
        });

        renderSummaryView();
    }

    function formatCleanDisplayTime(rawStr) {
        if (!rawStr) return "N/A";
        const parts = String(rawStr).trim().split(/\s+/);
        return parts.length >= 3 ? `${parts[0]} ${parts[2]}` : String(rawStr);
    }

    function renderSummaryView() {
        const sortedProps = Object.keys(propertyGroups).sort();
        const container = document.getElementById('runContainer');
        container.innerHTML = "";

        sortedProps.forEach(prop => {
            const redCount = propertyGroups[prop].filter(c => c.status === "READY").length;
            const orangeCount = propertyGroups[prop].filter(c => c.status === "WAIT").length;
            const blueCount = propertyGroups[prop].filter(c => c.status === "PASS").length;

            const card = document.createElement('div');
            card.className = 'prop-summary-card';
            card.innerHTML = `
                <div class="prop-name" onclick="renderDetailView('${prop}', 'ALL')">${prop}</div>
                <div class="count-btns">
                    <button class="cnt-btn btn-red" onclick="renderDetailView('${prop}', 'READY')">
                        <span class="cnt-num">${redCount}</span>
                        <span class="cnt-lbl">TOW</span>
                    </button>
                    <button class="cnt-btn btn-orange" onclick="renderDetailView('${prop}', 'WAIT')">
                        <span class="cnt-num">${orangeCount}</span>
                        <span class="cnt-lbl">WAIT</span>
                    </button>
                    <button class="cnt-btn btn-blue" onclick="renderDetailView('${prop}', 'PASS')">
                        <span class="cnt-num">${blueCount}</span>
                        <span class="cnt-lbl">PASS</span>
                    </button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function renderDetailView(prop, filterStatus) {
        const container = document.getElementById('runContainer');
        container.innerHTML = "";

        const backBtn = document.createElement('div');
        backBtn.className = 'back-btn';
        backBtn.innerText = "← BACK TO ALL PROPERTIES";
        backBtn.onclick = renderSummaryView;
        container.appendChild(backBtn);

        const title = document.createElement('div');
        title.className = 'detail-title';
        title.innerText = `${prop} ${filterStatus !== 'ALL' ? '(' + filterStatus + ')' : ''}`;
        container.appendChild(title);

        let cars = propertyGroups[prop] || [];
        if (filterStatus !== 'ALL') cars = cars.filter(c => c.status === filterStatus);

        cars.forEach(car => {
            const tile = document.createElement('div');
            tile.className = `car-tile tile-${car.status.toLowerCase()}`;
            tile.innerHTML = `
                <div>
                    <div class="rego-header-line">
                        <span class="car-rego">${car.rego}</span>
                        <span class="car-time-mkd">MKD: ${car.markedTimeStr}</span>
                    </div>
                    <div class="car-time-exp">EXP: ${car.expiryTimeStr}</div>
                </div>
                <div class="tile-right-box">
                    <button class="pic-preview-btn" onclick="event.stopPropagation(); openPhotoPreview('${car.rego}', '${car.property}', '${car.imageUrl}')">📷</button>
                    <div class="badge badge-${car.status.toLowerCase()}">${car.status === "READY" ? "TOW" : car.status}</div>
                </div>
            `;
            tile.addEventListener('click', () => {
                if (car.status === "READY") openOverlayModal(car);
                else if (car.status === "WAIT") window.location.href = `tow.html?rego=${encodeURIComponent(car.rego)}&prop=${encodeURIComponent(car.property)}`;
                else window.location.href = `passes.html`;
            });
            container.appendChild(tile);
        });
    }

    // ==========================================
    // ⚡ DRIVE-BY HUD SCANNER ENGINE
    // ==========================================
    async function openDriveByCam() {
        const modal = document.getElementById('hudCamModal');
        const video = document.getElementById('hudVideo');
        modal.style.display = 'flex';

        try {
            hudStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: false
            });
            video.srcObject = hudStream;
            await video.play().catch(() => {});
        } catch(err) {
            alert("Camera permission required: " + err.message);
            closeDriveByCam();
        }
    }

    function closeDriveByCam() {
        if (hudStream) {
            hudStream.getTracks().forEach(t => t.stop());
            hudStream = null;
        }
        document.getElementById('hudCamModal').style.display = 'none';
        dismissHudFlash();
    }

    async function triggerDriveByScan() {
        if (isProcessingScan) return;
        isProcessingScan = true;

        const video = document.getElementById('hudVideo');
        const snapBtn = document.getElementById('hudSnapBtn');
        snapBtn.style.opacity = "0.4";

        // 1. Capture snapshot scaled to 600px width for fast network transfer
        const vW = video.videoWidth || 1280;
        const vH = video.videoHeight || 720;
        const aspect = vH / vW;

        const canvas = document.createElement('canvas');
        canvas.width = 600;
        canvas.height = Math.round(600 * aspect);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        // 2. Direct browser call to Plate Recognizer API (~450ms turnaround)
        canvas.toBlob(async (blob) => {
            try {
                const formData = new FormData();
                formData.append('upload', blob, 'plate.jpg');
                formData.append('regions', 'au');

                const resp = await fetch('https://api.platerecognizer.com/v1/plate-reader/', {
                    method: 'POST',
                    headers: { 'Authorization': 'Token ' + ANPR_API_KEY },
                    body: formData
                });
                const json = await resp.json();

                if (json && json.results && json.results.length > 0) {
                    const plate = String(json.results[0].plate || "").toUpperCase();
                    evaluatePlateAndFlashHUD(plate);
                } else {
                    flashResultOverlay("nomark", "NO PLATE", "NO VEHICLE PLATE DETECTED");
                }
            } catch(e) {
                flashResultOverlay("nomark", "OFFLINE", "CHECK NETWORK CONNECTION");
            } finally {
                isProcessingScan = false;
                snapBtn.style.opacity = "1";
            }
        }, 'image/jpeg', 0.55);
    }

    // 0ms IN-MEMORY DECISION MATRIX
    function evaluatePlateAndFlashHUD(plate) {
        const cleanRego = plate.replace(/[^A-Z0-9]/g, '');
        let matchedItem = null;

        for (const prop in propertyGroups) {
            const found = propertyGroups[prop].find(c => c.rego.replace(/[^A-Z0-9]/g, '') === cleanRego);
            if (found) { matchedItem = found; break; }
        }

        // Case 1: Active Pass
        if (matchedItem && matchedItem.status === "PASS") {
            flashResultOverlay("pass", cleanRego, `PASS ON FILE (${matchedItem.property})`);
            if (navigator.vibrate) navigator.vibrate(80);
        }
        // Case 2: Expired / Ready for Tow
        else if (matchedItem && matchedItem.status === "READY") {
            flashResultOverlay("tow", cleanRego, `TOW READY (${matchedItem.property})`);
            if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
        }
        // Case 3: Marked but Still within parking limit
        else if (matchedItem && matchedItem.status === "WAIT") {
            flashResultOverlay("wait", cleanRego, `MARKED: EXP ${matchedItem.expiryTimeStr}`);
            if (navigator.vibrate) navigator.vibrate(60);
        }
        // Case 4: No record found
        else {
            flashResultOverlay("nomark", cleanRego, "NO ACTIVE MARK - UNMARKED");
            if (navigator.vibrate) navigator.vibrate(40);
        }
    }

    function flashResultOverlay(type, plate, detail) {
        const overlay = document.getElementById('hudFlashOverlay');
        const statusEl = document.getElementById('hudStatusText');
        const plateEl = document.getElementById('hudPlateText');
        const detailEl = document.getElementById('hudDetailText');

        overlay.className = `hud-flash-${type}`;
        overlay.style.display = 'flex';

        if (type === 'tow') statusEl.innerText = "🚨 TOW";
        else if (type === 'pass') statusEl.innerText = "🎫 PASS";
        else if (type === 'wait') statusEl.innerText = "⏳ WAIT";
        else statusEl.innerText = "🟢 NO MARK";

        plateEl.innerText = plate;
        detailEl.innerText = detail;

        if (hudTimer) clearTimeout(hudTimer);
        // Automatically dismisses after 2 seconds so the camera is instantly ready for the next vehicle
        hudTimer = setTimeout(dismissHudFlash, 2000);
    }

    function dismissHudFlash() {
        if (hudTimer) clearTimeout(hudTimer);
        document.getElementById('hudFlashOverlay').style.display = 'none';
    }

    // Photo Preview & Comparison
    function openPhotoPreview(rego, prop, url) {
        document.getElementById('previewTitle').innerText = `${rego} (${prop})`;
        document.getElementById('previewImg').src = url ? (url.match(/[-\w]{25,}/) ? "https://lh3.googleusercontent.com/d/" + url.match(/[-\w]{25,}/)[0] : url) : "";
        document.getElementById('previewModal').classList.add('show');
    }
    function closePhotoPreview() { document.getElementById('previewModal').classList.remove('show'); }
    function closeOverlayModal() { document.getElementById('overlayModal').classList.remove('show'); }
</script>
</body>
