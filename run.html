<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>RUN</title>
    <link rel="apple-touch-icon" href="icon-manager.png?v=2">
    <link rel="icon" type="image/png" href="icon-manager.png?v=2">
    <link rel="manifest" href="manifest-run.json?v=2">
    <style>
        :root {
            --c-mark: #2979ff; --c-run: #ffab00; --c-tow: #ff1744;
            --c-pass: #ab47bc; --c-yard: #00b0ff; --c-rel: #00e676;
        }
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            margin: 0; padding: 12px; background: #121212; color: #fff; 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
            padding-top: max(14px, env(safe-area-inset-top));
            padding-bottom: max(30px, env(safe-area-inset-bottom));
        }
        .header-box { display: flex; align-items: center; justify-content: center; position: relative; width: 100%; max-width: 440px; margin-bottom: 10px; }
        .header-box h1 { margin: 0; font-size: 38px; font-weight: 900; color: #ffab00; letter-spacing: 2px; }
        .icon-btn { position: absolute; right: 0; background: #2a2a2a; border: 1px solid #444; border-radius: 10px; font-size: 20px; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; }

        .nav-grid-3x2 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; max-width: 440px; margin-bottom: 10px; }
        .nav-tile { height: 38px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; text-decoration: none; color: #000; text-transform: uppercase; letter-spacing: 0.5px; }
        .t-mark { background: var(--c-mark); color: #fff; }
        .t-run  { background: var(--c-run); color: #000; box-shadow: 0 0 0 2px #fff; }
        .t-tow  { background: var(--c-tow); color: #fff; }
        .t-pass { background: var(--c-pass); color: #fff; }
        .t-yard { background: var(--c-yard); color: #000; }
        .t-rel  { background: var(--c-rel); color: #000; }

        .hud-check-btn {
            width: 100%; max-width: 440px; height: 56px; border-radius: 12px; border: none;
            background: linear-gradient(135deg, #ff1744 0%, #ffab00 100%); color: #000;
            font-size: 20px; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase;
            display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 12px;
            cursor: pointer; box-shadow: 0 4px 15px rgba(255, 23, 68, 0.4);
        }

        .container { width: 100%; max-width: 440px; }
        .prop-summary-card {
            background: #1e1e1e; border-radius: 16px; padding: 12px 14px; margin-bottom: 10px;
            border: 1px solid #333; display: flex; align-items: center; justify-content: space-between;
        }
        .prop-name { font-size: 18px; font-weight: 900; color: #ffab00; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; flex: 1; padding-right: 8px; }
        .count-btns { display: flex; gap: 6px; }
        .cnt-btn { width: 54px; height: 54px; border-radius: 10px; border: none; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
        .cnt-num { font-size: 20px; font-weight: 900; line-height: 1; margin-bottom: 2px; }
        .cnt-lbl { font-size: 10px; font-weight: 900; text-transform: uppercase; }
        .btn-red { background: #ff1744; color: #fff; }
        .btn-orange { background: #ffab00; color: #000; }
        .btn-blue { background: #29b6f6; color: #000; }

        .back-btn { background: #2a2a2a; border: 1px solid #444; color: #ffab00; padding: 8px 16px; border-radius: 10px; font-weight: 900; margin-bottom: 10px; cursor: pointer; display: inline-block; }
        .detail-title { font-size: 22px; font-weight: 900; color: #ffab00; margin-bottom: 10px; text-transform: uppercase; }

        .car-tile {
            background: #1e1e1e; border-radius: 14px; padding: 14px 16px; margin-bottom: 10px;
            display: flex; align-items: center; justify-content: space-between; border: 2px solid #333; cursor: pointer;
        }
        .tile-ready { border-color: #ff1744; background: #2a1215; }
        .tile-wait { border-color: #ffab00; background: #2a2212; }
        .tile-pass { border-color: #29b6f6; background: #0d212d; }
        .rego-header-line { display: flex; align-items: baseline; gap: 10px; }
        .car-rego { font-size: 30px; font-weight: 900; letter-spacing: 1px; }
        .tile-ready .car-rego { color: #ff1744; }
        .tile-wait .car-rego { color: #ffab00; }
        .tile-pass .car-rego { color: #29b6f6; }
        .car-time-mkd { font-size: 13px; color: #aaa; font-weight: 700; }
        .car-time-exp { font-size: 20px; color: #fff; font-weight: 900; margin-top: 4px; }
        .badge { padding: 9px 16px; border-radius: 8px; font-size: 15px; font-weight: 900; text-transform: uppercase; border: none; cursor: pointer; }
        .badge-ready { background: #ff1744; color: #fff; }
        .badge-wait { background: #ffab00; color: #000; }
        .badge-pass { background: #29b6f6; color: #000; }

        /* HUD MODAL & ZOOM/TORCH */
        #hudCamModal { display: none; position: fixed; inset: 0; background: #000; z-index: 99999; flex-direction: column; }
        .hud-cam-header { height: 60px; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; position: absolute; top: 0; left: 0; width: 100%; z-index: 10; }
        .hud-top-btn { background: #2a2a2a; color: #ffab00; border: 1.5px solid #ffab00; padding: 8px 14px; border-radius: 8px; font-weight: 900; font-size: 14px; cursor: pointer; }
        .hud-cam-view { flex: 1; width: 100%; height: 100%; position: relative; overflow: hidden; }
        #hudVideo { width: 100%; height: 100%; object-fit: cover; }
        
        /* WIDER ANPR CHECK RETICLE */
        .hud-target-reticle {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            width: 92%; max-width: 440px; height: 190px; border: 3.5px dashed #00e676; border-radius: 16px;
            pointer-events: none; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
        }
        .hud-side-controls { position: absolute; top: 75px; right: 14px; display: flex; flex-direction: column; gap: 10px; z-index: 20; }
        .hud-snap-trigger {
            position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
            width: 86px; height: 86px; background: #fff; border: 5px solid #000; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 20;
        }
        .hud-snap-inner { width: 64px; height: 64px; background: #ff1744; border-radius: 50%; }

        #hudFlashOverlay { display: none; position: fixed; inset: 0; z-index: 100000; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; cursor: pointer; }
        .hud-flash-tow { background: rgba(255, 23, 68, 0.98); }
        .hud-flash-pass { background: rgba(41, 182, 246, 0.98); }
        .hud-flash-nomark { background: rgba(0, 230, 118, 0.98); }
        .hud-flash-wait { background: rgba(255, 171, 0, 0.98); }
        .hud-flash-noplate { background: rgba(20, 20, 20, 0.98); border: 4px solid #ff1744; }
        .hud-main-icon { font-size: 70px; line-height: 1; }
        .hud-main-status { font-size: 76px; font-weight: 950; color: #000; text-transform: uppercase; line-height: 0.95; }
        .hud-sub-plate { font-size: 46px; font-weight: 900; color: #fff; margin-top: 10px; text-transform: uppercase; }

        /* GHOST COMPARISON MODAL */
        .overlay-modal { display: none; position: fixed; inset: 0; background: #000; z-index: 100005; flex-direction: column; }
        .overlay-modal.show { display: flex; }
        .modal-header { height: 52px; background: #1e1e1e; display: flex; justify-content: space-between; align-items: center; padding: 0 16px; border-bottom: 1px solid #333; }
        .viewfinder-container { flex: 1; position: relative; overflow: hidden; background: #000; }
        #overlayVideo { width: 100%; height: 100%; object-fit: cover; }
        #ghostImage { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.45; pointer-events: none; }
        .modal-footer { height: 75px; background: #1e1e1e; display: flex; gap: 10px; padding: 0 10px; align-items: center; border-top: 1px solid #333; }
        .match-btn, .skip-btn { flex: 1; height: 50px; border: none; border-radius: 10px; font-weight: 900; font-size: 14px; cursor: pointer; text-transform: uppercase; }
        .match-btn { background: #ff1744; color: #fff; }
        .skip-btn { background: #444; color: #fff; }
    </style>
</head>
<body>

<div class="header-box">
    <h1>RUN</h1>
    <div class="icon-btn" id="refreshBtn">🔄</div>
</div>

<div class="nav-grid-3x2">
    <a href="mark.html" class="nav-tile t-mark">MARK</a>
    <a href="run.html" class="nav-tile t-run">RUN</a>
    <a href="tow.html" class="nav-tile t-tow">TOW</a>
    <a href="passes.html" class="nav-tile t-pass">PASS</a>
    <a href="yard.html" class="nav-tile t-yard">YARD</a>
    <a href="release.html" class="nav-tile t-rel">REL</a>
</div>

<button type="button" class="hud-check-btn" onclick="openDriveByCam()">
    <span>📷 CHECK VEHICLE</span>
</button>

<div class="container" id="runContainer">
    <div style="text-align:center; padding:30px; font-weight:800; color:#888;">LOADING RUN...</div>
</div>

<!-- DRIVE-BY HUD CAMERA MODAL -->
<div id="hudCamModal">
    <div class="hud-cam-header">
        <button type="button" class="hud-top-btn" onclick="showManualEntryOverlay()">⌨️ TYPE</button>
        <span style="font-weight:900; color:#ffab00; font-size:16px;">⚡ DRIVE-BY CHECK</span>
        <button type="button" class="hud-top-btn" style="background:#333; color:#fff;" onclick="closeDriveByCam()">CLOSE</button>
    </div>
    <div class="hud-cam-view">
        <video id="hudVideo" autoplay playsinline muted></video>
        <div class="hud-target-reticle"></div>
        <div class="hud-side-controls">
            <button class="hud-top-btn" id="hudTorchBtn" onclick="toggleHudTorch()">🔦 TORCH: OFF</button>
            <button class="hud-top-btn" id="hudZoomBtn" onclick="cycleHudZoom()">🔍 1.0x</button>
        </div>
        <div class="hud-snap-trigger" id="hudSnapBtn" onclick="triggerDriveByScan()"><div class="hud-snap-inner"></div></div>
    </div>
</div>

<div id="hudFlashOverlay" onclick="dismissHudFlash()">
    <div class="hud-main-icon" id="hudMainIcon">🚨</div>
    <div class="hud-main-status" id="hudStatusText">TOW</div>
    <div class="hud-sub-plate" id="hudPlateText">790WSY</div>
    <div style="font-size:19px; font-weight:800; color:#000; margin-top:8px;" id="hudDetailText">EXPIRED - READY TO TOW</div>
    <button type="button" id="hudTowActionBtn" style="display:none; margin-top:16px; background:#000; color:#ff1744; border:2px solid #fff; padding:14px 26px; border-radius:10px; font-size:20px; font-weight:900;" onclick="openTowFromHud(event)">🚨 LOAD TOW APP</button>
    <div id="hudManualWrap" style="display:none; margin-top:12px; width:80%; max-width:300px;" onclick="event.stopPropagation()">
        <input type="text" id="hudManualInput" placeholder="ENTER REGO" style="width:100%; height:48px; border-radius:8px; border:2px solid #ffab00; background:#111; color:#fff; font-size:22px; font-weight:900; text-align:center; text-transform:uppercase;">
        <button type="button" style="width:100%; height:44px; margin-top:6px; border-radius:8px; border:none; background:#ffab00; color:#000; font-weight:900; text-transform:uppercase;" onclick="submitManualHudCheck()">CHECK VEHICLE</button>
    </div>
</div>

<!-- GHOST VIEW FINDER -->
<div id="overlayModal" class="overlay-modal">
    <div class="modal-header">
        <span style="font-weight:900; color:#fff;" id="modalRegoTitle">ALIGN & VERIFY TOW</span>
        <span style="color:#ff1744; font-size:24px; cursor:pointer;" onclick="closeOverlayModal()">✕</span>
    </div>
    <div class="viewfinder-container">
        <video id="overlayVideo" autoplay playsinline muted></video>
        <img id="ghostImage" alt="Ghost Overlay">
    </div>
    <div class="modal-footer">
        <button id="matchBtn" class="match-btn">MATCH & TOW</button>
        <button id="skipBtn" class="skip-btn" onclick="skipAndTow()">SKIP & TOW</button>
    </div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";
    const ANPR_API_KEY = "74a8bb83a49461eef0266274ce63e1e198b4c888";

    let rawData = [];
    let propertyGroups = {};
    let hudStream = null;
    let hudTrack = null;
    let isHudTorchOn = false;
    let currentZoom = 1.0;
    let lastMatchedTowVehicle = null;
    let overlayStream = null;
    let currentGhostVehicle = null;

    window.addEventListener('load', loadTowRun);

    document.getElementById('refreshBtn').addEventListener('click', () => {
        localStorage.removeItem('towed_blacklist');
        localStorage.removeItem('cached_run_data');
        loadTowRun();
    });

    async function loadTowRun() {
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL + "?action=get_run");
            rawData = await res.json();
            localStorage.setItem('cached_run_data', JSON.stringify(rawData));
            parseAndRenderRun(rawData);
        } catch(e) {
            const cached = localStorage.getItem('cached_run_data');
            if (cached) parseAndRenderRun(JSON.parse(cached));
        }
    }

    function parseAndRenderRun(data) {
        if (!Array.isArray(data) || data.length === 0) {
            document.getElementById('runContainer').innerHTML = "<div style='text-align:center; padding:30px; font-weight:800; color:#888;'>NO CARS ON RUN</div>";
            return;
        }

        const nowMs = Date.now();
        propertyGroups = {};
        data.forEach(item => {
            const prop = item.property || "GENERAL";
            if (!propertyGroups[prop]) propertyGroups[prop] = [];

            let status = "WAIT";
            if (item.pass === "YES") {
                status = "PASS";
            } else if (item.rawExpiryMs > 0 && nowMs >= item.rawExpiryMs) {
                status = "READY";
            } else {
                let expMs = item.rawExpiryMs || 0;
                if (!expMs && item.expiryTime) {
                    const cleanExp = item.expiryTime.replace(/^[A-Za-z]+\s+/, "");
                    const parts = cleanExp.split(/[\s-:]+/);
                    if (parts.length >= 4) {
                        expMs = new Date(new Date().getFullYear(), parseInt(parts[1], 10) - 1, parseInt(parts[0], 10), parseInt(parts[2], 10), parseInt(parts[3], 10)).getTime();
                    }
                }
                if (expMs > 0 && nowMs >= expMs) status = "READY";
            }

            propertyGroups[prop].push({
                rego: item.rego,
                markedTimeStr: item.markedTime || "N/A",
                expiryTimeStr: item.expiryTime || "N/A",
                rawExpiryMs: item.rawExpiryMs || 0,
                status: status,
                property: prop,
                make: item.make || "",
                model: item.model || "",
                colour: item.colour || "",
                bodyType: item.bodyType || "",
                imageUrl: item.imageUrl || item.image || ""
            });
        });

        renderSummaryView();
    }

    function renderSummaryView() {
        const sortedProps = Object.keys(propertyGroups).sort((a, b) => {
            const redA = propertyGroups[a].filter(c => c.status === "READY").length;
            const redB = propertyGroups[b].filter(c => c.status === "READY").length;
            if (redB !== redA) return redB - redA;
            return a.localeCompare(b);
        });

        const container = document.getElementById('runContainer');
        container.innerHTML = "";
        sortedProps.forEach(prop => {
            const redCount = propertyGroups[prop].filter(c => c.status === "READY").length;
            const orangeCount = propertyGroups[prop].filter(c => c.status === "WAIT").length;
            const blueCount = propertyGroups[prop].filter(c => c.status === "PASS").length;

            const card = document.createElement('div');
            card.className = 'prop-summary-card';
            card.innerHTML = `
                <div class="prop-name" onclick="renderDetailView('${prop}', 'ALL')">${prop}</div>
                <div class="count-btns">
                    <button class="cnt-btn btn-red" onclick="renderDetailView('${prop}', 'READY')"><span class="cnt-num">${redCount}</span><span class="cnt-lbl">TOW</span></button>
                    <button class="cnt-btn btn-orange" onclick="renderDetailView('${prop}', 'WAIT')"><span class="cnt-num">${orangeCount}</span><span class="cnt-lbl">WAIT</span></button>
                    <button class="cnt-btn btn-blue" onclick="renderDetailView('${prop}', 'PASS')"><span class="cnt-num">${blueCount}</span><span class="cnt-lbl">PASS</span></button>
                </div>`;
            container.appendChild(card);
        });
    }

    // STRICT SORT: RED (TOW/READY) -> ORANGE (WAIT) -> BLUE (PASS)
    function renderDetailView(prop, filterStatus) {
        const container = document.getElementById('runContainer');
        container.innerHTML = `<div class="back-btn" onclick="renderSummaryView()">← BACK TO ALL PROPERTIES</div><div class="detail-title">${prop}</div>`;

        let cars = propertyGroups[prop] || [];
        if (filterStatus !== 'ALL') cars = cars.filter(c => c.status === filterStatus);

        const statusRank = { "READY": 1, "WAIT": 2, "PASS": 3 };
        cars.sort((a, b) => (statusRank[a.status] || 99) - (statusRank[b.status] || 99) || (a.rawExpiryMs - b.rawExpiryMs));

        cars.forEach(car => {
            const tile = document.createElement('div');
            tile.className = `car-tile tile-${car.status.toLowerCase()}`;
            tile.innerHTML = `
                <div>
                    <div class="rego-header-line">
                        <span class="car-rego">${car.rego}</span>
                        <span class="car-time-mkd">MKD: ${car.markedTimeStr}</span>
                    </div>
                    <div class="car-time-exp">EXP: ${car.expiryTimeStr}</div>
                </div>
                <button type="button" class="badge badge-${car.status.toLowerCase()}">${car.status === "READY" ? "TOW" : car.status}</button>`;
            tile.onclick = () => {
                if (car.status === "READY") openOverlayModal(car);
                else navigateToTow(car);
            };
            container.appendChild(tile);
        });
    }

    function navigateToTow(car) {
        closeOverlayModal();
        const q = new URLSearchParams({ rego: car.rego || "", prop: car.property || "", make: car.make || "", model: car.model || "", colour: car.colour || "", body: car.bodyType || "" });
        window.location.href = `tow.html?${q.toString()}`;
    }

    // --- HUD CAMERA & ZOOM/TORCH CONTROLS ---
    async function openDriveByCam() {
        document.getElementById('hudCamModal').style.display = 'flex';
        try {
            hudStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 } } });
            document.getElementById('hudVideo').srcObject = hudStream;
            hudTrack = hudStream.getVideoTracks()[0];
        } catch(e) { closeDriveByCam(); }
    }

    function closeDriveByCam() {
        if (hudStream) { hudStream.getTracks().forEach(t => t.stop()); hudStream = null; hudTrack = null; }
        document.getElementById('hudCamModal').style.display = 'none';
        dismissHudFlash();
    }

    async function toggleHudTorch() {
        if (!hudTrack) return;
        isHudTorchOn = !isHudTorchOn;
        try {
            await hudTrack.applyConstraints({ advanced: [{ torch: isHudTorchOn }] });
            document.getElementById('hudTorchBtn').innerText = isHudTorchOn ? "🔦 TORCH: ON" : "🔦 TORCH: OFF";
        } catch(e) {}
    }

    async function cycleHudZoom() {
        if (!hudTrack) return;
        currentZoom = currentZoom === 1.0 ? 2.0 : (currentZoom === 2.0 ? 3.0 : 1.0);
        document.getElementById('hudZoomBtn').innerText = `🔍 ${currentZoom.toFixed(1)}x`;
        try {
            await hudTrack.applyConstraints({ advanced: [{ zoom: currentZoom }] });
        } catch(e) {}
    }

    async function triggerDriveByScan() {
        const vid = document.getElementById('hudVideo');
        const canvas = document.createElement('canvas');
        canvas.width = 600; canvas.height = 450;
        canvas.getContext('2d').drawImage(vid, 0, 0, 600, 450);
        canvas.toBlob(async (blob) => {
            const fd = new FormData();
            fd.append('upload', blob, 'plate.jpg');
            fd.append('regions', 'au');
            try {
                const resp = await fetch('https://api.platerecognizer.com/v1/plate-reader/', { method: 'POST', headers: { 'Authorization': 'Token ' + ANPR_API_KEY }, body: fd });
                const json = await resp.json();
                if (json.results && json.results.length > 0) evaluatePlate(String(json.results[0].plate || "").toUpperCase());
                else flashOverlay("noplate", "NO PLATE", "NO VEHICLE DETECTED");
            } catch(e) { flashOverlay("noplate", "ERROR", "SCAN FAILED"); }
        }, 'image/jpeg', 0.55);
    }

    function evaluatePlate(plate) {
        const clean = plate.replace(/[^A-Z0-9]/g, '');
        let match = null;
        for (const p in propertyGroups) {
            const f = propertyGroups[p].find(c => c.rego.replace(/[^A-Z0-9]/g, '') === clean);
            if (f) { match = f; break; }
        }
        lastMatchedTowVehicle = match;
        if (match && match.status === "READY") flashOverlay("tow", clean, `TOW READY (${match.property})`, true);
        else if (match && match.status === "WAIT") flashOverlay("wait", clean, `MARKED - EXP ${match.expiryTimeStr}`);
        else if (match && match.status === "PASS") flashOverlay("pass", clean, `PASS ON FILE (${match.property})`);
        else flashOverlay("nomark", clean, "NO ACTIVE MARK");
    }

    function flashOverlay(type, plate, detail, showTowBtn = false) {
        const ov = document.getElementById('hudFlashOverlay');
        ov.className = `hud-flash-${type}`;
        ov.style.display = 'flex';
        document.getElementById('hudPlateText').innerText = plate;
        document.getElementById('hudDetailText').innerText = detail;
        document.getElementById('hudTowActionBtn').style.display = showTowBtn ? 'block' : 'none';
    }

    function dismissHudFlash() { document.getElementById('hudFlashOverlay').style.display = 'none'; }
    function openTowFromHud(e) { e.stopPropagation(); if (lastMatchedTowVehicle) { closeDriveByCam(); navigateToTow(lastMatchedTowVehicle); } }
    function showManualEntryOverlay() { flashOverlay("noplate", "MANUAL CHECK", "TYPE LICENCE PLATE TO CHECK", false); document.getElementById('hudManualWrap').style.display = 'block'; }
    function submitManualHudCheck() { const val = document.getElementById('hudManualInput').value.trim().toUpperCase(); if (val) evaluatePlate(val); }

    // --- GHOST COMPARISON MODAL ---
    async function openOverlayModal(car) {
        currentGhostVehicle = car;
        document.getElementById('modalRegoTitle').innerText = `${car.rego} - ALIGN & VERIFY TOW`;
        const ghost = document.getElementById('ghostImage');
        ghost.src = car.imageUrl || "";
        document.getElementById('overlayModal').classList.add('show');
        try {
            overlayStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 } } });
            document.getElementById('overlayVideo').srcObject = overlayStream;
        } catch(e) {}
    }

    function closeOverlayModal() {
        if (overlayStream) { overlayStream.getTracks().forEach(t => t.stop()); overlayStream = null; }
        document.getElementById('overlayModal').classList.remove('show');
    }

    function skipAndTow() { if (currentGhostVehicle) navigateToTow(currentGhostVehicle); }

    document.getElementById('matchBtn').addEventListener('click', () => {
        if (!currentGhostVehicle) return;
        const vid = document.getElementById('overlayVideo');
        const canvas = document.createElement('canvas');
        canvas.width = 800; canvas.height = 600;
        canvas.getContext('2d').drawImage(vid, 0, 0, 800, 600);
        localStorage.setItem('pending_comp_' + currentGhostVehicle.rego, canvas.toDataURL('image/jpeg', 0.6));
        navigateToTow(currentGhostVehicle);
    });
</script>
</body>
</html>
