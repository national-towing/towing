<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOW RUN</title>
    
    <link rel="apple-touch-icon" href="icon-run.png?v=17">
    <link rel="icon" type="image/png" href="icon-run.png?v=17">
    <link rel="manifest" href="manifest-run.json?v=17">

    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            margin: 0; padding: 14px; background: #121212; color: #fff; 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; 
        }
        
        .header-box { display: flex; align-items: center; justify-content: center; position: relative; width: 100%; max-width: 440px; margin-bottom: 10px; }
        .header-box h1 { margin: 0; font-size: 38px; font-weight: 900; color: #ffab00; letter-spacing: 2px; text-align: center; }
        .icon-btn { position: absolute; right: 0; background: #2a2a2a; border: 1px solid #444; border-radius: 10px; font-size: 20px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; }
        .icon-btn:active { transform: scale(0.9); }

        .nav-bar { display: flex; gap: 8px; width: 100%; max-width: 440px; margin-bottom: 16px; }
        .nav-tile { flex: 1; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 900; text-decoration: none; color: #000; }
        .nav-run { background: #ffab00; }
        .nav-tow { background: #ff1744; color: #fff; }
        .nav-rel { background: #00e676; }
        .nav-pass { background: #ab47bc; color: #fff; }

        .property-card { background: #1e1e1e; border-radius: 16px; padding: 16px; width: 100%; max-width: 440px; border: 1px solid #333; margin-bottom: 14px; }
        .property-title { font-size: 20px; font-weight: 900; color: #ffab00; margin-bottom: 10px; text-transform: uppercase; border-bottom: 1px solid #333; padding-bottom: 6px; }

        .vehicle-row { display: flex; justify-content: space-between; align-items: center; background: #2a2a2a; border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; border-left: 6px solid #444; }
        .vehicle-rego { font-size: 24px; font-weight: 900; color: #fff; }
        .vehicle-time { font-size: 13px; color: #aaa; margin-top: 2px; font-weight: 600; }
        
        .status-badge { font-size: 14px; font-weight: 900; border-radius: 8px; padding: 6px 10px; text-align: center; text-decoration: none; display: inline-block; }
        .badge-wait { background: #ffab00; color: #000; }
        .badge-tow { background: #ff1744; color: #fff; }
        .badge-pass { background: #ab47bc; color: #fff; }

        #loading { text-align: center; color: #aaa; font-weight: 900; margin-top: 20px; }
    </style>
</head>
<body>

<div class="header-box">
    <h1>TOW RUN</h1>
    <div class="icon-btn" id="refreshBtn">🔄</div>
</div>

<div class="nav-bar">
    <a href="run.html" class="nav-tile nav-run">RUN</a>
    <a href="tow.html" class="nav-tile nav-tow">TOW</a>
    <a href="release.html" class="nav-tile nav-rel">REL</a>
    <a href="passes.html" class="nav-tile nav-pass">PASS</a>
</div>

<div id="loading">LOADING TOW RUN...</div>
<div id="container" style="width:100%; max-width:440px;"></div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";

    const refreshBtn = document.getElementById('refreshBtn');
    const loadingDiv = document.getElementById('loading');
    const container = document.getElementById('container');

    window.addEventListener('load', loadRunData);
    refreshBtn.addEventListener('click', loadRunData);

    async function loadRunData() {
        loadingDiv.style.display = 'block';
        container.innerHTML = "";
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL + "?action=get_tow_run");
            const data = await res.json();
            loadingDiv.style.display = 'none';

            if (!data || data.length === 0) {
                container.innerHTML = "<div style='text-align:center; color:#666; font-weight:900;'>NO VEHICLES ON TOW RUN</div>";
                return;
            }

            const grouped = {};
            data.forEach(item => {
                const prop = item.property || "GENERAL";
                if (!grouped[prop]) grouped[prop] = [];
                grouped[prop].push(item);
            });

            const nowMs = Date.now();

            for (let prop in grouped) {
                const card = document.createElement('div');
                card.className = 'property-card';
                card.innerHTML = `<div class="property-title">${prop}</div>`;

                grouped[prop].forEach(v => {
                    const row = document.createElement('div');
                    row.className = 'vehicle-row';

                    let badgeHtml = "";
                    if (v.pass && v.pass.toUpperCase() === "YES") {
                        badgeHtml = `<span class="status-badge badge-pass">PASS</span>`;
                    } else if (v.rawExpiryMs && nowMs >= v.rawExpiryMs) {
                        badgeHtml = `<a href="tow.html?rego=${encodeURIComponent(v.rego)}&prop=${encodeURIComponent(v.property)}" class="status-badge badge-tow">TOW READY</a>`;
                        row.style.borderLeftColor = "#ff1744";
                    } else {
                        badgeHtml = `<span class="status-badge badge-wait">WAIT</span>`;
                        row.style.borderLeftColor = "#ffab00";
                    }

                    row.innerHTML = `
                        <div>
                            <div class="vehicle-rego">${v.rego}</div>
                            <div class="vehicle-time">Marked: ${v.markedTime} | Exp: ${v.expiryTime}</div>
                        </div>
                        <div>${badgeHtml}</div>
                    `;
                    card.appendChild(row);
                });

                container.appendChild(card);
            }
        } catch(e) {
            loadingDiv.innerText = "ERROR LOADING TOW RUN";
        }
    }
</script>
</body>
</html>
