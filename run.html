<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

    <title>RUN</title>
    
    <link rel="apple-touch-icon" href="icon-run.png?v=700">
    <link rel="icon" type="image/png" href="icon-run.png?v=700">
    <link rel="manifest" href="manifest-run.json?v=700">

    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            margin: 0; padding: 14px; background: #121212; color: #fff; 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; 
        }
        
        .header-box { display: flex; align-items: center; justify-content: center; position: relative; width: 100%; max-width: 440px; margin-bottom: 10px; }
        .header-box h1 { margin: 0; font-size: 38px; font-weight: 900; color: #ffab00; letter-spacing: 2px; text-align: center; }
        .icon-btn { position: absolute; right: 0; background: #2a2a2a; border: 1px solid #444; border-radius: 10px; font-size: 20px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; }
        .icon-btn:active { transform: scale(0.9); }

        .nav-bar { display: flex; gap: 8px; width: 100%; max-width: 440px; margin-bottom: 16px; }
        .nav-tile { flex: 1; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 900; text-decoration: none; color: #000; }
        .nav-run { background: #ffab00; }
        .nav-tow { background: #ff1744; color: #fff; }
        .nav-rel { background: #00e676; }
        .nav-pass { background: #ab47bc; color: #fff; }

        .container { width: 100%; max-width: 440px; }

        .prop-summary-card {
            background: #1e1e1e; border-radius: 16px; padding: 14px; margin-bottom: 12px;
            border: 1px solid #333; display: flex; align-items: center; justify-content: space-between;
        }
        .prop-name {
            font-size: 19px; font-weight: 900; color: #ffab00; text-transform: uppercase;
            letter-spacing: 1px; cursor: pointer; flex: 1; padding-right: 8px;
        }

        .count-btns { display: flex; gap: 8px; }
        
        .cnt-btn {
            width: 58px; height: 58px; border-radius: 10px; border: none;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; text-decoration: none; padding: 0;
        }
        .cnt-btn:active { transform: scale(0.92); }

        .cnt-num { font-size: 22px; font-weight: 900; line-height: 1; margin-bottom: 2px; }
        .cnt-lbl { font-size: 10px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; line-height: 1; }

        .btn-red { background: #ff1744; color: #fff; }
        .btn-orange { background: #ffab00; color: #000; }
        .btn-blue { background: #29b6f6; color: #000; }

        .back-btn {
            background: #2a2a2a; border: 1px solid #444; color: #ffab00; padding: 8px 16px;
            border-radius: 10px; font-weight: 900; margin-bottom: 14px; cursor: pointer; display: inline-block;
        }
        .detail-title { font-size: 24px; font-weight: 900; color: #ffab00; margin-bottom: 12px; text-transform: uppercase; }

        .car-tile {
            background: #1e1e1e; border-radius: 14px; padding: 16px; margin-bottom: 12px;
            display: flex; align-items: center; justify-content: space-between; border: 2px solid #333;
            text-decoration: none; color: #fff; transition: transform 0.1s ease; cursor: pointer;
        }
        .car-tile:active { transform: scale(0.98); }

        .tile-ready { border-color: #ff1744; background: #2a1215; }
        .tile-wait { border-color: #ffab00; background: #2a2212; }
        .tile-pass { border-color: #29b6f6; background: #0d212d; }

        .rego-header-line {
            display: flex; align-items: baseline; gap: 12px;
        }
        .car-rego { font-size: 32px; font-weight: 900; letter-spacing: 1px; line-height: 1; }
        .tile-ready .car-rego { color: #ff1744; }
        .tile-wait .car-rego { color: #ffab00; }
        .tile-pass .car-rego { color: #29b6f6; }

        .car-time-mkd { font-size: 13px; color: #aaa; font-weight: 700; line-height: 1; }
        .car-time-exp { font-size: 22px; color: #fff; font-weight: 900; margin-top: 6px; letter-spacing: 0.5px; }

        .badge {
            padding: 10px 14px; border-radius: 8px; font-size: 15px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px;
        }
        .badge-ready { background: #ff1744; color: #fff; }
        .badge-wait { background: #ffab00; color: #000; }
        .badge-pass { background: #29b6f6; color: #000; }

        .empty-msg { text-align: center; color: #666; font-weight: 800; font-size: 16px; margin-top: 40px; }

        /* GHOST OVERLAY VERIFICATION MODAL */
        .overlay-modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; display: none; flex-direction: column;
            align-items: center; justify-content: space-between; padding: 12px; z-index: 9999;
        }
        .overlay-modal.show { display: flex; }

        .overlay-header {
            width: 100%; max-width: 440px; display: flex; justify-content: space-between;
            align-items: center; background: #1e1e1e; padding: 8px 12px; border-radius: 12px; border: 1px solid #333;
        }
        .overlay-title { font-size: 18px; font-weight: 900; color: #ff1744; letter-spacing: 1px; }
        .close-modal-btn { background: #333; color: #fff; border: 1px solid #555; padding: 6px 12px; border-radius: 8px; font-weight: 900; cursor: pointer; }

        .camera-overlay-box {
            position: relative; width: 100%; max-width: 440px; flex: 1; margin: 8px 0;
            border-radius: 14px; overflow: hidden; background: #000; display: flex;
            align-items: center; justify-content: center; border: 2px solid #ff1744;
        }

        #overlayVideo { width: 100%; height: 100%; object-fit: cover; }

        #ghostImage {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; opacity: 0.5; pointer-events: none; transition: opacity 0.1s ease;
        }

        .torch-overlay-btn {
            position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.65);
            border: 1px solid #ff1744; color: #ff1744; padding: 6px 12px; border-radius: 20px;
            font-size: 11px; font-weight: 900; cursor: pointer; z-index: 10;
        }

        .controls-card {
            width: 100%; max-width: 440px; background: #1e1e1e; border-radius: 14px;
            padding: 12px; border: 1px solid #333; display: flex; flex-direction: column; gap: 10px;
        }

        .slider-row { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 900; color: #aaa; }
        .slider-row input[type="range"] { flex: 1; height: 6px; border-radius: 3px; background: #444; outline: none; }

        .match-btn {
            width: 100%; height: 52px; background: #ff1744; color: #fff; border: none;
            border-radius: 12px; font-size: 20px; font-weight: 900; letter-spacing: 1px;
            cursor: pointer; box-shadow: 0 4px 15px rgba(255, 23, 68, 0.4);
        }
        .match-btn:active { transform: scale(0.96); }
    </style>
</head>
<body>

<div class="header-box">
    <h1>RUN</h1>
    <div class="icon-btn" id="refreshBtn">🔄</div>
</div>

<div class="nav-bar">
    <a href="run.html" class="nav-tile nav-run">RUN</a>
    <a href="tow.html" class="nav-tile nav-tow">TOW</a>
    <a href="release.html" class="nav-tile nav-rel">REL</a>
    <a href="passes.html" class="nav-tile nav-pass">PASS</a>
</div>

<div class="container" id="runContainer">
    <div class="empty-msg">LOADING RUN...</div>
</div>

<!-- GHOST OVERLAY VERIFICATION MODAL -->
<div class="overlay-modal" id="overlayModal">
    <div class="overlay-header">
        <span class="overlay-title" id="modalRegoTitle">VERIFY REGO</span>
        <button class="close-modal-btn" id="closeModalBtn">CANCEL</button>
    </div>

    <div class="camera-overlay-box">
        <video id="overlayVideo" autoplay playsinline></video>
        <img id="ghostImage" src="" alt="Mark Photo Overlay">
        <button class="torch-overlay-btn" id="torchOverlayBtn">⚡ FLASH: OFF</button>
    </div>

    <div class="controls-card">
        <div class="slider-row">
            <span>LIVE</span>
            <input type="range" id="opacitySlider" min="0.1" max="0.9" step="0.05" value="0.5">
            <span>MARK</span>
        </div>
        <button class="match-btn" id="matchBtn">MATCH & TOW</button>
    </div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(()=>{});
    }

    const runContainer = document.getElementById('runContainer');
    const refreshBtn = document.getElementById('refreshBtn');

    // Modal elements
    const overlayModal = document.getElementById('overlayModal');
    const modalRegoTitle = document.getElementById('modalRegoTitle');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const overlayVideo = document.getElementById('overlayVideo');
    const ghostImage = document.getElementById('ghostImage');
    const opacitySlider = document.getElementById('opacitySlider');
    const torchOverlayBtn = document.getElementById('torchOverlayBtn');
    const matchBtn = document.getElementById('matchBtn');

    let rawData = [];
    let propertyGroups = {};
    let activeCar = null;

    let videoStream = null;
