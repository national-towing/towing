<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="National Towing">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>RUN</title>
    
    <link rel="apple-touch-icon" href="icon-manager.png?v=2">
    <link rel="icon" type="image/png" href="icon-manager.png?v=2">
    <link rel="manifest" href="manifest-run.json?v=2">

    <style>
        :root {
            --c-mark: #2979ff;
            --c-run: #ffab00;
            --c-tow: #ff1744;
            --c-pass: #ab47bc;
            --c-yard: #00b0ff;
            --c-rel: #00e676;
        }
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            margin: 0; padding: 12px; background: #121212; color: #fff; 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
            padding-top: max(16px, env(safe-area-inset-top));
            padding-bottom: max(30px, env(safe-area-inset-bottom));
        }
        
        .header-box { display: flex; align-items: center; justify-content: center; position: relative; width: 100%; max-width: 440px; margin: 0 auto 12px auto; flex-shrink: 0; }
        .header-box h1 { margin: 0; font-size: 38px; font-weight: 900; color: var(--c-run); letter-spacing: 2px; text-align: center; line-height: 1.2; padding-top: 4px; }
        .icon-btn { position: absolute; right: 0; background: #2a2a2a; border: 1px solid #444; border-radius: 10px; font-size: 18px; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; }
        .icon-btn:active { transform: scale(0.9); }

        .nav-grid-3x2 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; max-width: 440px; margin: 0 auto 12px auto; flex-shrink: 0; }
        .nav-tile { height: 38px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; text-decoration: none; color: #000; text-transform: uppercase; letter-spacing: 0.5px; }
        .nav-tile:active { transform: scale(0.96); }
        .t-mark { background: var(--c-mark); color: #fff; }
        .t-run  { background: var(--c-run); color: #000; box-shadow: 0 0 0 2px #fff; }
        .t-tow  { background: var(--c-tow); color: #fff; }
        .t-admin { background: var(--c-pass); color: #fff; }
        .t-yard { background: var(--c-yard); color: #000; }
        .t-rel  { background: var(--c-rel); color: #000; }

        .hud-check-btn {
            width: 100%; max-width: 440px; height: 56px; border-radius: 12px; border: none;
            background: linear-gradient(135deg, #ff1744 0%, #ffab00 100%); color: #000;
            font-size: 20px; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase;
            display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 12px;
            cursor: pointer; box-shadow: 0 4px 15px rgba(255, 23, 68, 0.4);
        }
        .hud-check-btn:active { transform: scale(0.97); }

        .container { width: 100%; max-width: 440px; }

        .prop-summary-card {
            background: #1e1e1e; border-radius: 16px; padding: 14px; margin-bottom: 12px;
            border: 1px solid #333; display: flex; align-items: center; justify-content: space-between;
        }
        .prop-name {
            font-size: 19px; font-weight: 900; color: #ffab00; text-transform: uppercase;
            letter-spacing: 1px; cursor: pointer; flex: 1; padding-right: 8px;
        }

        .count-btns { display: flex; gap: 8px; }
        .cnt-btn {
            width: 58px; height: 58px; border-radius: 10px; border: none;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; text-decoration: none; padding: 0;
        }
        .cnt-btn:active { transform: scale(0.92); }
        .cnt-num { font-size: 22px; font-weight: 900; line-height: 1; margin-bottom: 2px; }
        .cnt-lbl { font-size: 10px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; line-height: 1; }

        .btn-red { background: #ff1744; color: #fff; }
        .btn-orange { background: #ffab00; color: #000; }
        .btn-blue { background: #29b6f6; color: #000; }

        .back-btn {
            background: #2a2a2a; border: 1px solid #444; color: #ffab00; padding: 8px 16px;
            border-radius: 10px; font-weight: 900; margin-bottom: 10px; cursor: pointer; display: inline-block;
        }
        .detail-title { font-size: 22px; font-weight: 900; color: #ffab00; margin-bottom: 10px; text-transform: uppercase; }

        .car-tile { background: #1e1e1e; border-radius: 14px; padding: 12px; margin-bottom: 12px; display: flex; align-items: center; gap: 12px; border: 2px solid #333; color: #fff; transition: transform 0.1s ease; cursor: pointer; }
        .run-tile-thumb { width: 70px; height: 70px; border-radius: 8px; object-fit: cover; border: 1.5px solid #444; background: #000; flex-shrink: 0; cursor: pointer; }
        .run-tile-thumb:active { transform: scale(0.96); }
        .run-tile-thumb.no-thumb { display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; color: #555; }
        .tile-mid-content { flex: 1; min-width: 0; }
        .car-tile:active { transform: scale(0.98); }
        .tile-ready { border-color: #ff1744; background: #2a1215; }
        .tile-wait { border-color: #ffab00; background: #2a2212; }
        .tile-pass { border-color: #29b6f6; background: #0d212d; }

        .rego-header-line { display: flex; align-items: baseline; gap: 12px; }
        .car-rego { font-size: 32px; font-weight: 900; letter-spacing: 1px; line-height: 1; }
        .tile-ready .car-rego { color: #ff1744; }
        .tile-wait .car-rego { color: #ffab00; }
        .tile-pass .car-rego { color: #29b6f6; }

        .car-time-mkd { font-size: 13px; color: #aaa; font-weight: 700; line-height: 1; }
        .car-time-exp { font-size: 22px; color: #fff; font-weight: 900; margin-top: 6px; letter-spacing: 0.5px; }

        .tile-right-box { display: flex; align-items: center; gap: 8px; }

        .badge {
            padding: 10px 16px; border-radius: 8px; font-size: 15px; font-weight: 900;
            text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center;
            justify-content: center; border: none; cursor: pointer; line-height: 1;
        }
        .badge:active { transform: scale(0.94); }
        .badge-ready { background: #ff1744; color: #fff; }
        .badge-wait { background: #ffab00; color: #000; }
        .badge-pass { background: #29b6f6; color: #000; }

        .empty-msg { text-align: center; color: #666; font-weight: 800; font-size: 16px; margin-top: 40px; }

        /* HUD FLASH OVERLAY */
        #hudFlashOverlay { display: none; position: fixed; inset: 0; z-index: 100000; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; cursor: pointer; }
        .hud-flash-tow { background: rgba(255, 23, 68, 0.98); }
        .hud-flash-pass { background: rgba(41, 182, 246, 0.98); }
        .hud-flash-nomark { background: rgba(0, 230, 118, 0.98); }
        .hud-flash-wait { background: rgba(255, 171, 0, 0.98); }
        .hud-flash-fuzzy { background: rgba(255, 150, 0, 0.98); border: 4px solid #fff; }
        .hud-flash-noplate { background: rgba(20, 20, 20, 0.98); border: 4px solid #ff1744; }

        .hud-main-icon { font-size: 70px; margin-bottom: 4px; line-height: 1; }
        .hud-main-status { font-size: 76px; font-weight: 950; color: #000; text-transform: uppercase; line-height: 0.95; }
        .hud-sub-plate { font-size: 46px; font-weight: 900; color: #fff; margin-top: 10px; text-transform: uppercase; }
        .hud-detail-line { font-size: 20px; font-weight: 800; color: #000; margin-top: 10px; text-transform: uppercase; white-space: pre-line; }

        .hud-action-tow-btn {
            display: none; margin-top: 20px; background: #000; color: #ff1744; border: 3px solid #fff;
            padding: 16px 30px; border-radius: 14px; font-size: 22px; font-weight: 950; cursor: pointer;
        }
        .hud-rescan-btn {
            margin-top: 16px; background: #ffffff; color: #000000; border: none;
            padding: 14px 28px; border-radius: 12px; font-size: 18px; font-weight: 900; cursor: pointer;
            box-shadow: 0 4px 14px rgba(0,0,0,0.4); text-transform: uppercase;
        }
        .hud-reset-hint { margin-top: 20px; background: rgba(0,0,0,0.6); color: #fff; padding: 10px 20px; border-radius: 30px; font-size: 13px; font-weight: 900; text-transform: uppercase; }

        #hudManualWrap { display: none; margin-top: 18px; width: 88%; max-width: 320px; }
        .hud-manual-box { display: flex; flex-direction: column; gap: 10px; width: 100%; }
        #hudManualInput { width: 100%; height: 56px; border-radius: 12px; border: 2.5px solid #ffab00; background: #111; color: #fff; font-size: 26px; font-weight: 900; text-align: center; text-transform: uppercase; outline: none; }
        .hud-manual-btn { width: 100%; height: 52px; border-radius: 12px; border: none; background: #ffab00; color: #000; font-weight: 900; font-size: 20px; cursor: pointer; text-transform: uppercase; }

        /* Zoom Modal Styles */
        .preview-modal { display: none; position: fixed; inset: 0; background: #121212; z-index: 100006; flex-direction: column; }
        .preview-modal.show { display: flex; }
        .preview-header { height: 60px; background: #1e1e1e; border-bottom: 1px solid #333; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; }
        .preview-back-btn { background: #2a2a2a; border: 1px solid #555; color: #ffab00; font-size: 14px; font-weight: 900; padding: 8px 14px; border-radius: 8px; cursor: pointer; }
        .preview-zoom-btn { background: #00b0ff; color: #000; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 900; font-size: 13px; cursor: pointer; }
        .preview-body { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; padding: 10px; overflow: auto; touch-action: pan-x pan-y pinch-zoom; }
        #previewImg { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; transition: transform 0.2s ease; cursor: zoom-in; }
        #previewImg.is-zoomed { transform: scale(2.2); cursor: zoom-out; }
    </style>
</head>
<body>

<div class="header-box">
    <h1>RUN</h1>
    <div class="icon-btn" id="refreshBtn">🔄</div>
</div>

<div class="nav-grid-3x2">
    <a href="mark.html" class="nav-tile t-mark">MARK</a>
    <a href="run.html" class="nav-tile t-run">RUN</a>
    <a href="tow.html" class="nav-tile t-tow">TOW</a>
    <a href="admin.html" class="nav-tile t-admin">ADMIN</a>
    <a href="yard.html" class="nav-tile t-yard">YARD</a>
    <a href="release.html" class="nav-tile t-rel">REL</a>
</div>

<!-- NATIVE QUICK SCAN TRIGGER -->
<button type="button" class="hud-check-btn" onclick="triggerNativeScan()">
    <span>📷 CHECK VEHICLE</span>
</button>
<input type="file" id="runNativeCam" capture="environment" accept="image/*" style="display:none;" onchange="handleRunNativeScan(this)">

<div class="container" id="runContainer">
    <div class="empty-msg">LOADING RUN...</div>
</div>

<!-- HUD FLASH OVERLAY -->
<div id="hudFlashOverlay" onclick="handleHudOverlayTap(event)">
    <div class="hud-main-icon" id="hudMainIcon">🚨</div>
    <div class="hud-main-status" id="hudStatusText">TOW</div>
    <div class="hud-sub-plate" id="hudPlateText"></div>
    <div class="hud-detail-line" id="hudDetailText"></div>
    <button type="button" id="hudTowActionBtn" class="hud-action-tow-btn" onclick="openTowFromHud(event)">🚨 LOAD TOW APP</button>
    <div id="hudManualWrap" onclick="event.stopPropagation()">
        <div class="hud-manual-box">
            <input type="text" id="hudManualInput" placeholder="ENTER REGO" autocomplete="off" autocorrect="off">
            <button type="button" class="hud-manual-btn" onclick="submitManualHudCheck()">CHECK VEHICLE</button>
        </div>
    </div>
    <button type="button" class="hud-rescan-btn" onclick="event.stopPropagation(); dismissHudFlash(); triggerNativeScan();">📷 RESCAN NATIVE</button>
    <div class="hud-reset-hint">TAP OUTSIDE TO CLOSE ✕</div>
</div>

<!-- PHOTO PREVIEW MODAL WITH ZOOM -->
<div id="previewModal" class="preview-modal">
    <div class="preview-header">
        <button type="button" class="preview-back-btn" onclick="closePhotoPreview()">← BACK</button>
        <div style="display:flex; flex-direction:column; text-align:center;">
            <span style="font-size:17px; font-weight:900; color:#fff;" id="previewTitle"></span>
            <span style="font-size:11px; color:#aaa;" id="previewMeta"></span>
        </div>
        <button type="button" class="preview-zoom-btn" id="previewZoomBtn" onclick="toggleZoom()">🔍 ZOOM 2X</button>
    </div>
    <div class="preview-body" onclick="toggleZoom()"><img id="previewImg" alt="Mark Photo"></div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";

    let rawData = [];
    let propertyGroups = {};
    let isProcessingScan = false;
    let lastMatchedTowVehicle = null;

    let audioCtx = null;
    function getAudioContext() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
    }

    function playTowAlertSiren() {
        try {
            const ctx = getAudioContext();
            if (!ctx) return;
            const now = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(880, now);
            osc.frequency.setValueAtTime(587, now + 0.15);
            osc.frequency.setValueAtTime(880, now + 0.30);
            osc.frequency.setValueAtTime(587, now + 0.45);
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.65);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.65);
        } catch(e) {}
    }

    window.addEventListener('load', () => {
        loadTowRun();
    });

    document.getElementById('refreshBtn').addEventListener('click', () => {
        localStorage.removeItem('towed_blacklist');
        localStorage.removeItem('cached_run_data');
        document.getElementById('runContainer').innerHTML = "<div class='empty-msg'>REFRESHING...</div>";
        loadTowRun();
    });

    async function loadTowRun() {
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL + "?action=get_run");
            rawData = await res.json();
            localStorage.setItem('cached_run_data', JSON.stringify(rawData));
            parseAndRenderRun(rawData);
        } catch(e) {
            const cached = localStorage.getItem('cached_run_data');
            if (cached) {
                rawData = JSON.parse(cached);
                parseAndRenderRun(rawData);
            }
        }
    }

    // STRICT DAY-FIRST (DD-MM) PARSING FOR AUSTRALIAN TIMESTAMPS
    function parseAndRenderRun(data) {
        if (!data || !Array.isArray(data) || data.length === 0) {
            document.getElementById('runContainer').innerHTML = "<div class='empty-msg'>NO CARS ON RUN</div>";
            return;
        }

        const now = new Date();
        const nowMs = now.getTime();
        const currentYear = now.getFullYear();

        data = data.filter(item => {
            const r = String(item.rego || '').trim().toUpperCase();
            return !r;
        });

        propertyGroups = {};
        data.forEach(item => {
            const prop = item.property || "GENERAL";
            if (!propertyGroups[prop]) propertyGroups[prop] = [];

            let status = "WAIT";
            let expMs = 0;

            if (item.expiryTime) {
                const cleanExp = String(item.expiryTime).replace(/^[A-Za-z]+\s+/, "").trim();
                const parts = cleanExp.split(/[\s-:]+/);
                if (parts.length >= 4) {
                    const day = parseInt(parts[0], 10);
                    const month = parseInt(parts[1], 10) - 1;
                    const hours = parseInt(parts[2], 10);
                    const mins = parseInt(parts[3], 10);
                    
                    let expYear = currentYear;
                    if (now.getMonth() === 11 && month === 0) expYear++; // Handle Dec->Jan rollover

                    expMs = new Date(expYear, month, day, hours, mins).getTime();
                }
            }

            if (item.pass === "YES") {
                status = "PASS";
            } else if (expMs > 0 && nowMs >= expMs) {
                status = "READY";
            }

            propertyGroups[prop].push({
                rego: item.rego,
                markedTimeStr: formatCleanDisplayTime(item.markedTime),
                expiryTimeStr: formatCleanDisplayTime(item.expiryTime),
                rawExpiryMs: expMs,
                status: status,
                property: prop,
                make: item.make || "",
                model: item.model || "",
                colour: item.colour || "",
                bodyType: item.bodyType || "",
                imageUrl: item.imageUrl || item.image || ""
            });
        });

        renderSummaryView();
    }

    function formatCleanDisplayTime(rawStr) {
        if (!rawStr) return "N/A";
        const parts = String(rawStr).trim().split(/\s+/);
        return parts.length >= 3 ? `${parts[0]} ${parts[2]}` : String(rawStr);
    }

    function renderSummaryView() {
        const sortedProps = Object.keys(propertyGroups).sort((a, b) => {
            const redA = propertyGroups[a].filter(c => c.status === "READY").length;
            const redB = propertyGroups[b].filter(c => c.status === "READY").length;
            if (redB !== redA) return redB - redA;

            const orangeA = propertyGroups[a].filter(c => c.status === "WAIT").length;
            const orangeB = propertyGroups[b].filter(c => c.status === "WAIT").length;
            if (orangeB !== orangeA) return orangeB - orangeA;

            const blueA = propertyGroups[a].filter(c => c.status === "PASS").length;
            const blueB = propertyGroups[b].filter(c => c.status === "PASS").length;
            if (blueB !== blueA) return blueB - blueA;

            return a.localeCompare(b);
        });

        const container = document.getElementById('runContainer');
        container.innerHTML = "";

        sortedProps.forEach(prop => {
            const redCount = propertyGroups[prop].filter(c => c.status === "READY").length;
            const orangeCount = propertyGroups[prop].filter(c => c.status === "WAIT").length;
            const blueCount = propertyGroups[prop].filter(c => c.status === "PASS").length;

            const card = document.createElement('div');
            card.className = 'prop-summary-card';
            card.innerHTML = `
                <div class="prop-name" onclick="renderDetailView('${prop}', 'ALL')">${prop}</div>
                <div class="count-btns">
                    <button class="cnt-btn btn-red" onclick="renderDetailView('${prop}', 'READY')">
                        <span class="cnt-num">${redCount}</span>
                        <span class="cnt-lbl">TOW</span>
                    </button>
                    <button class="cnt-btn btn-orange" onclick="renderDetailView('${prop}', 'WAIT')">
                        <span class="cnt-num">${orangeCount}</span>
                        <span class="cnt-lbl">WAIT</span>
                    </button>
                    <button class="cnt-btn btn-blue" onclick="renderDetailView('${prop}', 'PASS')">
                        <span class="cnt-num">${blueCount}</span>
                        <span class="cnt-lbl">PASS</span>
                    </button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function renderDetailView(prop, filterStatus) {
        const container = document.getElementById('runContainer');
        container.innerHTML = "";

        const backBtn = document.createElement('div');
        backBtn.className = 'back-btn';
        backBtn.innerText = "← BACK TO ALL PROPERTIES";
        backBtn.onclick = renderSummaryView;
        container.appendChild(backBtn);

        const title = document.createElement('div');
        title.className = 'detail-title';
        title.innerText = `${prop} ${filterStatus !== 'ALL' ? '(' + filterStatus + ')' : ''}`;
        container.appendChild(title);

        let cars = (propertyGroups[prop] || []).slice();
        if (filterStatus !== 'ALL') cars = cars.filter(c => c.status === filterStatus);

        const getRank = (st) => {
            const s = String(st || '').toUpperCase();
            if (s === 'READY') return 1;
            if (s === 'WAIT') return 2;
            if (s === 'PASS') return 3;
            return 4;
        };

        cars.sort((a, b) => {
            const rDiff = getRank(a.status) - getRank(b.status);
            if (rDiff !== 0) return rDiff;
            return (Number(a.rawExpiryMs) || 0) - (Number(b.rawExpiryMs) || 0);
        });

        cars.forEach(car => {
            const makeModel = [car.make, car.model].filter(Boolean).join(' - ');
            const vehDesc = makeModel 
                ? (car.colour ? `${makeModel} (${car.colour})` : makeModel) 
                : (car.colour || '');

            const driveId = car.imageUrl ? (car.imageUrl.match(/[-\w]{25,}/) || [''])[0] : '';
            const thumbUrl = driveId ? `https://lh3.googleusercontent.com/d/${driveId}` : (car.imageUrl || '');
            const thumbHtml = thumbUrl 
                ? `<img src="${thumbUrl}" class="run-tile-thumb" loading="lazy" onclick="event.stopPropagation(); openPhotoPreview('${car.rego}', '${car.property}', '${thumbUrl}')">`
                : `<div class="run-tile-thumb no-thumb" onclick="event.stopPropagation();">NO PIC</div>`;

            const tile = document.createElement('div');
            tile.className = `car-tile tile-${car.status.toLowerCase()}`;
            tile.innerHTML = `
                ${thumbHtml}
                <div class="tile-mid-content">
                    <div class="rego-header-line">
                        <span class="car-rego">${car.rego}</span>
                        <span class="car-time-mkd">MKD: ${car.markedTimeStr}</span>
                    </div>
                    ${vehDesc ? `<div style="font-size:12px; color:#aaa; font-weight:800; margin-top:2px;">${vehDesc}</div>` : ''}
                    <div class="car-time-exp">EXP: ${car.expiryTimeStr}</div>
                </div>
                <div class="tile-right-box">
                    <button type="button" class="badge badge-${car.status.toLowerCase()}">${car.status === "READY" ? "TOW" : car.status}</button>
                </div>
            `;
            
            const handleSelect = (e) => {
                e.stopPropagation();
                if (car.status === "PASS") {
                    window.location.href = `passes.html`;
                } else {
                    navigateToTow(car);
                }
            };

            tile.addEventListener('click', handleSelect);
            tile.querySelector('.badge').addEventListener('click', handleSelect);
            container.appendChild(tile);
        });
    }

    function navigateToTow(car) {
        const q = new URLSearchParams({
            rego: car.rego || "",
            prop: car.property || "",
            make: car.make || "",
            model: car.model || "",
            colour: car.colour || "",
            body: car.bodyType || "",
            img: car.imageUrl || car.image || "",
            mkd: car.markedTimeStr || "",
            openComp: car.status === "READY" ? "1" : "0"
        });
        window.location.href = `tow.html?${q.toString()}`;
    }

    // --- QUICK SCAN: NATIVE CAMERA TRIGGER ---
    function triggerNativeScan() {
        getAudioContext();
        const cam = document.getElementById('runNativeCam');
        cam.value = "";
        cam.click();
    }

    function handleRunNativeScan(input) {
        if (!input.files || !input.files[0]) return;
        if (isProcessingScan) return;
        isProcessingScan = true;

        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const maxDim = 960;
                let w = img.width, h = img.height;
                if (w > h) { if (w > maxDim) { h = Math.round((h * maxDim) / w); w = maxDim; } } 
                else { if (h > maxDim) { w = Math.round((w * maxDim) / h); h = maxDim; } }
                
                canvas.width = w; canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);
                const b64 = canvas.toDataURL('image/jpeg', 0.60);
                executeAnprScan(b64);
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    async function executeAnprScan(b64) {
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'scan_npr', photoBytes: b64 })
            });
            const data = await res.json();
            const plate = data && data.rego ? String(data.rego).trim().toUpperCase() : "";
            
            if (plate) {
                evaluatePlateAndFlashHUD(plate);
            } else {
                flashResultOverlay("noplate", "NO PLATE", "NO VEHICLE PLATE DETECTED", true);
            }
        } catch(err) {
            flashResultOverlay("noplate", "OFFLINE", "SCAN FAILED — ENTER MANUALLY", true);
        } finally {
            isProcessingScan = false;
        }
    }

    function levenshtein(a, b) {
        const matrix = [];
        for (let i = 0; i <= b.length; i++) matrix[i] = [i];
        for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
        for (let i = 1; i <= b.length; i++) {
            for (let j = 1; j <= a.length; j++) {
                if (b.charAt(i - 1) === a.charAt(j - 1)) {
                    matrix[i][j] = matrix[i - 1][j - 1];
                } else {
                    matrix[i][j] = Math.min(matrix[i - 1][j - 1] + 1, Math.min(matrix[i][j - 1] + 1, matrix[i - 1][j] + 1));
                }
            }
        }
        return matrix[b.length][a.length];
    }

    function evaluatePlateAndFlashHUD(plate) {
        const cleanRego = plate.replace(/[^A-Z0-9]/g, '');
        let exactMatch = null;
        let fuzzyMatch = null;
        let minDistance = 999;

        const allVehicles = [];
        for (const prop in propertyGroups) {
            allVehicles.push(...propertyGroups[prop]);
        }

        exactMatch = allVehicles.find(c => c.rego.replace(/[^A-Z0-9]/g, '') === cleanRego);

        if (!exactMatch) {
            allVehicles.forEach(c => {
                const r = c.rego.replace(/[^A-Z0-9]/g, '');
                const dist = levenshtein(r, cleanRego);
                if (dist <= 2 && dist < minDistance) {
                    minDistance = dist;
                    fuzzyMatch = c;
                }
            });
        }

        if (exactMatch) {
            lastMatchedTowVehicle = exactMatch;
            if (exactMatch.status === "PASS") flashResultOverlay("pass", cleanRego, `PASS ON FILE (${exactMatch.property})`, false);
            else if (exactMatch.status === "READY") {
                playTowAlertSiren();
                if (navigator.vibrate) try { navigator.vibrate([250, 100, 250, 100, 400]); } catch(e){}
                flashResultOverlay("tow", cleanRego, `TOW READY (${exactMatch.property})`, false);
            }
            else if (exactMatch.status === "WAIT") flashResultOverlay("wait", cleanRego, `MARKED: EXP ${exactMatch.expiryTimeStr}`, false);
        } else if (fuzzyMatch) {
            lastMatchedTowVehicle = fuzzyMatch; 
            flashResultOverlay("fuzzy", cleanRego, `FUZZY MATCH DETECTED\nSCANNED: ${cleanRego}\nLOGGED: ${fuzzyMatch.rego} (${fuzzyMatch.status})`, false);
        } else {
            flashResultOverlay("nomark", cleanRego, "NO ACTIVE MARK - UNMARKED", false);
        }
    }

    function flashResultOverlay(type, plate, detail, showManualInput) {
        const overlay = document.getElementById('hudFlashOverlay');
        const iconEl = document.getElementById('hudMainIcon');
        const statusEl = document.getElementById('hudStatusText');
        const plateEl = document.getElementById('hudPlateText');
        const detailEl = document.getElementById('hudDetailText');
        const manualWrap = document.getElementById('hudManualWrap');
        const manualInput = document.getElementById('hudManualInput');
        const towActionBtn = document.getElementById('hudTowActionBtn');

        overlay.className = `hud-flash-${type}`;
        overlay.style.display = 'flex';

        if (type === 'tow') {
            iconEl.innerText = "🚨"; statusEl.innerText = "TOW";
            towActionBtn.style.display = "block";
            towActionBtn.innerText = "🚨 LOAD TOW APP";
        } else if (type === 'fuzzy') {
            iconEl.innerText = "⚠️"; statusEl.innerText = "CHECK REGO";
            towActionBtn.style.display = "block"; 
            towActionBtn.innerText = "🚨 PROCEED WITH TOW";
        } else {
            towActionBtn.style.display = "none";
            if (type === 'pass') { iconEl.innerText = "🎫"; statusEl.innerText = "PASS"; }
            else if (type === 'wait') { iconEl.innerText = "⏳"; statusEl.innerText = "WAIT"; }
            else if (type === 'nomark') { iconEl.innerText = "🟢"; statusEl.innerText = "NO MARK"; }
            else if (type === 'noplate') { iconEl.innerText = "❌"; statusEl.innerText = "NO PLATE"; }
        }

        plateEl.innerText = plate;
        detailEl.innerText = detail;

        if (showManualInput) {
            manualWrap.style.display = 'block';
            setTimeout(() => { manualInput.focus(); }, 100);
        } else {
            manualWrap.style.display = 'none';
        }
    }

    function openTowFromHud(e) {
        e.stopPropagation();
        if (!lastMatchedTowVehicle) return;
        dismissHudFlash();
        navigateToTow(lastMatchedTowVehicle);
    }

    function showManualEntryOverlay() {
        flashResultOverlay("noplate", "MANUAL CHECK", "TYPE LICENCE PLATE TO CHECK", true);
    }

    function submitManualHudCheck() {
        const manualInput = document.getElementById('hudManualInput');
        const val = manualInput.value.trim().toUpperCase();
        if (val.length < 2) return;
        manualInput.value = "";
        evaluatePlateAndFlashHUD(val);
    }

    function handleHudOverlayTap(e) { dismissHudFlash(); }
    function dismissHudFlash() {
        document.getElementById('hudFlashOverlay').style.display = 'none';
        document.getElementById('hudManualWrap').style.display = 'none';
        document.getElementById('hudManualInput').value = "";
    }

    function openPhotoPreview(rego, prop, url) {
        document.getElementById('previewTitle').innerText = `${rego} (${prop})`;
        const driveIdMatch = url ? String(url).match(/[-\w]{25,}/) : null;
        const img = document.getElementById('previewImg');
        img.src = driveIdMatch ? "https://lh3.googleusercontent.com/d/" + driveIdMatch[0] : (url || "");
        img.classList.remove('is-zoomed');
        const btn = document.getElementById('previewZoomBtn');
        if (btn) btn.innerText = "🔍 ZOOM 2X";
        document.getElementById('previewModal').classList.add('show');
    }

    function closePhotoPreview() { 
        const img = document.getElementById('previewImg');
        img.classList.remove('is-zoomed');
        document.getElementById('previewModal').classList.remove('show'); 
    }

    function toggleZoom() {
        const img = document.getElementById('previewImg');
        const btn = document.getElementById('previewZoomBtn');
        const isZ = img.classList.toggle('is-zoomed');
        if (btn) btn.innerText = isZ ? "🔍 RESET" : "🔍 ZOOM 2X";
    }
</script>
