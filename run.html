<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>RUN</title>
    
    <link rel="apple-touch-icon" href="icon-run.png?v=100">
    <link rel="icon" type="image/png" href="icon-run.png?v=100">
    <link rel="manifest" href="manifest-run.json?v=100">

    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            margin: 0; padding: 14px; background: #121212; color: #fff; 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; 
        }
        
        .header-box { display: flex; align-items: center; justify-content: center; position: relative; width: 100%; max-width: 440px; margin-bottom: 10px; }
        .header-box h1 { margin: 0; font-size: 38px; font-weight: 900; color: #ffab00; letter-spacing: 2px; text-align: center; }
        .icon-btn { position: absolute; right: 0; background: #2a2a2a; border: 1px solid #444; border-radius: 10px; font-size: 20px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; }
        .icon-btn:active { transform: scale(0.9); }

        .nav-bar { display: flex; gap: 8px; width: 100%; max-width: 440px; margin-bottom: 16px; }
        .nav-tile { flex: 1; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 900; text-decoration: none; color: #000; }
        .nav-run { background: #ffab00; }
        .nav-tow { background: #ff1744; color: #fff; }
        .nav-rel { background: #00e676; }
        .nav-pass { background: #ab47bc; color: #fff; }

        .container { width: 100%; max-width: 440px; }

        .prop-group { margin-bottom: 18px; }
        .prop-title { font-size: 20px; font-weight: 900; color: #ffab00; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; padding-left: 4px; border-left: 4px solid #ffab00; }

        .car-tile {
            background: #1e1e1e; border-radius: 14px; padding: 14px; margin-bottom: 10px;
            display: flex; align-items: center; justify-content: space-between; border: 2px solid #333;
            text-decoration: none; color: #fff; transition: transform 0.1s ease;
        }
        .car-tile:active { transform: scale(0.98); }

        .tile-ready { border-color: #ff1744; background: #2a1215; }
        .tile-wait { border-color: #ffab00; background: #2a2212; }
        .tile-pass { border-color: #00e676; background: #122a18; }

        .car-rego { font-size: 28px; font-weight: 900; letter-spacing: 1px; }
        .tile-ready .car-rego { color: #ff1744; }
        .tile-wait .car-rego { color: #ffab00; }
        .tile-pass .car-rego { color: #00e676; }

        .car-times { font-size: 12px; color: #aaa; margin-top: 4px; font-weight: 700; }

        .badge {
            padding: 8px 12px; border-radius: 8px; font-size: 14px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px;
        }
        .badge-ready { background: #ff1744; color: #fff; }
        .badge-wait { background: #ffab00; color: #000; }
        .badge-pass { background: #00e676; color: #000; }

        .empty-msg { text-align: center; color: #666; font-weight: 800; font-size: 16px; margin-top: 40px; }
    </style>
</head>
<body>

<div class="header-box">
    <h1>RUN</h1>
    <div class="icon-btn" id="refreshBtn">🔄</div>
</div>

<div class="nav-bar">
    <a href="run.html" class="nav-tile nav-run">RUN</a>
    <a href="tow.html" class="nav-tile nav-tow">TOW</a>
    <a href="release.html" class="nav-tile nav-rel">REL</a>
    <a href="passes.html" class="nav-tile nav-pass">PASS</a>
</div>

<div class="container" id="runContainer">
    <div class="empty-msg">LOADING RUN...</div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";

    const runContainer = document.getElementById('runContainer');
    const refreshBtn = document.getElementById('refreshBtn');

    window.addEventListener('load', loadTowRun);

    refreshBtn.addEventListener('click', () => {
        runContainer.innerHTML = "<div class='empty-msg'>REFRESHING...</div>";
        loadTowRun();
    });

    async function loadTowRun() {
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL + "?action=get_tow_run");
            const data = await res.json();

            if (!data || data.length === 0) {
                runContainer.innerHTML = "<div class='empty-msg'>NO CARS ON RUN</div>";
                return;
            }

            const nowMs = Date.now();
            const groups = {};

            data.forEach(item => {
                const prop = item.property || "GENERAL";
                if (!groups[prop]) groups[prop] = [];

                let status = "WAIT";
                if (item.pass === "YES") {
                    status = "PASS";
                } else if (item.rawExpiryMs > 0 && nowMs >= item.rawExpiryMs) {
                    status = "READY";
                }

                groups[prop].push({
                    rego: item.rego,
                    markedTime: item.markedTime,
                    expiryTime: item.expiryTime,
                    status: status,
                    property: prop
                });
            });

            runContainer.innerHTML = "";

            Object.keys(groups).forEach(prop => {
                const propBox = document.createElement('div');
                propBox.className = 'prop-group';

                const title = document.createElement('div');
                title.className = 'prop-title';
                title.innerText = prop;
                propBox.appendChild(title);

                groups[prop].forEach(car => {
                    const tile = document.createElement('a');
                    
                    if (car.status === "READY") {
                        tile.className = 'car-tile tile-ready';
                        tile.href = `tow.html?rego=${encodeURIComponent(car.rego)}&prop=${encodeURIComponent(car.property)}`;
                    } else if (car.status === "WAIT") {
                        tile.className = 'car-tile tile-wait';
                        tile.href = '#';
                    } else {
                        tile.className = 'car-tile tile-pass';
                        tile.href = '#';
                    }

                    tile.innerHTML = `
                        <div>
                            <div class="car-rego">${car.rego}</div>
                            <div class="car-times">MKD: ${car.markedTime} | EXP: ${car.expiryTime}</div>
                        </div>
                        <div class="badge badge-${car.status.toLowerCase()}">${car.status === "READY" ? "TOW" : car.status}</div>
                    `;

                    propBox.appendChild(tile);
                });

                runContainer.appendChild(propBox);
            });

        } catch(e) {
            runContainer.innerHTML = "<div class='empty-msg'>ERROR LOADING RUN</div>";
        }
    }
</script>
</body>
</html>
