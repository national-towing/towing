<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tow Run - Comparison Mode</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #121212; color: #fff; padding: 12px; }
        h1 { text-align: center; font-size: 20px; color: #ff1744; margin-bottom: 12px; font-weight: 800; }
        .summary-card { background: #1e1e1e; border-radius: 10px; padding: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border-left: 5px solid #ff1744; }
        .summary-card.wait { border-left-color: #ff9100; }
        .summary-card.pass { border-left-color: #00e676; }
        .prop-name { font-size: 16px; font-weight: bold; }
        .badge-count { background: #2a2a2a; padding: 4px 10px; border-radius: 12px; font-size: 13px; font-weight: bold; }
        .car-tile { background: #1e1e1e; border-radius: 10px; padding: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #ff1744; cursor: pointer; }
        .tile-wait { border-left-color: #ff9100; }
        .tile-pass { border-left-color: #00e676; }
        .car-rego { font-size: 18px; font-weight: bold; letter-spacing: 1px; }
        .car-time-mkd { font-size: 11px; color: #aaa; margin-left: 8px; }
        .car-time-exp { font-size: 12px; color: #ff5252; margin-top: 4px; }
        .badge { padding: 6px 12px; border-radius: 6px; font-weight: bold; font-size: 12px; }
        .badge-ready { background: #ff1744; color: #fff; }
        .badge-wait { background: #ff9100; color: #000; }
        .badge-pass { background: #00e676; color: #000; }
        .back-btn { background: #2a2a2a; color: #fff; text-align: center; padding: 10px; border-radius: 8px; font-weight: bold; margin-bottom: 12px; cursor: pointer; }
        .detail-title { font-size: 16px; font-weight: bold; margin-bottom: 10px; color: #ff1744; text-transform: uppercase; }
        .empty-msg { text-align: center; color: #777; padding: 30px; font-size: 14px; }
        
        /* Modal Overlay Viewfinder */
        .overlay-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 9999; flex-direction: column; }
        .overlay-modal.show { display: flex; }
        .modal-header { height: 50px; background: #1e1e1e; display: flex; justify-content: space-between; align-items: center; padding: 0 16px; border-bottom: 1px solid #333; }
        .modal-title { font-weight: bold; font-size: 15px; color: #fff; }
        .close-btn { color: #ff1744; font-weight: bold; font-size: 20px; cursor: pointer; }
        .viewfinder-container { flex: 1; position: relative; overflow: hidden; background: #000; }
        #overlayVideo { width: 100%; height: 100%; object-fit: cover; }
        #ghostImage { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.45; pointer-events: none; }
        .modal-footer { height: 75px; background: #1e1e1e; display: flex; justify-content: center; align-items: center; border-top: 1px solid #333; }
        .match-btn { background: #ff1744; color: #fff; border: none; padding: 14px 28px; border-radius: 30px; font-weight: bold; font-size: 15px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>READY TO TOW RUN</h1>
    <div id="runContainer">Loading active runs...</div>

    <!-- Overlay Comparison Modal -->
    <div id="overlayModal" class="overlay-modal">
        <div class="modal-header">
            <span class="modal-title" id="modalRegoTitle">ALIGN & VERIFY TOW</span>
            <span class="close-btn" onclick="closeOverlayModal()">✕</span>
        </div>
        <div class="viewfinder-container">
            <video id="overlayVideo" autoplay playsinline muted></video>
            <img id="ghostImage" alt="Ghost Overlay">
        </div>
        <div class="modal-footer">
            <button id="matchBtn" class="match-btn">MATCH & TOW VEHICLE</button>
        </div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby5Ew_VpC0aD4iG6B5Q2p93tL8yL5Y0Y-X7J5m6L8/exec";

        let activeCar = null;
        let propertyGroups = {};
        let videoStream = null;

        const runContainer = document.getElementById('runContainer');
        const overlayModal = document.getElementById('overlayModal');
        const overlayVideo = document.getElementById('overlayVideo');
        const ghostImage = document.getElementById('ghostImage');
        const modalRegoTitle = document.getElementById('modalRegoTitle');
        const matchBtn = document.getElementById('matchBtn');

        async function fetchRunData() {
            try {
                const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=get_run`);
                const data = await response.json();
                processRunData(data);
            } catch(err) {
                runContainer.innerHTML = `<div class="empty-msg">Error loading run data: ${err.message}</div>`;
            }
        }

        function processRunData(data) {
            propertyGroups = {};
            const nowMs = new Date().getTime();

            data.forEach(item => {
                const prop = item.property || "GENERAL";
                if (!propertyGroups[prop]) propertyGroups[prop] = [];

                let status = "WAIT";
                if (item.pass === "YES") {
                    status = "PASS";
                } else if (item.rawExpiryMs && nowMs >= item.rawExpiryMs) {
                    status = "READY";
                }

                propertyGroups[prop].push({
                    rego: item.rego,
                    property: prop,
                    markedTimeStr: item.markedTime,
                    expiryTimeStr: item.expiryTime,
                    status: status,
                    imageUrl: item.imageUrl || item.image || ""
                });
            });

            renderSummaryView();
        }

        function renderSummaryView() {
            runContainer.innerHTML = "";
            const properties = Object.keys(propertyGroups);

            if (properties.length === 0) {
                runContainer.innerHTML = `<div class="empty-msg">NO VEHICLES CURRENTLY MARKED</div>`;
                return;
            }

            properties.forEach(prop => {
                const cars = propertyGroups[prop];
                const readyCount = cars.filter(c => c.status === "READY").length;
                const waitCount = cars.filter(c => c.status === "WAIT").length;
                const passCount = cars.filter(c => c.status === "PASS").length;

                const card = document.createElement('div');
                card.className = `summary-card ${readyCount > 0 ? '' : (waitCount > 0 ? 'wait' : 'pass')}`;
                card.onclick = () => renderDetailView(prop, readyCount > 0 ? 'READY' : 'ALL');

                card.innerHTML = `
                    <div>
                        <div class="prop-name">${prop}</div>
                        <div style="font-size:12px; color:#aaa; margin-top:4px;">
                            ${readyCount} Ready to Tow · ${waitCount} Waiting · ${passCount} Passes
                        </div>
                    </div>
                    <div class="badge-count">${cars.length} REGO${cars.length > 1 ? 'S' : ''}</div>
                `;
                runContainer.appendChild(card);
            });
        }

        function renderDetailView(prop, filterStatus) {
            runContainer.innerHTML = "";

            const backBtn = document.createElement('div');
            backBtn.className = 'back-btn';
            backBtn.innerText = "← BACK TO ALL PROPERTIES";
            backBtn.onclick = renderSummaryView;
            runContainer.appendChild(backBtn);

            const title = document.createElement('div');
            title.className = 'detail-title';
            title.innerText = `${prop} ${filterStatus !== 'ALL' ? '(' + filterStatus + ')' : ''}`;
            runContainer.appendChild(title);

            let cars = propertyGroups[prop] || [];
            if (filterStatus !== 'ALL') {
                cars = cars.filter(c => c.status === filterStatus);
            }

            cars.forEach(car => {
                const tile = document.createElement('div');
                tile.className = `car-tile ${car.status === 'READY' ? '' : (car.status === 'WAIT' ? 'tile-wait' : 'tile-pass')}`;

                if (car.status === "READY") {
                    tile.addEventListener('click', (e) => {
                        e.preventDefault();
                        openOverlayModal(car);
                    });
                } else if (car.status === "WAIT") {
                    tile.addEventListener('click', () => {
                        window.location.href = `tow.html?rego=${encodeURIComponent(car.rego)}&prop=${encodeURIComponent(car.property)}`;
                    });
                } else {
                    tile.addEventListener('click', () => { window.location.href = `passes.html`; });
                }

                tile.innerHTML = `
                    <div>
                        <div>
                            <span class="car-rego">${car.rego}</span>
                            <span class="car-time-mkd">MKD: ${car.markedTimeStr}</span>
                        </div>
                        <div class="car-time-exp">EXP: ${car.expiryTimeStr}</div>
                    </div>
                    <div class="badge badge-${car.status.toLowerCase()}">${car.status === "READY" ? "TOW" : car.status}</div>
                `;
                runContainer.appendChild(tile);
            });
        }

        async function openOverlayModal(car) {
            try {
                activeCar = car;
                modalRegoTitle.innerText = `${car.rego} (${car.property})`;
                
                if (car.imageUrl) {
                    ghostImage.crossOrigin = "anonymous";
                    let fastUrl = car.imageUrl;
                    const idMatch = car.imageUrl.match(/[-\w]{25,}/);
                    if (idMatch) {
                        fastUrl = "https://lh3.googleusercontent.com/d/" + idMatch[0] + "=s800";
                    }
                    ghostImage.src = fastUrl;
                } else {
                    ghostImage.removeAttribute("crossOrigin");
                    ghostImage.src = "";
                }

                overlayModal.classList.add('show');
                await startOverlayCamera();
            } catch(err) {
                alert("Error opening comparison: " + err.message);
            }
        }

        async function startOverlayCamera() {
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
                overlayVideo.srcObject = videoStream;
            } catch(err) {
                alert("Unable to access camera: " + err.message);
            }
        }

        function closeOverlayModal() {
            stopOverlayCamera();
            overlayModal.classList.remove('show');
        }

        function stopOverlayCamera() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }
        }

        matchBtn.addEventListener('click', async () => {
            if (!activeCar) return;

            matchBtn.disabled = true;
            matchBtn.innerText = "SAVING PROOF...";

            const liveCanvas = document.createElement('canvas');
            const aspect = (overlayVideo.videoHeight && overlayVideo.videoWidth) ? (overlayVideo.videoHeight / overlayVideo.videoWidth) : 0.5625;
            liveCanvas.width = 800;
            liveCanvas.height = Math.round(800 * aspect);
            const liveCtx = liveCanvas.getContext('2d');
            liveCtx.drawImage(overlayVideo, 0, 0, liveCanvas.width, liveCanvas.height);

            const compositeCanvas = document.createElement('canvas');
            compositeCanvas.width = 1600;
            compositeCanvas.height = liveCanvas.height;
            const compCtx = compositeCanvas.getContext('2d');

            compCtx.drawImage(liveCanvas, 800, 0);

            const markImg = new Image();
            markImg.crossOrigin = "anonymous";

            const executeUpload = async (canvasToUpload) => {
                const compositeB64 = canvasToUpload.toDataURL('image/jpeg', 0.65);
                await uploadEvidenceAndRedirect(compositeB64);
            };

            markImg.onload = async () => {
                try {
                    compCtx.drawImage(markImg, 0, 0, 800, liveCanvas.height);
                } catch(e) {}

                compCtx.fillStyle = "#ff1744";
                compCtx.font = "bold 24px sans-serif";
                compCtx.fillText("ORIGINAL MARK PHOTO", 20, 35);
                compCtx.fillText("TOW VERIFICATION PHOTO", 820, 35);

                await executeUpload(compositeCanvas);
            };

            markImg.onerror = async () => {
                await executeUpload(liveCanvas);
            };

            if (ghostImage.src && ghostImage.src !== "") {
                markImg.src = ghostImage.src;
            } else {
                markImg.onerror();
            }
        });

        async function uploadEvidenceAndRedirect(b64Data) {
            const payload = {
                action: 'log_tow_confirmation',
                rego: activeCar.rego,
                property: activeCar.property,
                photoBytes: b64Data,
                timestamp: new Date().toISOString()
            };

            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
            } catch(e) {}

            stopOverlayCamera();
            window.location.href = `tow.html?rego=${encodeURIComponent(activeCar.rego)}&prop=${encodeURIComponent(activeCar.property)}`;
        }

        fetchRunData();
    </script>
</body>
</html>
