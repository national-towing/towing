<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RUN</title>
    
    <link rel="apple-touch-icon" href="icon-run.png?v=8">
    <link rel="icon" type="image/png" href="icon-run.png?v=8">
    <link rel="manifest" href="manifest-run.json?v=8">

    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: 14px; background: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .header h1 { margin: 0 0 14px 0; font-size: 38px; font-weight: 900; color: #ffab00; letter-spacing: 2px; text-align: center; }
        .container { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 12px; }
        .property-card { background: #1e1e1e; border-radius: 18px; padding: 18px; border: 1px solid #333; }
        .prop-title { font-size: 24px; font-weight: 900; color: #fff; margin-bottom: 14px; text-transform: uppercase; cursor: pointer; display: flex; justify-content: space-between; }
        .count-boxes { display: flex; gap: 10px; }
        .count-box { flex: 1; height: 75px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 900; cursor: pointer; }
        .box-green { background: #00e676; color: #000; }
        .box-yellow { background: #ffab00; color: #000; }
        .box-red { background: #ff1744; color: #fff; }
        
        .back-btn { background: #2a2a2a; color: #ffab00; border: 2px solid #ffab00; border-radius: 12px; height: 52px; font-size: 20px; font-weight: 900; width: 100%; cursor: pointer; margin-bottom: 12px; }
        .vehicle-card { background: #1e1e1e; border-radius: 16px; padding: 18px; border: 2px solid #333; margin-bottom: 14px; }
        .rego-title { font-size: 32px; font-weight: 900; color: #fff; }
        
        /* DYNAMIC STATUS BUTTONS */
        .action-btn { font-weight: 900; border: none; border-radius: 14px; height: 58px; font-size: 24px; width: 100%; margin-top: 14px; text-decoration: none; display: flex; align-items: center; justify-content: center; letter-spacing: 1px; }
        .btn-red { background: #ff1744; color: #fff; }
        .btn-yellow { background: #ffab00; color: #000; }
        .btn-green { background: #00e676; color: #000; }

        #status { text-align: center; font-weight: 900; font-size: 20px; color: #ffab00; margin-top: 24px; }
    </style>
</head>
<body>

<div class="header"><h1>RUN</h1></div>
<div class="container" id="appContainer"><div id="status">LOADING RUN DATA...</div></div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";
    const appContainer = document.getElementById('appContainer');
    let allRunData = [];

    window.addEventListener('load', async () => {
        try {
            const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=get_tow_run`);
            allRunData = await res.json();
            renderDashboard();
        } catch(e) { 
            appContainer.innerHTML = '<div id="status">NO MARKED CARS FOUND</div>'; 
        }
    });

    function getVehicleStatus(item) {
        const isExempt = item.pass && item.pass.toUpperCase().includes('EXEMPT');
        if (isExempt) return 'GREEN';

        const now = new Date();
        const expiryDate = new Date(item.expiryTime);
        
        // If expiry timestamp parsed correctly and passed, it's ready to TOW (RED)
        if (!isNaN(expiryDate.getTime()) && now >= expiryDate) {
            return 'RED';
        }
        return 'YELLOW'; // Still in waiting window
    }

    function formatDDDhhmm(dateStr) {
        if (!dateStr) return "N/A";
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return dateStr; // Return raw string if custom text
        
        const days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
        const dayName = days[d.getDay()];
        const hours = String(d.getHours()).padStart(2, '0');
        const mins = String(d.getMinutes()).padStart(2, '0');
        
        return `${dayName} ${hours}:${mins}`;
    }

    function renderDashboard() {
        appContainer.innerHTML = '';
        if (!allRunData || allRunData.length === 0) {
            appContainer.innerHTML = '<div id="status">NO CARS CURRENTLY MARKED</div>';
            return;
        }

        const propGroups = {};

        allRunData.forEach(item => {
            const prop = item.property || 'GENERAL';
            if (!propGroups[prop]) propGroups[prop] = { green: 0, yellow: 0, red: 0 };
            
            const status = getVehicleStatus(item);
            if (status === 'GREEN') propGroups[prop].green++;
            else if (status === 'RED') propGroups[prop].red++;
            else propGroups[prop].yellow++;
        });

        Object.keys(propGroups).forEach(prop => {
            const counts = propGroups[prop];
            const card = document.createElement('div');
            card.className = 'property-card';
            card.innerHTML = `
                <div class="prop-title" onclick="showList('${escapeJs(prop)}')">📍 ${prop}</div>
                <div class="count-boxes">
                    <div class="count-box box-green" onclick="showList('${escapeJs(prop)}')">${counts.green}</div>
                    <div class="count-box box-yellow" onclick="showList('${escapeJs(prop)}')">${counts.yellow}</div>
                    <div class="count-box box-red" onclick="showList('${escapeJs(prop)}')">${counts.red}</div>
                </div>
            `;
            appContainer.appendChild(card);
        });
    }

    function showList(prop) {
        appContainer.innerHTML = `<button class="back-btn" onclick="renderDashboard()">⬅ BACK TO PROPERTIES</button>`;
        const filtered = allRunData.filter(i => i.property === prop);

        // Sort Top to Bottom: RED -> YELLOW -> GREEN
        const weight = { 'RED': 1, 'YELLOW': 2, 'GREEN': 3 };
        filtered.sort((a, b) => weight[getVehicleStatus(a)] - weight[getVehicleStatus(b)]);

        filtered.forEach(i => {
            const status = getVehicleStatus(i);
            let btnClass = "btn-red";
            let btnText = "TOW";

            if (status === "YELLOW") {
                btnClass = "btn-yellow";
                btnText = "WAIT";
            } else if (status === "GREEN") {
                btnClass = "btn-green";
                btnText = "PASS";
            }

            const markedFormatted = formatDDDhhmm(i.markedTime);
            const towReadyFormatted = formatDDDhhmm(i.expiryTime);

            const card = document.createElement('div');
            card.className = 'vehicle-card';
            card.innerHTML = `
                <div class="rego-title">${i.rego}</div>
                <div style="color:#aaa; font-weight:900; font-size:18px; margin-top:4px;">📍 ${i.property}</div>
                <div style="color:#fff; font-weight:800; font-size:16px; margin-top:8px; line-height: 1.4;">
                    Marked: ${markedFormatted}<br>
                    Tow Ready: ${towReadyFormatted}
                </div>
                <a href="tow.html?rego=${encodeURIComponent(i.rego)}&prop=${encodeURIComponent(i.property)}" class="action-btn ${btnClass}">${btnText}</a>
            `;
            appContainer.appendChild(card);
        });
    }

    function escapeJs(str) { return (str || '').replace(/'/g, "\\'"); }
</script>
</body>
</html>
