<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";
    const PLATE_RECOGNIZER_TOKEN = "74a8bb83a49461eef0266274ce63e1e198b4c888";

    let selectedProperty = "";
    let towPhotoBase64 = "";

    // RUN IMMEDIATELY ON SCRIPT LOAD TO PREVENT "LOADING PROPERTY..." DELAY
    (function initPropertyMemory() {
        const urlParams = new URLSearchParams(window.location.search);
        let propFromUrl = urlParams.get('prop') || urlParams.get('property');

        if (propFromUrl) {
            selectedProperty = decodeURIComponent(propFromUrl).trim().toUpperCase();
            localStorage.setItem('saved_tow_prop', selectedProperty);
        } else {
            selectedProperty = localStorage.getItem('saved_tow_prop') || "GENERAL";
        }

        // Render property header right away before images/page load completes
        document.addEventListener('DOMContentLoaded', () => {
            const propElem = document.getElementById('propDisplay');
            if (propElem) propElem.innerText = selectedProperty;
        });
    })();

    window.addEventListener('load', () => {
        // Fallback display check
        document.getElementById('propDisplay').innerText = selectedProperty;

        const todayStr = getTodayIsoDate();
        const startDateElem = document.getElementById('startDateInput');

        if (startDateElem) {
            startDateElem.min = todayStr;
            startDateElem.value = todayStr;
            handleDateChange('start');
        }
    });

    function getTodayIsoDate() {
        const d = new Date();
        const offset = d.getTimezoneOffset() * 60000;
        const localIso = (new Date(d.getTime() - offset)).toISOString().split('T')[0];
        return localIso;
    }

    function cleanRegoInput(elem) {
        elem.value = elem.value.replace(/\s+/g, '').toUpperCase();
    }

    function handleDateChange(source) {
        const startDateElem = document.getElementById('startDateInput');
        const endDateElem = document.getElementById('endDateInput');
        const durationElem = document.getElementById('durationSelect');

        if (!startDateElem.value) return;

        let startD = new Date(startDateElem.value + 'T00:00:00');

        if (source === 'start' || source === 'duration') {
            const days = parseInt(durationElem.value, 10) || 1;
            let endD = new Date(startD.getTime() + (days * 24 * 60 * 60 * 1000));
            endDateElem.value = endD.toISOString().split('T')[0];
            endDateElem.min = startDateElem.value;
        } else if (source === 'end') {
            if (!endDateElem.value) return;
            let endD = new Date(endDateElem.value + 'T00:00:00');

            if (endD <= startD) {
                endDateElem.value = startDateElem.value;
                durationElem.value = "1";
                return;
            }

            const diffTime = Math.abs(endD - startD);
            let diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays < 1) diffDays = 1;
            if (diffDays > 7) diffDays = 7;

            durationElem.value = diffDays.toString();
        }
    }

    function switchTab(mode) {
        const passBtn = document.getElementById('tabPassBtn');
        const towBtn = document.getElementById('tabTowBtn');
        const passTab = document.getElementById('passTab');
        const towTab = document.getElementById('towTab');
        const statusDiv = document.getElementById('status');

        statusDiv.innerText = "";

        if (mode === 'pass') {
            passBtn.className = "tab-btn active-pass";
            towBtn.className = "tab-btn";
            passTab.className = "tab-content active";
            towTab.className = "tab-content";
        } else {
            passBtn.className = "tab-btn";
            towBtn.className = "tab-btn active-tow";
            passTab.className = "tab-content";
            towTab.className = "tab-content active";
        }
    }

    function triggerCamera() {
        document.getElementById('cameraInput').click();
    }

    function processTowPhoto(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;
                const maxDim = 1200;

                if (width > height && width > maxDim) {
                    height = Math.round((height * maxDim) / width);
                    width = maxDim;
                } else if (height > maxDim) {
                    width = Math.round((width * maxDim) / height);
                    height = maxDim;
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);

                towPhotoBase64 = canvas.toDataURL('image/jpeg', 0.85);
                
                const previewImg = document.getElementById('towPhotoPreview');
                previewImg.src = towPhotoBase64;
                previewImg.style.display = "block";
                document.getElementById('cameraText').innerText = "📷 PHOTO ATTACHED (TAP TO CHANGE)";

                // Run Plate Recognizer ANPR Engine
                canvas.toBlob(async (blob) => {
                    if (blob) runPlateRecognizerANPR(blob);
                }, 'image/jpeg', 0.85);
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    async function runPlateRecognizerANPR(imageBlob) {
        const statusDiv = document.getElementById('status');
        statusDiv.style.color = "#ffab00";
        statusDiv.innerText = "READING PLATE...";

        try {
            const formData = new FormData();
            formData.append('upload', imageBlob, 'tow_scan.jpg');
            formData.append('regions', 'au');

            const anprRes = await fetch('https://api.platerecognizer.com/v1/plate-reader/', {
                method: 'POST',
                headers: { 'Authorization': 'Token ' + PLATE_RECOGNIZER_TOKEN },
                body: formData
            });

            if (!anprRes.ok) {
                statusDiv.style.color = "#aaa";
                statusDiv.innerText = "PHOTO SAVED. ENTER REGO MANUALLY.";
                return;
            }

            const anprData = await anprRes.json();
            
            if (anprData.results && anprData.results.length > 0 && anprData.results[0].plate) {
                const detectedRego = anprData.results[0].plate.toUpperCase();
                document.getElementById('towRegoInput').value = detectedRego;
                statusDiv.style.color = "#00e676";
                statusDiv.innerText = `✔ REGO DETECTED: ${detectedRego}`;
            } else {
                statusDiv.style.color = "#aaa";
                statusDiv.innerText = "PHOTO SAVED. ENTER REGO MANUALLY.";
            }

        } catch(err) {
            statusDiv.style.color = "#aaa";
            statusDiv.innerText = "PHOTO SAVED. ENTER REGO MANUALLY.";
        }
    }

    // SUBMIT PASS
    document.getElementById('submitPassBtn').addEventListener('click', async () => {
        const rego = document.getElementById('passRegoInput').value.trim().toUpperCase();
        const startDate = document.getElementById('startDateInput').value;
        const duration = document.getElementById('durationSelect').value;
        const endDate = document.getElementById('endDateInput').value;
        const notes = document.getElementById('passNotesInput').value.trim();
        const statusDiv = document.getElementById('status');

        if (!rego) {
            statusDiv.style.color = "#ff1744";
            statusDiv.innerText = "PLEASE ENTER VEHICLE REGO";
            return;
        }

        if (!startDate) {
            statusDiv.style.color = "#ff1744";
            statusDiv.innerText = "PLEASE SELECT START DATE";
            return;
        }

        document.getElementById('submitPassBtn').disabled = true;
        statusDiv.style.color = "#ffab00";
        statusDiv.innerText = "ISSUING PERMIT...";

        const payload = {
            action: 'add_pass',
            property: selectedProperty,
            rego: rego,
            startDate: startDate,
            duration: duration,
            expiryDate: endDate,
            notes: notes || "ISSUED VIA MANAGER PORTAL"
        };

        try {
            await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });

            statusDiv.style.color = "#00e676";
            statusDiv.innerText = `✔ PERMIT ISSUED FOR ${rego}!`;
            document.getElementById('passRegoInput').value = "";
            document.getElementById('passNotesInput').value = "";
        } catch(e) {
            statusDiv.style.color = "#ff1744";
            statusDiv.innerText = "ERROR ISSUING PERMIT";
        }

        setTimeout(() => {
            document.getElementById('submitPassBtn').disabled = false;
            statusDiv.innerText = "";
        }, 2500);
    });

    // SUBMIT TOW REQUEST
    document.getElementById('submitTowBtn').addEventListener('click', async () => {
        const rego = document.getElementById('towRegoInput').value.trim().toUpperCase();
        const reason = document.getElementById('towReasonSelect').value;
        const location = document.getElementById('towLocationInput').value.trim();
        const authorizer = document.getElementById('towAuthorizerInput').value.trim();
        const statusDiv = document.getElementById('status');

        if (!rego) {
            statusDiv.style.color = "#ff1744";
            statusDiv.innerText = "PLEASE ENTER VEHICLE REGO";
            return;
        }

        document.getElementById('submitTowBtn').disabled = true;
        statusDiv.style.color = "#ffab00";
        statusDiv.innerText = "SENDING TOW REQUEST...";

        const payload = {
            action: 'log_mark',
            property: selectedProperty,
            rego: rego,
            makeModel: "",
            confidence: "HIGH",
            isManagerRequest: true,
            reason: reason,
            location: location,
            authorizer: authorizer,
            photoBytes: towPhotoBase64,
            timestamp: new Date().toISOString()
        };

        try {
            await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });

            statusDiv.style.color = "#00e676";
            statusDiv.innerText = `✔ TOW REQUESTED FOR ${rego}!`;
            document.getElementById('towRegoInput').value = "";
            document.getElementById('towLocationInput').value = "";
            document.getElementById('towAuthorizerInput').value = "";
            towPhotoBase64 = "";
            document.getElementById('towPhotoPreview').style.display = "none";
            document.getElementById('cameraText').innerText = "📷 TAP TO SCAN REGO / ATTACH PHOTO";
        } catch(e) {
            statusDiv.style.color = "#ff1744";
            statusDiv.innerText = "ERROR SENDING TOW REQUEST";
        }

        setTimeout(() => {
            document.getElementById('submitTowBtn').disabled = false;
            statusDiv.innerText = "";
        }, 2500);
    });
</script>
