<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

    <title>Nat Tow</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nat Tow">

    <link rel="apple-touch-icon" href="LOGO.png?v=3">
    <link rel="icon" type="image/png" href="LOGO.png?v=3">
    <link rel="manifest" href="manifest-manager.json?v=3">

    <style>
        :root {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --border: #333333;
            --accent-tow: #ff1744;
            --accent-pass: #ab47bc;
            --accent-gold: #ffab00;
            --success: #00e676;
            --text-muted: #888888;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { 
            background: var(--bg); color: #fff; min-height: 100vh; padding: 14px; 
            display: flex; flex-direction: column; align-items: center; 
        }

        .brand-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            width: 100%;
            max-width: 440px;
            margin: 6px auto 16px auto;
            padding: 14px 18px;
            background: #1a1a1a;
            border: 1.5px solid #333;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
        }
        .brand-logo {
            width: 64px;
            height: 64px;
            border-radius: 12px;
            object-fit: contain;
            background: #ffffff;
            padding: 4px;
            border: 2px solid #555;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        .brand-titles {
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: left;
        }
        .brand-title {
            font-size: 24px;
            font-weight: 900;
            color: #ffab00;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            line-height: 1.1;
            margin: 0;
        }
        .brand-subtitle {
            font-size: 13px;
            font-weight: 800;
            color: #ccc;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .auth-banner {
            width: 100%; max-width: 440px; background: var(--success); color: #000;
            padding: 12px; border-radius: 10px; text-align: center; font-weight: 900;
            font-size: 15px; margin-bottom: 14px; display: none; text-transform: uppercase; letter-spacing: 1px;
        }

        .card {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 18px;
            padding: 18px; width: 100%; max-width: 440px; margin-bottom: 16px; display: none;
        }

        label { font-size: 12px; font-weight: 900; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; display: block; margin-top: 12px; }
        input, select {
            width: 100%; height: 50px; background: #2a2a2a; border: 1px solid #444;
            border-radius: 10px; color: #fff; font-size: 18px; font-weight: 900;
            padding: 0 12px; margin-top: 6px; outline: none; -webkit-appearance: none;
        }

        .mode-toggle { display: flex; gap: 8px; margin-top: 14px; margin-bottom: 6px; }
        .mode-btn {
            flex: 1; height: 52px; border: 2px solid #444; border-radius: 12px;
            background: #1a1a1a; color: #aaa; font-size: 14px; font-weight: 900;
            text-transform: uppercase; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .mode-active-tow { border-color: var(--accent-tow); background: rgba(255,23,68,0.15); color: var(--accent-tow); }
        .mode-active-pass { border-color: var(--accent-pass); background: rgba(171,71,188,0.15); color: var(--accent-pass); }

        .cam-btn {
            width: 100%; height: 72px; border: 2.5px dashed var(--accent-tow); border-radius: 14px;
            background: #2a1215; color: var(--accent-tow); font-size: 16px; font-weight: 900;
            display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; margin-top: 16px;
        }
        .cam-btn:active { transform: scale(0.98); }

        .thumb-preview { width: 100%; height: 180px; object-fit: cover; border-radius: 12px; border: 2px solid var(--accent-tow); display: none; margin-top: 12px; }

        .submit-btn {
            width: 100%; height: 62px; border: none; border-radius: 14px;
            background: var(--accent-tow); color: #fff; font-size: 20px; font-weight: 900;
            letter-spacing: 2px; text-transform: uppercase; cursor: pointer; margin-top: 20px;
        }
        .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-pass { background: var(--accent-pass); }

        .cam-modal { display: none; position: fixed; inset: 0; background: #000; z-index: 9999; flex-direction: column; }
        .cam-header { height: 60px; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; position: absolute; top: 0; width: 100%; z-index: 10; }
        .cam-view { flex: 1; width: 100%; height: 100%; object-fit: cover; }
        .cam-snap { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); width: 80px; height: 80px; background: var(--accent-tow); border: 4px solid #fff; border-radius: 50%; z-index: 20; }

        #status { text-align: center; font-weight: 900; font-size: 14px; margin-top: 12px; color: var(--accent-gold); min-height: 20px; }
        .loading-screen { text-align: center; color: var(--text-muted); font-weight: 800; margin-top: 40px; font-size: 18px; }

        /* FULLSCREEN SUCCESS OVERLAY */
        #successOverlay {
            display: none; position: fixed; inset: 0; z-index: 10000;
            flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 20px;
        }
        .success-tow { background: rgba(255, 23, 68, 0.96); }
        .success-pass { background: rgba(171, 71, 188, 0.96); }
        
        #successOverlay h1 { font-size: 38px; font-weight: 900; color: #fff; margin-bottom: 28px; text-transform: uppercase; line-height: 1.15; max-width: 90%; letter-spacing: 1px; }
        .ok-btn { background: #000; color: #fff; font-size: 24px; font-weight: 900; border: none; border-radius: 14px; padding: 16px 50px; letter-spacing: 2px; cursor: pointer; }
        .ok-btn:active { transform: scale(0.96); }
    </style>
</head>
<body>

<div class="brand-header">
    <img src="LOGO.png" alt="National Towing Logo" class="brand-logo">
    <div class="brand-titles">
        <h1 class="brand-title">National Towing</h1>
        <span class="brand-subtitle">Authorised Manager Portal</span>
    </div>
</div>

<div class="loading-screen" id="loadingMsg">VERIFYING AUTHORISATION...</div>
<div class="auth-banner" id="authBanner"></div>

<div class="card" id="mainCard">
    <label>PROPERTY</label>
    <select id="propertySelect"></select>

    <div class="mode-toggle" id="modeToggle">
        <button class="mode-btn mode-active-tow" id="btnModeTow" onclick="setMode('TOW')">🚨 TOW REQUEST</button>
        <button class="mode-btn" id="btnModePass" onclick="setMode('PASS')">🎫 VISITOR PASS</button>
    </div>

    <!-- TOW SECTION -->
    <div id="towSection">
        <label>VEHICLE REGISTRATION</label>
        <input type="text" id="towRego" placeholder="REGO" style="color:var(--accent-tow); text-transform:uppercase;">
        
        <label>REASON FOR TOWING</label>
        <select id="towReason" onchange="checkReasonOther(this)">
            <option value="UNAUTHORISED PARKING">UNAUTHORISED PARKING</option>
            <option value="PARKED IN VISITOR BAY">PARKED IN VISITOR BAY</option>
            <option value="NO VISITOR PASS">NO VISITOR PASS</option>
            <option value="BLOCKING DRIVEWAY">BLOCKING DRIVEWAY</option>
            <option value="OTHER">OTHER</option>
        </select>
        <input type="text" id="towReasonOther" placeholder="ENTER REASON" style="display:none; margin-top:6px; font-size:16px;">

        <label>BAY NUMBER / LOCATION</label>
        <input type="text" id="towBay" placeholder="e.g. Bay 12 or Visitor Area">

        <button class="cam-btn" id="openCamBtn" onclick="openCamera()">📷 SNAP EVIDENCE PHOTO</button>
        <img id="photoPreview" class="thumb-preview">
        
        <button class="submit-btn" id="submitTowBtn" onclick="submitTowRequest()">SEND TOW REQUEST</button>
    </div>

    <!-- PASS SECTION -->
    <div id="passSection" style="display:none;">
        <label>VEHICLE REGISTRATION</label>
        <input type="text" id="passRego" placeholder="REGO" style="color:var(--accent-pass); text-transform:uppercase;">
        
        <div style="display:flex; gap:10px;">
            <div style="flex:1;">
                <label>START DATE</label>
                <input type="date" id="passDate">
            </div>
            <div style="flex:1;">
                <label>DURATION (DAYS)</label>
                <select id="passDuration">
                    <option value="1">1 Day</option>
                    <option value="2">2 Days</option>
                    <option value="3">3 Days</option>
                    <option value="7">1 Week</option>
                    <option value="14">2 Weeks</option>
                </select>
            </div>
        </div>
        
        <button class="submit-btn btn-pass" id="submitPassBtn" onclick="submitVisitorPass()">ISSUE VISITOR PASS</button>
    </div>

    <div id="status"></div>
</div>

<!-- CAMERA MODAL -->
<div class="cam-modal" id="camModal">
    <div class="cam-header">
        <span style="color:var(--accent-tow); font-weight:900;">CAPTURE VEHICLE & PLATE</span>
        <button style="background:none; border:none; color:#fff; font-size:24px; font-weight:900;" onclick="closeCamera()">✕</button>
    </div>
    <video id="videoElem" class="cam-view" autoplay playsinline></video>
    <button class="cam-snap" onclick="takeSnapshot()"></button>
</div>

<!-- FULLSCREEN SUCCESS OVERLAY -->
<div id="successOverlay">
    <h1 id="successTitle">TOW REQUEST SENT</h1>
    <button class="ok-btn" onclick="dismissSuccessOverlay()">OK</button>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";

    let activeAuth = null;
    let currentMode = "TOW";
    let capturedPhoto = "";
    let videoStream = null;
    let isSubmitting = false;

    window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('passDate').valueAsDate = new Date();
        authenticateUser();
        window.addEventListener('online', syncManagerOfflineQueue);
        syncManagerOfflineQueue();
    });

    async function authenticateUser() {
        const urlParams = new URLSearchParams(window.location.search);
        const authKey = urlParams.get('phone') || urlParams.get('user') || urlParams.get('auth');
        
        if (!authKey) {
            document.getElementById('loadingMsg').innerText = "ACCESS DENIED: NO AUTH LINK.";
            return;
        }

        try {
            const res = await fetch(GOOGLE_SCRIPT_URL + "?action=check_auth&phone=" + encodeURIComponent(authKey));
            const data = await res.json();
            
            if (data && data.authorized) {
                activeAuth = data;
                document.getElementById('loadingMsg').style.display = 'none';
                document.getElementById('authBanner').innerText = "Authorised: " + (data.user || "Manager");
                document.getElementById('authBanner').style.display = 'block';
                document.getElementById('mainCard').style.display = 'block';
                
                populateProperties(data.properties);
            } else {
                document.getElementById('loadingMsg').innerText = "ACCESS DENIED: NOT AUTHORISED.";
            }
        } catch(e) {
            document.getElementById('loadingMsg').innerText = "NETWORK ERROR VERIFYING AUTH.";
        }
    }

    function populateProperties(props) {
        const sel = document.getElementById('propertySelect');
        sel.innerHTML = "";
        props.forEach((p) => {
            const opt = document.createElement('option');
            opt.value = p.name;
            opt.innerText = p.name;
            opt.dataset.mode = p.mode.toUpperCase();
            sel.appendChild(opt);
        });
        sel.addEventListener('change', updateUIForPropertyMode);
        updateUIForPropertyMode();
    }

    function updateUIForPropertyMode() {
        const sel = document.getElementById('propertySelect');
        const activeOpt = sel.options[sel.selectedIndex];
        if (!activeOpt) return;

        const mode = activeOpt.dataset.mode;
        const toggle = document.getElementById('modeToggle');
        
        if (mode.includes("BOTH")) {
            toggle.style.display = 'flex';
            setMode("TOW");
        } else if (mode.includes("PASS")) {
            toggle.style.display = 'none';
            setMode("PASS");
        } else {
            toggle.style.display = 'none';
            setMode("TOW");
        }
    }

    function checkReasonOther(sel) {
        const otherInput = document.getElementById('towReasonOther');
        if (sel.value === 'OTHER') {
            otherInput.style.display = 'block';
            otherInput.focus();
        } else {
            otherInput.style.display = 'none';
        }
    }

    function setMode(mode) {
        currentMode = mode;
        const btnTow = document.getElementById('btnModeTow');
        const btnPass = document.getElementById('btnModePass');
        const secTow = document.getElementById('towSection');
        const secPass = document.getElementById('passSection');
        document.getElementById('status').innerText = "";

        if (mode === 'TOW') {
            btnTow.classList.add('mode-active-tow');
            btnPass.classList.remove('mode-active-pass');
            secTow.style.display = 'block';
            secPass.style.display = 'none';
        } else {
            btnPass.classList.add('mode-active-pass');
            btnTow.classList.remove('mode-active-tow');
            secPass.style.display = 'block';
            secTow.style.display = 'none';
        }
    }

    // --- CAMERA ENGINE ---
    async function openCamera() {
        document.getElementById('camModal').style.display = 'flex';
        const video = document.getElementById('videoElem');
        try {
            videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
            video.srcObject = videoStream;
        } catch(e) {
            alert("Camera access required for evidence photo.");
            closeCamera();
        }
    }

    function closeCamera() {
        if (videoStream) videoStream.getTracks().forEach(t => t.stop());
        document.getElementById('camModal').style.display = 'none';
    }

    function takeSnapshot() {
        const video = document.getElementById('videoElem');
        const vW = video.videoWidth || 1280;
        const vH = video.videoHeight || 720;
        
        const canvas = document.createElement('canvas');
        if (vW > vH) {
            canvas.width = 960;
            canvas.height = Math.round(960 * (vH / vW));
        } else {
            canvas.height = 960;
            canvas.width = Math.round(960 * (vW / vH));
        }

        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        capturedPhoto = canvas.toDataURL('image/jpeg', 0.65);
        const preview = document.getElementById('photoPreview');
        preview.src = capturedPhoto;
        preview.style.display = 'block';
        document.getElementById('openCamBtn').innerText = "🔄 RETAKE PHOTO";
        document.getElementById('openCamBtn').style.borderStyle = "solid";
        
        closeCamera();
        processANPR(capturedPhoto);
    }

    async function processANPR(b64) {
        document.getElementById('status').innerText = "🔍 SCANNING PLATE...";
        document.getElementById('status').style.color = "var(--accent-gold)";
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'scan_npr', photoBytes: b64 })
            });
            const data = await res.json();
            if (data && data.rego) {
                document.getElementById('towRego').value = data.rego;
                document.getElementById('status').innerText = "✔ PLATE DETECTED: " + data.rego;
                document.getElementById('status').style.color = "var(--success)";
            } else {
                document.getElementById('status').innerText = "⚠️ NO PLATE DETECTED. PLEASE ENTER MANUALLY.";
            }
        } catch(e) {
            document.getElementById('status').innerText = "";
        }
    }

    // --- FORM RESET & SUCCESS OVERLAY ---
    function showSuccess(mode) {
        const overlay = document.getElementById('successOverlay');
        const title = document.getElementById('successTitle');

        if (mode === "TOW") {
            overlay.className = "success-tow";
            title.innerText = "TOW REQUEST SENT";
        } else {
            overlay.className = "success-pass";
            title.innerText = "PASS ACTIVATED";
        }
        overlay.style.display = "flex";
    }

    function dismissSuccessOverlay() {
        document.getElementById('successOverlay').style.display = 'none';
        
        // Reset inputs cleanly without reloading the page
        document.getElementById('towRego').value = "";
        document.getElementById('towBay').value = "";
        document.getElementById('towReason').selectedIndex = 0;
        document.getElementById('towReasonOther').value = "";
        document.getElementById('towReasonOther').style.display = "none";
        
        capturedPhoto = "";
        const preview = document.getElementById('photoPreview');
        preview.src = "";
        preview.style.display = "none";
        
        document.getElementById('openCamBtn').innerText = "📷 SNAP EVIDENCE PHOTO";
        document.getElementById('openCamBtn').style.borderStyle = "dashed";
        
        document.getElementById('passRego').value = "";
        document.getElementById('status').innerText = "";
        isSubmitting = false;
        document.getElementById('submitTowBtn').disabled = false;
    }

    // --- OFFLINE QUEUE (NETWORK-FAILURE BACKUP ONLY) ---
    function queueManagerOffline(payload) {
        let queue = JSON.parse(localStorage.getItem('mgr_offline_queue') || '[]');
        if (!queue.some(item => item.id === payload.id)) {
            queue.push(payload);
            localStorage.setItem('mgr_offline_queue', JSON.stringify(queue));
        }
    }

    function removeManagerOffline(id) {
        let queue = JSON.parse(localStorage.getItem('mgr_offline_queue') || '[]');
        queue = queue.filter(item => item.id !== id);
        localStorage.setItem('mgr_offline_queue', JSON.stringify(queue));
    }

    let isSyncingQueue = false;
    async function syncManagerOfflineQueue() {
        if (isSyncingQueue || !navigator.onLine) return;
        let queue = JSON.parse(localStorage.getItem('mgr_offline_queue') || '[]');
        if (queue.length === 0) return;

        isSyncingQueue = true;
        for (let i = 0; i < queue.length; i++) {
            const item = queue[i];
            try {
                const res = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(item)
                });
                const data = await res.json();
                if (data && data.status === "SUCCESS") {
                    removeManagerOffline(item.id);
                }
            } catch(err) {
                break;
            }
        }
        isSyncingQueue = false;
    }

    // --- SUBMISSION DISPATCH ---
    function submitTowRequest() {
        if (isSubmitting) return;

        const rego = document.getElementById('towRego').value.trim().toUpperCase();
        if (!rego || !capturedPhoto) {
            document.getElementById('status').innerText = "⚠️ PLEASE ENTER REGO AND ATTACH PHOTO";
            return;
        }

        isSubmitting = true;
        document.getElementById('submitTowBtn').disabled = true;

        const reasonSelect = document.getElementById('towReason').value;
        const reason = reasonSelect === 'OTHER'
            ? (document.getElementById('towReasonOther').value.trim() || 'OTHER')
            : reasonSelect;

        const payload = {
            id: 'MGR_TOW_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
            action: 'log_mark',
            isManagerRequest: true,
            authorizer: activeAuth ? activeAuth.user : "Manager",
            authorizerPhone: activeAuth ? (activeAuth.phone || "") : "",
            property: document.getElementById('propertySelect').value,
            rego: rego,
            reason: reason,
            bay: document.getElementById('towBay').value.trim(),
            photoBytes: capturedPhoto,
            timestamp: new Date().toISOString()
        };

        // 1. Show success overlay instantly
        showSuccess("TOW");

        // 2. Direct background upload; only queue if offline or network drops
        if (navigator.onLine) {
            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            }).then(res => res.json())
              .then(data => {
                  if (data && data.status !== "SUCCESS") {
                      queueManagerOffline(payload);
                  }
              }).catch(() => queueManagerOffline(payload));
        } else {
            queueManagerOffline(payload);
        }
    }

    function submitVisitorPass() {
        const rego = document.getElementById('passRego').value.trim().toUpperCase();
        if (!rego) {
            document.getElementById('status').innerText = "⚠️ PLEASE ENTER VEHICLE REGO";
            return;
        }

        const payload = {
            id: 'MGR_PASS_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
            action: 'issue_pass',
            property: document.getElementById('propertySelect').value,
            rego: rego,
            startDate: document.getElementById('passDate').value,
            duration: document.getElementById('passDuration').value,
            notes: "Authorised by " + (activeAuth ? activeAuth.user : "Manager"),
            timestamp: new Date().toISOString()
        };

        showSuccess("PASS");

        if (navigator.onLine) {
            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            }).catch(() => queueManagerOffline(payload));
        } else {
            queueManagerOffline(payload);
        }
    }
</script>
</body>
</html>
