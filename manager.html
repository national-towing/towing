<style>
  /* High-Visibility Non-Safari iOS Warning Banner */
  .ios-notice {
    display: none;
    background: #ffab00;
    color: #000;
    font-size: 18px;
    font-weight: 900;
    padding: 22px;
    border-radius: 16px;
    margin-bottom: 20px;
    text-align: center;
    line-height: 1.5;
    box-shadow: 0 6px 20px rgba(0,0,0,0.8);
    border: 3px solid #fff;
  }
  .safari-btn {
    display: block;
    width: 100%;
    margin-top: 14px;
    padding: 16px 10px;
    background: #000;
    color: #fff;
    font-size: 18px;
    font-weight: 900;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  .safari-btn:active {
    transform: scale(0.97);
    background: #222;
  }
  .copy-box {
    margin-top: 12px;
    background: #fff;
    color: #000;
    padding: 10px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 800;
    word-break: break-all;
    user-select: all;
    -webkit-user-select: all;
  }
</style>

<!-- Banner placed inside <body> right above <div class="card"> -->
<div id="iosNotice" class="ios-notice">
  ⚠️ <b>SAFARI REQUIRED TO INSTALL TOW APP</b><br>
  Apple only allows saving app icons from the <b>Safari</b> browser.
  
  <button class="safari-btn" onclick="openInSafari()">1-TAP COPY LINK & OPEN SAFARI 🧭</button>
  
  <div id="safariStatus" style="font-size:16px; font-weight:900; margin-top:12px; color:#00e676; display:none; background:#000; padding:10px; border-radius:8px;">
    ✔ LINK COPIED! <br><span style="color:#fff; font-size:14px; font-weight:700;">Open Safari, tap address bar & select 'Paste & Go'.</span>
  </div>

  <div style="font-size:12px; margin-top:12px; font-weight:700; color:#333;">Or copy this link manually:</div>
  <div class="copy-box" id="urlDisplay"></div>
</div>

<script>
  window.addEventListener('load', () => {
    // Detect iOS
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    // Detect standalone PWA mode (already saved to home screen)
    const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
    // Detect true Safari browser vs Chrome/Firefox/Gmail in-app on iOS
    const isSafari = isIOS && /Safari/.test(navigator.userAgent) && !/CriOS|FxiOS|OPiOS|EdgiOS|GSA/.test(navigator.userAgent);

    const currentUrl = window.location.href;
    document.getElementById('urlDisplay').innerText = currentUrl;

    // Show high-visibility banner if on iPhone but not in Safari & not saved as app yet
    if (isIOS && !isSafari && !isStandalone) {
      document.getElementById('iosNotice').style.display = 'block';
    }
  });

  function openInSafari() {
    const currentUrl = window.location.href;
    const statusDiv = document.getElementById('safariStatus');

    // 1. Copy link to clipboard
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(currentUrl);
    } else {
      const dummy = document.createElement('textarea');
      document.body.appendChild(dummy);
      dummy.value = currentUrl;
      dummy.select();
      document.execCommand('copy');
      document.body.removeChild(dummy);
    }

    // 2. Show clear visual feedback
    statusDiv.style.display = 'block';

    // 3. Direct HTTP fallback (without search engine redirect)
    setTimeout(() => {
      window.location.href = currentUrl;
    }, 400);
  }
</script>
