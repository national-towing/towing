<style>
  /* Non-Safari iOS Warning Banner */
  .ios-notice {
    display: none;
    background: #ffab00;
    color: #000;
    font-size: 13px;
    font-weight: 800;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 12px;
    text-align: center;
    line-height: 1.4;
  }
</style>

<!-- Add this banner right above <div class="card"> in the <body> -->
<div id="iosNotice" class="ios-notice">
  ⚠️ <b>Safari Required to Install App</b><br>
  To save this app to your Home Screen, please open this page in <b>Safari</b> (Tap Share ➔ Open in Safari).
</div>

<script>
  window.addEventListener('load', () => {
    // Detect iOS
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    // Detect standalone PWA mode (already added to home screen)
    const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
    // Detect actual Safari browser vs Chrome/Firefox/In-App on iOS
    const isSafari = isIOS && /Safari/.test(navigator.userAgent) && !/CriOS|FxiOS|OPiOS|EdgiOS|GSA/.test(navigator.userAgent);

    // If on iOS, not in Safari, and not already installed as an app:
    if (isIOS && !isSafari && !isStandalone) {
      document.getElementById('iosNotice').style.display = 'block';
    }
  });
</script>
